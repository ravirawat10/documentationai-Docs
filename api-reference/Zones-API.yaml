  /zones/http/pull/{zoneid}/securetoken:
    post:
      tags:
      - HTTP Pull Zones
      summary: Update Secure Token
      description: Update SecureToken of HTTP pull zone
      operationId: updateSecureTokenZonePull
      parameters:
      - $ref: '#/components/parameters/zoneIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: string
                  enum: [Y, N]
                  description: Enable or disable secure token.
                  example: Y
                policy:
                  type: string
                  enum: [Q, F]
                  description: Q = Query string mode, F = Full path mode.
                  example: Q
                keyip:
                  type: string
                  enum: [Y, N]
                  description: Include client IP in token generation.
                  example: N
                list:
                  type: string
                  pattern: '^[a-fA-F0-9]{16}$'
                  description: Secret token key — 16-character hexadecimal string.
                  example: abcdef0123456789
                timeout:
                  type: number
                  minimum: 5
                  maximum: 25200
                  description: Token expiry time in seconds. Min 5, max 25200.
                  example: 3600
                session:
                  type: string
                  enum: ["0", S]
                  description: '"0" = fixed expiry, "S" = session-based.'
                  example: "0"
                ips:
                  type: string
                  description: Comma-separated IPs excluded from the secure token check.
                  example: 192.168.1.1
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  message:
                    type: string
                  zone:
                    $ref: '#/components/schemas/zonePullResult'
