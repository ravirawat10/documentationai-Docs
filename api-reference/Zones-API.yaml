  /zones/http/push/servers:
    get:
      tags:
      - HTTP Push Zones
      summary: Get Servers
      description: HTTP Push Zone Servers
      operationId: HTTPPushZoneServer
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  servers:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: integer
                          example: 206
                        name:
                          type: string
                          example: Singapore
                        country:
                          type: string
                          example: SouthEast Asia
                    example:
                    - code: 206
                      name: Singapore
                      country: SouthEast Asia
                    - code: 30
                      name: San Jose City, United States
                      country: North America
                    - code: 31
                      name: London, United Kingdom
                      country: Europe
  /zones/http/push/new:
    post:
      tags:
      - HTTP Push Zones
      summary: Create Zone
      description: Create a new HTTP Push Zone
      operationId: createZonePush
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - _METHOD
              - alias
              - server
              properties:
                _METHOD:
                  type: string
                  description: Must always be PUT.
                  example: PUT
                alias:
                  type: string
                  description: Label for the zone.
                  example: my-push-zone
                server:
                  type: integer
                  format: int32
                  description: Server location code. 30 = North America, 31 = Europe, 206 = SE Asia.
                  enum: [30, 31, 206]
                  example: 30
                profiles:
                  type: array
                  items:
                    type: string
                  description: Transcoding profile IDs. Leave empty to disable auto transcoding.
                  example: ["12", "15"]
                ssl:
                  type: object
                  properties:
                    http2:
                      type: string
                      enum: [Y, N]
                      example: Y
                    redirect:
                      type: string
                      enum: [Y, N]
                      description: HTTP to HTTPS redirect.
                      example: N
                    mode:
                      type: string
                      description: SSL mode string.
                      example: S
                  description: SSL certificate settings for HTTPS delivery.
                cache:
                  type: object
                  properties:
                    cache:
                      type: string
                      description: Edge cache TTL duration code.
                      example: 1h
                    expiry:
                      type: string
                      description: Browser cache TTL duration code, or empty string to disable.
                      example: ""
                  description: Cache configuration settings for the zone.
                webhook:
                  type: string
                  description: HTTP/HTTPS URL to notify after files are transcoded.
                  example: https://x.com/wh
                cnames:
                  type: string
                  description: Comma-separated verified CNAMEs.
                  example: cdn.example.com
                domainlock:
                  type: object
                  properties:
                    enabled:
                      type: string
                      enum: [Y, N]
                      example: N
                      description: Enable or disable this feature. Y means enabled, N means disabled.
                    policy:
                      type: string
                      enum: [Y, N]
                      example: Y
                      description: Access policy. Y means allow listed entries only, N means allow all.
                    list:
                      type: string
                      description: Comma-separated domain names.
                      example: ""
                    ips:
                      type: string
                      example: ""
                      description: Comma-separated IP addresses or CIDR ranges.
                    noreferer:
                      type: string
                      enum: [Y, N]
                      example: N
                      description: Block requests with no referrer header. Y means block, N means allow.
                  description: Domain lock / referrer restriction settings.
                geoblock:
                  type: object
                  properties:
                    enabled:
                      type: string
                      enum: [Y, N]
                      example: N
                      description: Enable or disable this feature. Y means enabled, N means disabled.
                    policy:
                      type: string
                      enum: [Y, N]
                      example: Y
                      description: Access policy. Y means allow listed entries only, N means allow all.
                    list:
                      type: array
                      items:
                        type: string
                      description: ISO-3166 country codes.
                      example: []
                    ips:
                      type: string
                      example: ""
                      description: Comma-separated IP addresses or CIDR ranges.
                  description: Geo-blocking settings to restrict access by country.
                bwlimit:
                  type: object
                  properties:
                    enabled:
                      type: string
                      enum: [Y, N]
                      example: N
                      description: Enable or disable this feature. Y means enabled, N means disabled.
                    policy:
                      type: string
                      enum: [Y, N]
                      example: Y
                      description: Access policy. Y means allow listed entries only, N means allow all.
                    rate:
                      type: number
                      example: 0
                      description: Rate limit value.
                    rateafter:
                      type: number
                      example: 0
                      description: Amount of data delivered before rate limiting begins.
                  description: Bandwidth limit settings for the zone.
                ipaccess:
                  type: object
                  properties:
                    enabled:
                      type: string
                      enum: [Y, N]
                      example: N
                      description: Enable or disable this feature. Y means enabled, N means disabled.
                    policy:
                      type: string
                      enum: [Y, N]
                      example: Y
                      description: Access policy. Y means allow listed entries only, N means allow all.
                    list:
                      type: string
                      example: ""
                      description: Comma-separated list of allowed or blocked entries.
                    ips:
                      type: string
                      example: ""
                      description: Comma-separated IP addresses or CIDR ranges.
                  description: IP access control settings to allow or block specific IPs.
                securetoken:
                  type: object
                  properties:
                    enabled:
                      type: string
                      enum: [Y, N]
                      example: N
                      description: Enable or disable this feature. Y means enabled, N means disabled.
                    policy:
                      type: string
                      enum: [Q, F]
                      example: Q
                      description: Access policy. Y means allow listed entries only, N means allow all.
                    keyip:
                      type: string
                      enum: [Y, N]
                      example: N
                    list:
                      type: string
                      description: 16-character hex secret key.
                      example: ""
                    timeout:
                      type: number
                      minimum: 5
                      maximum: 25200
                      example: 5
                      description: Timeout duration in seconds.
                    session:
                      type: string
                      enum: ["0", S]
                      example: "0"
                    ips:
                      type: string
                      example: ""
                      description: Comma-separated IP addresses or CIDR ranges.
                  description: Secure token settings for URL authentication.
                useragent:
                  type: object
                  properties:
                    enabled:
                      type: string
                      enum: [Y, N]
                      example: N
                      description: Enable or disable this feature. Y means enabled, N means disabled.
                    policy:
                      type: string
                      enum: [Y, N]
                      example: Y
                      description: Access policy. Y means allow listed entries only, N means allow all.
                    list:
                      type: string
                      example: ""
                      description: Comma-separated list of allowed or blocked entries.
                    ips:
                      type: string
                      example: ""
                      description: Comma-separated IP addresses or CIDR ranges.
                    casesensitive:
                      type: string
                      enum: [Y, N]
                      example: N
                      description: Whether matching is case-sensitive. Y means enabled, N means disabled.
                  description: User-agent filter settings to restrict access by browser/client.
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Zone Created
                  zone:
                    $ref: '#/components/schemas/zonePushResult'
                  warnings:
                    type: array
                    nullable: true
                    items:
                      type: string
                    example: ["SSL Certificate Create Failed"]
