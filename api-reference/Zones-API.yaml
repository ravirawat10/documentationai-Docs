  /zones/http/pull/{zoneid}/cache:
    post:
      tags:
      - HTTP Pull Zones
      summary: Update Cache
      description: Update Cache HTTP Push Zone
      operationId: updateCacheZonePull
      parameters:
      - $ref: '#/components/parameters/zoneIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cache:
                  type: string
                  enum: ["0s", "10s", "1m", "10m", "30m", "1h", "4h", "12h", "1d", "7d", "14d", "1M", "3M", "6M", "1y"]
                  description: Edge cache TTL duration code.
                  example: 1h
                expiry:
                  type: string
                  description: Browser cache TTL duration code. Same values as cache, or empty string to disable.
                  example: 1d
                querystring:
                  type: string
                  enum: [Y, N]
                  description: Cache content per unique query string.
                  example: Y
                cachecontrol:
                  type: string
                  enum: [Y, N]
                  description: Honour Cache-Control headers from origin.
                  example: Y
                usestale:
                  type: string
                  enum: [Y, N]
                  description: Serve stale content while revalidating in the background.
                  example: Y
                revalidate:
                  type: string
                  enum: [Y, N]
                  description: Revalidate cached content on expiry.
                  example: Y
                cacheInSecs:
                  type: number
                  description: Cache TTL in seconds — computed from cache value.
                  example: 3600
                cacheInMins:
                  type: number
                  description: Cache TTL in minutes — computed from cache value.
                  example: 60
                expiryInSecs:
                  type: number
                  description: Browser cache TTL in seconds — computed from expiry value.
                  example: 86400
                expiryInMins:
                  type: number
                  description: Browser cache TTL in minutes — computed from expiry value.
                  example: 1440
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  message:
                    type: string
                  zone:
                    $ref: '#/components/schemas/zonePullResult'
