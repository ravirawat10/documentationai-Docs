  /zones/vod/pull/new:
    post:
      tags:
      - VOD Pull Zones
      summary: Create Zone
      description: Create a new VOD pull Zone
      operationId: createzonevodpull
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - _METHOD
              - alias
              - origin
              properties:
                _METHOD:
                  type: string
                  description: Must always be PUT.
                  example: PUT
                alias:
                  type: string
                  description: Label for the zone.
                  example: my-vod-pull-zone
                origin:
                  type: string
                  description: Origin server URL. Required.
                  example: https://origin.example.com
                optimize:
                  type: string
                  enum: [http, https]
                  description: Origin fetch protocol.
                  example: http
                ssl:
                  type: object
                  properties:
                    http2:
                      type: string
                      enum: [Y, N]
                      example: Y
                    redirect:
                      type: string
                      enum: [Y, N]
                      example: N
                      description: Redirect configuration.
                    mode:
                      type: string
                      example: S
                      description: Operation mode for this setting.
                  description: SSL certificate settings for HTTPS delivery.
                cache:
                  type: object
                  properties:
                    cache:
                      type: string
                      description: Cache duration code.
                      example: 1d
                    expiry:
                      type: string
                      example: ""
                  description: Cache configuration settings for the zone.
                cnames:
                  type: string
                  description: Comma-separated CNAMEs.
                  example: cdn.example.com
                domainlock:
                  type: object
                  properties:
                    enabled:
                      type: string
                      enum: [Y, N]
                      example: N
                      description: Enable or disable this feature. Y means enabled, N means disabled.
                    policy:
                      type: string
                      enum: [Y, N]
                      example: Y
                      description: Access policy. Y means allow listed entries only, N means allow all.
                    list:
                      type: string
                      example: ""
                      description: Comma-separated list of allowed or blocked entries.
                    ips:
                      type: string
                      example: ""
                      description: Comma-separated IP addresses or CIDR ranges.
                    noreferer:
                      type: string
                      enum: [Y, N]
                      example: N
                      description: Block requests with no referrer header. Y means block, N means allow.
                  description: Domain lock / referrer restriction settings.
                geoblock:
                  type: object
                  properties:
                    enabled:
                      type: string
                      enum: [Y, N]
                      example: N
                      description: Enable or disable this feature. Y means enabled, N means disabled.
                    policy:
                      type: string
                      enum: [Y, N]
                      example: Y
                      description: Access policy. Y means allow listed entries only, N means allow all.
                    list:
                      type: array
                      items:
                        type: string
                      description: Array of ISO-3166 country codes.
                      example: []
                    ips:
                      type: string
                      example: ""
                      description: Comma-separated IP addresses or CIDR ranges.
                  description: Geo-blocking settings to restrict access by country.
                bwlimit:
                  type: object
                  properties:
                    enabled:
                      type: string
                      enum: [Y, N]
                      example: N
                      description: Enable or disable this feature. Y means enabled, N means disabled.
                    policy:
                      type: string
                      enum: [Y, N]
                      example: Y
                      description: Access policy. Y means allow listed entries only, N means allow all.
                    rate:
                      type: number
                      example: 0
                      description: Rate limit value.
                    rateafter:
                      type: number
                      example: 0
                      description: Amount of data delivered before rate limiting begins.
                  description: Bandwidth limit settings for the zone.
                ipaccess:
                  type: object
                  properties:
                    enabled:
                      type: string
                      enum: [Y, N]
                      example: N
                      description: Enable or disable this feature. Y means enabled, N means disabled.
                    policy:
                      type: string
                      enum: [Y, N]
                      example: Y
                      description: Access policy. Y means allow listed entries only, N means allow all.
                    list:
                      type: string
                      example: ""
                      description: Comma-separated list of allowed or blocked entries.
                    ips:
                      type: string
                      example: ""
                      description: Comma-separated IP addresses or CIDR ranges.
