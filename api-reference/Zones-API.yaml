  /zones/http/push/{zoneid}/ssl:
    post:
      tags:
      - HTTP Push Zones
      summary: Update SSL
      description: Update SSL of HTTP push zone
      operationId: updateSslZonePush
      parameters:
      - $ref: '#/components/parameters/zoneIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                http2:
                  type: boolean
                  description: Indicates whether HTTP/2 protocol is enabled. Y means HTTP/2 is enabled, while N means it is disabled.
                  example: true
                redirect:
                  type: boolean
                  description: Indicates whether HTTP traffic is automatically redirected to HTTPS. Y means redirection is enabled, while N means it is not.
                  example: true
                mode:
                  type: string
                  description: Specifies the SSL mode used for the server configuration. Typical values include S for strict mode or A for automated.
                  example: S
                certid:
                  type: string
                  nullable: true
                  description: A unique identifier for the SSL certificate used. Optional; can be null if no certificate is assigned.
                  example:
                enabled:
                  type: string
                  description: Indicates whether SSL is enabled for the zone.
                  example: ""
                warning:
                  type: boolean
                  description: Indicates whether there is a warning associated with the SSL configuration.
                  example: false
                name:
                  type: string
                  description: The name associated with the SSL certificate. Typically used to identify the certificate for a specific domain.
                  example: ""
                crt:
                  type: string
                  description: The SSL certificate content in PEM format. Required for custom SSL certificates.
                  example: ""
                key:
                  type: string
                  description: The private key associated with the SSL certificate in PEM format. Required for setting up custom SSL certificates.
                  example: ""
                cabundle:
                  type: string
                  description: The Certificate Authority (CA) bundle content in PEM format. Used to validate the SSL certificate chain.
                  example: ""
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Zone Updated
                  zone:
                    $ref: '#/components/schemas/zonePushResult'
                  warnings:
                    type: array
                    nullable: true
                    items:
                      type: string
                    example: ["SSL Certificate Create Failed"]
  /zones/http/push/{zoneid}/securetoken:
    post:
      tags:
      - HTTP Push Zones
      summary: Update Secure Token
      description: Update SecureToken of HTTP push zone
      operationId: updateSecureTokenZonePush
      parameters:
      - $ref: '#/components/parameters/zoneIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: string
                  enum: [Y, N]
                  description: Enable or disable secure token.
                  example: Y
                policy:
                  type: string
                  enum: [Q, F]
                  description: Q = Query string mode, F = Full path mode.
                  example: Q
                keyip:
                  type: string
                  enum: [Y, N]
                  description: Include client IP in token generation for added security.
                  example: N
                list:
                  type: string
                  pattern: '^[a-fA-F0-9]{16}$'
                  description: Secret token key — 16-character hexadecimal string.
                  example: a21fe029ccc27bf6
                timeout:
                  type: number
                  minimum: 5
                  maximum: 25200
                  description: Token expiry time in seconds. Min 5, max 25200.
                  example: 3600
                session:
                  type: string
                  enum: ["0", S]
                  description: '"0" = fixed expiry, "S" = session-based.'
                  example: "0"
                ips:
                  type: string
                  description: Comma-separated IPs excluded from the secure token check.
                  example: ""
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Zone Updated
                  zone:
                    $ref: '#/components/schemas/zonePushResult'
