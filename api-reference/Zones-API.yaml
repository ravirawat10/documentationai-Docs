components:
  parameters:
    zoneIdParam:
      name: zoneid
      in: path
      description: Zone ID
      required: true
      schema:
        type: integer
        example: 42
    modeParam:
      in: query
      name: m
      description: Enter reported by
      required: true
      schema:
        type: string
    typeParam:
      in: query
      name: t
      description: Enter daily or hourly
      required: true
      schema:
        type: string
    rParam:
      in: query
      name: r
      description: Enter value last_24hrs/hourly or last_7days/hourly or last_30days/daily
      required: true
      schema:
        type: string
    rangeParam:
      in: query
      name: r
      description: Enter date range
      explode: false
      schema:
        type: string
    queryParam:
      in: query
      name: query
      description: search by filename
      schema:
        type: string
    markerParam:
      in: query
      name: marker
      description: Set the marker parameter to the name of the last item returned in the previous list.
      schema:
        type: string
    endmarkerParam:
      in: query
      name: end_marker
      description: Limits the result set to names that are less than the end_marker parameter value.
      schema:
        type: string
    dirParam:
      in: query
      name: dir
      description: Enter directory name
      schema:
        type: string
    fileParam:
      in: query
      name: file
      description: Enter file name
      schema:
        type: string
    mediaParam:
      in: query
      name: media
      description: show detailed media info if 1
      schema:
        type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    createZonePush:
      required:
      - _METHOD
      - server
      type: object
      properties:
        _METHOD:
          type: string
          description: To cast request method PUT
          example: PUT
        alias:
          type: string
          description: Optional label for the zone
          example: test-zone-001
        server:
          type: integer
          format: int32
          description: server.code, Should be one of the server code from the GET /zones/http/push/servers call
          example: 206
        profiles:
          type: array
          items:
            type: string
          description: Transcoding profile IDs. Leave empty to disable auto file transcoding.
          example: ["1"]
        ssl:
          type: object
          properties:
            http2:
              type: string
              example: Y
            redirect:
              type: string
              example: N
            mode:
              type: string
              description: 'N = None, S = Shared, L = Let''s Encrypt, C = Custom'
              example: L
        cache:
          type: object
          properties:
            cache:
              type: string
              description: Edge cache TTL. Values can be 1d, 7d, 14d, 1M, 3M, 6M, or 1y
              example: 1m
            expiry:
              type: string
              description: Browser cache TTL
              example: ""
        webhook:
          type: string
          description: URL to notify after files are transcoded
          example: https://requestbin.com/r/test/123
        cnames:
          type: string
          description: 'Comma-separated custom domains. Eg: cdn.domain.com'
          example: ""
        domainlock:
          type: object
          properties:
            enabled:
              type: string
              example: N
            policy:
              type: string
              example: N
            list:
              type: string
              example: ""
            ips:
              type: string
              example: ""
            noreferer:
              type: string
              example: N
            active:
              type: string
              example: N
        geoblock:
          type: object
          properties:
            enabled:
              type: string
              example: Y
            policy:
              type: string
              example: N
            list:
              type: array
              items:
                type: string
              example: []
            ips:
              type: string
              example: ""
            active:
              type: string
              example: N
        bwlimit:
          type: object
          properties:
            enabled:
              type: string
              example: Y
            policy:
              type: string
              example: "1"
            rate:
              type: integer
              format: int32
              example: 30
            rateafter:
              type: integer
              format: int32
              example: 0
            active:
              type: string
              example: Y
        ipaccess:
          type: object
          properties:
            enabled:
              type: string
              example: N
            policy:
              type: string
              example: N
            list:
              type: string
              example: ""
            ips:
              type: string
              example: ""
            active:
              type: string
              example: N
        securetoken:
          type: object
          properties:
            enabled:
              type: string
              example: N
            policy:
              type: string
              example: F
            list:
              type: string
              example: ""
            ips:
              type: string
              example: ""
            keyip:
              type: string
              example: N
            session:
              type: string
              example: "0"
            timeout:
              type: integer
              format: int32
              example: 5
            active:
              type: string
              example: N
        useragent:
          type: object
          properties:
            enabled:
              type: string
              example: N
            policy:
              type: string
              example: N
            list:
              type: string
              example: ""
            ips:
              type: string
              example: ""
            casesensitive:
              type: string
              example: N
            active:
              type: string
              example: N
            listArr:
              type: array
              items:
                type: string
              example: [""]
    zoneshttppushnew_geoblock:
      type: object
      properties:
        enabled:
          type: string
          description: Values can be Y or N.<br>Set to Y if Geo Block should be enabled.<br> Set to N if Geo Block should not to be enabled.
          example: Y
        policy:
          type: string
          description: Values can be Y or N.<br>Set to Y if geoblock countries list should be allowed.<br> Set to N if geoblock countries list should be blocked
          example: Y
        list:
          type: array
          items:
            type: string
            description: Geoblock countries list values can be AF,DZ,AW,CA etc
            example: AF
        ips:
          type: string
          description: 'List of IPs to whitelist when geoblock is enabled. IPs should be separated by comma. <br>Eg: 192.168.0.1, 192.168.0.2'
          example: 192.168.0.1
    zoneshttpsetting_geoblock:
      type: object
      properties:
        enabled:
          type: string
          description: Values can be Y or N.<br>Set to Y if Geo Block should be enabled.<br> Set to N if Geo Block should not to be enabled.
          example: Y
        policy:
          type: string
          description: Values can be Y or N.<br>Set to Y if geoblock countries list should be allowed.<br> Set to N if geoblock countries list should be blocked
          example: N
        list:
          type: array
          items:
            type: string
            description: Geoblock countries list values can be AF,DZ,AW,CA etc
            example: AF
        ips:
          type: string
          description: 'List of IPs to whitelist when geoblock is enabled. IPs should be separated by comma. <br>Eg: 192.168.0.1, 192.168.0.2'
          example: 192.168.0.1
        mode:
          type: string
          description: The values can be save,append,overwrite
          example: save
    zoneshttpsetting_domainlock:
      type: object
      properties:
        enabled:
          type: string
          enum: [Y]
          description: Enable domain lock (omit to disable)
        policy:
          type: string
