                  type: string
                  enum: [Y, N]
                  description: Bandwidth limit policy flag.
                  example: Y
                rate:
                  type: number
                  description: Throttle rate in KB/s applied after rateafter threshold is reached.
                  example: 1024
                rateafter:
                  type: number
                  description: Amount of data in KB served before the throttle rate kicks in.
                  example: 5120
                mode:
                  type: string
                  enum: [save, append, overwrite]
                  description: Update mode — save replaces, append adds to, overwrite replaces entirely.
                  example: save
