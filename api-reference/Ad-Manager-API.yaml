  /ad-manager/{pid}/creatives:
    get:
      summary: List Creatives
      description: List creatives in a project.
      operationId: listCreatives
      tags:
      - Creatives
      parameters:
      - $ref: '#/components/parameters/pidParam'
      - in: query
        name: page
        schema:
          type: integer
          example: 1
      - in: query
        name: limit
        schema:
          type: integer
          example: 20
      - in: query
        name: q
        schema:
          type: string
          description: Free-text search matched against creative name.
          example: summer-30s
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AdManagerBaseResponse'
                - type: object
                  properties:
                    creatives:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            example: crv_9a71
                          admanager_id:
                            type: integer
                            example: 9071
                          name:
                            type: string
                            example: Summer 30s Spot
                          creative_type:
                            $ref: '#/components/schemas/CreativeType'
                          status:
                            $ref: '#/components/schemas/CreativeStatus'
                          duration_seconds:
                            type: number
                            example: 30
                          media_url:
                            type: string
                            example: https://cdn.5centscdn.com/ad-manager-uploads/abc123.mp4
                          vast_url:
                            type: string
                            example: https://ads.example.com/vast?id=123
                          click_url:
                            type: string
                            example: https://acmecorp.com/summer-sale
                          mime_type:
                            type: string
                            example: video/mp4
                          width:
                            type: integer
                            example: 1920
                          height:
                            type: integer
                            example: 1080
                          bitrate:
                            type: integer
                            example: 4000000
                          approval_status:
                            $ref: '#/components/schemas/ApprovalStatus'
                          metadata:
                            type: string
                            description: Free-form metadata, serialized as a JSON string. Used to store UI-only flags such as `allow_prefetch`.
                            example: "[]"
                          created_at:
                            type: string
                            format: date-time
                            nullable: true
                            example: "2026-01-15T10:30:00Z"
                          updated_at:
                            type: string
                            format: date-time
                            example: "2026-02-01T08:00:00Z"
                          synced_at:
                            type: string
                            format: date-time
                            example: "2026-02-01T08:00:00Z"
                          tracking_mode:
                            allOf:
                            - $ref: '#/components/schemas/TrackingMode'
                            nullable: true
                          allow_prefetch:
                            type: integer
                            description: UI-only flag (1/0) controlling creative prefetch behavior.
                            example: 0
                          vast_query_params:
                            type: string
                            nullable: true
                            description: Custom VAST query parameters, serialized as a JSON string.
                            example: '[{"name": "cachebuster", "type": "from-variable", "value": "${CACHE_BUSTER}"}]'
                          ad_origin:
                            allOf:
                            - $ref: '#/components/schemas/AdOrigin'
                            nullable: true
                          skip_override:
                            type: string
                            nullable: true
                            description: Per-creative ad-skip override, serialized as a JSON string. When set, wins over the project skip policy and any per-request `skipoffset`/`skip_policy` override.
                            example: '{"skippable": true, "offset_type": "seconds", "offset_value": 30}'
                    total:
                      type: integer
                      example: 28
                    page:
                      type: integer
                      example: 1
                    pages:
                      type: integer
                      example: 1
                    approval_stats:
                      type: object
                      description: Creative counts keyed by approval status (`pending`, `approved`, `rejected`).
                      additionalProperties:
                        type: integer
                      example:
                        pending: 3
                        approved: 24
                        rejected: 1
    post:
      summary: Create Creative
      description: Create a new creative. `creative_type` determines which fields apply - `media_file` creatives reference an uploaded video (see Get Creative Upload URL), `vast_url` creatives reference a third-party VAST tag.
