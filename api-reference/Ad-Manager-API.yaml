        max_duration:
          type: integer
          description: Requested break fill target, seconds (IAB BREAKMAXDURATION).
          example: 30
        min_ad_length:
          type: integer
          example: 5
        max_ad_length:
          type: integer
          example: 30
        max_ads:
          type: integer
          example: 4
        fill_ceiling_seconds:
          type: integer
          example: 35
        break_position:
