        transaction_id:
          type: string
          example: 8f2a1c3e-4b5d-4a6e-9f1a-2b3c4d5e6f7a
        decision_status:
          type: string
          example: decided
        fill_status:
          $ref: '#/components/schemas/FillStatus'
        warnings:
          type: array
          description: Non-fatal parse warnings the decisioning API attached to this request (e.g. an invalid or out-of-range parameter that was ignored).
          items:
            type: string
        selected_duration_seconds:
          type: number
          description: Total duration actually filled, seconds.
