                        pod_decision:
                          type: object
                          properties:
                            id:
                              type: string
                              example: 393a76ac-6c92-45f9-90c5-fa1e7b57e8d4
                            request_id:
                              type: string
                              example: pod_7e21c9
                            content_id:
                              type: string
                              example: "1024"
                            break_duration_seconds:
                              type: number
                              description: Requested break fill target, seconds.
                              example: 30
                            selected_duration_seconds:
                              type: number
                              example: 30
                            fill_status:
                              $ref: '#/components/schemas/FillStatus'
