  /ad-manager/{pid}/creatives/upload-url:
    post:
      summary: Get Creative Upload URL
      description: Allocate a presigned S3 PUT URL for uploading a `media_file` creative's video asset. Upload the video directly to `presigned_url`, then create the creative with `media_url` set to `object_url`.
      operationId: getCreativeUploadUrl
      tags:
      - Creatives
      parameters:
      - $ref: '#/components/parameters/pidParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AdManagerBaseResponse'
                - type: object
                  properties:
                    presigned_url:
                      type: string
                      description: Presigned S3 URL to PUT the raw video file to.
                      example: https://s3.5centscdn.com/ad-manager-uploads/abc123.mp4?X-Amz-Signature=...
                    object_url:
                      type: string
                      description: Public URL of the uploaded object once the PUT completes. Use as `media_url` when creating the creative.
                      example: https://cdn.5centscdn.com/ad-manager-uploads/abc123.mp4
                    creative_uuid:
                      type: string
                      description: UUID assigned to the not-yet-created creative, for correlating the upload with the subsequent create request.
                      example: 8f2a1c3e-4b5d-4a6e-9f1a-2b3c4d5e6f7a

  /ad-manager/{pid}/creatives/direct-upload:
    post:
      summary: Direct Upload Creative
      description: CORS fallback for browsers that cannot PUT directly to the presigned S3 URL - proxies the raw video body through the API to storage.
      operationId: creativeDirectUpload
      tags:
      - Creatives
      parameters:
      - $ref: '#/components/parameters/pidParam'
      requestBody:
        required: true
        content:
          video/mp4:
            schema:
              type: string
              format: binary
              description: Raw MP4 video file bytes.
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AdManagerBaseResponse'
                - type: object
                  properties:
                    creative_uuid:
                      type: string
                      example: 8f2a1c3e-4b5d-4a6e-9f1a-2b3c4d5e6f7a
                    object_url:
                      type: string
                      example: https://cdn.5centscdn.com/ad-manager-uploads/abc123.mp4

  /ad-manager/{pid}/requests:
    post:
      summary: List Ad Pod Requests
      description: List/search the ad-pod request and decision log for a date range, with optional filtering by content, advertiser, campaign, creative, targeting dimension, and IAB break fields.
      operationId: listAdPodRequests
      tags:
      - Ad Pods
      parameters:
      - $ref: '#/components/parameters/pidParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdPodRequestFilters'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/AdManagerBaseResponse'
                - type: object
                  properties:
                    items:
                      type: array
                      description: Matching ad-pod requests.
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            example: pod_7e21c9
                          publisher_id:
                            type: string
                            example: "10042"
                          request_time:
                            type: string
                            format: date-time
                            example: "2026-01-15T10:30:00Z"
                          content_id:
                            type: string
                            example: "1024"
                          placement:
                            type: string
                            example: preroll
                          content_tags:
                            type: array
                            items:
                              type: string
                            example: [sports]
                          category:
                            type: integer
                            example: 3
                          continent_geoname_id:
                            type: integer
                            example: 6255149
                          country_geoname_id:
                            type: integer
                            example: 6252001
                          subdivision_1_geoname_id:
                            type: integer
                            example: 5332921
                          subdivision_2_geoname_id:
                            type: integer
                            example: 5391959
                          city_geoname_id:
                            type: integer
                            example: 5391811
                          device:
                            type: integer
                            description: IAB device-type ID.
                            example: 3
                          language:
                            type: string
                            example: en
                          user_key:
                            type: string
                            example: ""
                          ip:
                            type: string
                            example: "203.0.113.10"
                          user_agent:
                            type: string
                            example: Mozilla/5.0 (compatible; SSAI-Player/1.0)
                          os:
                            type: string
                            example: iOS
                          browser:
                            type: string
                            example: Chrome
                          max_duration:
                            type: integer
                            description: Requested break fill target, seconds (IAB BREAKMAXDURATION).
                            example: 30
                          min_ad_length:
                            type: integer
                            example: 5
                          max_ad_length:
                            type: integer
                            example: 30
                          decision_status:
                            type: string
                            example: decided
                          selected_duration_seconds:
                            type: number
                            description: Total duration actually filled, seconds.
                            example: 30
                          fill_status:
                            $ref: '#/components/schemas/FillStatus'
                          created_at:
                            type: string
                            format: date-time
                            example: "2026-01-15T10:30:00Z"
                    limit:
                      type: integer
                      example: 100
                    page:
                      type: integer
                      example: 1
                    pages:
                      type: integer
                      example: 4
                    total:
                      type: integer
                      example: 963

