openapi: 3.0.0
info:
  title: 5centsCDN - Stream Ad Insertion
  description: API for managing Ad Insertion on Live Streams in <a href="https://www.5centscdn.net" target="_blank">5centsCDN</a>
  version: 2.0.0
  contact:
    email: help@5centscdn.com
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
servers:
  - url: https://api.5centscdn.com/v2
    description: 5centsCDN API Server - Production
security:
  - ApiKeyAuth: []
tags:
  - name: Ad Insertion
    description: Enable, configure and control SCTE-35 ad insertion on a live stream
  - name: Ad Server
    description: Configure the upstream ad server (VAST/VMAP URL and query parameters)
  - name: Ad Pre-Roll
    description: Configure pre-roll ad settings
  - name: Ad Replacement
    description: Configure live ad replacement settings
  - name: Schedules
    description: Manage recurring or one-time ad break schedules
  - name: Triggers
    description: View and delete queued ad break triggers
  - name: Cue Signals
    description: Manually trigger cue-out / cue-in signals on the stream encoder
  - name: Consumption
    description: Query ad insertion consumption and billing data

paths:

  # ─── Ad Insertion (root) ────────────────────────────────────────────────────

  /streams/push/{streamid}/adinsertion:
    put:
      tags: [Ad Insertion]
      summary: Enable ad insertion (push stream)
      description: |
        Creates (or updates) the ad insertion record for the push stream.
        Requires the service to have **Advanced Features** enabled and an
        available ad insertion slot.
      operationId: adInsertionCreatePush
      parameters:
        - $ref: '#/components/parameters/streamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdInsertionCreateRequest'
            example:
              enabled: "Y"
              policy: 1
              provider: "Google Ad Manager"
              defaultDuration: 30
      responses:
        '200':
          $ref: '#/components/responses/SuccessResult'

    post:
      tags: [Ad Insertion]
      summary: Update ad insertion settings (push stream)
      description: |
        Updates the ad insertion record for the push stream. The record must already
        exist (i.e. ad insertion must have been enabled with `PUT` first).
      operationId: adInsertionUpdatePush
      parameters:
        - $ref: '#/components/parameters/streamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdInsertionCreateRequest'
            example:
              enabled: "Y"
              policy: 1
              provider: "Google Ad Manager"
              defaultDuration: 45
      responses:
        '200':
          $ref: '#/components/responses/SuccessResult'

    delete:
      tags: [Ad Insertion]
      summary: Delete ad insertion (push stream — not implemented)
      description: Reserved — returns `error / Not implemented` until a backend method is available.
      operationId: adInsertionDeletePush
      parameters:
        - $ref: '#/components/parameters/streamId'
      responses:
        '200':
          $ref: '#/components/responses/ErrorResult'

  /streams/pull/{streamid}/adinsertion:
    put:
      tags: [Ad Insertion]
      summary: Enable ad insertion (pull stream)
      description: |
        Creates (or updates) the ad insertion record for the pull stream.
        Requires the service to have **Advanced Features** enabled and an
        available ad insertion slot.
      operationId: adInsertionCreatePull
      parameters:
        - $ref: '#/components/parameters/streamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdInsertionCreateRequest'
            example:
              enabled: "Y"
              policy: 1
              provider: "Google Ad Manager"
              defaultDuration: 30
      responses:
        '200':
          $ref: '#/components/responses/SuccessResult'

    post:
      tags: [Ad Insertion]
      summary: Update ad insertion settings (pull stream)
      description: |
        Updates the ad insertion record for the pull stream. The record must already
        exist (i.e. ad insertion must have been enabled with `PUT` first).
      operationId: adInsertionUpdatePull
      parameters:
        - $ref: '#/components/parameters/streamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdInsertionCreateRequest'
            example:
              enabled: "Y"
              policy: 1
              provider: "Google Ad Manager"
              defaultDuration: 45
      responses:
        '200':
          $ref: '#/components/responses/SuccessResult'

    delete:
      tags: [Ad Insertion]
      summary: Delete ad insertion (pull stream — not implemented)
      description: Reserved — returns `error / Not implemented` until a backend method is available.
      operationId: adInsertionDeletePull
      parameters:
        - $ref: '#/components/parameters/streamId'
      responses:
        '200':
          $ref: '#/components/responses/ErrorResult'

  # ─── Ad Server ──────────────────────────────────────────────────────────────

  /streams/push/{streamid}/adinsertion/server:
    post:
      tags: [Ad Server]
      summary: Configure ad server (push stream)
      description: |
        Sets the upstream VAST/VMAP ad server URL, query parameters and custom
        origin headers. Triggers a `stream-adserver` provisioning job.
      operationId: adInsertionUpdateAdServerPush
      parameters:
        - $ref: '#/components/parameters/streamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdServerRequest'
            example:
              url: "https://cp.5centscdn.net/vast.php"
              queryParameters:
                - name: src_url
                  type: from-variable
                  value: SOURCE_URL
                - name: break_dur
                  type: from-variable
                  value: ADBREAK_DURATION_S
                - name: CACHE_BUSTER
                  type: from-variable
                  value: CACHE_BUSTER
              adOrigin:
                customHeaders: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResult'

  /streams/pull/{streamid}/adinsertion/server:
    post:
      tags: [Ad Server]
      summary: Configure ad server (pull stream)
      description: |
        Sets the upstream VAST/VMAP ad server URL, query parameters and custom
        origin headers. Triggers a `stream-adserver` provisioning job.
      operationId: adInsertionUpdateAdServerPull
      parameters:
        - $ref: '#/components/parameters/streamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdServerRequest'
            example:
              url: "https://cp.5centscdn.net/vast.php"
              queryParameters:
                - name: src_url
                  type: from-variable
                  value: SOURCE_URL
                - name: break_dur
                  type: from-variable
                  value: ADBREAK_DURATION_S
                - name: CACHE_BUSTER
                  type: from-variable
                  value: CACHE_BUSTER
              adOrigin:
                customHeaders: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResult'

  # ─── Ad Pre-Roll ────────────────────────────────────────────────────────────

  /streams/push/{streamid}/adinsertion/preroll:
    post:
      tags: [Ad Pre-Roll]
      summary: Configure pre-roll ads (push stream)
      description: |
        Enables or disables live ad pre-roll. When `enabled` is `N` the
        pre-roll configuration is removed entirely. Cannot be combined with
        `pastAdBreakReplacement` ≠ 0 in ad-replacement settings.
      operationId: adInsertionUpdateAdPreRollPush
      parameters:
        - $ref: '#/components/parameters/streamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdPreRollRequest'
            example:
              enabled: "Y"
              maxDuration: 30
              offset: 0
              startOver: "Y"
      responses:
        '200':
          $ref: '#/components/responses/SuccessResult'

  /streams/pull/{streamid}/adinsertion/preroll:
    post:
      tags: [Ad Pre-Roll]
      summary: Configure pre-roll ads (pull stream)
      description: |
        Enables or disables live ad pre-roll. When `enabled` is `N` the
        pre-roll configuration is removed entirely. Cannot be combined with
        `pastAdBreakReplacement` ≠ 0 in ad-replacement settings.
      operationId: adInsertionUpdateAdPreRollPull
      parameters:
        - $ref: '#/components/parameters/streamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdPreRollRequest'
            example:
              enabled: "Y"
              maxDuration: 30
              offset: 0
              startOver: "Y"
      responses:
        '200':
          $ref: '#/components/responses/SuccessResult'

  # ─── Ad Replacement ─────────────────────────────────────────────────────────

  /streams/push/{streamid}/adinsertion/replacement:
    post:
      tags: [Ad Replacement]
      summary: Configure ad replacement (push stream)
      description: |
        Enables or disables live ad replacement. When `enabled` is `N` the
        replacement configuration is removed entirely. Cannot be combined with
        ad pre-roll when `pastAdBreakReplacement` ≠ 0.
      operationId: adInsertionUpdateAdReplacementPush
      parameters:
        - $ref: '#/components/parameters/streamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdReplacementRequest'
            example:
              enabled: "Y"
              gapFiller: ""
              maxAdDurationExcess: 0
              pastAdBreakReplacement: 0
              pastAdBreakReplacementValue: ""
              onStartWithinAdBreak: replace
              scte35:
                adBreakTriggers:
                  - "0x22"
                  - "0x30"
                  - "0x32"
                  - "0x34"
                  - "0x36"
                  - "0x38"
                  - "0x3a"
                  - splice_insert
                markersToRemove:
                  - ALL
      responses:
        '200':
          $ref: '#/components/responses/SuccessResult'

  /streams/pull/{streamid}/adinsertion/replacement:
    post:
      tags: [Ad Replacement]
      summary: Configure ad replacement (pull stream)
      description: |
        Enables or disables live ad replacement. When `enabled` is `N` the
        replacement configuration is removed entirely. Cannot be combined with
        ad pre-roll when `pastAdBreakReplacement` ≠ 0.
      operationId: adInsertionUpdateAdReplacementPull
      parameters:
        - $ref: '#/components/parameters/streamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdReplacementRequest'
            example:
              enabled: "Y"
              gapFiller: ""
              maxAdDurationExcess: 0
              pastAdBreakReplacement: 0
              pastAdBreakReplacementValue: ""
              onStartWithinAdBreak: replace
              scte35:
                adBreakTriggers:
                  - "0x22"
                  - "0x30"
                  - "0x32"
                  - "0x34"
                  - "0x36"
                  - "0x38"
                  - "0x3a"
                  - splice_insert
                markersToRemove:
                  - ALL
      responses:
        '200':
          $ref: '#/components/responses/SuccessResult'

  # ─── Schedules ──────────────────────────────────────────────────────────────

  /streams/push/{streamid}/adinsertion/schedule:
    post:
      tags: [Schedules]
      summary: Add ad break schedule (push stream)
      description: |
        Adds a new ad break schedule. Two schedule types are supported:
        - **Type 1** – Recurring: fires according to a Quartz-style 6-field
          cron expression. `recur` sets the maximum number of repetitions
          (0 = unlimited).
        - **Type 2** – One-time: fires at a specific Unix timestamp (must be
          at least 2 minutes in the future).

        Maximum 10 schedules per stream. No two schedules may share the same
        `value`. For type 2, no existing trigger may exist within ±3 minutes.
      operationId: adInsertionAddSchedulePush
      parameters:
        - $ref: '#/components/parameters/streamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, duration, value]
              properties:
                _METHOD:
                  type: string
                  description: HTTP method override. Must be PUT for schedule creation.
                  example: PUT
                type:
                  type: integer
                  enum: [1, 2]
                  description: |
                    Schedule type.
                    - `1` – Recurring (Quartz cron expression)
                    - `2` – One-time (Unix timestamp, at least 120 seconds in the future)
                  example: 1
                duration:
                  type: integer
                  minimum: 10
                  maximum: 180
                  description: Ad break duration in seconds.
                  example: 60
                value:
                  description: |
                    For type `1`: a Quartz-style 6-field cron expression
                    (`<seconds> <minute> <hour> <dom> <month> <dow>`).
                    For type `2`: a Unix timestamp at least 120 seconds in the future.
                  oneOf:
                    - type: string
                      description: Quartz cron expression (type 1).
                    - type: integer
                      description: Unix timestamp (type 2).
                  example: "0 */5 * * * *"
                mode:
                  type: string
                  enum: [schedule]
                  description: Pass `schedule` to immediately create triggers for the new cron schedule rather than waiting for the next cron evaluation.
                  example: schedule
                recur:
                  type: integer
                  minimum: 0
                  maximum: 720
                  description: Maximum number of trigger repetitions (type 1 only). `0` means unlimited. Ignored for type 2.
                  example: 1
      responses:
        '200':
          description: Schedule add result including trigger counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [success, error]
                    example: success
                  message:
                    type: string
                    description: Summary of added and failed trigger counts.
                    example: "Added: 1, Failed: 151"
                  messages:
                    type: object
                    properties:
                      added:
                        type: object
                        description: Map of Unix timestamp to beanstalkd job ID for successfully queued triggers.
                        additionalProperties:
                          type: integer
                        example:
                          "1778066400": 1370623
                      failed:
                        type: object
                        description: Map of Unix timestamp to failure reason for triggers that could not be queued.
                        additionalProperties:
                          type: string
                        example:
                          "1778066700": "Recur limit reached"
                          "1778067000": "Recur limit reached"

  /streams/pull/{streamid}/adinsertion/schedule:
    post:
      tags: [Schedules]
      summary: Add ad break schedule (pull stream)
      description: |
        Adds a new ad break schedule. Two schedule types are supported:
        - **Type 1** – Recurring: fires according to a Quartz-style 6-field
          cron expression. `recur` sets the maximum number of repetitions
          (0 = unlimited).
        - **Type 2** – One-time: fires at a specific Unix timestamp (must be
          at least 2 minutes in the future).

        Maximum 10 schedules per stream. No two schedules may share the same
        `value`. For type 2, no existing trigger may exist within ±3 minutes.
      operationId: adInsertionAddSchedulePull
      parameters:
        - $ref: '#/components/parameters/streamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, duration, value]
              properties:
                _METHOD:
                  type: string
                  description: HTTP method override. Must be PUT for schedule creation.
                  example: PUT
                type:
                  type: integer
                  enum: [1, 2]
                  description: |
                    Schedule type.
                    - `1` – Recurring (Quartz cron expression)
                    - `2` – One-time (Unix timestamp, at least 120 seconds in the future)
                  example: 1
                duration:
                  type: integer
                  minimum: 10
                  maximum: 180
                  description: Ad break duration in seconds.
                  example: 60
                value:
                  description: |
                    For type `1`: a Quartz-style 6-field cron expression
                    (`<seconds> <minute> <hour> <dom> <month> <dow>`).
                    For type `2`: a Unix timestamp at least 120 seconds in the future.
                  oneOf:
                    - type: string
                      description: Quartz cron expression (type 1).
                    - type: integer
                      description: Unix timestamp (type 2).
                  example: "0 */5 * * * *"
                mode:
                  type: string
                  enum: [schedule]
                  description: Pass `schedule` to immediately create triggers for the new cron schedule rather than waiting for the next cron evaluation.
                  example: schedule
                recur:
                  type: integer
                  minimum: 0
                  maximum: 720
                  description: Maximum number of trigger repetitions (type 1 only). `0` means unlimited. Ignored for type 2.
                  example: 1
      responses:
        '200':
          description: Schedule add result including trigger counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [success, error]
                    example: success
                  message:
                    type: string
                    description: Summary of added and failed trigger counts.
                    example: "Added: 1, Failed: 151"
                  messages:
                    type: object
                    properties:
                      added:
                        type: object
                        description: Map of Unix timestamp to beanstalkd job ID for successfully queued triggers.
                        additionalProperties:
                          type: integer
                        example:
                          "1778066400": 1370623
                      failed:
                        type: object
                        description: Map of Unix timestamp to failure reason for triggers that could not be queued.
                        additionalProperties:
                          type: string
                        example:
                          "1778066700": "Recur limit reached"
                          "1778067000": "Recur limit reached"

  /streams/push/{streamid}/adinsertion/schedule/{scheduleid}:
    post:
      tags: [Schedules]
      summary: Update a schedule (push stream)
      description: |
        Updates the cron pattern, duration and recurrence limit of an existing
        **type 1** (recurring) schedule. Optionally replaces all queued
        triggers for the schedule when `mode` is `replace`.
      operationId: adInsertionUpdateSchedulePush
      parameters:
        - $ref: '#/components/parameters/streamId'
        - $ref: '#/components/parameters/scheduleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, duration, recur]
              properties:
                value:
                  type: string
                  description: Updated Quartz 6-field cron expression defining the schedule firing pattern.
                  example: "10 */5 1 * * *"
                duration:
                  type: integer
                  minimum: 10
                  maximum: 180
                  description: Updated ad break duration in seconds.
                  example: 24
                recur:
                  type: integer
                  minimum: 0
                  maximum: 720
                  description: Updated maximum number of trigger repetitions. `0` means unlimited.
                  example: 0
                mode:
                  type: string
                  enum: [replace]
                  description: Pass `replace` to delete existing triggers and regenerate them from the updated cron pattern.
                  example: replace
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [success, error]
                    example: success

    delete:
      tags: [Schedules]
      summary: Delete a schedule (push stream)
      description: |
        Deletes the schedule record. When `mode` is `clear`, all queued
        beanstalkd triggers associated with the schedule are also deleted
        before the record is removed.
      operationId: adInsertionDeleteSchedulePush
      parameters:
        - $ref: '#/components/parameters/streamId'
        - $ref: '#/components/parameters/scheduleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [_METHOD, mode]
              properties:
                _METHOD:
                  type: string
                  description: HTTP method override required for delete operations.
                  example: DELETE
                mode:
                  type: string
                  enum: [delete, clear]
                  description: |
                    Controls the delete behaviour.
                    - `delete` – Removes the schedule record only. Any queued triggers remain in beanstalkd.
                    - `clear` – Removes the schedule record AND deletes all queued beanstalkd triggers associated with this schedule.
                  example: delete
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [success, error]
                    example: success
                  message:
                    type: string
                    example: Schedule Deleted

  /streams/pull/{streamid}/adinsertion/schedule/{scheduleid}:
    post:
      tags: [Schedules]
      summary: Update a schedule (pull stream)
      description: |
        Updates the cron pattern, duration and recurrence limit of an existing
        **type 1** (recurring) schedule. Optionally replaces all queued
        triggers for the schedule when `mode` is `replace`.
      operationId: adInsertionUpdateSchedulePull
      parameters:
        - $ref: '#/components/parameters/streamId'
        - $ref: '#/components/parameters/scheduleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, duration, recur]
              properties:
                value:
                  type: string
                  description: Updated Quartz 6-field cron expression defining the schedule firing pattern.
                  example: "10 */5 1 * * *"
                duration:
                  type: integer
                  minimum: 10
                  maximum: 180
                  description: Updated ad break duration in seconds.
                  example: 24
                recur:
                  type: integer
                  minimum: 0
                  maximum: 720
                  description: Updated maximum number of trigger repetitions. `0` means unlimited.
                  example: 0
                mode:
                  type: string
                  enum: [replace]
                  description: Pass `replace` to delete existing triggers and regenerate them from the updated cron pattern.
                  example: replace
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [success, error]
                    example: success

    delete:
      tags: [Schedules]
      summary: Delete a schedule (pull stream)
      description: |
        Deletes the schedule record. When `mode` is `clear`, all queued
        beanstalkd triggers associated with the schedule are also deleted
        before the record is removed.
      operationId: adInsertionDeleteSchedulePull
      parameters:
        - $ref: '#/components/parameters/streamId'
        - $ref: '#/components/parameters/scheduleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [_METHOD, mode]
              properties:
                _METHOD:
                  type: string
                  description: HTTP method override required for delete operations.
                  example: DELETE
                mode:
                  type: string
                  enum: [delete, clear]
                  description: |
                    Controls the delete behaviour.
                    - `delete` – Removes the schedule record only. Any queued triggers remain in beanstalkd.
                    - `clear` – Removes the schedule record AND deletes all queued beanstalkd triggers associated with this schedule.
                  example: delete
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    enum: [success, error]
                    example: success
                  message:
                    type: string
                    example: Schedule Deleted

  # ─── Triggers ───────────────────────────────────────────────────────────────

  /streams/push/{streamid}/adinsertion/triggers:
    post:
      tags: [Triggers]
      summary: List triggers (push stream)
      description: |
        Returns the queued ad break triggers belonging to this stream,
        optionally filtered by schedule IDs and triggered status.
      operationId: adInsertionGetTriggersPush
      parameters:
        - $ref: '#/components/parameters/streamId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggersRequest'
            example:
              scheduleIds: [101, 102]
              viewTriggered: "0"
              orderByDate: true
      responses:
        '200':
          description: Array of trigger objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trigger'

  /streams/pull/{streamid}/adinsertion/triggers:
    post:
      tags: [Triggers]
      summary: List triggers (pull stream)
      description: |
        Returns the queued ad break triggers belonging to this stream,
        optionally filtered by schedule IDs and triggered status.
      operationId: adInsertionGetTriggersPull
      parameters:
        - $ref: '#/components/parameters/streamId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggersRequest'
            example:
              scheduleIds: [101, 102]
              viewTriggered: "0"
              orderByDate: true
      responses:
        '200':
          description: Array of trigger objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trigger'

  /streams/push/{streamid}/adinsertion/trigger/{triggerid}:
    delete:
      tags: [Triggers]
      summary: Delete a trigger (push stream)
      description: |
        Deletes a single queued trigger from both beanstalkd and the database.
        Returns `error` with per-operation messages if any step fails.
      operationId: adInsertionDeleteTriggerPush
      parameters:
        - $ref: '#/components/parameters/streamId'
        - $ref: '#/components/parameters/triggerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [_METHOD]
              properties:
                _METHOD:
                  type: string
                  description: HTTP method override used to signal a delete operation.
                  example: DELETE
      responses:
        '200':
          $ref: '#/components/responses/SuccessResult'

  /streams/pull/{streamid}/adinsertion/trigger/{triggerid}:
    delete:
      tags: [Triggers]
      summary: Delete a trigger (pull stream)
      description: |
        Deletes a single queued trigger from both beanstalkd and the database.
        Returns `error` with per-operation messages if any step fails.
      operationId: adInsertionDeleteTriggerPull
      parameters:
        - $ref: '#/components/parameters/streamId'
        - $ref: '#/components/parameters/triggerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [_METHOD]
              properties:
                _METHOD:
                  type: string
                  description: HTTP method override used to signal a delete operation.
                  example: DELETE
      responses:
        '200':
          $ref: '#/components/responses/SuccessResult'

  # ─── Cue Signals ────────────────────────────────────────────────────────────

  /streams/push/{streamid}/adinsertion/cue-out:
    get:
      tags: [Cue Signals]
      summary: Trigger cue-out / ad break start (push stream)
      description: |
        Sends a SCTE-35 cue-out signal to the stream encoder, starting an ad
        break of `duration` seconds. If `duration` is omitted the stream's
        `defaultDuration` is used (fallback: 30 s).

        Signals are sent to both primary and backup encoder IPs. For
        transcoded / ABR streams, signals are sent to streams 1–5.
      operationId: adInsertionCueOutPush
      parameters:
        - $ref: '#/components/parameters/streamId'
        - in: query
          name: duration
          required: false
          schema:
            type: integer
            minimum: 1
          description: Ad break duration in seconds.
      responses:
        '200':
          description: Cue-out sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CueResult'

  /streams/pull/{streamid}/adinsertion/cue-out:
    get:
      tags: [Cue Signals]
      summary: Trigger cue-out / ad break start (pull stream)
      description: |
        Sends a SCTE-35 cue-out signal to the stream encoder, starting an ad
        break of `duration` seconds. If `duration` is omitted the stream's
        `defaultDuration` is used (fallback: 30 s).

        Signals are sent to both primary and backup encoder IPs. For
        transcoded / ABR streams, signals are sent to streams 1–5.
      operationId: adInsertionCueOutPull
      parameters:
        - $ref: '#/components/parameters/streamId'
        - in: query
          name: duration
          required: false
          schema:
            type: integer
            minimum: 1
          description: Ad break duration in seconds.
      responses:
        '200':
          description: Cue-out sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CueResult'

  /streams/push/{streamid}/adinsertion/cue-in:
    get:
      tags: [Cue Signals]
      summary: Trigger cue-in / return to content (push stream)
      description: |
        Sends a SCTE-35 cue-in signal to the stream encoder, ending the
        current ad break and returning to the live content feed.
      operationId: adInsertionCueInPush
      parameters:
        - $ref: '#/components/parameters/streamId'
      responses:
        '200':
          description: Cue-in sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CueResult'

  /streams/pull/{streamid}/adinsertion/cue-in:
    get:
      tags: [Cue Signals]
      summary: Trigger cue-in / return to content (pull stream)
      description: |
        Sends a SCTE-35 cue-in signal to the stream encoder, ending the
        current ad break and returning to the live content feed.
      operationId: adInsertionCueInPull
      parameters:
        - $ref: '#/components/parameters/streamId'
      responses:
        '200':
          description: Cue-in sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CueResult'

  # ─── Consumption ────────────────────────────────────────────────────────────

  /streams/push/{streamid}/adinsertion/consumption:
    post:
      tags: [Consumption]
      summary: Get ad insertion consumption (push stream)
      description: |
        Returns ad insertion consumption data from the Broadpeak ad service,
        grouped by the requested time resolution.

        The `r` range uses the format `YYYY-MM-DD HH:MM:SS - YYYY-MM-DD HH:MM:SS`.
      operationId: adInsertionGetConsumptionPush
      parameters:
        - $ref: '#/components/parameters/streamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumptionRequest'
            example:
              groupBy: month
              r: "2025-01-01 00:00:00 - 2025-02-01 00:00:00"
      responses:
        '200':
          description: Consumption data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumptionResult'

  /streams/pull/{streamid}/adinsertion/consumption:
    post:
      tags: [Consumption]
      summary: Get ad insertion consumption (pull stream)
      description: |
        Returns ad insertion consumption data from the Broadpeak ad service,
        grouped by the requested time resolution.

        The `r` range uses the format `YYYY-MM-DD HH:MM:SS - YYYY-MM-DD HH:MM:SS`.
      operationId: adInsertionGetConsumptionPull
      parameters:
        - $ref: '#/components/parameters/streamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumptionRequest'
            example:
              groupBy: month
              r: "2025-01-01 00:00:00 - 2025-02-01 00:00:00"
      responses:
        '200':
          description: Consumption data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsumptionResult'

# ─── Components ───────────────────────────────────────────────────────────────

components:

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    streamId:
      in: path
      name: streamid
      required: true
      schema:
        type: integer
      description: Numeric stream ID.

    scheduleId:
      in: path
      name: scheduleid
      required: true
      schema:
        type: integer
      description: Numeric schedule ID.

    triggerId:
      in: path
      name: triggerid
      required: true
      schema:
        type: integer
      description: Numeric trigger ID.

  responses:
    SuccessResult:
      description: Operation result
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultResponse'
          examples:
            success:
              value: { result: success }
            error:
              value: { result: error, message: 'Descriptive error message.' }

    ErrorResult:
      description: Operation not available
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultResponse'
          example:
            result: error
            message: Not implemented.

    ScheduleResult:
      description: Schedule add result (includes trigger counts on schedule-and-trigger mode)
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ResultResponse'
              - $ref: '#/components/schemas/ScheduleAddResult'

  schemas:

    # ── Shared ────────────────────────────────────────────────────────────────

    ResultResponse:
      type: object
      required: [result]
      properties:
        result:
          type: string
          enum: [success, error]
        message:
          type: string

    # ── Ad Insertion ──────────────────────────────────────────────────────────

    AdInsertionCreateRequest:
      type: object
      required: [enabled, policy]
      properties:
        enabled:
          type: string
          enum: [Y, N]
          description: Enable (`Y`) or disable (`N`) ad insertion on the stream.
        policy:
          type: integer
          enum: [1, 2]
          description: |
            Ad insertion policy.
            - `1` – Provider-based (requires `provider`)
            - `2` – No provider
        provider:
          type: string
          description: Required when `policy` is `1`. Provider identifier.
        defaultDuration:
          type: integer
          minimum: 10
          maximum: 180
          default: 30
          description: Default ad break duration in seconds used by cue-out when no explicit duration is given.

    # ── Ad Server ─────────────────────────────────────────────────────────────

    AdServerRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Full VAST/VMAP ad server URL.
        queryParameters:
          type: array
          description: Query parameters appended to every ad request.
          items:
            $ref: '#/components/schemas/AdServerQueryParam'
        adOrigin:
          type: object
          properties:
            customHeaders:
              type: array
              description: Custom HTTP headers sent to the ad origin.
              items:
                $ref: '#/components/schemas/CustomHeader'

    AdServerQueryParam:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          description: Query parameter name (alphanumeric + `_` + `-`).
        type:
          type: string
          enum: [custom, forward, from-variable, from-header, from-query-parameter]
        value:
          type: string
          description: |
            Parameter value. Required for types `custom`, `from-header`,
            `from-query-parameter`.
            For `from-variable`, must be one of:
            `CLIENT_IP`, `CACHE_BUSTER`, `ADBREAK_DURATION_S`,
            `ADBREAK_DURATION_MS`, `UPID_ASCII`, `UPID_HEX`,
            `ADFR_FORMAT`, `ADFR_VERSION`, `ADFR_CHANNEL`,
            `ADFR_DATE`, `ADFR_CODE`, `ADFR_DURATION`,
            `CURRENT_SPOT_INDEX`, `SOURCE_URL`.

    CustomHeader:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
          description: HTTP header name.
        value:
          type: string
          description: HTTP header value.

    # ── Ad Pre-Roll ───────────────────────────────────────────────────────────

    AdPreRollRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: string
          enum: [Y, N]
          description: Enable or disable pre-roll.
        maxDuration:
          type: integer
          minimum: 1
          maximum: 7200
          description: Maximum pre-roll duration in seconds. Required when `enabled` is `Y`.
        offset:
          type: integer
          minimum: 0
          maximum: 60
          description: Playback offset in seconds before the pre-roll starts.
        startOver:
          type: string
          enum: [Y]
          description: Pass `Y` to restart the stream from the beginning after the pre-roll.

    # ── Ad Replacement ────────────────────────────────────────────────────────

    AdReplacementRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: string
          enum: [Y, N]
          description: Enable or disable ad replacement.
        gapFiller:
          type: string
          description: URL to a gap-filler asset (`.mp4`, `.jpg`, `.jpeg`) shown when no ad is available.
        maxAdDurationExcess:
          type: integer
          minimum: 0
          maximum: 180
          description: Maximum seconds an ad is allowed to exceed the scheduled break duration.
        pastAdBreakReplacement:
          type: integer
          enum: [-2, -1, 0]
          description: |
            Behaviour for late-joining viewers:
            - `0`  – Disabled
            - `-1` – Replace from the beginning of the current ad break
            - `-2` – Replace up to `pastAdBreakReplacementValue` seconds back
        pastAdBreakReplacementValue:
          type: integer
          minimum: 1
          maximum: 7200
          description: Look-back window in seconds. Required when `pastAdBreakReplacement` is `-2`.
        onStartWithinAdBreak:
          type: string
          enum: [replace, skip_ad_break]
          description: What to do when a viewer joins mid-break.
        scte35:
          $ref: '#/components/schemas/Scte35Config'

    Scte35Config:
      type: object
      properties:
        adBreakTriggers:
          type: array
          description: SCTE-35 splice command types that start an ad break.
          items:
            type: string
            enum: ['0x22', '0x30', '0x32', '0x34', '0x36', '0x38', '0x3a', splice_insert]
        markersToRemove:
          type: array
          description: SCTE-35 markers to strip from the manifest. Pass `ALL` to remove everything.
          items:
            type: string
            enum: ['0x22', '0x30', '0x32', '0x34', '0x36', '0x38', '0x3a', splice_insert, ALL]

    # ── Schedules ─────────────────────────────────────────────────────────────

    ScheduleAddRequest:
      type: object
      required: [type, duration, value]
      properties:
        type:
          type: integer
          enum: [1, 2]
          description: |
            - `1` – Recurring (Quartz cron)
            - `2` – One-time (Unix timestamp)
        duration:
          type: integer
          minimum: 10
          maximum: 180
          description: Ad break duration in seconds.
        value:
          description: |
            For type `1`: a Quartz-style 6-field cron expression
            (`<seconds> <minute> <hour> <dom> <month> <dow>`).
            Seconds must be a plain integer; other fields support `*`, `*/n`, ranges and lists.

            For type `2`: a Unix timestamp at least 120 seconds in the future.
          oneOf:
            - type: string
              description: Quartz cron expression (type 1)
            - type: integer
              description: Unix timestamp (type 2)
        recur:
          type: integer
          minimum: 0
          maximum: 720
          description: |
            Maximum number of trigger repetitions (type 1 only).
            `0` means unlimited. Ignored for type 2.
        mode:
          type: string
          enum: [schedule]
          description: |
            Pass `schedule` to immediately create triggers for the new cron
            schedule rather than waiting for the next cron evaluation.

    ScheduleUpdateRequest:
      type: object
      required: [value, duration, recur]
      properties:
        value:
          type: string
          description: Updated Quartz 6-field cron expression.
        duration:
          type: integer
          minimum: 10
          maximum: 180
          description: Updated ad break duration in seconds.
        recur:
          type: integer
          minimum: 0
          maximum: 720
          description: Updated maximum repetitions. `0` = unlimited.
        mode:
          type: string
          enum: [replace]
          description: Pass `replace` to delete existing triggers and regenerate them from the updated pattern.

    ScheduleAddResult:
      type: object
      properties:
        result:
          type: string
          enum: [success, error]
        message:
          type: string
          example: 'Added: 3, Failed: 1'
        messages:
          type: object
          properties:
            added:
              type: object
              description: Map of `timestamp → beanstalkd job ID` for successfully queued triggers.
              additionalProperties:
                type: integer
            failed:
              type: object
              description: Map of `timestamp → reason` for triggers that could not be queued.
              additionalProperties:
                type: string

    # ── Triggers ──────────────────────────────────────────────────────────────

    TriggersRequest:
      type: object
      properties:
        scheduleIds:
          type: array
          items:
            type: integer
          description: Filter to specific schedule IDs. Omit or leave empty for all schedules on this stream.
        viewTriggered:
          type: string
          enum: ['0', '1']
          description: |
            Filter by triggered status. Omit to return all.
            - `0` – Pending
            - `1` – Already fired
        orderByDate:
          type: boolean
          description: Set `true` to order results by `value` descending (newest first). Default ascending.

    Trigger:
      type: object
      properties:
        id:
          type: integer
          description: Beanstalkd job ID (also used as the trigger's DB primary key).
        relid:
          type: integer
          description: Parent schedule ID.
        value:
          type: integer
          description: Scheduled fire time as a Unix timestamp.
        triggered:
          type: integer
          enum: [0, 1]
          description: Whether the trigger has already fired.

    # ── Cue Signals ───────────────────────────────────────────────────────────

    CueResult:
      type: object
      properties:
        result:
          type: string
          enum: [success, error]
        message:
          type: string
          example: 'Ad Insertion triggered for 30s'

    # ── Consumption ───────────────────────────────────────────────────────────

    ConsumptionRequest:
      type: object
      required: [groupBy, r]
      properties:
        groupBy:
          type: string
          enum: [year, month, week, day, hour]
          description: Time resolution for aggregating consumption data.
        r:
          type: string
          description: |
            Date-time range in the format:
            `YYYY-MM-DD HH:MM:SS - YYYY-MM-DD HH:MM:SS`
          example: '2025-01-01 00:00:00 - 2025-02-01 00:00:00'

    ConsumptionResult:
      type: object
      properties:
        result:
          type: string
          enum: [success, error]
        message:
          type: string
        totalAdInsertionHours:
          type: number
          description: Total ad insertion hours in the requested range.
        adInsertionHoursChart:
          type: array
          description: Time-series data points.
          items:
            type: object
            properties:
              date:
                type: string
              value:
                type: number
