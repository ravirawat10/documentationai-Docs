  /players/5centscdn/skins/{skinid}:
    get:
      tags:
      - 5centsCDN
      summary: Get Player Skin
      parameters:
      - name: skinid
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 893
                  serviceid:
                    type: integer
                    example: 103
                  hashid:
                    type: string
