  /players/5centscdn/analytics/stats:
    post:
      tags:
      - 5centsCDN
      summary: Analytics Statistics
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                r:
                  type: string
                  example: 2022-03-01 00:00:00 - 2022-04-20 13:00:00
                  description: 'Date range string in UTC format: "YYYY-MM-DD HH:mm:ss - YYYY-MM-DD HH:mm:ss". Defines the reporting window.'
                granularity:
                  type: string
                  description: 'Time granularity for data aggregation. One of: 1m, 5m, 15m, 1h, 1d, 1M.'
                  example: 1h
                assests:
                  type: string
                  description: Comma-separated asset IDs filter. Retrieve available IDs from POST /players/5centscdn/analytics/search/assets.
                  example: 114160,116908
                titles:
                  type: string
                  description: Comma-separated title IDs filter. Retrieve available values from POST /players/5centscdn/analytics/search/titles.
                  example: intro.mp4/playlist.m3u8
                tags:
                  type: string
                  description: Comma-separated tag IDs filter. Retrieve available values from POST /players/5centscdn/analytics/search/tags.
                  example: live,highlights
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  aggregate:
                    type: object
                    properties:
                      concurrent:
                        type: integer
                        example: 2
                      impression:
                        type: integer
                        example: 23
                      page_load:
                        type: integer
                        example: 4586
                      play:
                        type: integer
                        example: 15
                      player_load:
                        type: integer
                        example: 1407
                      total_played:
                        type: integer
                        example: 40
                      unique:
                        type: integer
                        example: 9
                      hits:
                        type: integer
                        example: 110
                      complete:
                        type: integer
                        example: 1
                  concurrent:
                    type: array
                    items:
                      type: object
                      properties:
                        count:
                          type: integer
                          example: 1
                        date:
                          type: string
                          example: '2025-01-20 03:00'
                  impression:
                    type: array
                    items:
                      type: object
                      properties:
                        count:
                          type: integer
                          example: 1
                        date:
                          type: string
                          example: '2025-02-05 06:00'
                  page_load:
                    type: array
                    items:
                      type: object
