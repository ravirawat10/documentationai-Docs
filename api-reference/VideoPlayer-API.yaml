  /players/5centscdn/analytics/data:
    post:
      tags:
      - 5centsCDN
      summary: Analytics Data
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                r:
                  type: string
                  example: 2022-03-01 13:38:00 - 2022-04-20 13:38:00
                  description: 'Date range string in UTC format: "YYYY-MM-DD HH:mm:ss - YYYY-MM-DD HH:mm:ss". Defines the reporting window.'
                type:
                  type: string
                  description: 'Event type to aggregate. One of: play (view started), unique (unique viewer), impression (player visible).'
                  enum:
                  - play
                  - unique
                  - impression
                  example: play
                data_type:
                  type: string
                  description: 'Dimension to break down the data by. One of: country, browser, os, device, title.'
                  enum:
                  - country
                  - browser
                  - os
                  - device
                  - title
                  example: country
                assests[]:
                  type: string
                  description: Asset ID filter. Retrieve IDs from POST /players/5centscdn/analytics/search/assets.
                  example: '114160'
                titles[]:
                  type: string
                  description: Title filter. Retrieve values from POST /players/5centscdn/analytics/search/titles.
                  example: intro.mp4/playlist.m3u8
                tags[]:
                  type: string
                  description: Tag filter. Retrieve values from POST /players/5centscdn/analytics/search/tags.
                  example: live
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    data:
                      type: string
                      example: India
                    count:
                      type: integer
                      example: 15
              example:
                country:
                - data: India
                  count: 15
                browser:
                - data: Chrome
                  count: 10
                - data: Chrome Mobile
                  count: 5
                os:
                - data: Windows
                  count: 6
                - data: Android
                  count: 5
                - data: Linux
                  count: 4
                device:
                - data: Other
                  count: 10
                - data: K
                  count: 5
                title:
                - data: 9d7f2406-efc1-486d-b16a-3d486f525348
                  count: 5
