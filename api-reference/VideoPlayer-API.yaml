  /players/5centscdn/analytics/search/assets:
    post:
      tags:
      - 5centsCDN
      summary: Analytics Search Assets
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                search:
                  type: string
                  description: Text search term for asset autocomplete. Filters assets by name.
                  example: stream
                page:
                  type: integer
                  example: 1
                  description: Pagination page number. Starts at 1.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                pagination:
                  more: true
                results:
                - id: '114160'
                  text: 'Stream #14160 - app/stream1'
  /players/5centscdn/analytics/search/titles:
    post:
      tags:
      - 5centsCDN
      summary: Analytics Search Titles
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                r:
                  type: string
                  example: 2022-03-01 13:38:00 - 2022-04-20 13:38:00
                  description: 'Date range string in UTC format: "YYYY-MM-DD HH:mm:ss - YYYY-MM-DD HH:mm:ss". Used to scope title results.'
                search:
                  type: string
                  description: Text search term to filter titles by name.
                  example: intro
                assets:
                  type: string
                  description: Comma-separated list of selected asset IDs to scope the title search. At least one asset is required.
                  example: 114160,116908
                page:
                  type: integer
                  example: 1
                  description: Pagination page number. Starts at 1.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                pagination:
                  more: false
                results: []
  /players/5centscdn/analytics/search/tags:
    post:
      tags:
      - 5centsCDN
      summary: Analytics Search Tags
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                r:
                  type: string
                  example: 2022-04-01 00:00:00 - 2022-04-30 23:59:00
                  description: 'Date range string in UTC format: "YYYY-MM-DD HH:mm:ss - YYYY-MM-DD HH:mm:ss". Used to scope tag results.'
                assets:
                  type: integer
                  description: Comma-separated list of selected asset IDs to scope the tag search.
                  example: '21599'
                titles:
                  type: string
                  description: Comma-separated list of selected title IDs to scope the tag search. At least one title is required.
                  example: intro.mp4/playlist.m3u8
                page:
                  type: integer
                  example: 1
                  description: Pagination page number. Starts at 1.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                pagination:
                  more: false
                results: []
  /players/5centscdn/skins:
    get:
      tags:
      - 5centsCDN
      summary: Skins List
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Unique skin ID
                      example: 782
                    serviceid:
                      type: integer
                      description: Service account ID
                      example: 103
                    hashid:
                      type: string
                      description: Unique hash identifier for the skin
                      example: rjed53ekvwlp
                    name:
                      type: string
                      description: Display name of the skin
                      example: testing
                    base:
                      type: integer
                      description: 'Base skin template. Valid values: 1, 2, 3, 4, or 5'
                      example: 1
                    meta:
                      type: object
                      description: Skin configuration settings
                      properties:
                        showskinoninit:
                          type: integer
                          description: Show the skin UI controls when the player initialises. 1=yes, 0=no
                          example: 1
                        showpip:
                          type: integer
                          description: Show Picture-in-Picture button. 1=yes, 0=no
                          example: 1
                        autoplay:
                          type: integer
                          description: Automatically start playback. 1=enabled, 0=disabled
                          example: 1
                        muted:
                          type: integer
                          description: Start playback muted. 1=muted, 0=unmuted
                          example: 1
                        endAction:
                          type: string
                          description: Action to perform when playback ends. Empty string means default behaviour
                          example: ''
                        infoTitle:
                          type: string
                          description: Title text shown in the player info overlay
                          example: ''
                        infoUrl:
                          type: string
                          description: URL linked from the player info overlay
                          example: ''
                        infoDescription:
                          type: string
                          description: Description text in the player info overlay
                          example: ''
                        infoIcon:
                          type: string
                          description: Icon for the player info overlay
                          example: ''
                        primaryColor:
                          type: string
                          description: Primary brand colour in hex format
                          example: '#f44336'
                        secondaryColor:
                          type: string
                          description: Secondary accent colour in hex format
                          example: '#000000'
                        showcv:
                          type: integer
                          description: Show concurrent viewers count. 1=yes, 0=no
                          example: 0
                        logo:
                          type: object
                          description: Branding logo overlay configuration
                          properties:
                            file:
                              type: string
                              description: 'Base64-encoded logo image. Format: data:image/png;base64,<hash>'
                              example: data:image/jpeg;base64,/9j/4AAQSkZJRg...
                            position:
                              type: string
                              description: 'Position of the logo overlay. One of: top-left, top-right, bottom-left, bottom-right'
                              example: top-right
                            width:
                              type: string
                              description: Logo width in pixels
                              example: '50'
                            height:
                              type: string
                              description: Logo height in pixels
                              example: '50'
                            offsetH:
                              type: string
                              description: Horizontal offset from anchor position in pixels
                              example: ''
                            offsetV:
                              type: string
                              description: Vertical offset from anchor position in pixels
                              example: ''
                            padding:
                              type: string
                              description: Inner padding around the logo in pixels
                              example: ''
                            opacity:
                              type: string
                              description: Logo opacity. Value between 0 (fully transparent) and 1 (fully opaque)
                              example: ''
                            fadeDelay:
                              type: string
                              description: Time in ms before the logo fades out. 0 keeps it always visible
                              example: ''
                        poster:
                          type: string
                          description: 'Poster image shown before playback starts. Base64-encoded. Format: data:image/jpeg;base64,<hash>'
                          example: data:image/jpeg;base64,/9j/4ALqPVhHqk...
                        contextUrl:
                          type: string
                          description: URL for contextual link shown on the player
                          example: ''
                        contextText:
                          type: string
                          description: Text label for the contextual link
                          example: ''
                        contextIcon:
                          type: string
                          description: Icon for the contextual link
                          example: ''
                        imaAdOption:
                          type: object
                          description: Google IMA / VAST ad tag configuration
                          properties:
                            adTagUrl:
                              type: string
                              description: VAST/VMAP ad tag URL for IMA ad insertion. Empty string disables IMA ads
                              example: ''
                        vastAdOption:
                          type: object
                          description: VAST ad tag URL list (up to three slots)
                          properties:
                            tagURL:
                              type: array
                              description: Array of up to three VAST ad tag URLs. Empty string disables that slot
                              items:
                                type: string
                              example:
                              - ''
                              - ''
                              - ''
                        offline:
                          type: object
                          description: Offline / stream-down overlay configuration
                          properties:
                            offlineImage:
                              type: string
                              description: Base64-encoded image shown when stream is offline
                              example: ''
                            offlineTimeout:
                              type: string
                              description: 'Duration to wait before showing offline image. Format: HH:MM:SS'
                              example: 00:00:00
                            label:
                              type: string
                              description: Text label shown when stream is offline
                              example: ''
                        relatedVideos:
                          type: array
                          nullable: true
                          description: List of related video items displayed after playback ends. Null if not configured
                          items:
                            type: object
                            properties:
                              thumb:
                                type: string
                                description: Base64-encoded thumbnail image for the related video
                                example: data:image/png;base64,iVBORw0KGgo...
                              url:
                                type: string
                                description: URL of the related video
                                example: https://app.userback.io/viewer/31459/...
                              duration:
                                type: string
                                description: Duration of the related video in seconds
                                example: '23'
                              title:
                                type: string
                                description: Title of the related video
                                example: dada
                    created_at:
                      type: string
                      description: Creation timestamp in UTC (YYYY-MM-DD HH:mm:ss)
                      example: '2025-06-17 12:45:17'
                    updated_at:
                      type: string
                      description: Last updated timestamp in UTC (YYYY-MM-DD HH:mm:ss)
                      example: '2026-04-06 06:05:08'
              example:
              - id: 782
                serviceid: 103
                hashid: rjed53ekvwlp
                name: testing
                base: 1
                meta:
                  showskinoninit: 1
                  showpip: 1
                  autoplay: 1
                  muted: 1
                  endAction: ''
                  infoTitle: ''
                  infoUrl: ''
                  infoDescription: ''
                  infoIcon: ''
                  primaryColor: '#f44336'
                  secondaryColor: '#000000'
                  logo:
                    file: data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEAYABgAAD...
                    position: top-right
                    width: '50'
                    height: '50'
                    offsetH: ''
                    offsetV: ''
                    padding: ''
                    opacity: ''
                    fadeDelay: ''
                  poster: data:image/jpeg;base64,/9j/4ALqPVhHqklTpQQ0XUk...
                  contextUrl: ''
                  contextText: ''
                  contextIcon: ''
                  imaAdOption:
                    adTagUrl: ''
                  vastAdOption:
                    tagURL:
                    - ''
                    - ''
                    - ''
                  offline:
                    offlineImage: ''
                    offlineTimeout: 00:00:00
                    label: ''
                  relatedVideos:
                  - thumb: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAscAAAHm...
                    url: https://app.userback.io/viewer/31459/98357/746766368h4w7Vqvwq9x75wQvMhG395xwxX6jVfgC3GP3/
                    duration: '23'
                    title: dada
                  - thumb: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAscAAAHm...
                    url: https://app.userback.io/viewer/31459/98357/746766368h4w7Vqvwq9x75wQvMhG395xwxX6jVfgC3GP3/
                    duration: '22'
                    title: dada
                  showcv: 0
                created_at: '2025-06-17 12:45:17'
                updated_at: '2026-04-06 06:05:08'
              - id: 725
                serviceid: 103
                hashid: p2qyanpbdlz5
