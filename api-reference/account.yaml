openapi: 3.0.0
info:
  title: 5centsCDN - Account Management API
  description: >
    Account management endpoints for the 5centsCDN platform. Includes
    domain verification, SSL certificate management, bandwidth overage protection,
    API key management, raw log configuration, and sub-account user management.
    API v2 routes use header-based API key authentication.
  version: 2.0.0
  contact:
    email: help@5centscdn.com
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'

servers:
  - url: https://api.5centscdn.com/v2
    description: 5centsCDN API Server - Production

security:
  - ApiKeyAuth: []

tags:
  - name: Domain Verification
    description: Endpoints related to domain ownership verification via DNS TXT record
  - name: SSL Certificates
    description: Endpoints related to SSL certificate management (create, read, update, delete)
  - name: Bandwidth Overage Protection
    description: Bandwidth Overage Protection and Auto Recharge settings
  - name: API Keys
    description: API key management (create, read, update, delete)

paths:
  /account/dv:
    get:
      summary: List verified domains
      operationId: getDomainVerificationList
      tags:
      - Domain Verification
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Operation outcome.
                    example: success
                  domains:
                    type: array
                    description: List of domain verification records for this service account.
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the domain verification record.
                          example: 12345
                        serviceid:
                          type: integer
                          description: Service account identifier that owns this record.
                          example: 10001
                        domain:
                          type: string
                          description: Domain name registered for verification.
                          example: example.com
                        validated:
                          type: string
                          description: Y if the domain has been successfully verified via DNS TXT record, N otherwise.
                          enum:
                          - Y
                          - N
                          example: Y
                        txtrecord:
                          type: object
                          description: DNS TXT record details required for domain ownership verification.
                          properties:
                            host:
                              type: string
                              description: TXT record host/name prefix to use when creating the DNS TXT record.
                              example: abc123def456
                            ttl:
                              type: integer
                              description: Recommended TTL in seconds for the DNS TXT record.
                              example: 3600
                            value:
                              type: string
                              description: TXT record value to set in DNS for domain ownership proof.
                              example: xyz789uvw012
    post:
      summary: Add a domain for verification
      operationId: storeDomainVerification
      tags:
      - Domain Verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainVerificationCreateRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Operation outcome.
                    example: success
                  message:
                    type: string
                    description: Human-readable description of the operation outcome.
                    example: Domain added. Please add TXT DNS record for verification
                  domain:
                    type: object
                    description: Newly created domain verification record with TXT record details.
                    properties:
                      id:
                        type: integer
                        description: Unique identifier of the domain verification record.
                        example: 12345
                      serviceid:
                        type: integer
                        description: Service account identifier that owns this record.
                        example: 10001
                      domain:
                        type: string
                        description: Domain name registered for verification.
                        example: example.com
                      validated:
                        type: string
                        description: Y if the domain has been successfully verified, N if verification is pending.
                        enum:
                        - Y
                        - N
                        example: N
                      txtrecord:
                        type: object
                        description: DNS TXT record details required for domain ownership verification.
                        properties:
                          host:
                            type: string
                            description: TXT record host/name prefix to use when creating the DNS TXT record.
                            example: abc123def456
                          ttl:
                            type: integer
                            description: Recommended TTL in seconds for the DNS TXT record.
                            example: 3600
                          value:
                            type: string
                            description: TXT record value to set in DNS for domain ownership proof.
                            example: xyz789uvw012
  /account/dv/{dvid}:
    get:
      summary: Show domain verification details
      operationId: showDomainVerification
      tags:
      - Domain Verification
      parameters:
      - $ref: '#/components/parameters/dvId'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Operation outcome.
                    example: success
                  domain:
                    type: object
                    description: Domain verification record with current validation status and TXT record details.
                    properties:
                      id:
                        type: integer
                        description: Unique identifier of the domain verification record.
                        example: 12345
                      serviceid:
                        type: integer
                        description: Service account identifier that owns this record.
                        example: 10001
                      domain:
                        type: string
                        description: Domain name registered for verification.
                        example: example.com
                      validated:
                        type: string
                        description: Y if the domain has been successfully verified via DNS TXT record, N otherwise.
                        enum:
                        - Y
                        - N
                        example: Y
                      txtrecord:
                        type: object
                        description: DNS TXT record details required for domain ownership verification.
                        properties:
                          host:
                            type: string
                            description: TXT record host/name prefix to use when creating the DNS TXT record.
                            example: abc123def456
                          ttl:
                            type: integer
                            description: Recommended TTL in seconds for the DNS TXT record.
                            example: 3600
                          value:
                            type: string
                            description: TXT record value to set in DNS for domain ownership proof.
                            example: xyz789uvw012
    post:
      summary: Delete a domain verification record
      operationId: destroyDomainVerification
      tags:
      - Domain Verification
      parameters:
      - $ref: '#/components/parameters/dvId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - _METHOD
              properties:
                _METHOD:
                  type: string
                  description: Must be set to DELETE to trigger domain deletion.
                  example: DELETE
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Operation outcome.
                    example: success
                  message:
                    type: string
                    description: Human-readable description of the operation outcome.
                    example: Domain deleted
  /account/dv/{dvid}/validate:
    get:
      summary: Trigger domain DNS TXT record validation
      operationId: validateDomain
      tags:
      - Domain Verification
      parameters:
      - $ref: '#/components/parameters/dvId'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Operation outcome. Returns success if the TXT record was found, error otherwise.
                    example: success
                  message:
                    type: string
                    description: Human-readable description of the validation outcome. Present when result is error.
                    example: Domain verified successfully.
  /account/ssl:
    get:
      summary: List SSL certificates
      operationId: indexSSL
      tags:
      - SSL Certificates
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Operation outcome.
                    example: success
                  certs:
                    type: array
                    description: List of SSL certificates uploaded to this service account.
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the SSL certificate.
                          example: 12345
                        name:
                          type: string
                          description: Friendly name assigned to the SSL certificate.
                          example: sample-ssl-certificate
                        crt:
                          type: string
                          description: PEM-encoded X.509 certificate.
                          example: "-----BEGIN CERTIFICATE-----\r\n...\r\n-----END CERTIFICATE-----"
                        key:
                          type: string
                          description: Always returned as redacted for security.
                          example: '--- redacted ---'
                        cabundle:
                          type: string
                          description: PEM-encoded CA bundle.
                          example: "-----BEGIN CERTIFICATE-----\r\n...\r\n-----END CERTIFICATE-----"
                        domain:
                          type: string
                          description: Common Name (CN) extracted from the certificate.
                          example: example.com
                        sans:
                          type: array
                          description: Subject Alternative Names extracted from the certificate.
                          items:
                            type: string
                          example:
                          - example.com
                          - www.example.com
                        expiry:
                          type: string
                          format: date
                          description: Certificate expiration date.
                          example: '2027-01-01'
                        installs:
                          type: integer
                          description: Number of CDN zones or streams currently using this certificate.
                          example: 0
                        expired:
                          type: boolean
                          description: True when the certificate expiration date is in the past.
                          example: false
                        validFrom:
                          type: string
                          format: date
                          description: Certificate valid-from date.
                          example: '2026-01-01'
  /account/ssl/new:
    post:
      summary: Upload a new SSL certificate
      operationId: storeSSL
      tags:
      - SSL Certificates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSLCertCreateRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Operation outcome.
                    example: success
                  message:
                    type: string
                    description: Human-readable description of the operation outcome.
                    example: Operation completed successfully
                  cert:
                    type: object
                    description: The newly uploaded SSL certificate record.
                    properties:
                      id:
                        type: integer
                        description: Unique identifier of the SSL certificate.
                        example: 12345
                      name:
                        type: string
                        description: Friendly name assigned to the SSL certificate.
                        example: sample-ssl-certificate
                      crt:
                        type: string
                        description: PEM-encoded X.509 certificate.
                        example: "-----BEGIN CERTIFICATE-----\r\nstring\r\n-----END CERTIFICATE-----"
                      key:
                        type: string
                        description: Always returned as redacted for security.
                        example: '--- redacted ---'
                      cabundle:
                        type: string
                        description: PEM-encoded CA bundle.
                        example: "-----BEGIN CERTIFICATE-----\r\nstring\r\n-----END CERTIFICATE-----"
                      domain:
                        type: string
                        description: Common Name (CN) extracted from the certificate.
                        example: example.com
                      sans:
                        type: array
                        description: Subject Alternative Names extracted from the certificate.
                        items:
                          type: string
                        example:
                        - example.com
                        - www.example.com
                      expiry:
                        type: string
                        format: date
                        description: Certificate expiration date.
                        example: '2027-01-01'
                      installs:
                        type: integer
                        description: Number of CDN zones or streams currently using this certificate.
                        example: 1
                      expired:
                        type: boolean
                        description: True when the certificate expiration date is in the past.
                        example: false
                      validFrom:
                        type: string
                        format: date
                        description: Certificate valid-from date.
                        example: '2026-01-01'
  /account/ssl/{sslcertid}:
    get:
      summary: Show SSL certificate details
      operationId: showSSL
      tags:
      - SSL Certificates
      parameters:
      - $ref: '#/components/parameters/sslcertId'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Operation outcome.
                    example: success
                  cert:
                    type: object
                    description: SSL certificate record with full metadata.
                    properties:
                      id:
                        type: integer
                        description: Unique identifier of the SSL certificate.
                        example: 12345
                      name:
                        type: string
                        description: Friendly name assigned to the SSL certificate.
                        example: sample-ssl-certificate
                      crt:
                        type: string
                        description: PEM-encoded X.509 certificate.
                        example: "-----BEGIN CERTIFICATE-----\r\nstring\r\n-----END CERTIFICATE-----"
                      key:
                        type: string
                        description: Always returned as redacted for security.
                        example: '--- redacted ---'
                      cabundle:
                        type: string
                        description: PEM-encoded CA bundle.
                        example: "-----BEGIN CERTIFICATE-----\r\nstring\r\n-----END CERTIFICATE-----"
                      domain:
                        type: string
                        description: Common Name (CN) extracted from the certificate.
                        example: example.com
                      sans:
                        type: array
                        description: Subject Alternative Names extracted from the certificate.
                        items:
                          type: string
                        example:
                        - example.com
                        - www.example.com
                      expiry:
                        type: string
                        format: date
                        description: Certificate expiration date.
                        example: '2027-01-01'
                      installs:
                        type: integer
                        description: Number of CDN zones or streams currently using this certificate.
                        example: 1
                      expired:
                        type: boolean
                        description: True when the certificate expiration date is in the past.
                        example: false
                      validFrom:
                        type: string
                        format: date
                        description: Certificate valid-from date.
                        example: '2026-01-01'
    post:
      summary: Update an SSL certificate
      operationId: updateSSL
      tags:
      - SSL Certificates
      parameters:
      - $ref: '#/components/parameters/sslcertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSLCertUpdateRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Operation outcome.
                    example: success
                  message:
                    type: string
                    description: Human-readable description of the operation outcome.
                    example: Update successful
                  cert:
                    type: object
                    description: Updated SSL certificate record with full metadata.
                    properties:
                      id:
                        type: integer
                        description: Unique identifier of the SSL certificate.
                        example: 12345
                      name:
                        type: string
                        description: Friendly name assigned to the SSL certificate.
                        example: sample-ssl-certificate
                      crt:
                        type: string
                        description: PEM-encoded X.509 certificate.
                        example: "-----BEGIN CERTIFICATE-----\r\nstring\r\n-----END CERTIFICATE-----"
                      key:
                        type: string
                        description: Always returned as redacted for security.
                        example: '--- redacted ---'
                      cabundle:
                        type: string
                        description: PEM-encoded CA bundle.
                        example: "-----BEGIN CERTIFICATE-----\r\nstring\r\n-----END CERTIFICATE-----"
                      domain:
                        type: string
                        description: Common Name (CN) extracted from the certificate.
                        example: example.com
                      sans:
                        type: array
                        description: Subject Alternative Names extracted from the certificate.
                        items:
                          type: string
                        example:
                        - example.com
                        - www.example.com
                      expiry:
                        type: string
                        format: date
                        description: Certificate expiration date.
                        example: '2027-01-01'
                      installs:
                        type: integer
                        description: Number of CDN zones or streams currently using this certificate.
                        example: 1
                      expired:
                        type: boolean
                        description: True when the certificate expiration date is in the past.
                        example: false
                      validFrom:
                        type: string
                        format: date
                        description: Certificate valid-from date.
                        example: '2026-01-01'
    delete:
      summary: Delete an SSL certificate
      operationId: destroySSL
      tags:
      - SSL Certificates
      parameters:
      - $ref: '#/components/parameters/sslcertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - _METHOD
              properties:
                _METHOD:
                  type: string
                  description: Must be set to DELETE to trigger certificate deletion.
                  example: DELETE
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Operation outcome.
                    example: success
                  message:
                    type: string
                    description: Human-readable description of the operation outcome.
                    example: SSL Certificate Deleted.

  /account/bwop:
    get:
      summary: Show Bandwidth Overage Protection settings
      operationId: showBWOP
      tags:
      - Bandwidth Overage Protection
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Operation outcome.
                    example: success
                  bwop:
                    type: string
                    description: Current monthly bandwidth overage protection limit as a percentage of the plan's included bandwidth. Returns 0 if disabled.
                    example: '110'
    post:
      summary: Update Bandwidth Overage Protection limit
      operationId: updateBWOP
      tags:
      - Bandwidth Overage Protection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BWOPRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Operation outcome.
                    example: success
                  message:
                    type: string
                    description: Human-readable description of the operation outcome.
                    example: Bandwidth Overage Protection Updated
  /account/recharge:
    post:
      summary: Update Bandwidth Auto Recharge settings
      operationId: updateAutoRecharge
      tags:
      - Bandwidth Overage Protection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoRechargeRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Operation outcome.
                    example: success
                  message:
                    type: string
                    description: Human-readable description of the operation outcome.
                    example: Bandwidth Auto Recharge Updated
  /account/api:
    get:
      summary: List API keys
      operationId: indexAPI
      tags:
      - API Keys
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Operation outcome.
                    example: success
                  apikeys:
                    type: array
                    description: List of API keys for this service account.
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier of the API key.
                          example: 12345
                        serviceid:
                          type: integer
                          description: Service account identifier that owns this key.
                          example: 10001
                        name:
                          type: string
                          description: Human-readable label for the API key.
                          example: sample-api-key
                        description:
                          type: string
                          description: Optional description of the key's purpose.
                          example: Used by the mobile app
                        permission:
                          type: array
                          description: Set of CRUD permissions granted to this key.
                          items:
                            type: string
                            enum:
                            - create
                            - read
                            - update
                            - delete
                          example:
                          - create
                          - update
                          - delete
                        hash:
                          type: string
                          description: The actual API key token. Use as the X-API-Key header value in API v2 requests.
                          example: sample-api-key-hash-value
  /account/api/new:
    post:
      summary: Create a new API key
      operationId: storeAPI
      tags:
      - API Keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - description
              - permission[]
              - _METHOD
              properties:
                name:
                  type: string
                  description: Human-readable label for the API key / application.
                  example: My Application
                description:
                  type: string
                  description: Optional description of the key's purpose.
                  example: Used by the mobile app
                permission[]:
                  type: array
                  description: >
                    Set of CRUD permissions granted to this key. At least
                    one value is required. Multiple values allowed.
                  items:
                    type: string
                    enum:
                    - create
                    - read
                    - update
                    - delete
                  example:
                  - read
                  - update
                _METHOD:
                  type: string
                  description: Must be set to PUT to trigger API key creation.
                  example: PUT
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Operation outcome.
                    example: success
                  message:
                    type: string
                    description: Human-readable description of the operation outcome.
                    example: API Key Created
                  id:
                    type: integer
                    description: Unique identifier of the newly created API key.
                    example: 12345
  /account/api/{apikeyid}:
    get:
      summary: Show API key details
      operationId: showAPI
      tags:
      - API Keys
      parameters:
      - $ref: '#/components/parameters/apikeyId'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Operation outcome.
                    example: success
                  apikey:
                    type: object
                    description: API key record with permissions and token details.
                    properties:
                      id:
                        type: integer
                        description: Unique identifier of the API key.
                        example: 12345
                      serviceid:
                        type: integer
                        description: Service account identifier that owns this key.
                        example: 10001
                      name:
                        type: string
                        description: Human-readable label for the API key.
                        example: sample-api-key
                      description:
                        type: string
                        description: Optional description of the key's purpose.
                        example: Used by the mobile app
                      permission:
                        type: array
                        description: Set of CRUD permissions granted to this key.
                        items:
                          type: string
                          enum:
                          - create
                          - read
                          - update
                          - delete
                        example:
                        - read
                        - create
                      hash:
                        type: string
                        description: The actual API key token. Use as the X-API-Key header value in API v2 requests.
                        example: sample-api-key-hash-value
    post:
      summary: Update an API key
      operationId: updateAPI
      tags:
      - API Keys
      parameters:
      - $ref: '#/components/parameters/apikeyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - description
              - permission[]
              properties:
                name:
                  type: string
                  description: Human-readable label for the API key / application.
                  example: My Application
                description:
                  type: string
                  description: Optional description of the key's purpose.
                  example: Used by the mobile app
                permission[]:
                  type: array
                  description: Set of CRUD permissions granted to this key.
                  items:
                    type: string
                    enum:
                    - create
                    - read
                    - update
                    - delete
                  example:
                  - read
                  - update
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Operation outcome.
                    example: success
                  message:
                    type: string
                    description: Human-readable description of the operation outcome.
                    example: API Key Updated
    delete:
      summary: Delete an API key
      operationId: destroyAPI
      tags:
      - API Keys
      parameters:
      - $ref: '#/components/parameters/apikeyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - _METHOD
              properties:
                _METHOD:
                  type: string
                  description: Must be set to DELETE to trigger API key deletion.
                  example: DELETE
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Operation outcome.
                    example: success
                  message:
                    type: string
                    description: Human-readable description of the operation outcome.
                    example: API Key Deleted.

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    sslcertId:
      name: sslcertid
      in: path
      required: true
      description: Unique identifier of the SSL certificate record.
      schema:
        type: integer
        example: 12345
    dvId:
      name: dvid
      in: path
      required: true
      description: Unique identifier of the domain verification record.
      schema:
        type: integer
        example: 12345
    apikeyId:
      name: apikeyid
      in: path
      required: true
      description: Unique identifier of the API key record.
      schema:
        type: integer
        example: 12345

  schemas:
    DomainVerificationCreateRequest:
      type: object
      required:
      - domain
      properties:
        domain:
          type: string
          description: >
            Top-level domain to verify (e.g. example.com). Subdomains
            are not accepted. Unicode/IDN domains are accepted and converted to punycode
            internally.
          example: example.com
    DomainVerificationTxtRecord:
      type: object
      description: DNS TXT record details required for domain ownership verification.
      properties:
        host:
          type: string
          description: TXT record host/name prefix to use when creating the DNS TXT record.
          example: abc123def456
        ttl:
          type: integer
          description: Recommended TTL in seconds for the DNS TXT record.
          example: 3600
        value:
          type: string
          description: TXT record value to set in DNS for domain ownership proof.
          example: xyz789uvw012
    DomainVerificationResponse:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the domain verification record.
          example: 12345
        serviceid:
          type: integer
          description: Service account identifier that owns this record.
          example: 10001
        domain:
          type: string
          description: Domain name registered for verification.
          example: example.com
        validated:
          type: string
          description: Y if the domain has been successfully verified via DNS TXT record, N otherwise.
          enum:
          - Y
          - N
          example: N
        txtrecord:
          $ref: '#/components/schemas/DomainVerificationTxtRecord'
    DomainVerificationValidateResponse:
      type: object
      properties:
        result:
          type: string
          description: Operation outcome. Returns success if the TXT record was found, error otherwise.
          enum:
          - success
          - error
          example: success
        msg:
          type: string
          description: Human-readable error message. Only present when result is error.
          example: Record not found
    SSLCertCreateRequest:
      type: object
      required:
      - _METHOD
      - crt
      - key
      properties:
        _METHOD:
          type: string
          description: Must be set to PUT to trigger SSL certificate creation.
          example: PUT
        name:
          type: string
          description: Friendly name for the certificate. If omitted, auto-generated using the certificate CN, expiry date, and a timestamp.
          example: sample-ssl-certificate
        crt:
          type: string
          description: PEM-encoded X.509 certificate. Required.
          example: YOUR_PEM_CERTIFICATE
        key:
          type: string
          description: PEM-encoded private key. Required.
          example: YOUR_PEM_PRIVATE_KEY
        cabundle:
          type: string
          description: PEM-encoded CA bundle. Optional but recommended.
          example: YOUR_PEM_CA_BUNDLE
    SSLCertUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: Friendly name for the certificate.
          example: sample-ssl-certificate
        crt:
          type: string
          description: PEM-encoded X.509 certificate. Provide crt and key together to replace certificate material. Omitting both updates only the name.
          example: YOUR_PEM_CERTIFICATE
        key:
          type: string
          description: PEM-encoded private key. Required when replacing certificate material.
          example: YOUR_PEM_PRIVATE_KEY
        cabundle:
          type: string
          description: PEM-encoded CA bundle.
          example: YOUR_PEM_CA_BUNDLE
    SSLCertResponse:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the SSL certificate.
          example: 12345
        serviceid:
          type: integer
          description: Service account identifier that owns this certificate.
          example: 10001
        name:
          type: string
          description: Friendly name assigned to the SSL certificate.
          example: sample-ssl-certificate
        domain:
          type: string
          description: Common Name (CN) extracted from the certificate.
          example: '*.example.com'
        crt:
          type: string
          description: PEM-encoded X.509 certificate.
          example: "-----BEGIN CERTIFICATE-----\r\nstring\r\n-----END CERTIFICATE-----"
        key:
          type: string
          description: Always returned as redacted for security.
          example: '--- redacted ---'
        cabundle:
          type: string
          description: PEM-encoded CA bundle.
          example: "-----BEGIN CERTIFICATE-----\r\nstring\r\n-----END CERTIFICATE-----"
        expiry:
          type: string
          format: date
          description: Certificate expiration date derived from the cert itself.
          example: '2027-01-01'
        expired:
          type: boolean
          description: True when the expiry date is in the past.
          example: false
        installs:
          type: integer
          description: Number of CDN zones or streams currently using this certificate.
          example: 2
        sans:
          type: array
          description: Subject Alternative Names extracted from the certificate.
          items:
            type: string
          example:
          - '*.example.com'
          - example.com
        validFrom:
          type: string
          format: date
          description: Certificate valid-from date.
          example: '2026-01-01'
    BWOPRequest:
      type: object
      required:
      - bwop
      properties:
        bwop:
          type: integer
          description: Monthly bandwidth limit as a percentage of the plan's included bandwidth. Valid values between 90 and 120 (inclusive). Use 0 to disable.
          minimum: 90
          maximum: 120
          multipleOf: 5
          example: 110
    AutoRechargeRequest:
      type: object
      required:
      - autorecharge_at
      properties:
        autorecharge_at:
          type: integer
          description: Percentage of monthly bandwidth at which an addon package is auto-purchased. Set to 0 to disable auto recharge.
          enum:
          - 0
          - 75
          - 85
          - 95
          example: 85
        autorecharge_id:
          type: integer
          description: Addon service ID for the bandwidth package to auto-purchase. Required when autorecharge_at is non-zero.
          example: 42
    APIKeyCreateRequest:
      type: object
      required:
      - name
      - permission
      properties:
        name:
          type: string
          description: Human-readable label for the API key / application.
          example: My Application
        description:
          type: string
          description: Optional description of the key's purpose.
          example: Used by the mobile app
        permission:
          type: array
          description: Set of CRUD permissions granted to this key. At least one value is required.
          items:
            type: string
            enum:
            - create
            - read
            - update
            - delete
          example:
          - read
          - update
    APIKeyUpdateRequest:
      type: object
      required:
      - name
      - permission
      properties:
        name:
          type: string
          description: Human-readable label for the API key / application.
          example: My Application
        description:
          type: string
          description: Optional description of the key's purpose.
          example: Used by the mobile app
        permission:
          type: array
          description: Set of CRUD permissions granted to this key.
          items:
            type: string
            enum:
            - create
            - read
            - update
            - delete
          example:
          - read
          - update
    APIKeyResponse:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier of the API key.
          example: 12345
        name:
          type: string
          description: Human-readable label for the API key.
          example: My Application
        description:
          type: string
          description: Optional description of the key's purpose.
          example: Used by the mobile app
        permission:
          type: array
          description: Set of CRUD permissions granted to this key.
          items:
            type: string
            enum:
            - create
            - read
            - update
            - delete
          example:
          - read
          - update
        hash:
          type: string
          description: The actual API key token. Use as the X-API-Key header value in API v2 requests.
          example: sample-api-key-hash-value
        serviceid:
          type: integer
          description: Service account identifier that owns this key.
          example: 10001
