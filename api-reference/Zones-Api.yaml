    post:
      tags:
      - HTTP Push
      summary: Update Geoblock
      description: Update geblock of HTTP push zone
      operationId: updateGeblockZonePush
      parameters:
      - $ref: '#/components/parameters/zoneIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: string
                  enum: [Y, N]
                  description: Enable or disable geo-lock.
                policy:
                  type: string
                  enum: [Y, N]
                  description: "Country filtering mode. Y = Blacklist mode (block requests from listed countries). N = Whitelist mode (allow only requests from listed countries, block all others)."
                list:
                  type: array
                  items:
                    type: string
                  description: Array of ISO-3166 country codes to block (Y) or allow (N).
                ips:
                  type: string
                  description: Comma-separated IP addresses excluded from the geo check.
                mode:
                  type: string
                  enum: [save, append, overwrite]
                  description: "Configuration persistence mode. save = replace current list. append = add entries to existing list. overwrite = reset and replace entirely."
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
