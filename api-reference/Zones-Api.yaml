          description: Whether the X-Forwarded-For header is forwarded to the origin.
        cors:
          type: string
          description: Whether CORS headers are added to responses. Y means enabled.
        webp:
          type: string
          description: Whether automatic WebP image conversion is enabled.
        pseudostreaming:
          type: string
          description: Whether pseudo-streaming for progressive media files is enabled.
        wp:
          type: string
          description: Whether WordPress optimizations are enabled.
        lfo:
          type: string
          description: Whether large file optimization is enabled.
        prefresh:
          type: string
          description: Whether prefresh (background cache refresh) is enabled.
    edgerules:
      properties:
        enabled:
          type: string
          description: Whether edge rules are enabled for this zone. Y means enabled, N means disabled.
    ftpdetailsList:
      properties:
        username:
          type: string
          description: FTP username for authenticating to the push zone storage.
        password:
          type: string
          description: FTP password for authenticating to the push zone storage.
    serverList:
      properties:
        code:
          type: string
          description: Numeric server location code.
        name:
          type: string
          description: Human-readable name of the server location.
        country:
          type: string
          description: Geographic region or country of the server.
        meta:
          type: object
          description: Additional server metadata including upload endpoint details.
          properties:
            uploadPort:
              type: string
              description: FTP port number for uploading files to this server.
            uploadHost:
              type: string
              description: Hostname of the FTP upload server for this zone.
      type: object
    OriginAuth:
      type: object
      description: Origin server authentication settings (HTTP Pull zones only)
      properties:
        type:
          type: string
          enum: [none, awsSignatureV4]
          default: none
          description: Authentication type for private origin access
        s3_access_key_id:
          type: string
          minLength: 20
          maxLength: 20
          pattern: '^AKIA[A-Z0-9]{16}$'
          description: AWS Access Key ID (required when type=awsSignatureV4)
        s3_access_key_secret:
          type: string
          minLength: 40
          maxLength: 40
          description: AWS Secret Access Key (required when type=awsSignatureV4)
        s3_midgress_cache_size:
          type: integer
          minimum: 1
          description: Midgress cache size in GB (requires Advanced Features)
    IPAccessSettings:
      type: object
      description: IP address access control settings
      properties:
        enabled:
          type: string
          enum: [Y]
          description: Enable IP access control (omit to disable)
        policy:
          type: string
          enum: [Y, N]
          description: "Y = Block listed IPs, N = Allow only listed IPs"
        list:
          type: string
          description: Comma-separated IP addresses or CIDR ranges to block or allow
        ips:
          type: string
          description: Comma-separated IPs excluded from IP access restrictions
        active:
          type: string
          description: Whether IP access control is currently active. Y means active, N means inactive.
    UserAgentSettings:
      type: object
      description: User-Agent string access control settings
      properties:
        enabled:
          type: string
          enum: [Y]
          description: Enable user agent control (omit to disable)
        policy:
          type: string
          enum: [Y, N]
          description: "Y = Block listed user agents, N = Allow only listed user agents"
        list:
          type: string
          description: |
            Semicolon-separated (;;;) user agent strings.
            Use *wildcard* pattern for partial matching. Example: *Chrome*
        casesensitive:
          type: string
          enum: [Y]
          description: Enable case-sensitive matching
        ips:
          type: string
          description: Comma-separated IPs excluded from user agent restrictions
        active:
          type: string
          description: Whether user agent control is currently active. Y means active, N means inactive.
        listArr:
          type: array
          items:
            type: string
          description: Array form of the user agent list entries.
    cdnserviceList:
      type: object
      properties:
        purgeurls:
          type: array
          description: Array of relative API paths for purging zone cache.
          items:
            type: string
        purgeurl:
          type: string
          description: JSON-encoded array of purge URL paths.
        authtoken:
          type: string
          description: Base64-encoded authentication token for CDN service API calls.
        infourl:
          type: string
          description: Endpoint URL to retrieve zone service metadata.
        listurl:
          type: string
          description: Endpoint URL to list files in the zone.
        rawlisturl:
          type: string
          description: Endpoint URL to retrieve raw file listing.
        transcodelisturl:
          type: string
          description: Endpoint URL to list transcoded files.
        addurl:
          type: string
          description: Endpoint URL to add files to the zone.
        editurl:
          type: string
          description: Endpoint URL to edit file metadata.
        deleteurl:
          type: string
          description: Endpoint URL to delete files from the zone.
        uploadurl:
          type: string
          description: Endpoint URL for direct file uploads.
        playlisturl:
          type: string
          description: Endpoint URL to retrieve video playlists.
    s3detailsList:
      type: object
      properties:
        relid:
          type: integer
          description: Numeric zone ID this S3 credential set belongs to.
          format: int32
        type:
          type: string
          description: Zone type identifier, e.g. push or pull.
        projectid:
          type: string
          description: Primary S3 project identifier.
        token:
          type: string
          description: Primary S3 authentication token.
        projectid2:
          type: string
          description: Secondary S3 project identifier for backup storage.
        token2:
          type: string
          description: Secondary S3 authentication token for backup storage.
        active:
          type: string
          description: Whether S3 integration is active. 1 means active, 0 means inactive.
        updated_at:
          type: string
          description: Timestamp of the most recent zone update (UTC).
        last_modified:
          type: string
          description: Timestamp of the last file modification in the S3 bucket.