    post:
      tags:
      - HTTP Push
      summary: Zone Cache Purge
      description: Purge cache of a HTTP push zone
      operationId: zonePushCachePurge
      parameters:
      - $ref: '#/components/parameters/zoneIdParam'
      - in: query
        name: delete
        schema:
          type: string
          example: true
          description: true - delete the cache false - invalidate the cache (default)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                  description: List of file paths to purge. Omit this field entirely (send an empty body) to purge the whole zone.
                  example: ["/videos/file.mp4", "/images/logo.png"]
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                    example: success
                  message:
                    type: string
                    description: "Human-readable status or result message"
                    example: Zone Purged
  /zones/http/push/{zoneid}/bwlimit:
    post:
      tags:
      - HTTP Push
      summary: Update bandwidth limit
      description: Update bandwidth limit of HTTP push zone
      operationId: updateBwLimitZonePush
      parameters:
      - $ref: '#/components/parameters/zoneIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: string
                  enum: [Y, N]
                  description: Enable or disable bandwidth limiting.
                  example: Y
                policy:
                  type: string
                  enum: ["0", "1"]
                  description: "Rate limiting mode. \"0\" = Static mode (fixed rate applied from the start of the transfer). \"1\" = Dynamic mode (rate limiting activates only after rateafter bytes have been served)."
                  example: "0"
                rate:
                  type: number
                  description: Throttle rate in KB/s applied after rateafter threshold is reached.
                  example: 1024
                rateafter:
                  type: number
                  description: Amount of data in KB served before the throttle rate kicks in.
                  example: 5120
                mode:
                  type: string
                  enum: [save, append, overwrite]
                  description: "Configuration persistence mode. save = replace current list. append = add entries to existing list. overwrite = reset and replace entirely."
                  example: save
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                    example: success
                  message:
                    type: string
                    description: "Human-readable status or result message"
                    example: Zone Updated
                  zone:
                    $ref: '#/components/schemas/zonePushResult'
  /zones/http/push/{zoneid}/import:
    post:
      tags:
      - HTTP Push
      summary: Import HTTP Push Zone
      description: Import HTTP Push Zone
      operationId: importHTTPPushZones
      parameters:
      - $ref: '#/components/parameters/zoneIdParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postPushZoneImport'
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                    example: success
                  message:
                    type: string
                    description: Human-readable status message describing the outcome.
                    example: Zone updated successfully
