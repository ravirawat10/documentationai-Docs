  /zones/vod/push/new:
    post:
      tags:
      - VOD Push
      summary: Create Zone
      description: Create a new VOD push Zone
      operationId: createZoneVodPush
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - _METHOD
              - alias
              properties:
                _METHOD:
                  type: string
                  description: Must always be PUT.
                alias:
                  type: string
                  description: Label for the zone.
                server:
                  type: number
                  description: Server/region ID.
                profiles:
                  type: array
                  items:
                    type: string
                  description: Encoding profile IDs.
                ssl:
                  type: object
                  properties:
                    http2:
                      type: string
                      enum: [Y, N]
                      description: "Whether HTTP/2 is enabled (Y/N)"
                    redirect:
                      type: string
                      enum: [Y, N]
                      description: Redirect configuration.
                    mode:
                      type: string
                  description: SSL certificate settings for HTTPS delivery.
                cache:
                  type: object
                  properties:
                    cache:
                      type: string
                      description: Cache duration code.
                    expiry:
                      type: string
                      description: "Browser cache TTL duration code"
                  description: Cache configuration settings for the zone.
                webhook:
                  type: string
                  description: Optional webhook URL.
                cnames:
                  type: string
                  description: Comma-separated CNAMEs.
                domainlock:
                  type: object
                  properties:
                    enabled:
                      type: string
                      enum: [Y, N]
                      description: Enable or disable this feature. Y means enabled, N means disabled.
                    policy:
                      type: string
                      enum: [Y, N]
                      description: "Referrer filtering mode. Y = Blacklist mode (block requests with listed referring domains). N = Whitelist mode (allow only requests from listed referring domains, block all others)."
                    list:
                      type: string
                      description: Comma-separated domain names to block (Y) or allow (N).
                    ips:
                      type: string
                      description: Comma-separated IP addresses excluded from domain lock restrictions.
                    noreferer:
                      type: string
                      enum: [Y, N]
                      description: "Controls requests with no Referer header. Y = block requests that have no Referer header. N = allow requests with no Referer header."
                  description: Domain lock / referrer restriction settings.
                geoblock:
                  type: object
                  properties:
                    enabled:
                      type: string
                      enum: [Y, N]
                      description: Enable or disable this feature. Y means enabled, N means disabled.
                    policy:
                      type: string
                      enum: [Y, N]
                      description: "Country filtering mode. Y = Blacklist mode (block requests from listed countries). N = Whitelist mode (allow only requests from listed countries, block all others)."
                    list:
                      type: array
                      items:
                        type: string
                      description: Array of ISO-3166 country codes to block (Y) or allow (N).
                    ips:
                      type: string
                  description: Geo-blocking settings to restrict access by country.
                bwlimit:
                  type: object
                  properties:
                    enabled:
                      type: string
                      enum: [Y, N]
                      description: Enable or disable this feature. Y means enabled, N means disabled.
                    policy:
                      type: string
                      enum: ["0", "1"]
                      description: "Rate limiting mode. \"0\" = Static mode (fixed rate applied from the start of the transfer). \"1\" = Dynamic mode (rate limiting activates only after rateafter bytes have been served)."
                    rate:
                      type: number
                      description: Throttle rate in KB/s applied after rateafter threshold is reached.
                    rateafter:
                      type: number
                      description: Amount of data in KB served before the throttle rate kicks in.
                  description: Bandwidth limit settings for the zone.
                ipaccess:
                  type: object
                  properties:
                    enabled:
                      type: string
                      enum: [Y, N]
                      description: Enable or disable this feature. Y means enabled, N means disabled.
                    policy:
                      type: string
                      enum: [Y, N]
                      description: "IP access filtering mode. Y = Blacklist mode (block listed IPs). N = Whitelist mode (allow only listed IPs, block all others)."
                    list:
                      type: string
                      description: Comma-separated IP addresses or CIDR ranges to block (Y) or allow (N).
                    ips:
                      type: string
                  description: IP access control settings to allow or block specific IPs.
                securetoken:
                  type: object
                  properties:
                    enabled:
                      type: string
                      enum: [Y, N]
                      description: Enable or disable this feature. Y means enabled, N means disabled.
                    policy:
                      type: string
                      enum: [Q, F, D]
                      description: "Defines how the token is computed. Q = Query string mode (token applied per query string parameter). F = Full path mode (token covers the full URL path). D = Directory/path-embedded mode (token is embedded within the URL path)."
                    keyip:
                      type: string
                      enum: [Y, N]
                      description: "Bind token validation to the originating client IP address. Y = token is only valid from the IP that generated it, preventing sharing or theft. N = IP binding is disabled."
                    list:
                      type: string
                      description: 16-character hex secret key.
                    timeout:
                      type: number
                      minimum: 5
                      maximum: 25200
                      description: Token expiry time in seconds. Minimum 5, maximum 25200.
                    session:
                      type: string
                      enum: ["0", "1"]
                      description: "Defines the token expiry behavior. \"0\" = Fixed expiry (token expires at a set time). \"1\" = Rolling/Moving expiry (token timeout resets with each request for active sessions)."
                    ips:
                      type: string
                  description: Secure token settings for URL authentication.
                useragent:
                  type: object
                  properties:
                    enabled:
                      type: string
                      enum: [Y, N]
                      description: Enable or disable this feature. Y means enabled, N means disabled.
                    policy:
                      type: string
                      enum: [Y, N]
                      description: "User agent filtering mode. Y = Block mode (block requests from listed user agents). N = Allow mode (allow only requests from listed user agents, block all others)."
                    list:
                      type: string
                      description: Comma-separated user agent strings to block (Y) or allow (N).
                    ips:
                      type: string
                      description: Comma-separated IP addresses excluded from user agent control.
                    casesensitive:
                      type: string
                      enum: [Y, N]
                      description: "User agent string matching precision. Y = case-sensitive matching. N = case-insensitive matching."
                  description: User-agent filter settings to restrict access by browser/client.
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                  message:
                    type: string
                    description: Human-readable status message describing the outcome.
                  zone:
                    $ref: '#/components/schemas/zoneVodPushResult'
                  warnings:
                    type: array
                    description: Array of non-fatal warning messages from the operation.
                    items:
                      type: string
