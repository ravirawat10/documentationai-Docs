                              example: "true"
                            nal_length_size:
                              type: string
                              description: Size of NAL length prefix in bytes (typically 4)
                              example: "4"
                            sample_fmt:
                              type: string
                              description: Audio sample format (e.g. fltp, s16)
                              example: fltp
                            sample_rate:
                              type: string
                              description: Audio sample rate in Hz (e.g. 44100, 48000)
                              example: "44100"
                            channels:
                              type: integer
                              description: Number of audio channels (1=mono, 2=stereo)
