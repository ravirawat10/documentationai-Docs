components:
  parameters:
    zoneIdParam:
      name: zoneid
      in: path
      description: Zone ID
      required: true
      schema:
        type: integer
        example: 42
    modeParam:
      in: query
      name: m
      description: Enter reported by
      required: true
      schema:
        type: string
    typeParam:
      in: query
      name: t
      description: Enter daily or hourly
      required: true
      schema:
        type: string
    rParam:
      in: query
      name: r
      description: Enter value last_24hrs/hourly or last_7days/hourly or last_30days/daily
      required: true
      schema:
        type: string
    rangeParam:
      in: query
      name: r
      description: Enter date range
      explode: false
      schema:
        type: string
    queryParam:
      in: query
      name: query
      description: search by filename
      schema:
        type: string
    markerParam:
      in: query
      name: marker
      description: Set the marker parameter to the name of the last item returned in the previous list.
      schema:
        type: string
    endmarkerParam:
      in: query
      name: end_marker
      description: Limits the result set to names that are less than the end_marker parameter value.
      schema:
        type: string
    dirParam:
      in: query
      name: dir
      description: Enter directory name
      schema:
        type: string
    fileParam:
      in: query
      name: file
      description: Enter file name
      schema:
        type: string
    mediaParam:
      in: query
      name: media
      description: show detailed media info if 1
      schema:
        type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    createZonePush:
      required:
      - _METHOD
      - server
      type: object
      properties:
        _METHOD:
          type: string
          description: To cast request method PUT
          example: PUT
        alias:
          type: string
          description: Optional label for the zone
          example: test-zone-001
        server:
          type: integer
          format: int32
          description: server.code, Should be one of the server code from the GET /zones/http/push/servers call
          example: 206
        profiles:
          type: array
          items:
            type: string
          description: Transcoding profile IDs. Leave empty to disable auto file transcoding.
          example: ["1"]
        ssl:
          type: object
          properties:
            http2:
              type: string
              description: "Whether HTTP/2 is enabled (Y/N)"
              example: Y
            redirect:
              type: string
              description: "Whether HTTP to HTTPS redirect is enabled (Y/N)"
              example: N
            mode:
              type: string
              description: 'N = None, S = Shared, L = Let''s Encrypt, C = Custom'
              example: L
        cache:
          type: object
          description: Edge cache TTL duration code, e.g. 4h or 1d.
          properties:
            cache:
              type: string
              description: Edge cache TTL. Values can be 1d, 7d, 14d, 1M, 3M, 6M, or 1y
              example: 1m
            expiry:
              type: string
              description: Browser cache TTL
