                            duration_ts:
                              type: integer
                              description: Duration in time_base units
                              example: 18532263
                            duration:
                              type: string
                              description: Duration of the media segment in seconds
                              example: "205.914033"
                            bit_rate:
                              type: string
                              description: Bitrate of the media stream in kbps
                              example: "1581916"
                            bits_per_raw_sample:
                              type: string
                              description: Number of bits per raw (uncompressed) sample
