          example: https://cdn-service.example.com/service.php/raw/list/5/push/12345
        transcodelisturl:
          type: string
          description: Endpoint URL to list transcoded files.
          example: https://cdn-service.example.com/service.php/transcode/list/5/push/12345
        addurl:
          type: string
          description: Endpoint URL to add files to the zone.
          example: https://cdn-service.example.com/service.php/add/5/push/12345
        editurl:
          type: string
          description: Endpoint URL to edit file metadata.
          example: https://cdn-service.example.com/service.php/edit/5/push/12345
        deleteurl:
          type: string
          description: Endpoint URL to delete files from the zone.
          example: https://cdn-service.example.com/service.php/delete/5/push/12345
        uploadurl:
          type: string
          description: Endpoint URL for direct file uploads.
          example: https://cdn-service.example.com/upload.php
        playlisturl:
