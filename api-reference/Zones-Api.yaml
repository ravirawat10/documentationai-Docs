                              example: "N"
                            list:
                              type: array
                              items:
                                type: string
                              description: "Comma-separated list of entries for this security rule"
                              example: [""]
                            ips:
                              type: string
                              description: "Comma-separated IP addresses or CIDR ranges"
                              example: ""
                            active:
                              type: string
                              description: "Whether this security rule is currently active (Y/N)"
                              example: "N"
                        ipaccess:
                          type: object
                          properties:
                            enabled:
                              type: string
                              description: "Whether this feature is currently enabled (Y/N)"
                              example: "N"
                            policy:
                              type: string
                              description: "Access policy setting for this security feature"
                              example: "N"
                            list:
                              type: string
                              description: "Comma-separated list of entries for this security rule"
                              example: ""
                            ips:
                              type: string
                              description: "Comma-separated IP addresses or CIDR ranges"
                              example: ""
                            active:
                              type: string
                              description: "Whether this security rule is currently active (Y/N)"
                              example: "N"
                        useragent:
