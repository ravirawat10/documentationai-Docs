  /zones/vod/push/{zoneid}/securetoken:
    post:
      tags:
      - VOD Push
      summary: Update Securetoken
      description: Update Securetoken of VoD push zone
      operationId: updateSecuretokenZoneVod
      parameters:
      - $ref: '#/components/parameters/zoneIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: string
                  enum: [Y, N]
                  description: Enable or disable secure token. Y means enabled, N means disabled.
                policy:
                  type: string
                  enum: [Q, F, D]
                  description: "Defines how the token is computed. Q = Query string mode (token applied per query string parameter). F = Full path mode (token covers the full URL path). D = Directory/path-embedded mode (token is embedded within the URL path)."
                keyip:
                  type: string
                  enum: [Y, N]
                  description: "Bind token validation to the originating client IP address. Y = token is only valid from the IP that generated it, preventing sharing or theft. N = IP binding is disabled."
                list:
                  type: string
                  pattern: '^[a-fA-F0-9]{16}$'
                  description: 16-character hexadecimal secret key used for token generation.
                timeout:
                  type: number
                  minimum: 5
                  maximum: 25200
                  description: Token expiry time in seconds. Minimum 5, maximum 25200.
                session:
                  type: string
                  enum: ["0", "1"]
                  description: "Defines the token expiry behavior. \"0\" = Fixed expiry (token expires at a set time). \"1\" = Rolling/Moving expiry (token timeout resets with each request for active sessions)."
                ips:
                  type: string
                  description: Comma-separated IPs excluded from token check.
                mode:
                  type: string
                  description: S=shared (zone-level)
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                  message:
                    type: string
                    description: Human-readable status message describing the outcome.
                  zone:
                    $ref: '#/components/schemas/zoneVodPushResult'
