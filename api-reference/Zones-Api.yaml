  /zones/http/push/{zoneid}/ssl:
    post:
      tags:
      - HTTP Push
      summary: Update SSL
      description: Update SSL of HTTP push zone
      operationId: updateSslZonePush
      parameters:
      - $ref: '#/components/parameters/zoneIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                http2:
                  type: boolean
                  description: Indicates whether HTTP/2 protocol is enabled. Y means HTTP/2 is enabled, while N means it is disabled.
                redirect:
                  type: boolean
                  description: Indicates whether HTTP traffic is automatically redirected to HTTPS. Y means redirection is enabled, while N means it is not.
                mode:
                  type: string
                  description: Specifies the SSL mode used for the server configuration. Typical values include S for strict mode or A for automated.
                certid:
                  type: string
                  nullable: true
                  description: A unique identifier for the SSL certificate used. Optional; can be null if no certificate is assigned.
                enabled:
                  type: string
                  description: Indicates whether SSL is enabled for the zone.
                warning:
                  type: boolean
                  description: Indicates whether there is a warning associated with the SSL configuration.
                name:
                  type: string
                  description: The name associated with the SSL certificate. Typically used to identify the certificate for a specific domain.
                crt:
                  type: string
                  description: The SSL certificate content in PEM format. Required for custom SSL certificates.
                key:
                  type: string
                  description: The private key associated with the SSL certificate in PEM format. Required for setting up custom SSL certificates.
                cabundle:
                  type: string
                  description: The Certificate Authority (CA) bundle content in PEM format. Used to validate the SSL certificate chain.
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                  message:
                    type: string
                    description: "Human-readable status or result message"
                  zone:
                    $ref: '#/components/schemas/zonePushResult'
                  warnings:
                    type: array
                    nullable: true
                    items:
                      type: string
                      description: Array of warning messages from the operation
  /zones/http/push/{zoneid}/securetoken:
    post:
      tags:
      - HTTP Push
      summary: Update Secure Token
      description: Update SecureToken of HTTP push zone
      operationId: updateSecureTokenZonePush
      parameters:
      - $ref: '#/components/parameters/zoneIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: string
                  enum: [Y, N]
                  description: Enable or disable secure token.
                policy:
                  type: string
                  enum: [Q, F, D]
                  description: "Defines how the token is computed. Q = Query string mode (token applied per query string parameter). F = Full path mode (token covers the full URL path). D = Directory/path-embedded mode (token is embedded within the URL path)."
                keyip:
                  type: string
                  enum: [Y, N]
                  description: "Bind token validation to the originating client IP address. Y = token is only valid from the IP that generated it, preventing sharing or theft. N = IP binding is disabled."
                list:
                  type: string
                  pattern: '^[a-fA-F0-9]{16}$'
                  description: Secret token key - 16-character hexadecimal string.
                timeout:
                  type: number
                  minimum: 5
                  maximum: 25200
                  description: Token expiry time in seconds. Minimum 5, maximum 25200.
                session:
                  type: string
                  enum: ["0", "1"]
                  description: "Defines the token expiry behavior. \"0\" = Fixed expiry (token expires at a set time). \"1\" = Rolling/Moving expiry (token timeout resets with each request for active sessions)."
                ips:
                  type: string
                  description: Comma-separated IPs excluded from the secure token check.
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                  message:
                    type: string
                    description: "Human-readable status or result message"
                  zone:
                    $ref: '#/components/schemas/zonePushResult'
