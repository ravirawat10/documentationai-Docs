      type: object
      properties:
        enabled:
          type: string
          description: Enable or disable geo-blocking. Y means enabled, N means disabled.
        policy:
          type: string
          description: "Country filtering mode. Y = Blacklist mode (block requests from listed countries). N = Whitelist mode (allow only requests from listed countries, block all others)."
        list:
          type: array
          items:
            type: string
            description: ISO-3166 country code. e.g. AF, DZ, AW, CA
        ips:
          type: string
          description: 'Comma-separated IP addresses excluded from geo-blocking restrictions. e.g. 192.168.0.1, 192.168.0.2'
    zoneshttpsetting_geoblock:
      type: object
      properties:
        enabled:
          type: string
          description: Enable or disable geo-blocking. Y means enabled, N means disabled.
        policy:
          type: string
          description: "Country filtering mode. Y = Blacklist mode (block requests from listed countries). N = Whitelist mode (allow only requests from listed countries, block all others)."
        list:
          type: array
          items:
            type: string
            description: Geoblock countries list values can be AF,DZ,AW,CA etc
        ips:
          type: string
          description: 'List of IPs to whitelist when geoblock is enabled. IPs should be separated by comma. Eg: 192.168.0.1, 192.168.0.2'
        mode:
          type: string
          description: The values can be save,append,overwrite
    zoneshttpsetting_domainlock:
      type: object
      properties:
        enabled:
          type: string
          enum: [Y]
          description: Enable domain lock (omit to disable).
        policy:
          type: string
          enum: [Y, N]
          description: "Referrer filtering mode. Y = Blacklist mode (block requests with listed referring domains). N = Whitelist mode (allow only requests from listed referring domains, block all others)."
        list:
          type: string
          description: 'Comma-separated domain names to block (Y) or allow (N). e.g. www.domain-one.com, www.domain-two.com'
        type:
          type: string
          description: The values can be whitelist or blacklist.
        noreferer:
          type: string
          enum: [Y]
          description: "Controls requests with no Referer header. Y = block requests that have no Referer header."
        ips:
          type: string
          description: 'Comma-separated IP addresses excluded from domain lock restrictions.'
        mode:
          type: string
          description: The values can be save,append,overwrite
    zoneshttppushnew_domainlock:
