                            r_frame_rate:
                              type: string
                              description: Real (base) frame rate as a fraction (e.g. 60000/1001)
                              example: 24000/1001
                            avg_frame_rate:
                              type: string
                              description: Average frame rate as a fraction (e.g. 30/1)
                              example: 148110000/6177421
                            time_base:
                              type: string
                              description: Time base fraction used for timestamp calculations (e.g. 1/90000)
