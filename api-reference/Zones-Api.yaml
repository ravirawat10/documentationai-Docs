                              description: "URL to add a file via the CDN service"
                              example: https://cdn-service.example.com/service.php/add/5/push/12345
                            editurl:
                              type: string
                              description: "URL to edit a file via the CDN service"
                              example: https://cdn-service.example.com/service.php/edit/5/push/12345
                            deleteurl:
                              type: string
                              description: "URL to delete a file via the CDN service"
                              example: https://cdn-service.example.com/service.php/delete/5/push/12345
                            uploadurl:
                              type: string
                              description: "URL to upload files via the CDN service"
                              example: https://cdn-service.example.com/upload.php
                            playlisturl:
                              type: string
                              description: "URL to retrieve the playlist via the CDN service"
                              example: https://cdn-service.example.com/service.php/playlist
                        ftpdetails:
