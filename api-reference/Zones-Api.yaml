  /zones/http/push/{zoneid}/filemanager/info:
    get:
      tags:
      - HTTP Push
      summary: Zone File Manager  info
      description: Zone File Manager info
      operationId: zonePushFilemanagerInfo
      parameters:
      - $ref: '#/components/parameters/zoneIdParam'
      - $ref: '#/components/parameters/fileParam'
      - $ref: '#/components/parameters/mediaParam'
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  dirname:
                    type: string
                    description: Directory name component of the file path
                    example: /
                  basename:
                    type: string
                    description: Base filename without directory path
                    example: badguy.mp4
                  filesize:
                    type: integer
                    description: File size in bytes
                    example: 44185321
                  lastChange:
                    type: integer
                    description: Unix timestamp of the last modification
                    example: 1777227615
                  lastAccess:
                    type: integer
                    description: Unix timestamp of the last access to this file or resource
                    example: 1777227615
                  etag:
                    type: string
                    description: ETag value of the stored object
                    example: 4d9916f660b76396ad42669e3ddc5ab2
                  perms:
                    type: string
                    description: File or directory permission string (e.g. drwxr-xr-x)
                    example: "0664"
                  media:
                    type: object
                    properties:
                      streams:
                        type: array
                        items:
                          type: object
                          properties:
                            index:
                              type: integer
                              description: Zero-based stream index within the media container
                              example: 0
                            codec_name:
                              type: string
                              description: Media stream metadata from the source file
                              example: h264
                            codec_long_name:
                              type: string
                              description: Full human-readable codec name (e.g. H.264 / AVC / MPEG-4 AVC)
                              example: H.264 / AVC / MPEG-4 AVC / MPEG-4 part 10
                            profile:
                              type: string
                              description: Codec profile used for encoding (e.g. High, Baseline)
                              example: High
                            codec_type:
                              type: string
                              description: "Type of the codec stream: video or audio"
                              example: video
                            codec_tag_string:
                              type: string
                              description: FourCC codec tag string (e.g. avc1, mp4a)
                              example: avc1
                            codec_tag:
                              type: string
                              description: Hex codec tag value (e.g. 0x31637661)
                              example: "0x31637661"
                            width:
                              type: integer
                              description: Video width in pixels
                              example: 1920
                            height:
                              type: integer
                              description: Video height in pixels
                              example: 1080
                            coded_width:
                              type: integer
                              description: Raw encoded width in pixels before crop/padding
                              example: 1920
                            coded_height:
                              type: integer
                              description: Raw encoded height in pixels before crop/padding
                              example: 1080
                            closed_captions:
                              type: integer
                              description: Whether this stream contains closed caption data (0 or 1)
                              example: 0
                            film_grain:
                              type: integer
                              description: Whether film grain synthesis data is present in the stream
                              example: 0
                            has_b_frames:
                              type: integer
                              description: Number of B-frames used in encoding (0 means none)
                              example: 1
                            sample_aspect_ratio:
                              type: string
                              description: Pixel aspect ratio (e.g. 1:1 for square pixels)
                              example: "1:1"
                            display_aspect_ratio:
                              type: string
                              description: Display aspect ratio of the video (e.g. 16:9)
                              example: "16:9"
                            pix_fmt:
                              type: string
                              description: Pixel format of the video stream (e.g. yuv420p)
                              example: yuv420p
                            level:
                              type: integer
                              description: Codec level value indicating complexity constraints
                              example: 40
                            color_range:
                              type: string
                              description: "Color range: tv (limited) or pc (full)"
                              example: tv
                            color_space:
                              type: string
                              description: Color space used for the video stream (e.g. bt709)
                              example: bt709
                            color_transfer:
                              type: string
                              description: Transfer characteristics / gamma curve (e.g. bt709)
                              example: bt709
                            color_primaries:
                              type: string
                              description: Color primaries defining the color gamut (e.g. bt709)
                              example: bt709
                            chroma_location:
                              type: string
