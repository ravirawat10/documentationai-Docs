  /zones/vod/pull/{zoneid}/purge:
    post:
      tags:
      - VOD Pull
      summary: Purge
      description: Purge cache of a VoD pull zone
      operationId: zoneVodPullCachePurge
      parameters:
      - $ref: '#/components/parameters/zoneIdParam'
      - in: query
        name: delete
        schema:
          type: string
          example: true
          description: true - delete the cache false - invalidate the cache (default)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                  description: List of file paths to purge. Omit to purge entire zone.
                  example: ["/video/file.mp4", "/video/another.mp4"]
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                    example: success
                  message:
                    type: string
                    description: Human-readable status message describing the outcome.
                    example: Zone updated successfully
