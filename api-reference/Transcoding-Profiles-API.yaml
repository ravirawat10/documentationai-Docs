      tags:
      - Encoding Profiles
      summary: List Encoding Profiles
      description: List all file transcoding profiles for the service.
      operationId: profilesList
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: API response status.
                    example: success
                  profiles:
                    type: object
                    description: Map of transcoding profiles keyed by profile ID string.
                    properties:
                      "114730":
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Unique stream or record identifier.
                            example: 114730
                          serviceid:
                            type: integer
                            description: Service account identifier.
                            example: 103
                          vmid:
                            type: integer
                            description: Video manager zone ID this profile is associated with.
                            example: 242
                          type:
                            type: string
                            description: Record type identifier.
                            example: file
                          name:
                            type: string
                            description: Human-readable name.
                            example: 2160p
                          filemode:
                            type: string
                            description: File encoding mode.
                            example: Single
                          settings:
                            type: object
                            description: Profile settings object containing encoding parameters.
                            properties:
                              name:
                                type: string
                                description: Human-readable name.
                                example: 2160p
                              outdir:
                                type: string
                                description: Output directory path for the encoded file.
                                example: mp4/
                              f:
                                type: string
                                description: Output container format.
                                example: mp4
                              cv:
                                type: string
                                description: Video codec identifier.
                                example: libx264
                              sv:
                                type: string
                                description: Scale video flag.
                                example: 2160p
                              svvalue:
                                type: string
                                description: Target output resolution for video scaling.
                                example: ""
                              crfv:
                                type: string
                                description: Constant rate factor (CRF) for video quality control.
                                example: "24"
                              bv:
                                type: string
                                description: Enable custom video bitrate flag.
                                example: "1"
                              bvvalue:
