  /account/logs/s3:
    post:
      operationId: getDownloadableLogFiles
      tags:
        - Raw Logs Downloader
      summary: Get Downloadable Log Files
      description: |
        Returns S3 object paths for CDN access log archive files matching the specified date range
        and resources. An empty `files` array means no logs were found for the given criteria.

        The client constructs full download URLs by prepending the OpenStack controller and username
        from `GET /account/logs`:

        `https://{openstack.controller}/{openstack.username}/{file}`

        Files are gzip-compressed CDN access log archives (.gz). The Downloader tab downloads files
        in parallel chunks of 25, packages each chunk as a ZIP using JSZip, and triggers a browser
        download per chunk (`downloaded-logs-part-N.zip`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - r
                - resources
              properties:
                r:
                  type: string
                  description: 'Date range in UTC format: "YYYY-MM-DD HH:mm:ss - YYYY-MM-DD HH:mm:ss". Defines the time window for which log files are retrieved.'
                  example: '2026-01-20 00:00:00 - 2026-01-20 23:59:59'
                resources:
                  type: array
                  description: Resource IDs for which log files should be retrieved. Must contain at least one entry.
                  items:
                    type: string
                  minItems: 1
                  example:
                    - '12345'
                    - '67890'
            example:
              r: '2026-01-20 00:00:00 - 2026-01-20 23:59:59'
              resources:
                - '12345'
                - '67890'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadLogsSuccessResponse'
              examples:
                files_found:
                  summary: Log files available for the requested range
                  value:
                    result: success
                    files:
                      - logs/2026/01/20/resource-12345/cdn-access.log.gz
                      - logs/2026/01/20/resource-67890/cdn-access.log.gz
                no_files:
                  summary: No log files found for the requested range and resources
                  value:
                    result: success
                    files: []
