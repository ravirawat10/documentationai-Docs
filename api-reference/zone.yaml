openapi: 3.0.0
info:
  title: 5centsCDN - Zones
  description: API for managing Zones in <a href="https://www.5centscdn.net" target="_blank">5centsCDN</a>
  version: 2.0.0
  contact:
    email: help@5centscdn.com
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
servers:
- url: https://api.5centscdn.com/v2
  description: 5centsCDN API Server - Production
security:
  - ApiKeyAuth: []
tags:
  - name: HTTP Push Zones
    description: endpoints related to  HTTP Push zones
  - name: HTTP Pull Zones
    description: endpoints related to  HTTP Pull zones
  - name: VOD Push Zones
    description: endpoints related to  VOD Push zones
  - name: VOD Pull Zones
    description: endpoints related to  VOD Pull zones
  - name: HTTP Zones Global Settings
    description: Global HTTP Zones Settings
  - name: VOD Zones Global Settings
    description: Global VOD Zones Settings
paths:
  /{id}/zones/http/push/{zoneid}/domainlock:
    post:
      tags:
      - HTTP Push Zones
      summary: Update Domain Lock
      description: Update domain lock of HTTP push zone
      operationId: updateDomainLockZonePush
      parameters:
      - $ref: '#/components/parameters/serviceId'
      - $ref: '#/components/parameters/zoneIdParam'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                enabled:
                  type: string
                  enum: [Y, N]
                  description: Enable or disable domain lock.
                  example: Y
                policy:
                  type: string
                  enum: [Y, N]
                  description: Y = Whitelist (allow listed domains), N = Blacklist (block listed domains).
                  example: Y
                list:
                  type: string
                  description: Comma-separated domain names to whitelist or blacklist.
                  example: example.com,b.com
                ips:
                  type: string
                  description: Comma-separated IP addresses that are whitelisted regardless of domain lock.
                  example: 192.168.1.1
                noreferer:
                  type: string
                  enum: [Y, N]
                  description: Y = allow requests with no Referer header, N = block them.
                  example: Y
                mode:
                  type: string
                  enum: [save, append, overwrite]
                  description: Update mode — save replaces, append adds to, overwrite replaces entirely.
                  example: save
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                 result:
                  type: string
                  example: success
                 message:
                  type: string
                  example: Zone Updated
                 zone:
                   $ref: '#/components/schemas/zonePushResult'
  /{id}/zones/http/push/{zoneid}/edge:
    post:
      tags: 
      - HTTP Push Zones
      summary: Update Edge Settings
      description: Update Edge settings of HTTP push zone
      operationId: updateEdgeSettingsZonePush
      parameters:
      - $ref: '#/components/parameters/serviceId'
      - $ref: '#/components/parameters/zoneIdParam'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                compression:
                  type: string
                  enum: [Y, N]
                  description: Enable or disable gzip/brotli compression.
                  example: Y
                compressionlevel:
                  type: string
                  enum: ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
                  description: Compression level from 1 (fastest) to 9 (best compression).
                  example: "6"
                disposition:
                  type: string
                  enum: [Y, N]
                  description: Enable or disable Content-Disposition header.
                  example: Y
                stripcookie:
                  type: string
                  enum: [Y, N]
                  description: Strip cookies from CDN responses.
                  example: Y
                xff:
                  type: string
                  enum: [Y, N]
                  description: Enable or disable X-Forwarded-For header passthrough.
                  example: Y
                cors:
                  type: string
                  enum: [Y, N]
                  description: Enable or disable CORS headers.
                  example: Y
                webp:
                  type: string
                  enum: [Y, N]
                  description: Enable or disable automatic WebP conversion.
                  example: Y
                pseudostreaming:
                  type: string
                  enum: [Y, N]
                  description: Enable or disable pseudo-streaming for video files.
                  example: N
                wp:
                  type: string
                  enum: [Y, N]
                  description: Enable or disable WordPress cache bypass optimisation.
                  example: N
                lfo:
                  type: string
                  enum: [Y, N]
                  description: Enable or disable large file optimisation.
                  example: N
                prefresh:
                  type: string
                  enum: [Y, N]
                  description: Enable or disable cache prefresh on expiry.
                  example: N
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                 result:
                  type: string
                  example: success
                 message:
                  type: string
                  example: Zone Updated
                 zone:
                   $ref: '#/components/schemas/zonePushResult'
  /{id}/zones/http/push/{zoneid}/cache:
    post:
      tags: 
      - HTTP Push Zones
      summary: Update Cache
      description: Update cache of HTTP Push Zone
      operationId: updateCacheZonePush
      parameters:
      - $ref: '#/components/parameters/serviceId'
      - $ref: '#/components/parameters/zoneIdParam'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                cache:
                  type: string
                  enum: ["0s", "10s", "1m", "10m", "30m", "1h", "4h", "12h", "1d", "7d", "14d", "1M", "3M", "6M", "1y"]
                  description: Edge cache TTL duration code.
                  example: 1h
                expiry:
                  type: string
                  description: Browser cache TTL duration code. Same values as cache, or empty string to disable.
                  example: 1d
                querystring:
                  type: string
                  enum: [Y, N]
                  description: Cache content per unique query string.
                  example: Y
                cachecontrol:
                  type: string
                  enum: [Y, N]
                  description: Honour Cache-Control headers from origin.
                  example: Y
                usestale:
                  type: string
                  enum: [Y, N]
                  description: Serve stale content while revalidating in the background.
                  example: Y
                revalidate:
                  type: string
                  enum: [Y, N]
                  description: Revalidate cached content on expiry.
                  example: Y
                cacheInSecs:
                  type: number
                  description: Cache TTL in seconds — computed from cache value.
                  example: 3600
                cacheInMins:
                  type: number
                  description: Cache TTL in minutes — computed from cache value.
                  example: 60
                expiryInSecs:
                  type: number
                  description: Browser cache TTL in seconds — computed from expiry value.
                  example: 86400
                expiryInMins:
                  type: number
                  description: Browser cache TTL in minutes — computed from expiry value.
                  example: 1440
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                 result:
                  type: string
                  example: success
                 message:
                  type: string
                  example: Zone Updated
                 zone:
                    $ref: '#/components/schemas/zonePushResult'
