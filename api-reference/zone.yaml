      summary: Update bandwidth limit
      description: Update bandwidth limit of HTTP push zone
      operationId: updateBwLimitZonePush
      parameters:
      - $ref: '#/components/parameters/serviceId'
      - $ref: '#/components/parameters/zoneIdParam'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                enabled:
                  type: string
                  enum: [Y, N]
                  description: Enable or disable bandwidth limiting.
                  example: Y
                policy:
                  type: string
                  enum: [Y, N]
                  description: Bandwidth limit policy flag.
                  example: Y
                rate:
                  type: number
                  description: Throttle rate in KB/s applied after rateafter threshold is reached.
                  example: 1024
                rateafter:
                  type: number
                  description: Amount of data in KB served before the throttle rate kicks in.
                  example: 5120
                mode:
                  type: string
                  enum: [save, append, overwrite]
                  description: Update mode — save replaces, append adds to, overwrite replaces entirely.
                  example: save
