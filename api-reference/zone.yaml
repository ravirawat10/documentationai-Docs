    OriginAuth:
      type: object
      description: Origin server authentication settings (HTTP Pull zones only)
      properties:
        type:
          type: string
          enum: [none, awsSignatureV4]
          default: none
          description: Authentication type for private origin access
        s3_access_key_id:
          type: string
          minLength: 20
          maxLength: 20
          pattern: '^AKIA[A-Z0-9]{16}$'
          description: AWS Access Key ID (required when type=awsSignatureV4)
        s3_access_key_secret:
          type: string
          minLength: 40
          maxLength: 40
          description: AWS Secret Access Key (required when type=awsSignatureV4)
        s3_midgress_cache_size:
          type: integer
          minimum: 1
          description: Midgress cache size in GB (requires Advanced Features)
    IPAccessSettings:
      type: object
      description: IP address access control settings
      properties:
        enabled:
          type: string
          enum: [Y]
          description: Enable IP access control (omit to disable)
        policy:
          type: string
          enum: [Y, N]
          description: "Y = Block listed IPs, N = Allow only listed IPs"
        list:
          type: string
          description: Comma-separated IP addresses or CIDR ranges to block or allow
        ips:
          type: string
          description: Comma-separated IPs excluded from IP access restrictions
        active:
          type: string
    UserAgentSettings:
      type: object
      description: User-Agent string access control settings
      properties:
        enabled:
          type: string
          enum: [Y]
          description: Enable user agent control (omit to disable)
        policy:
          type: string
          enum: [Y, N]
          description: "Y = Block listed user agents, N = Allow only listed user agents"
        list:
          type: string
          description: |
            Semicolon-separated (;;;) user agent strings.
            Use *wildcard* pattern for partial matching. Example: *Chrome*
        casesensitive:
          type: string
          enum: [Y]
          description: Enable case-sensitive matching
        ips:
          type: string
          description: Comma-separated IPs excluded from user agent restrictions
        active:
          type: string
        listArr:
          type: array
          items:
            type: string
