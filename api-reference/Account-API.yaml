openapi: 3.0.3
info:
  title: 5centsCDN - Account Management API
  description: >
    Account management endpoints for the 5centsCDN platform. Includes
    domain verification, SSL certificate management, bandwidth overage protection,
    API key management, raw log configuration, and sub-account user management.
    API v2 routes use header-based API key authentication.
  version: 2.0.0
  contact:
    email: help@5centscdn.com
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'

servers:
  - url: https://api.5centscdn.com/v2
    description: 5centsCDN API Server - Production

security:
  - apikeyAuth: []

tags:
  - name: Domain Verification
    description: Endpoints related to domain ownership verification via DNS TXT record
  - name: SSL Certificates
    description: Endpoints related to SSL certificate management (create, read, update, delete)
  - name: Bandwidth Overage Protection
    description: Bandwidth Overage Protection and Auto Recharge settings
  - name: API Keys
    description: API key management (create, read, update, delete)

paths:
  /account/dv:
    get:
      summary: List verified domains
      operationId: getDomainVerificationList
      tags:
      - Domain Verification
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  domains:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 2150
                        serviceid:
                          type: integer
                          example: 103
                        domain:
                          type: string
                          example: 5centscdndemo.ca
                        validated:
                          type: string
                          enum:
                          - Y
                          - N
                          example: Y
                        txtrecord:
                          type: object
                          properties:
                            host:
                              type: string
                              example: j78dpam2ndq5
                            ttl:
                              type: integer
                              example: 3600
                            value:
                              type: string
                              example: g2qd3wjxay7a
    post:
      summary: Add a domain for verification
      operationId: storeDomainVerification
      tags:
      - Domain Verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DomainVerificationCreateRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Domain added. Please add TXT DNS record for verification
                  domain:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 3847
                      serviceid:
                        type: integer
                        example: 103
                      domain:
                        type: string
                        example: ravi.com
                      validated:
                        type: string
                        enum:
                        - Y
                        - N
                        example: N
                      txtrecord:
                        type: object
                        properties:
                          host:
                            type: string
                            example: zkpyw4ggalbe
                          ttl:
                            type: integer
                            example: 3600
                          value:
                            type: string
                            example: 932y4jqqeyjv
  /account/dv/{dvid}:
    get:
      summary: Show domain verification details
      operationId: showDomainVerification
      tags:
      - Domain Verification
      parameters:
      - $ref: '#/components/parameters/dvId'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  domain:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2150
                      serviceid:
                        type: integer
                        example: 103
                      domain:
                        type: string
                        example: 5centscdndemo.ca
                      validated:
                        type: string
                        enum:
                        - Y
                        - N
                        example: Y
                      txtrecord:
                        type: object
                        properties:
                          host:
                            type: string
                            example: j78dpam2ndq5
                          ttl:
                            type: integer
                            example: 3600
                          value:
                            type: string
                            example: g2qd3wjxay7a
    post:
      summary: Delete a domain verification record
      operationId: destroyDomainVerification
      tags:
      - Domain Verification
      parameters:
      - $ref: '#/components/parameters/dvId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - _METHOD
              properties:
                _METHOD:
                  type: string
                  description: Must be set to DELETE to trigger domain deletion.
                  example: DELETE
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Domain deleted
  /account/dv/{dvid}/validate:
    get:
      summary: Trigger domain DNS TXT record validation
      operationId: validateDomain
      tags:
      - Domain Verification
      parameters:
      - $ref: '#/components/parameters/dvId'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  message:
                    type: string
  /account/ssl:
    get:
      summary: List SSL certificates
      operationId: indexSSL
      tags:
      - SSL Certificates
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  certs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 374
                        name:
                          type: string
                          example: Arti
                        crt:
                          type: string
                          description: PEM-encoded X.509 certificate.
                          example: "-----BEGIN CERTIFICATE-----\r\n...\r\n-----END\
                            \ CERTIFICATE-----"
                        key:
                          type: string
                          description: Always returned as redacted for security.
                          example: '--- redacted ---'
                        cabundle:
                          type: string
                          description: PEM-encoded CA bundle.
                          example: "-----BEGIN CERTIFICATE-----\r\n...\r\n-----END\
                            \ CERTIFICATE-----"
                        domain:
                          type: string
                          example: wmncdn.com
                        sans:
                          type: array
                          items:
                            type: string
                          example:
                          - wmncdn.com
                          - www.wmncdn.com
                        expiry:
                          type: string
                          format: date
                          example: '2024-02-21'
                        installs:
                          type: integer
                          example: 0
                        expired:
                          type: boolean
                          example: true
                        validFrom:
                          type: string
                          format: date
                          example: '2023-11-23'
  /account/ssl/new:
    post:
      summary: Upload a new SSL certificate
      operationId: storeSSL
      tags:
      - SSL Certificates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSLCertCreateRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Operation completed successfully
                  cert:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 222
                      name:
                        type: string
                        example: sss
                      crt:
                        type: string
                        description: PEM-encoded X.509 certificate.
                        example: "-----BEGIN CERTIFICATE-----\r\nstring\r\n-----END\
                          \ CERTIFICATE-----"
                      key:
                        type: string
                        description: Always returned as redacted for security.
                        example: '--- redacted ---'
                      cabundle:
                        type: string
                        description: PEM-encoded CA bundle.
                        example: "-----BEGIN CERTIFICATE-----\r\nstring\r\n-----END\
                          \ CERTIFICATE-----"
                      domain:
                        type: string
                        example: mydomain.com
                      sans:
                        type: array
                        items:
                          type: string
                        example:
                        - mydomain.com
                        - www.mydomain.com
                      expiry:
                        type: string
                        format: date
                        example: '2024-03-12'
                      installs:
                        type: integer
                        example: 1
                      expired:
                        type: boolean
                        example: true
                      validFrom:
                        type: string
                        format: date
                        example: '2023-12-11'
  /account/ssl/{sslcertid}:
    get:
      summary: Show SSL certificate details
      operationId: showSSL
      tags:
      - SSL Certificates
      parameters:
      - $ref: '#/components/parameters/sslcertId'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  cert:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 222
                      name:
                        type: string
                        example: sss
                      crt:
                        type: string
                        description: PEM-encoded X.509 certificate.
                        example: "-----BEGIN CERTIFICATE-----\r\nstring\r\n-----END\
                          \ CERTIFICATE-----"
                      key:
                        type: string
                        description: Always returned as redacted for security.
                        example: '--- redacted ---'
                      cabundle:
                        type: string
                        description: PEM-encoded CA bundle.
                        example: "-----BEGIN CERTIFICATE-----\r\nstring\r\n-----END\
                          \ CERTIFICATE-----"
                      domain:
                        type: string
                        example: mydomain.com
                      sans:
                        type: array
                        items:
                          type: string
                        example:
                        - mydomain.com
                        - www.mydomain.com
                      expiry:
                        type: string
                        format: date
                        example: '2024-03-12'
                      installs:
                        type: integer
                        example: 1
                      expired:
                        type: boolean
                        example: true
                      validFrom:
                        type: string
                        format: date
                        example: '2023-12-11'
    post:
      summary: Update an SSL certificate
      operationId: updateSSL
      tags:
      - SSL Certificates
      parameters:
      - $ref: '#/components/parameters/sslcertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSLCertUpdateRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Update successful
                  cert:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 222
                      name:
                        type: string
                        example: sss
                      crt:
                        type: string
                        description: PEM-encoded X.509 certificate.
                        example: "-----BEGIN CERTIFICATE-----\r\nstring\r\n-----END\
                          \ CERTIFICATE-----"
                      key:
                        type: string
                        description: Always returned as redacted for security.
                        example: '--- redacted ---'
                      cabundle:
                        type: string
                        description: PEM-encoded CA bundle.
                        example: "-----BEGIN CERTIFICATE-----\r\nstring\r\n-----END\
                          \ CERTIFICATE-----"
                      domain:
                        type: string
                        example: mydomain.com
                      sans:
                        type: array
                        items:
                          type: string
                        example:
                        - mydomain.com
                        - www.mydomain.com
                      expiry:
                        type: string
                        format: date
                        example: '2024-03-12'
                      installs:
                        type: integer
                        example: 1
                      expired:
                        type: boolean
                        example: true
                      validFrom:
                        type: string
                        format: date
                        example: '2023-12-11'
    delete:
      summary: Delete an SSL certificate
      operationId: destroySSL
      tags:
      - SSL Certificates
      parameters:
      - $ref: '#/components/parameters/sslcertId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - _METHOD
              properties:
                _METHOD:
                  type: string
                  description: Must be set to DELETE to trigger certificate deletion.
                  example: DELETE
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  message:
                    type: string
                    example: SSL Certificate - Test Deleted

  /account/bwop:
    get:
      summary: Show Bandwidth Overage Protection settings
      operationId: showBWOP
      tags:
      - Bandwidth Overage Protection
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  bwop:
                    type: string
                    example: '110'
    post:
      summary: Update Bandwidth Overage Protection limit
      operationId: updateBWOP
      tags:
      - Bandwidth Overage Protection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BWOPRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Bandwidth Overage Protection Updated
  /account/recharge:
    post:
      summary: Update Bandwidth Auto Recharge settings
      operationId: updateAutoRecharge
      tags:
      - Bandwidth Overage Protection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoRechargeRequest'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Bandwidth Auto Recharge Updated
  /account/api:
    get:
      summary: List API keys
      operationId: indexAPI
      tags:
      - API Keys
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  apikeys:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 897
                        serviceid:
                          type: integer
                          example: 103
                        name:
                          type: string
                          example: test
                        description:
                          type: string
                          example: testttt
                        permission:
                          type: array
                          items:
                            type: string
                            enum:
                            - create
                            - read
                            - update
                            - delete
                          example:
                          - create
                          - update
                          - delete
                        hash:
                          type: string
                          example: b8786ced9a366895405fa28f66ae192c
  /account/api/new:
    post:
      summary: Create a new API key
      operationId: storeAPI
      tags:
      - API Keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - description
              - permission[]
              - _METHOD
              properties:
                name:
                  type: string
                  description: Human-readable label for the API key / application.
                  example: My Application
                description:
                  type: string
                  description: Optional description of the key's purpose.
                  example: Used by the mobile app
                permission[]:
                  type: array
                  description: >
                    Set of CRUD permissions granted to this key. At least
                    one value is required. Multiple values allowed.
                  items:
                    type: string
                    enum:
                    - create
                    - read
                    - update
                    - delete
                  example:
                  - read
                  - update
                _METHOD:
                  type: string
                  description: Must be set to PUT to trigger API key creation.
                  example: PUT
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  message:
                    type: string
                    example: API Key Created
                  id:
                    type: integer
                    example: 1143
  /account/api/{apikeyid}:
    get:
      summary: Show API key details
      operationId: showAPI
      tags:
      - API Keys
      parameters:
      - $ref: '#/components/parameters/apikeyId'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  apikey:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1143
                      serviceid:
                        type: integer
                        example: 103
                      name:
                        type: string
                        example: Testing123
                      description:
                        type: string
                        example: Testtttt
                      permission:
                        type: array
                        items:
                          type: string
                          enum:
                          - create
                          - read
                          - update
                          - delete
                        example:
                        - read
                        - create
                      hash:
                        type: string
                        example: 34ae4bf346e1915bd38a1dee9103145a
    post:
      summary: Update an API key
      operationId: updateAPI
      tags:
      - API Keys
      parameters:
      - $ref: '#/components/parameters/apikeyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - description
              - permission[]
              properties:
                name:
                  type: string
                  description: Human-readable label for the API key / application.
                  example: My Application
                description:
                  type: string
                  description: Optional description of the key's purpose.
                  example: Used by the mobile app
                permission[]:
                  type: array
                  description: Set of CRUD permissions granted to this key.
                  items:
                    type: string
                    enum:
                    - create
                    - read
                    - update
                    - delete
                  example:
                  - read
                  - update
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  message:
                    type: string
                    example: API Key Updated
    delete:
      summary: Delete an API key
      operationId: destroyAPI
      tags:
      - API Keys
      parameters:
      - $ref: '#/components/parameters/apikeyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - _METHOD
              properties:
                _METHOD:
                  type: string
                  description: Must be set to DELETE to trigger API key deletion.
                  example: DELETE
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  message:
                    type: string
                    example: API Key - t2 Deleted



components:
  securitySchemes:
    apikeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    sslcertId:
      name: sslcertid
      in: path
      required: true
      description: Unique identifier of the SSL certificate record (dashboard).
      schema:
        type: integer
        example: 3
    dvId:
      name: dvid
      in: path
      required: true
      description: Unique identifier of the domain verification record (dashboard).
      schema:
        type: integer
        example: 5
    apikeyId:
      name: apikeyid
      in: path
      required: true
      description: Unique identifier of the API key record.
      schema:
        type: integer
        example: 7

  schemas:
    DomainVerificationCreateRequest:
      type: object
      required:
      - domain
      properties:
        domain:
          type: string
          description: >
            Top-level domain to verify (e.g. example.com). Subdomains
            are not accepted. Unicode/IDN domains are accepted and converted to punycode
            internally.
          example: example.com
    DomainVerificationTxtRecord:
      type: object
      description: DNS TXT record details required for domain ownership verification.
      properties:
        host:
          type: string
          description: TXT record host / name (a 12-character hashid prefix).
          example: a3b9f1c82d4e
        ttl:
          type: integer
          description: Recommended TTL in seconds.
          example: 3600
        value:
          type: string
          description: TXT record value to set.
          example: z1x2w3v4u5t6
    DomainVerificationResponse:
      type: object
      properties:
        id:
          type: integer
          example: 5
        serviceid:
          type: integer
          example: 1234
        domain:
          type: string
          example: example.com
        validated:
          type: string
          description: '''Y'' if the domain has been successfully verified, ''N'' otherwise.'
          enum:
          - Y
          - N
          example: N
        txtrecord:
          $ref: '#/components/schemas/DomainVerificationTxtRecord'
    DomainVerificationValidateResponse:
      type: object
      properties:
        result:
          type: string
          enum:
          - success
          - error
          example: success
        msg:
          type: string
          description: Human-readable error message (only present when result is error).
          example: Record not found
    SSLCertCreateRequest:
      type: object
      required:
      - _METHOD
      - crt
      - key
      properties:
        _METHOD:
          type: string
          description: Must be set to PUT to trigger SSL certificate creation.
          example: PUT
        name:
          type: string
          description: Friendly name for the certificate. If omitted, auto-generated
            using the certificate CN, expiry date, and a timestamp.
          example: my-wildcard-cert
        crt:
          type: string
          description: PEM-encoded X.509 certificate. Required.
          example: YOUR_PEM_CERTIFICATE
        key:
          type: string
          description: PEM-encoded private key. Required.
          example: YOUR_PEM_PRIVATE_KEY
        cabundle:
          type: string
          description: PEM-encoded CA bundle. Optional but recommended.
          example: YOUR_PEM_CA_BUNDLE
    SSLCertUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: Friendly name for the certificate.
          example: my-wildcard-cert
        crt:
          type: string
          description: PEM-encoded X.509 certificate. Provide crt + key to replace
            certificate material. Omitting both updates only the name.
          example: YOUR_PEM_CERTIFICATE
        key:
          type: string
          description: PEM-encoded private key. Required when replacing certificate
            material.
          example: YOUR_PEM_PRIVATE_KEY
        cabundle:
          type: string
          description: PEM-encoded CA bundle.
          example: YOUR_PEM_CA_BUNDLE
    SSLCertResponse:
      type: object
      properties:
        id:
          type: integer
          example: 3
        serviceid:
          type: integer
          example: 1234
        name:
          type: string
          example: my-wildcard-cert
        domain:
          type: string
          description: Common Name (CN) extracted from the certificate.
          example: '*.example.com'
        crt:
          type: string
          description: PEM-encoded certificate.
        key:
          type: string
          description: Always returned as redacted for security.
          example: '--- redacted ---'
        cabundle:
          type: string
          description: PEM-encoded CA bundle.
        expiry:
          type: string
          format: date
          description: Certificate expiration date derived from the cert itself.
          example: '2026-06-01'
        expired:
          type: boolean
          description: True when the expiry date is in the past.
          example: false
        installs:
          type: integer
          description: Number of CDN zones / streams currently using this cert.
          example: 2
        sans:
          type: array
          description: Subject Alternative Names extracted from the certificate.
          items:
            type: string
          example:
          - '*.example.com'
          - example.com
        validFrom:
          type: string
          format: date
          description: Certificate valid-from date.
          example: '2025-06-01'
    BWOPRequest:
      type: object
      required:
      - bwop
      properties:
        bwop:
          type: integer
          description: Monthly bandwidth limit as a percentage of the plan's included
            bandwidth. Valid values between 90 and 120 (inclusive). Use 0 to disable.
          minimum: 90
          maximum: 120
          multipleOf: 5
          example: 110
    AutoRechargeRequest:
      type: object
      required:
      - autorecharge_at
      properties:
        autorecharge_at:
          type: integer
          description: Percentage of monthly bandwidth at which an addon package is
            auto-purchased. Set to 0 to disable auto recharge.
          enum:
          - 0
          - 75
          - 85
          - 95
          example: 85
        autorecharge_id:
          type: integer
          description: WHMCS addon service ID for the bandwidth package to purchase.
            Required when autorecharge_at is non-zero.
          example: 42
    APIKeyCreateRequest:
      type: object
      required:
      - name
      - permission
      properties:
        name:
          type: string
          description: Human-readable label for the API key / application.
          example: My Application
        description:
          type: string
          description: Optional description of the key's purpose.
          example: Used by the mobile app
        permission:
