components:
  parameters:
    RestServiceId:
      name: serviceId
      in: path
      required: true
      description: CDN service ID (integer)
      schema:
        type: integer
        minimum: 1

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
# ── Schemas from Dashboard Reports API (Claude) ───────────────────────────────
    # ------------------------------------------------------------------
    # MyCDN / ON filter schemas
    # ------------------------------------------------------------------
    StatsSummaryRangeParam:
      description: |
        Slash-delimited filter string for stats summary endpoints.
        Format: `{range}/{type}`
        - range: `last_24hrs` | `last_7days` | `last_30days` | `YYYY-MM` (month key)
        - type: `hourly` | `daily`
        Example: `last_7days/daily`
      type: string
      example: "last_7days/daily"

    CacheFilterParam:
      description: |
        Slash-delimited filter string for cache statistics endpoints.
        Format: `{frequency}/{filter_type}/{start_date}/{end_date}`
        - frequency: `0` (minute) | `1` (hour) | `2` (day)
        - filter_type: `0` (traffic) | `1` (HIT/MISS)
        - start_date: `YYYY-MM-DD`
        - end_date: `YYYY-MM-DD`
        Example: `2/0/2024-01-01/2024-01-31`
      type: string
      example: "2/0/2024-01-01/2024-01-31"

    TopFilesFilterParam:
      description: |
        Slash-delimited filter string for top-files endpoints.
        Format: `{start_date}/{end_date}/{type}`
        - start_date: `YYYY-MM-DD`
        - end_date: `YYYY-MM-DD`
        - type: `dynamic` | `static` | `notfound`
        Example: `2024-01-01/2024-01-31/dynamic`
      type: string
      example: "2024-01-01/2024-01-31/dynamic"

    DateRangeFilterParam:
      description: |
        Slash-delimited filter string for referrers, status-codes, countries,
        browsers, OS, and visitors endpoints.
        Format: `{frequency}/{start_date}/{end_date}`
        - frequency: `0` (minute) | `1` (hour) | `2` (day)
        - start_date: `YYYY-MM-DD`
        - end_date: `YYYY-MM-DD`
        Example: `2/2024-01-01/2024-01-31`
      type: string
      example: "2/2024-01-01/2024-01-31"

    TopReferrersFilterParam:
      description: |
        Slash-delimited filter string for top-referrers endpoint.
        Format: `{start_date}/{end_date}`
        - start_date: `YYYY-MM-DD`
        - end_date: `YYYY-MM-DD`
        Example: `2024-01-01/2024-01-31`
      type: string
      example: "2024-01-01/2024-01-31"

    # ------------------------------------------------------------------
    # Akamai range params
    # ------------------------------------------------------------------
    AkamaiRangeParam:
      description: |
        Date-time range for Akamai reports. Format: `YYYY-MM-DD HH:mm:ss - YYYY-MM-DD HH:mm:ss`
        Defaults to last 7 days ending yesterday.
      type: string
      example: "2024-01-01 00:00:00 - 2024-01-08 00:00:00"

    # ------------------------------------------------------------------
    # Minutes / DVR range param
    # ------------------------------------------------------------------
    MinutesRangeParam:
      description: |
        Date-time range for DVR/transcode stats. Format: `YYYY-MM-DD HH:00:00 - YYYY-MM-DD HH:00:00`
        Defaults to last 7 days.
      type: string
      example: "2024-01-01 00:00:00 - 2024-01-08 00:00:00"

    # ------------------------------------------------------------------
    # HTML page response (all dashboard pages return HTML)
    # ------------------------------------------------------------------
    TrafficBytesValue:
      type: object
      description: A bandwidth metric — raw bytes and human-readable string, with optional percentage of total.
      properties:
        bytes:
          type: integer
          format: int64
          description: Raw byte count
          example: 1262343731219
        formatted:
          type: string
          description: Human-readable value (e.g. "1.26 TB")
          example: "1.26 TB"
        percent:
          type: string
          description: Share of the total for this dimension value (only present in breakdown/line data items)
          example: "+35.67%"

    TrafficCountValue:
      type: object
      description: A count metric — raw count and human-readable string, with optional percentage of total.
      properties:
        count:
          type: integer
