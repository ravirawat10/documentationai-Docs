                  example: 1172166
                formatted:
                  type: string
                  example: "1.172M"
            requests:
              type: object
              properties:
                count:
                  type: integer
                  format: int64
                  example: 1646341
                formatted:
                  type: string
                  example: "1.646M"
            unique_visitors:
              type: object
              properties:
                count:
                  type: integer
                  format: int64
                  example: 27056
                formatted:
                  type: string
                  example: "27.06k"
            caching_efficiency:
              type: object
              properties:
                percent:
                  type: number
                  format: float
                  example: 0.71
                formatted:
                  type: string
                  example: "+71%"
            traffic_efficiency:
              type: object
              properties:
                percent:
                  type: number
                  format: float
                  example: 0.69
                formatted:
                  type: string
                  example: "+69%"

    TrafficCacheResponse:
      type: object
      description: Traffic metrics broken down by cache status.
      properties:
        summary:
          type: object
          properties:
            traffic:
              type: object
              properties:
                bytes:
                  type: integer
                  format: int64
                  example: 1262343731219
                formatted:
                  type: string
                  example: "1.26 TB"
            traffic_cached:
              type: object
              properties:
                bytes:
                  type: integer
                  format: int64
                  example: 864713098005
                formatted:
                  type: string
                  example: "864.71 GB"
            hits:
              type: object
              properties:
                count:
                  type: integer
                  format: int64
                  example: 1172166
                formatted:
                  type: string
                  example: "1.172M"
        data:
          type: array
          description: Per-cache-status breakdown rows.
          items:
            type: object
            properties:
              key:
                type: string
                description: Cache status label (e.g. HIT, MISS, BYPASS).
                example: HIT
              traffic:
                type: object
                properties:
                  bytes:
                    type: integer
                    format: int64
                    example: 864713098005
                  formatted:
                    type: string
                    example: "864.71 GB"
                  percent:
                    type: string
                    example: "+68.5%"

    TrafficBreakdownResponse:
      type: object
      description: |
        Traffic metrics broken down by a single dimension (country, browser, PoP, etc.).
        The `data` array is sorted by total traffic descending.
      properties:
        summary:
          $ref: '#/components/schemas/TrafficSummary'
        data:
          type: array
          description: Per-dimension breakdown rows
          items:
            $ref: '#/components/schemas/TrafficDataItem'

    TrafficLineResponse:
      type: object
      description: Time-series traffic data for a selected dimension value.
      properties:
        info:
          $ref: '#/components/schemas/TrafficLineInfo'
        summary:
          $ref: '#/components/schemas/TrafficSummary'
        data:
          type: array
          description: Time-series data points, one per granularity bucket. `key` is a Unix timestamp.
          items:
            $ref: '#/components/schemas/TrafficDataItem'

    TrafficCardResponse:
      type: object
      description: |
        Period-over-period comparison for summary metrics. The comparison period is
        equivalent to the selected range shifted backward by the same duration.
        Deviation values use the same TrafficSummary structure, where each metric's
        `percent` or `formatted` field encodes the relative change (e.g. "-4%").
      properties:
        current:
          $ref: '#/components/schemas/TrafficSummary'
        previous:
          $ref: '#/components/schemas/TrafficSummary'
        deviation:
          $ref: '#/components/schemas/TrafficSummary'

    TrafficSummaryLineResponse:
      type: object
      description: Period-over-period cache status comparison with date range metadata.
      properties:
        period:
          type: object
          description: Date ranges for the current and previous periods.
          properties:
            current:
              type: object
              properties:
                from:
                  type: string
                  format: date-time
                  example: "2026-04-01T00:00:00"
                to:
                  type: string
                  format: date-time
                  example: "2026-04-27T23:59:59"
            previous:
              type: object
              properties:
                from:
                  type: string
                  format: date-time
                  example: "2026-03-05T00:00:01"
                to:
                  type: string
                  format: date-time
                  example: "2026-04-01T00:00:00"
        current:
          $ref: '#/components/schemas/TrafficSummaryStatusMap'
        previous:
          $ref: '#/components/schemas/TrafficSummaryStatusMap'
        deviation:
          type: object
          description: Per-status period-over-period deviation values.
          properties:
            "-":
              $ref: '#/components/schemas/TrafficCacheDeviationValue'
            BYPASS:
              $ref: '#/components/schemas/TrafficCacheDeviationValue'
            MISS:
              $ref: '#/components/schemas/TrafficCacheDeviationValue'
            HIT:
              $ref: '#/components/schemas/TrafficCacheDeviationValue'
            STALE:
              $ref: '#/components/schemas/TrafficCacheDeviationValue'
            EXPIRED:
              $ref: '#/components/schemas/TrafficCacheDeviationValue'
            UPDATING:
              $ref: '#/components/schemas/TrafficCacheDeviationValue'

    TrafficSummaryStatusMap:
      type: object
      description: Request counts keyed by cache status. Known statuses include HIT, MISS, EXPIRED, BYPASS, STALE, UPDATING, "-".
      properties:
        "-":
          $ref: '#/components/schemas/TrafficCacheStatusValue'
        BYPASS:
          $ref: '#/components/schemas/TrafficCacheStatusValue'
        MISS:
          $ref: '#/components/schemas/TrafficCacheStatusValue'
        HIT:
          $ref: '#/components/schemas/TrafficCacheStatusValue'
        STALE:
          $ref: '#/components/schemas/TrafficCacheStatusValue'
        EXPIRED:
          $ref: '#/components/schemas/TrafficCacheStatusValue'
        UPDATING:
          $ref: '#/components/schemas/TrafficCacheStatusValue'

    TrafficCacheStatusValue:
      type: object
      description: Request count for a single cache status code.
      properties:
        count:
          type: integer
          format: int64
          description: Raw request count
          example: 1172166
        formatted:
          type: string
          description: Human-readable value
          example: "1.172M"

    TrafficCacheDeviationValue:
      type: object
      description: Period-over-period change for a cache status.
      properties:
        percent:
          type: number
          format: float
          description: Relative change as a decimal (negative = decrease)
          example: -0.08
        formatted:
          type: string
          description: Human-readable change string (e.g. "-8%")
          example: "-8%"

    TrafficCacheStatusMap:
      type: object
      description: |
        Request counts keyed by cache status. Known statuses: HIT, MISS, EXPIRED, BYPASS, "-".
      properties:
        HIT:
          $ref: '#/components/schemas/TrafficCacheStatusValue'
        MISS:
          $ref: '#/components/schemas/TrafficCacheStatusValue'
        EXPIRED:
          $ref: '#/components/schemas/TrafficCacheStatusValue'
        BYPASS:
          $ref: '#/components/schemas/TrafficCacheStatusValue'
        "-":
          $ref: '#/components/schemas/TrafficCacheStatusValue'

    TrafficCacheCardResponse:
      type: object
      description: |
        Period-over-period comparison for cache status request counts.
        Unlike the summary card, metrics are keyed by cache status rather than metric type.
      properties:
        current:
          $ref: '#/components/schemas/TrafficCacheStatusMap'
        previous:
          $ref: '#/components/schemas/TrafficCacheStatusMap'
        deviation:
          type: object
          description: Per-status deviation values
          properties:
            HIT:
              $ref: '#/components/schemas/TrafficCacheDeviationValue'
            MISS:
              $ref: '#/components/schemas/TrafficCacheDeviationValue'
            EXPIRED:
              $ref: '#/components/schemas/TrafficCacheDeviationValue'
            BYPASS:
              $ref: '#/components/schemas/TrafficCacheDeviationValue'
            "-":
              $ref: '#/components/schemas/TrafficCacheDeviationValue'
