  /{id}/transcoding/filters/new:
    parameters:
      - $ref: '#/components/parameters/serviceIdParam'
    post:
      tags:
        - Video Encoding Profiles
      summary: Create File Transcoding Filter
      description: Create a new file transcoding filter.
      operationId: createFileTranscodingFilter
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - name
                - filter
                - _METHOD
              properties:
                name:
                  type: string
                  description: Filter name.
                  example: flutter
                filter:
                  type: string
                  description: "Filter type: drawtext or overlay."
                  enum: [drawtext, overlay]
                  example: drawtext
                args[overlay][url]:
                  type: string
                  description: Logo image URL for overlay filter.
                  example: "https://example.com/logo.png"
                args[overlay][scale]:
                  type: string
                  description: Scale of the overlay.
                  example: "50%"
                args[overlay][position]:
                  type: string
                  description: Position of the overlay.
                  example: top-right
                args[drawtext][text]:
                  type: string
                  description: Text string to render on the video.
                  example: "Flutter"
                args[drawtext][fontsize]:
                  type: integer
                  description: Font size in pixels.
                  example: 16
                args[drawtext][fontcolor]:
                  type: string
                  description: Font color as hex string.
                  example: "#2599f8"
                args[drawtext][position]:
                  type: string
                  description: Position of the text on the video.
                  example: Top Left
                _METHOD:
                  type: string
                  description: To cast request method POST to PUT.
                  enum: [PUT]
                  example: PUT
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  message:
                    type: string
                    example: "Transcoding Settings, New Filter Created"
                  filterid:
                    type: integer
                    example: 429

  /{id}/transcoding/filters/{filterid}:
    parameters:
      - $ref: '#/components/parameters/serviceIdParam'
    post:
      tags:
        - Video Encoding Profiles
      summary: Edit Transcoding Profile Filter
      description: Edit an existing transcoding profile filter.
      operationId: editTranscodingProfileFilter
      parameters:
        - $ref: '#/components/parameters/filterIdParam'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name associated with the configuration or filter.
                  example: flutter
                args[text]:
                  type: string
                  description: The text to be displayed as part of the filter.
                  example: Flutter
                args[fontsize]:
                  type: integer
                  description: The size of the font for the displayed text.
                  example: 16
                args[fontcolor]:
                  type: string
                  description: The color of the font as a hex code.
                  example: "#2599f8"
                args[position]:
                  type: string
                  description: The position of the text on the screen.
                  example: Top Left
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Transcoding Settings Updated
    delete:
      tags:
        - Video Encoding Profiles
      summary: Delete Transcoding Profile Filter
      description: >
        Delete the information of a transcoding profile filter. To cast request
        method POST, include parameter _METHOD = DELETE.
      operationId: deleteTranscodingProfileFilter
      parameters:
        - $ref: '#/components/parameters/filterIdParam'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - _METHOD
              properties:
                _METHOD:
                  type: string
                  description: Signals DELETE to the backend.
                  enum: [DELETE]
                  example: DELETE
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Transcoding Filter Deleted

  # ---------------------------------------------------------------------------
  # Transcoding Notifications
  # ---------------------------------------------------------------------------
  /{id}/transcoding/notifications/defaults:
    parameters:
      - $ref: '#/components/parameters/serviceIdParam'
    post:
      tags:
        - Transcoding Notifications
      summary: Save Notification Emails and Webhook URLs
      description: >
        Updates email addresses and webhook URLs for encode-completion
        notifications. The emails field is a comma-separated list of email
        addresses; webhooks is a comma-separated list of HTTP/HTTPS URLs.
      operationId: updateNotifications
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                emails:
                  type: string
                  description: >
                    Comma-separated list of email addresses to receive
                    encode-completion notifications.
                  example: "admin@example.com,ops@example.com"
                webhooks:
                  type: string
                  description: >
                    Comma-separated list of HTTP/HTTPS URLs to POST
                    encode-completion payloads to.
                  example: "https://hooks.example.com/encode,https://api.example.com/notify"
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Transcoding Settings Updated

  /{id}/transcoding/notifications/resend:
    parameters:
      - $ref: '#/components/parameters/serviceIdParam'
    post:
      tags:
        - Transcoding Notifications
      summary: Resend Encode-Completion Webhook Notification
      description: >
        Looks up a completed encode job and re-POSTs the original completion
        payload to all configured webhook URLs. Exactly one of index, infile,
        or outfile must be provided along with zoneid.
      operationId: resendNotification
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - zoneid
                - index
              properties:
                zoneid:
                  type: integer
                  description: Zone ID.
                  example: 5394
                index:
                  type: integer
                  description: Job index.
                  example: 3
      responses:
        '200':
          description: Array of webhook call results.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    time:
                      type: integer
                      description: Unix timestamp of the call.
                      example: 1742810400
                    hook:
                      type: string
                      description: Webhook URL that was called.
                      example: "https://hooks.example.com/encode"
                    body:
                      type: array
                      description: JSON payload posted to the webhook.
                      items:
                        type: object
                    respCode:
                      type: integer
                      description: HTTP response status code from the webhook endpoint.
                      example: 200
                    respBody:
                      type: string
                      description: HTTP response body from the webhook endpoint.
                      example: "OK"
                    error:
                      type: string
                      description: Exception message if the HTTP call threw an exception.
        '400':
          description: Lookup or configuration error.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "No Match Found"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    serviceIdParam:
      name: id
      in: path
      required: true
      description: service id.
      schema:
        type: integer
        example: 42

    zoneIdParam:
      name: zoneId
      in: path
      description: ID of the Push Zone (`fs_pushzones.id`).
      required: true
      style: simple
      explode: false
      schema:
        type: integer
        example: 15

    jobIdParam:
      name: jobid
      in: path
      description: ID of the Video Encoding job (Beanstalkd job ID stored in `fs_encodejobs.jobid`).
      required: true
      style: simple
      explode: false
      schema:
        type: integer
        example: 10042

    profileIdParam:
      name: profileid
      in: path
      description: ID of the Transcode Profile (`fs_transcodeprofiles.id`).
      required: true
      style: simple
      explode: false
      schema:
        type: integer
        example: 7

    filterIdParam:
      name: filterid
      in: path
      description: ID of the Transcode Profile filter (`fs_transcodefilters.id`).
      required: true
      style: simple
      explode: false
      schema:
        type: integer
        example: 3

  schemas:
    createProfileCombined:
      type: object

    editProfileCombined:
      type: object

    createFileTranscodingFilter:
      type: object

    editFileTranscodingFilter:
      type: object
