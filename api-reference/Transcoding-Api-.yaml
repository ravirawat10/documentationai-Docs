        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Transcoding Settings Updated

  /{id}/transcoding/profiles/new:
    parameters:
      - $ref: '#/components/parameters/serviceIdParam'
    post:
      tags:
        - Video Encoding Profiles
      summary: Create Transcoding Profile
      description: Create a new transcoding profile.
      operationId: createTranscodingProfile
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - name
                - _METHOD
              properties:
                _METHOD:
                  type: string
                  description: To cast request method POST to PUT.
                  example: PUT
                name:
                  type: string
                  description: Enter profile name. Each name should have minimum 3 characters.
                  example: My Profile
                cv:
                  type: string
                  description: "Video codec: libx264 | libx265 | vp9 | etc."
                  example: libx264
                ca:
                  type: string
                  description: Audio codec.
                  example: aac
                f:
                  type: string
                  description: Output format.
                  example: mp4
                filemode:
                  type: string
                  description: File mode.
                  example: transcode
                fps:
                  type: string
                  description: Frames per second.
                  example: "30"
                gop:
                  type: string
                  description: Keyframe interval.
                  example: "60"
                preset:
                  type: string
                  description: "Encoder preset: ultrafast | fast | medium | slow."
                  example: medium
                vlevel:
                  type: string
                  description: Video level.
                  example: "4.0"
                vprofile:
                  type: string
                  description: "Video profile: baseline | main | high."
                  example: high
                vpass:
                  type: string
                  description: "Encoding pass: 1 | 2."
                  example: "1"
                bv:
                  type: string
                  description: Enable video bitrate. Y or N.
                  enum: ["Y", "N"]
                  example: "Y"
                bvvalue:
                  type: string
                  description: Video bitrate value.
                  example: 2000k
                ba:
                  type: string
                  description: Enable audio bitrate. Y or N.
                  enum: ["Y", "N"]
                  example: "Y"
                bavalue:
                  type: string
                  description: Audio bitrate value.
                  example: 128k
                sv:
                  type: string
                  description: Enable scale video. Y or N.
                  enum: ["Y", "N"]
                  example: "Y"
                svvalue:
                  type: string
                  description: Output resolution.
                  example: 1280x720
                crfv:
                  type: string
                  description: CRF value (constant rate factor).
                  example: "23"
                ara:
                  type: string
                  description: Audio rate args.
                  example: ""
                aca:
                  type: string
                  description: Audio codec args.
                  example: ""
                bframe:
                  type: integer
                  description: B-frames count.
                  example: 3
                tm:
                  type: string
                  description: Time mode.
                  example: ""
                tv:
                  type: string
                  description: Time value.
                  example: ""
                upscale:
                  type: string
                  description: Allow upscaling. Y or N.
                  enum: ["Y", "N"]
                  example: "N"
                outdir:
                  type: string
                  description: Output directory override.
                  example: ""
                filters:
                  type: array
                  description: Filter IDs to apply.
                  items:
                    type: string
                  example: ["1", "2"]
                profiles:
                  type: array
                  description: Sub-profiles.
                  items:
                    type: string
                  example: []
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  message:
                    type: string
                    example: "Transcoding Settings, New Profile Created"
                  profileid:
                    type: integer
                    example: 129017

