    post:
      tags:
        - Video Encoding Jobs
      summary: List Jobs / Get Job Details
      description: >
        Multi-purpose POST endpoint. Behaviour depends on body content:
        - No body + query string `r` / `r&i`: filter jobs by date range and optionally zone.
        - Body `view=job`: get single job details by jobid and index (form-encoded).
        - Body `view=new`: get new / polling jobs (form-encoded).
      operationId: postEncodingJobs
      parameters:
        - name: r
          in: query
          required: false
          description: >
            Date range filter. Format: YYYY-MM-DD - YYYY-MM-DD.
            Example: 2025-01-01 - 2025-01-31
          schema:
            type: string
            example: "2025-01-01 - 2025-01-31"
        - name: i
          in: query
          required: false
          description: Zone ID to filter by.
          schema:
            type: integer
            example: 15
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                view:
                  type: string
                  description: "Operation mode: `job` to fetch a single job, `new` to poll new jobs."
                  enum: [job, new]
                  example: job
                jobid:
                  type: integer
                  description: Job ID. Required when view=job.
                  example: 12345
                index:
                  type: integer
                  description: Job index. Required when view=job.
                  example: 0
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  zonesInRange:
                    type: array
                    items:
                      type: integer
                    example: [2102, 2332, 2442, 2591, 2614, 3606, 3759, 3812, 3849, 4000, 4114, 4171, 4218, 4292, 4305, 4329, 4340, 4393, 4438, 4451, 4475, 4485, 4497, 4499, 4524, 4552, 4566, 4580, 4583, 4891, 4898, 4899, 4970, 5013, 5015, 5022, 5063, 5088, 5098, 5100, 5107, 5111, 5127, 5129, 5170, 5236, 5258, 5279, 5296, 5325, 5341, 5535, 5552]
                  logsInRange:
                    type: array
                    items: {}
                    example: []
                  billed:
                    type: object
                    properties:
                      jobs:
                        type: integer
                        example: 0
                      secs:
                        type: integer
                        example: 0
                      mins:
                        type: string
                        example: 0 mins
                      sourceMins:
                        type: string
                        example: 0 mins
                      completed:
                        type: integer
                        example: 0
                      active:
                        type: integer
                        example: 0

