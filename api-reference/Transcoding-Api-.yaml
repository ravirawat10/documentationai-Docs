  /{id}/transcoding/profiles/defaults:
    parameters:
      - $ref: '#/components/parameters/serviceIdParam'
    post:
      tags:
        - Video Encoding Profiles
      summary: Create Global Auto Transcode Preset Profiles
      description: These presets will be automatically added to your new zones.
      operationId: createAutoTranscodeProfiles
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                defaultprofiles:
                  type: array
                  description: >
                    Array of profile IDs to set as default auto-apply presets.
                    Should be profile IDs from GET /transcoding/file/profiles.
                  items:
                    type: string
                  example: ["profileId1", "profileId2"]
