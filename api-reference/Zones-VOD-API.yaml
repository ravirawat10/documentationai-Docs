          description: Comma-separated domain names to block (Y) or allow (N).
          example: example.com,cdn.example.com
        ips:
          type: string
          description: Comma-separated IP addresses excluded from domain lock restrictions regardless of the policy.
          example: 203.0.113.10
        noreferer:
          type: string
          description: "Controls requests with no Referer header. Y = block requests that have no Referer header. N = allow requests with no Referer header."
          example: "N"
        type:
          type: string
          description: Zone type identifier, e.g. push or pull.
          example: push
        enabled:
          type: string
          description: Whether domain lock is enabled. Y means enabled, N means disabled.
          example: "N"
        active:
          type: string
          description: Whether domain lock is currently active. Y means active, N means inactive.
          example: "N"
    geoblockList:
      type: object
      properties:
        policy:
          type: string
          description: "Country filtering mode. Y = Blacklist mode (block requests from listed countries). N = Whitelist mode (allow only requests from listed countries, block all others)."
          example: "N"
        list:
          type: array
          items:
            type: string
          description: Array of ISO-3166 country codes to allow or block.
          example: ["US", "GB"]
        ips:
          type: string
          description: Comma-separated IP addresses excluded from geo-blocking restrictions.
          example: 203.0.113.10
        enabled:
          type: string
          description: Whether geo-blocking is enabled. Y means enabled, N means disabled.
          example: "N"
        active:
          type: string
          description: Whether geo-blocking is currently active. Y means active, N means inactive.
          example: "N"
    securetokenList:
      type: object
      properties:
        policy:
          type: string
          description: "Defines how the token is computed. Q = Query string mode (token applied per query string parameter). F = Full path mode (token covers the full URL path). D = Directory/path-embedded mode (token is embedded within the URL path)."
          example: "F"
        keyip:
          type: string
          description: "Whether client IP is bound to the token. Y = token is only valid from the originating client IP. N = IP binding is disabled."
          example: "N"
        list:
          type: string
          description: 16-character hexadecimal secret key used for token generation.
          example: ab12cd34ef56gh78
        timeout:
          type: integer
          format: int32
          description: Token expiry time in seconds. Minimum 5, maximum 25200.
          example: 3600
        session:
          type: string
          description: "Token expiry behavior. \"0\" = Fixed expiry (token expires at a set time). \"1\" = Rolling/Moving expiry (token timeout resets with each request for active sessions)."
          example: "0"
        ips:
          type: string
          description: Comma-separated IP addresses excluded from secure token validation.
          example: ""
        dirs:
          type: string
          description: Optional directory restriction path for secure token enforcement.
          example: ""
        enabled:
          type: string
          description: Whether secure token is enabled. Y means enabled, N means disabled.
          example: "N"
        active:
          type: string
          description: Whether secure token is currently active. Y means active, N means inactive.
          example: "N"
    eacList:
      type: object
      properties:
        policy:
          type: string
          description: Access policy. Y means allow authenticated requests, N means deny.
          example: "N"
        list:
          type: string
          description: Authentication URL for the external access control endpoint.
          example: http://example.com/auth.script
        ips:
          type: string
          description: Comma-separated IP addresses excluded from external access control.
          example: 203.0.113.10
        enabled:
          type: string
          description: Whether external access control is enabled. Y means enabled, N means disabled.
          example: "N"
        active:
          type: string
          description: Whether external access control is currently active. Y means active, N means inactive.
          example: "N"
