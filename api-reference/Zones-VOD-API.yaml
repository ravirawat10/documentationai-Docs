          example: []
          items:
            $ref: '#/components/schemas/status_code_line_chartList'
    status_code_tableList:
      properties:
        code:
          type: integer
          description: HTTP status code returned for the request, e.g. 200, 404, 500.
          format: int32
          example: 200
        bytes:
          type: integer
          description: Total bytes transferred for this entry.
          format: int32
          example: 1048576
        request:
          type: integer
          description: Number of requests recorded for this status code.
          format: int32
          example: 50000
    status_code_line_chartList:
      properties:
        code:
          type: integer
          description: HTTP status code returned for the request, e.g. 200, 404, 500.
          format: int32
          example: 200
        date:
          type: string
          description: Date of the analytics data point in YYYY-MM-DD format.
          format: date
          example: "2024-06-01"
        bytes:
          type: integer
          description: Total bytes transferred for this entry.
          format: int32
          example: 1048576
        request:
          type: integer
          description: Number of requests recorded for this entry.
          format: int32
          example: 50000
    top_fifty_referers_tableList:
      properties:
        site:
          type: string
          description: Referring site domain or URL.
          example: example.com
        bytes:
          type: integer
          description: Total bytes transferred for this entry.
          format: int32
          example: 1048576
        request:
          type: integer
          description: Number of requests recorded for this entry.
          format: int32
          example: 50000
    top_fifty_files_tableList:
      properties:
        method:
          type: string
          description: HTTP method used for the request, e.g. GET or POST.
          example: GET
        url:
          type: string
          description: URL path of the requested file.
          format: url
          example: /path/to/video.mp4
        bytes:
          type: integer
          description: Total bytes transferred for this entry.
          format: int32
          example: 1048576
        request:
          type: string
          description: Number of requests recorded for this file.
          example: "50000"
    cache_statistic_line_chartList:
      properties:
        time:
          type: string
          description: Timestamp of the analytics data point.
          format: date
          example: "2024-06-01T00:00:00Z"
        hit:
          type: integer
          description: Number of cache hit requests.
          format: int32
          example: 45000
        miss:
          type: integer
          description: Number of cache miss requests.
          format: int32
          example: 5000
        bypass:
          type: integer
          description: Number of requests that bypassed the cache.
          format: int32
          example: 100
        others:
          type: string
          description: Number of requests with other cache statuses.
          example: "0"
        total:
          type: integer
          description: Total number of requests including all cache statuses.
          format: int32
          example: 50000
    cache_statistic_tableList:
      properties:
        locationid:
          type: integer
          description: Numeric identifier of the CDN edge location.
          format: int32
          example: 206
        gb:
          type: integer
          description: Total gigabytes of data delivered from this location.
          format: int32
          example: 100
        request:
          type: integer
          description: Number of requests recorded for this entry.
          format: int32
          example: 50000
    deliveredList:
      properties:
        date:
          type: string
          description: Date of the analytics data point in YYYY-MM-DD format.
          format: date
          example: "2024-06-01"
        value:
          type: string
          description: Delivered bandwidth or data value for this period.
          example: "107374182400"
    seoList:
      type: object
      properties:
        id:
          type: integer
          description: Unique numeric identifier for the zone.
          format: int32
          example: 12345
        type:
          type: string
          description: Zone type identifier, e.g. push or pull.
          example: pull
        canonical:
          type: string
          description: Canonical URL setting for SEO optimization.
          example: "N"
        mode:
          type: string
          description: SEO mode setting for this zone.
          example: default
        robots:
          type: string
          description: Robots meta tag value, e.g. index or noindex.
          example: "N"
        robotstxt:
          type: string
          description: Robots.txt mode setting.
          example: "N"
        robotstxtcustom:
          type: string
          description: Custom robots.txt content when mode is set to custom.
          example: ""
    cacheList:
      type: object
      properties:
        smart:
          type: string
          description: Smart cache flag. 1 means enabled, 0 means disabled.
          example: "0"
        cache:
          type: string
          description: Edge cache TTL duration code, e.g. 4h or 1d.
          example: 4h
        expiry:
          type: string
          description: Browser cache TTL duration code, e.g. 1M. Empty string disables it.
          example: 1M
        querystring:
          type: string
          description: Whether query strings are included in cache keys. Y means included.
          example: "N"
        cachecontrol:
          type: string
          description: Whether Cache-Control headers from origin are respected.
          example: "Y"
        usestale:
          type: string
          description: Whether stale cached content is served when origin is unavailable.
          example: "Y"
        revalidate:
          type: string
          description: Whether conditional revalidation is performed before serving cached content.
          example: "Y"
        cacheInSecs:
          type: integer
          description: Edge cache TTL in seconds.
          format: int64
          example: 14400
        cacheInMins:
          type: integer
          description: Edge cache TTL in minutes.
          format: int32
          example: 240
        expiryInSecs:
          type: integer
          description: Browser cache TTL in seconds.
          format: int64
          example: 2592000
        expiryInMins:
          type: integer
          description: Browser cache TTL in minutes.
          format: int32
          example: 43200
    edgeList:
      type: object
      properties:
        compression:
          type: string
          description: Whether Gzip/Brotli compression is enabled. Y means enabled.
          example: "N"
        compressionlevel:
          type: integer
          description: Compression level from 1 (fastest) to 9 (best compression).
          example: 5
        disposition:
          type: string
          description: Whether Content-Disposition header is sent to force file download.
          example: "N"
        stripcookie:
          type: string
          description: Whether cookies are stripped from requests to the CDN edge.
          example: "N"
        xff:
          type: string
          description: Whether the X-Forwarded-For header is forwarded to the origin.
          example: "N"
        cors:
          type: string
          description: Whether CORS headers are added to responses. Y means enabled.
          example: "Y"
        webp:
          type: string
          description: Whether automatic WebP image conversion is enabled.
          example: "N"
        pseudostreaming:
          type: string
          description: Whether pseudo-streaming for progressive media files is enabled.
          example: "N"
        wp:
          type: string
          description: Whether WordPress optimizations are enabled.
          example: "N"
        lfo:
          type: string
          description: Whether large file optimization is enabled.
          example: "Y"
        prefresh:
          type: string
          description: Whether prefresh (background cache refresh) is enabled.
          example: "N"
    edgerules:
      type: object
      properties:
        enabled:
          type: string
          description: Whether edge rules are enabled for this zone. Y means enabled, N means disabled.
          example: "N"
    ftpdetailsList:
      type: object
      properties:
        username:
          type: string
          description: FTP username for authenticating to the push zone storage.
          example: user_67890_push_12345
        password:
          type: string
          description: FTP password for authenticating to the push zone storage.
          example: "••••••••"
    serverList:
      properties:
        code:
          type: string
          description: Numeric server location code.
          example: "206"
        name:
          type: string
          description: Human-readable name of the server location.
          example: Singapore
        country:
          type: string
          description: Geographic region or country of the server.
          example: SouthEast Asia
        meta:
          type: object
          description: Additional server metadata including upload endpoint details.
          example: {"uploadPort": "21", "uploadHost": "upload.example.com"}
          properties:
            uploadPort:
              type: string
              description: FTP port number for uploading files to this server.
              example: "21"
            uploadHost:
              type: string
              description: Hostname of the FTP upload server for this zone.
              example: upload.example.com
      type: object
    OriginAuth:
      type: object
      description: Origin server authentication settings (HTTP Pull zones only)
      properties:
        type:
          type: string
          enum: [none, awsSignatureV4]
          default: none
          description: Authentication type for private origin access
        s3_access_key_id:
          type: string
          minLength: 20
          maxLength: 20
          pattern: '^AKIA[A-Z0-9]{16}$'
          description: AWS Access Key ID (required when type=awsSignatureV4)
        s3_access_key_secret:
          type: string
          minLength: 40
          maxLength: 40
          description: AWS Secret Access Key (required when type=awsSignatureV4)
        s3_midgress_cache_size:
          type: integer
          minimum: 1
          description: Midgress cache size in GB (requires Advanced Features)
    IPAccessSettings:
      type: object
      description: IP address access control settings
      properties:
        enabled:
          type: string
          enum: [Y]
          description: Enable IP access control (omit to disable)
          example: "Y"
        policy:
          type: string
          enum: [Y, N]
          description: "Y = Block listed IPs, N = Allow only listed IPs"
          example: "N"
        list:
          type: string
          description: Comma-separated IP addresses or CIDR ranges to block or allow
          example: 203.0.113.10,10.0.0.0/8
        ips:
          type: string
          description: Comma-separated IPs excluded from IP access restrictions
          example: ""
        active:
          type: string
          description: Whether IP access control is currently active. Y means active, N means inactive.
          example: "N"
    UserAgentSettings:
      type: object
      description: User-Agent string access control settings
      properties:
        enabled:
          type: string
          enum: [Y]
          description: Enable user agent control (omit to disable)
          example: "Y"
        policy:
          type: string
          enum: [Y, N]
          description: "Y = Block listed user agents, N = Allow only listed user agents"
          example: "N"
        list:
          type: string
          description: |
            Semicolon-separated (;;;) user agent strings.
            Use *wildcard* pattern for partial matching. Example: *Chrome*
          example: "*Chrome*;;;*Firefox*"
        casesensitive:
          type: string
          enum: [Y]
          description: Enable case-sensitive matching
          example: "N"
        ips:
          type: string
          description: Comma-separated IPs excluded from user agent restrictions
          example: ""
        active:
          type: string
          description: Whether user agent control is currently active. Y means active, N means inactive.
          example: "N"
        listArr:
          type: array
          items:
            type: string
          description: Array form of the user agent list entries.
          example: ["*Chrome*", "*Firefox*"]
    cdnserviceList:
      type: object
      properties:
        purgeurls:
          type: array
          description: Array of relative API paths for purging zone cache.
          items:
            type: string
          example: ["/dashboard/67890/zones/http/push/12345/purge"]
        purgeurl:
          type: string
          description: JSON-encoded array of purge URL paths.
          example: "[\"\\/dashboard\\/67890\\/zones\\/http\\/push\\/12345\\/purge\"]"
        authtoken:
          type: string
          description: Base64-encoded authentication token for CDN service API calls.
          example: c2FtcGxlLWF1dGh0b2tlbi1oZXJl
        infourl:
          type: string
          description: Endpoint URL to retrieve zone service metadata.
          example: https://cdn-service.example.com/service.php/info/5/push/12345
        listurl:
          type: string
          description: Endpoint URL to list files in the zone.
          example: https://cdn-service.example.com/service.php/list/5/push/12345
        rawlisturl:
          type: string
          description: Endpoint URL to retrieve raw file listing.
          example: https://cdn-service.example.com/service.php/raw/list/5/push/12345
        transcodelisturl:
          type: string
          description: Endpoint URL to list transcoded files.
          example: https://cdn-service.example.com/service.php/transcode/list/5/push/12345
        addurl:
          type: string
          description: Endpoint URL to add files to the zone.
          example: https://cdn-service.example.com/service.php/add/5/push/12345
        editurl:
          type: string
          description: Endpoint URL to edit file metadata.
          example: https://cdn-service.example.com/service.php/edit/5/push/12345
        deleteurl:
          type: string
          description: Endpoint URL to delete files from the zone.
          example: https://cdn-service.example.com/service.php/delete/5/push/12345
        uploadurl:
          type: string
          description: Endpoint URL for direct file uploads.
          example: https://cdn-service.example.com/upload.php
        playlisturl:
          type: string
          description: Endpoint URL to retrieve video playlists.
          example: https://cdn-service.example.com/service.php/playlist
    s3detailsList:
      type: object
      properties:
        relid:
          type: integer
          description: Numeric zone ID this S3 credential set belongs to.
          format: int32
          example: 12345
        type:
          type: string
          description: Zone type identifier, e.g. push or pull.
          example: push
        projectid:
          type: string
          description: Primary S3 project identifier.
          example: abc123def456789012345678abcdef12
        token:
          type: string
          description: Primary S3 authentication token.
          example: sample-access-token
        projectid2:
          type: string
          description: Secondary S3 project identifier for backup storage.
          example: def456abc789012345678901abcdef34
        token2:
          type: string
          description: Secondary S3 authentication token for backup storage.
          example: sample-access-token
        active:
          type: string
          description: Whether S3 integration is active. 1 means active, 0 means inactive.
          example: "1"
        updated_at:
          type: string
          description: Timestamp of the most recent zone update (UTC).
          example: "2024-06-01T08:00:00Z"
        last_modified:
          type: string
          description: Timestamp of the last file modification in the S3 bucket.
          example: ""