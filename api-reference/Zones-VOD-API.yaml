openapi: 3.0.0
info:
  title: 5centsCDN - VOD Zones Global Settings
  description: API for managing Zones in 5centsCDN (https://www.5centscdn.net)
  version: 2.0.0
  contact:
    email: help@5centscdn.com
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
servers:
- url: https://api.5centscdn.com/v2
  description: 5centsCDN API Server - Production
security:
- ApiKeyAuth: []
tags:
- name: VOD Global Settings
  description: Global zone security settings

paths:
  /zones/vod/settings/security/domainlock:
    post:
      tags:
      - VOD Global Settings
      summary: update zone vod domain setting
      description: update zone vod domain setting
      operationId: settingsZoneVodDomain
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: string
                  enum: [Y, N]
                  example: Y
                  description: Enable or disable this feature. Y means enabled, N means disabled.
                policy:
                  type: string
                  enum: [Y, N]
                  description: "Y = blacklist — blocks the listed domains from accessing content. N = whitelist — allows only the listed domains to access content."
                  example: Y
                list:
                  type: string
                  description: Comma-separated domain names.
                  example: example.com,cdn.example.com
                ips:
                  type: string
                  description: Comma-separated IPs whitelisted regardless of domain lock.
                  example: 1.2.3.4,5.6.7.8
                noreferer:
                  type: string
                  enum: [Y, N]
                  description: "Y=block requests with empty referer header; N=allow them"
                  example: Y
                mode:
                  type: string
                  enum: [save, append, overwrite]
                  description: "Controls how the settings are applied to zones. save — only saves the settings, no changes will be made to existing zone settings. append — appends the values to existing zones data and updates. overwrite — overwrites the existing zones values, replacing them and updates."
                  example: save
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                    example: success
                  message:
                    type: string
                    description: "Human-readable status or result message"
                    example: Zone Settings Updated
  /zones/vod/settings/security/geoblock:
    post:
      tags:
      - VOD Global Settings
      summary: update zone vod geoblock setting
      description: update zone vod domain setting
      operationId: settingsZoneVodGeoblock
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: string
                  enum: [Y, N]
                  example: Y
                  description: Enable or disable this feature. Y means enabled, N means disabled.
                policy:
                  type: string
                  enum: [Y, N]
                  description: "N = Allow listed countries, Y = Block listed countries"
                  example: Y
                list:
                  type: array
                  items:
                    type: string
                  description: Array of ISO-3166 country codes.
                  example: [US, GB, IN]
                ips:
                  type: string
                  description: Comma-separated IPs excluded from geo check.
                  example: 1.2.3.4
                mode:
                  type: string
                  enum: [save, append, overwrite]
                  description: "Controls how the settings are applied to zones. save — only saves the settings, no changes will be made to existing zone settings. append — appends the values to existing zones data and updates. overwrite — overwrites the existing zones values, replacing them and updates."
                  example: save
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                    example: success
                  message:
                    type: string
                    description: "Human-readable status or result message"
                    example: Zone Settings Updated
  /zones/vod/settings/security/securetoken:
    post:
      tags:
      - VOD Global Settings
      summary: update zone vod securetoken setting
      description: update zone vod securetoken setting
      operationId: settingsZoneVodSecuretoken
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: string
                  enum: [Y, N]
                  example: Y
                  description: Enable or disable secure token globally for VOD zones. Y means enabled, N means disabled.
                policy:
                  type: string
                  enum: [Q, F, D]
                  example: Q
                  description: "Defines how the token is computed. Q = Query string mode (token applied per query string parameter). F = Full path mode (token covers the full URL path). D = Directory/path-embedded mode (token is embedded within the URL path)."
                keyip:
                  type: string
                  enum: [Y, N]
                  description: "Bind token validation to the originating client IP address. Y = token is only valid from the IP that generated it, preventing sharing or theft. N = IP binding is disabled."
                  example: N
                list:
                  type: string
                  pattern: '^[a-fA-F0-9]{16}$'
                  description: 16-character hexadecimal secret key used for token generation.
                  example: ab12cd34ef56gh78
                timeout:
                  type: number
                  minimum: 5
                  maximum: 25200
                  description: Token expiry time in seconds. Minimum 5, maximum 25200.
                  example: 3600
                session:
                  type: string
                  enum: ["0", "1"]
                  description: "Defines the token expiry behavior. \"0\" = Fixed expiry (token expires at a set time). \"1\" = Rolling/Moving expiry (token timeout resets with each request for active sessions)."
                  example: "0"
                ips:
                  type: string
                  description: Comma-separated IPs excluded from token check.
                  example: 1.2.3.4
                mode:
                  type: string
                  enum: [save, append, overwrite]
                  description: "Controls how the settings are applied to zones. save — only saves the settings, no changes will be made to existing zone settings. append — appends the values to existing zones data and updates. overwrite — overwrites the existing zones values, replacing them and updates."
                  example: save
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                    example: success
                  message:
                    type: string
                    description: "Human-readable status or result message"
                    example: Zone Settings Updated
  /zones/vod/settings/security/ipaccess:
    post:
      tags:
      - VOD Global Settings
      summary: update zone vod ipaccess setting
      description: update zone vod ipaccess setting
      operationId: settingsZoneVodIpaccess
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: string
                  enum: [Y, N]
                  example: Y
                  description: Enable or disable this feature. Y means enabled, N means disabled.
                policy:
                  type: string
                  enum: [Y, N]
                  description: "Y = Block listed IP addresses, N = Allow only listed IP addresses"
                  example: Y
                list:
                  type: string
                  description: Comma-separated IP addresses or CIDR ranges.
                  example: 1.2.3.4,10.0.0.0/8
                ips:
                  type: string
                  description: Comma-separated IPs excluded from access control.
                  example: 1.1.1.1,192.168.1.10/30
                mode:
                  type: string
                  enum: [save, append, overwrite]
                  description: "Controls how the settings are applied to zones. save — only saves the settings, no changes will be made to existing zone settings. append — appends the values to existing zones data and updates. overwrite — overwrites the existing zones values, replacing them and updates."
                  example: save
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                    example: success
                  message:
                    type: string
                    description: "Human-readable status or result message"
                    example: Zone Settings Updated
  /zones/vod/settings/security/useragent:
    post:
      tags:
      - VOD Global Settings
      summary: update zone vod useragent setting
      description: update zone vod useragent setting
      operationId: settingsZoneVodUseragent
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: string
                  enum: [Y, N]
                  example: Y
                  description: Enable or disable this feature. Y means enabled, N means disabled.
                policy:
                  type: string
                  enum: [Y, N]
                  description: "Y = Block listed user agents, N = Allow listed user agents"
                  example: Y
                list:
                  type: string
                  description: Comma-separated user agent strings.
                  example: Mozilla,Googlebot
                ips:
                  type: string
                  description: Comma-separated IPs excluded from user agent check.
                  example: 1.2.3.4
                casesensitive:
                  type: string
                  enum: [Y, N]
                  example: N
                  description: Whether matching is case-sensitive. Y means enabled, N means disabled.
                listArr:
                  type: array
                  items:
                    type: string
                  description: Optional mirror of list as array.
                  example: [Mozilla, Googlebot]
                mode:
                  type: string
                  enum: [save, append, overwrite]
                  description: "Controls how the settings are applied to zones. save — only saves the settings, no changes will be made to existing zone settings. append — appends the values to existing zones data and updates. overwrite — overwrites the existing zones values, replacing them and updates."
                  example: save
      deprecated: false
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                    example: success
                  message:
                    type: string
                    description: "Human-readable status or result message"
                    example: Zone Settings Updated
components:
  parameters:
    zoneIdParam:
      name: zoneid
      in: path
      description: Zone ID
      required: true
      schema:
        type: integer
        example: 42
    modeParam:
      in: query
      name: m
      description: Enter reported by
      required: true
      schema:
        type: string
    typeParam:
      in: query
      name: t
      description: Enter daily or hourly
      required: true
      schema:
        type: string
    rParam:
      in: query
      name: r
      description: Enter value last_24hrs/hourly or last_7days/hourly or last_30days/daily
      required: true
      schema:
        type: string
    rangeParam:
      in: query
      name: r
      description: Enter date range
      explode: false
      schema:
        type: string
    queryParam:
      in: query
      name: query
      description: search by filename
      schema:
        type: string
    markerParam:
      in: query
      name: marker
      description: Set the marker parameter to the name of the last item returned in the previous list.
      schema:
        type: string
    endmarkerParam:
      in: query
      name: end_marker
      description: Limits the result set to names that are less than the end_marker parameter value.
      schema:
        type: string
    dirParam:
      in: query
      name: dir
      description: Enter directory name
      schema:
        type: string
    fileParam:
      in: query
      name: file
      description: Enter file name
      schema:
        type: string
    mediaParam:
      in: query
      name: media
      description: show detailed media info if 1
      schema:
        type: string
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    createZonePush:
      required:
      - _METHOD
      - server
      type: object
      properties:
        _METHOD:
          type: string
          description: To cast request method PUT
          example: PUT
        alias:
          type: string
          description: Optional label for the zone
          example: test-zone-001
        server:
          type: integer
          format: int32
          description: server.code, Should be one of the server code from the GET /zones/http/push/servers call
          example: 206
        profiles:
          type: array
          items:
            type: string
          description: Transcoding profile IDs. Leave empty to disable auto file transcoding.
          example: ["1"]
        ssl:
          type: object
          properties:
            http2:
              type: string
              description: "Whether HTTP/2 is enabled (Y/N)"
              example: Y
            redirect:
              type: string
              description: "Whether HTTP to HTTPS redirect is enabled (Y/N)"
              example: N
            mode:
              type: string
              description: 'N = None, S = Shared, L = Let''s Encrypt, C = Custom'
              example: L
        cache:
          type: object
          description: Edge cache TTL duration code, e.g. 4h or 1d.
          properties:
            cache:
              type: string
              description: Edge cache TTL. Values can be 1d, 7d, 14d, 1M, 3M, 6M, or 1y
              example: 1m
            expiry:
              type: string
              description: Browser cache TTL
              example: ""
        webhook:
          type: string
          description: URL to notify after files are transcoded
          example: https://requestbin.com/r/test/123
        cnames:
          type: string
          description: 'Comma-separated custom domains. Eg: cdn.domain.com'
          example: ""
        domainlock:
          type: object
          properties:
            enabled:
              type: string
              description: "Whether this feature is currently enabled (Y/N)"
              example: N
            policy:
              type: string
              description: "Access policy setting for this security feature"
              example: N
            list:
              type: string
              description: "Comma-separated list of entries for this security rule"
              example: ""
            ips:
              type: string
              description: "Comma-separated IP addresses or CIDR ranges"
              example: ""
            noreferer:
              type: string
              description: "Whether requests with no referrer header are blocked (Y/N)"
              example: N
            active:
              type: string
              description: "Whether this security rule is currently active (Y/N)"
              example: N
        geoblock:
          type: object
          properties:
            enabled:
              type: string
              description: "Whether this feature is currently enabled (Y/N)"
              example: Y
            policy:
              type: string
              description: "Access policy setting for this security feature"
              example: N
            list:
              type: array
              items:
                type: string
              description: "Comma-separated list of entries for this security rule"
              example: []
            ips:
              type: string
              description: "Comma-separated IP addresses or CIDR ranges"
              example: ""
            active:
              type: string
              description: "Whether this security rule is currently active (Y/N)"
              example: N
        bwlimit:
          type: object
          properties:
            enabled:
              type: string
              description: "Whether this feature is currently enabled (Y/N)"
              example: Y
            policy:
              type: string
              description: "Access policy setting for this security feature"
              example: "1"
            rate:
              type: integer
              format: int32
              description: "Bandwidth rate limit value"
              example: 30
            rateafter:
              type: integer
              format: int32
              description: "Bytes transferred before rate limiting begins"
              example: 0
            active:
              type: string
              description: "Whether this security rule is currently active (Y/N)"
              example: Y
        ipaccess:
          type: object
          properties:
            enabled:
              type: string
              description: "Whether this feature is currently enabled (Y/N)"
              example: N
            policy:
              type: string
              description: "Access policy setting for this security feature"
              example: N
            list:
              type: string
              description: "Comma-separated list of entries for this security rule"
              example: ""
            ips:
              type: string
              description: "Comma-separated IP addresses or CIDR ranges"
              example: ""
            active:
              type: string
              description: "Whether this security rule is currently active (Y/N)"
              example: N
        securetoken:
          type: object
          properties:
            enabled:
              type: string
              description: "Whether this feature is currently enabled (Y/N)"
              example: N
            policy:
              type: string
              description: "Access policy setting for this security feature"
              example: F
            list:
              type: string
              description: "Comma-separated list of entries for this security rule"
              example: ""
            ips:
              type: string
              description: "Comma-separated IP addresses or CIDR ranges"
              example: ""
            keyip:
              type: string
              description: "Whether IP is included in the secure token key (Y/N)"
              example: N
            session:
              type: string
              description: "Whether session-based tokens are used (Y/N)"
              example: "0"
            timeout:
              type: integer
              format: int32
              description: "Token expiry timeout in seconds"
              example: 5
            active:
              type: string
              description: "Whether this security rule is currently active (Y/N)"
              example: N
        useragent:
          type: object
          properties:
            enabled:
              type: string
              description: "Whether this feature is currently enabled (Y/N)"
              example: N
            policy:
              type: string
              description: "Access policy setting for this security feature"
              example: N
            list:
              type: string
              description: "Comma-separated list of entries for this security rule"
              example: ""
            ips:
              type: string
              description: "Comma-separated IP addresses or CIDR ranges"
              example: ""
            casesensitive:
              type: string
              description: "Whether matching is case-sensitive (Y/N)"
              example: N
            active:
              type: string
              description: "Whether this security rule is currently active (Y/N)"
              example: N
            listArr:
              type: array
              items:
                type: string
              description: "Array of entries for this security rule"
              example: [""]
    zoneshttppushnew_geoblock:
      type: object
      properties:
        enabled:
          type: string
          description: Enable or disable geo-blocking. Y means enabled, N means disabled.
          example: Y
        policy:
          type: string
          description: "Country filtering mode. Y = Blacklist mode (block requests from listed countries). N = Whitelist mode (allow only requests from listed countries, block all others)."
          example: Y
        list:
          type: array
          items:
            type: string
            description: ISO-3166 country code. e.g. AF, DZ, AW, CA
            example: AF
        ips:
          type: string
          description: 'Comma-separated IP addresses excluded from geo-blocking restrictions. e.g. 192.168.0.1, 192.168.0.2'
          example: 192.168.0.1
    zoneshttpsetting_geoblock:
      type: object
      properties:
        enabled:
          type: string
          description: Enable or disable geo-blocking. Y means enabled, N means disabled.
          example: Y
        policy:
          type: string
          description: "Country filtering mode. Y = Blacklist mode (block requests from listed countries). N = Whitelist mode (allow only requests from listed countries, block all others)."
          example: N
        list:
          type: array
          items:
            type: string
            description: Geoblock countries list values can be AF,DZ,AW,CA etc
            example: AF
        ips:
          type: string
          description: 'List of IPs to whitelist when geoblock is enabled. IPs should be separated by comma. Eg: 192.168.0.1, 192.168.0.2'
          example: 192.168.0.1
        mode:
          type: string
          description: The values can be save,append,overwrite
          example: save
    zoneshttpsetting_domainlock:
      type: object
      properties:
        enabled:
          type: string
          enum: [Y]
          description: Enable domain lock (omit to disable).
        policy:
          type: string
          enum: [Y, N]
          description: "Referrer filtering mode. Y = Blacklist mode (block requests with listed referring domains). N = Whitelist mode (allow only requests from listed referring domains, block all others)."
          example: Y
        list:
          type: string
          description: 'Comma-separated domain names to block (Y) or allow (N). e.g. www.domain-one.com, www.domain-two.com'
          example: www.domain-one.com,www.domain-two.com
        type:
          type: string
          description: The values can be whitelist or blacklist.
          example: whitelist
        noreferer:
          type: string
          enum: [Y]
          description: "Controls requests with no Referer header. Y = block requests that have no Referer header."
        ips:
          type: string
          description: 'Comma-separated IP addresses excluded from domain lock restrictions.'
          example: 117.251.60.184
        mode:
          type: string
          description: The values can be save,append,overwrite
          example: save
    zoneshttppushnew_domainlock:
      type: object
      properties:
        enabled:
          type: string
          enum: [Y]
          description: Enable domain lock (omit to disable).
        policy:
          type: string
          enum: [Y, N]
          description: "Referrer filtering mode. Y = Blacklist mode (block requests with listed referring domains). N = Whitelist mode (allow only requests from listed referring domains, block all others)."
          example: Y
        list:
          type: string
          description: 'Comma-separated domain names to block (Y) or allow (N). e.g. www.domain-one.com, www.domain-two.com'
          example: www.domain-one.com
        type:
          type: string
          description: The values can be whitelist or blacklist.
          example: whitelist
        noreferer:
          type: string
          enum: [Y, N]
          description: "Controls requests with no Referer header. Y = block requests that have no Referer header. N = allow requests with no Referer header."
          example: N
        ips:
          type: string
          description: 'Comma-separated IP addresses excluded from domain lock restrictions.'
          example: 117.251.60.184
    zoneshttppushnew_securetoken:
      type: object
      properties:
        policy:
          type: string
          enum: [Q, F, D]
          description: "Defines how the token is computed. Q = Query string mode (token applied per query string parameter). F = Full path mode (token covers the full URL path). D = Directory/path-embedded mode (token is embedded within the URL path)."
          example: Q
        list:
          type: string
          description: 16-character hexadecimal secret key used for token generation.
          example: e49c6d01156bd7c8
        timeout:
          type: string
          description: "Token expiry time in seconds. Minimum 5, maximum 25200."
          example: 300
        keyip:
          type: string
          enum: [Y, N]
          description: "Bind token validation to the originating client IP address. Y = token is only valid from the IP that generated it, preventing sharing or theft. N = IP binding is disabled."
          example: N
    zoneshttpsetting_securetoken:
      type: object
      properties:
        policy:
          type: string
          description: Values Can be Y or N. Set to Y if secure token should be enabled Set to Y if Secure token should be disabled.
          example: Y
        list:
          type: string
          description: The value should be random alpha numeric string, [A-Za-z0-9]
          example: 9466f10285af0011
        timeout:
          type: string
          description: "Secure token link expiration time in seconds \tmin: 5, max: 25200"
          example: 30
        ips:
          type: string
          description: 'List of IPs to whitelist when geoblock is enabled. IPs should be separated by comma. Eg: 192.168.0.1, 192.168.0.2'
          example: 192.168.0.1
        mode:
          type: string
          description: The values can be save,append,overwrite
          example: save
    PostReportTraffic:
      type: object
      properties:
        r:
          type: string
          description: Date range
          example: 2020-08-22 15:23:00 - 2020-08-28 15:23:00
        t:
          type: string
          description: The value should be hourly/daily
          example: daily
        m:
          type: string
          description: The value should be hits/bytes
          example: bytes
    zonessetting_bwlimit:
      type: object
      properties:
        policy:
          type: string
          enum: ["0", "1"]
          description: "Rate limiting mode. \"0\" = Static mode (fixed rate applied from the start of the transfer). \"1\" = Dynamic mode (rate limiting activates only after rateafter bytes have been served)."
          example: "0"
        rate:
          type: integer
          format: int32
          description: The value should be numeric
          example: 0
        rateafter:
          type: integer
          format: int32
          description: The value should be numeric
          example: 0
        mode:
          type: string
          description: The values can be save,append,overwrite
          example: save
    PostSecureToken:
      type: object
      properties:
        policy:
          type: string
          description: Values can be Y or N. Set to Y if secure token should be enabled. Set to N if secure token should be disabled.
          example: Y
        list:
          type: string
          description: List can be a random alpha numeric string, [A-Za-z0-9]
          example: 1ae6ffaa8f17b79c
        keyip:
          type: string
          description: "Whether IP is included in the secure token key (Y/N)"
          example: N
        ips:
          type: string
          description: 'List of IPs to whitelist when secure token is enabled. IPs should be separated by comma. Eg: 192.168.0.1, 192.168.0.2'
          example: 192.168.0.1
        timeout:
          type: integer
          description: "Secure token link expiration time in seconds \tmin: 5, max: 25200"
          format: int32
          example: 300
    postZoneSeo:
      type: object
      properties:
        canonical:
          type: string
          description: Values Can be Y or N. Set to Y if canonical header should be enabled Set to N if canonical header should be disabled.
          example: N
        robots:
          type: string
          description: Values Can be Y or N. Set to Y if robots should be enabled Set to N if robots should be disabled.
          example: N
        robotstxt:
          type: string
          description: Values Can be Y or N. Set to Y if robots.txt should be enabled Set to N if robots.txt should be disabled.
          example: N
        robotstxtcustom:
          type: string
          description: Custom robots.txt content when mode is set to custom.
    postZoneOriginip:
      type: object
      properties:
        dnscheck:
          type: string
          description: Values Can be Y or N. Set to Y if origin IP resolution should be enabled Set to N if origin IP resolution should be disabled.
          example: Y
        ip:
          type: string
          description: 'When origin IP resolution is enabled. Eg: 192.168.0.1, 192.168.0.2'
          example: 192.168.0.1
        customhostheader:
          type: string
          description: 'Eg: www.domain-one.com, www.domain-two.com'
          example: origin2.mydomain.com
    postZoneBwlimit:
      type: object
