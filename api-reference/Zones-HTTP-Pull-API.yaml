          example: 30
        profiles:
          type: array
          description: Array of transcoding profile IDs to apply automatically.
          items:
            type: integer
            format: int32
            description: 'All file uploaded to /raw folder will be transcoded to selected profiles. Leave empty to disable auto file transcoding. Eg: 7549'
            example: 7549
