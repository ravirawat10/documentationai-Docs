    cacheList:
      type: object
      properties:
        smart:
          type: string
          description: Smart cache flag. 1 means enabled, 0 means disabled.
          example: "0"
        cache:
          type: string
          description: Edge cache TTL duration code, e.g. 4h or 1d.
          example: 4h
        expiry:
          type: string
          description: Browser cache TTL duration code, e.g. 1M. Empty string disables it.
          example: 1M
        querystring:
          type: string
          description: Whether query strings are included in cache keys. Y means included.
          example: "N"
        cachecontrol:
          type: string
          description: Whether Cache-Control headers from origin are respected.
          example: "Y"
        usestale:
          type: string
          description: Whether stale cached content is served when origin is unavailable.
          example: "Y"
        revalidate:
          type: string
          description: Whether conditional revalidation is performed before serving cached content.
          example: "Y"
        cacheInSecs:
          type: integer
          description: Edge cache TTL in seconds.
          format: int64
          example: 14400
        cacheInMins:
          type: integer
          description: Edge cache TTL in minutes.
          format: int32
          example: 240
        expiryInSecs:
          type: integer
          description: Browser cache TTL in seconds.
          format: int64
          example: 2592000
        expiryInMins:
          type: integer
          description: Browser cache TTL in minutes.
          format: int32
          example: 43200
    edgeList:
      type: object
      properties:
        compression:
          type: string
          description: Whether Gzip/Brotli compression is enabled. Y means enabled.
          example: "N"
        compressionlevel:
          type: integer
          description: Compression level from 1 (fastest) to 9 (best compression).
          example: 5
        disposition:
          type: string
          description: Whether Content-Disposition header is sent to force file download.
          example: "N"
        stripcookie:
          type: string
          description: Whether cookies are stripped from requests to the CDN edge.
          example: "N"
        xff:
          type: string
          description: Whether the X-Forwarded-For header is forwarded to the origin.
          example: "N"
        cors:
          type: string
          description: Whether CORS headers are added to responses. Y means enabled.
          example: "Y"
        webp:
          type: string
          description: Whether automatic WebP image conversion is enabled.
          example: "N"
        pseudostreaming:
          type: string
          description: Whether pseudo-streaming for progressive media files is enabled.
          example: "N"
        wp:
          type: string
          description: Whether WordPress optimizations are enabled.
          example: "N"
        lfo:
          type: string
          description: Whether large file optimization is enabled.
          example: "Y"
