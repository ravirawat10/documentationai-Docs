components:
  parameters:
    zoneIdParam:
      name: zoneid
      in: path
      description: Zone ID
      required: true
      schema:
        type: integer
        example: 42
    modeParam:
      in: query
      name: m
      description: Enter reported by
      required: true
      schema:
        type: string
    typeParam:
      in: query
      name: t
      description: Enter daily or hourly
      required: true
      schema:
        type: string
    rParam:
      in: query
      name: r
      description: Enter value last_24hrs/hourly or last_7days/hourly or last_30days/daily
      required: true
      schema:
        type: string
    rangeParam:
      in: query
      name: r
      description: Enter date range
      explode: false
      schema:
        type: string
    queryParam:
      in: query
      name: query
      description: search by filename
      schema:
        type: string
    markerParam:
      in: query
      name: marker
      description: Set the marker parameter to the name of the last item returned in the previous list.
      schema:
        type: string
    endmarkerParam:
      in: query
      name: end_marker
      description: Limits the result set to names that are less than the end_marker parameter value.
      schema:
        type: string
    dirParam:
      in: query
      name: dir
      description: Enter directory name
      schema:
        type: string
    fileParam:
      in: query
      name: file
      description: Enter file name
      schema:
        type: string
    mediaParam:
