    zonesvodpushnew_geoblock:
      type: object
      properties:
        enabled:
          type: string
          description: Enable or disable geo-blocking. Y means enabled, N means disabled.
          example: Y
        policy:
          type: string
          description: "Country filtering mode. Y = Blacklist mode (block requests from listed countries). N = Whitelist mode (allow only requests from listed countries, block all others)."
          example: Y
        list:
          type: array
          items:
            type: string
            description: Geoblock countries list values can be AF,DZ,AW,CA etc
            example: AF
        ips:
          type: string
          description: 'List of IPs to whitelist when geoblock is enabled. IPs should be separated by comma. Eg: 192.168.0.1, 192.168.0.2'
          example: 192.168.0.1
    zoneshttppullnew_securetoken:
      type: object
      properties:
        policy:
          type: string
          enum: [Q, F, D]
          description: "Defines how the token is computed. Q = Query string mode (token applied per query string parameter). F = Full path mode (token covers the full URL path). D = Directory/path-embedded mode (token is embedded within the URL path)."
          example: Q
        list:
          type: string
          description: 16-character hexadecimal secret key used for token generation.
          example: 5f1283ceb939b05c
        timeout:
          type: integer
          description: "Token expiry time in seconds. Minimum 5, maximum 25200."
          format: int32
          example: 300
        keyip:
          type: string
          enum: [Y, N]
          description: "Bind token validation to the originating client IP address. Y = token is only valid from the IP that generated it, preventing sharing or theft. N = IP binding is disabled."
          example: N
        ips:
          type: string
          description: 'Comma-separated IP addresses excluded from secure token validation.'
          example: 117.251.60.184
    postPushZoneSecuretoken:
      type: object
      properties:
        policy:
          type: string
          description: Values Can be Y or N. Set to Y if secure token should be enabled Set to Y if Secure token should be disabled.
          example: Y
        list:
          type: string
          description: Token, The value should be random alpha numeric string, [A-Za-z0-9].
          example: c7d5cfb3212931fa
        timeout:
          type: integer
          description: "Secure token link expiration time in seconds \tmin: 5, max: 25200"
          format: int32
          example: 300
        keyip:
          type: string
          description: Values Can be Y or N. Set to Y if Add Client IP in token generation for added security should be enabled Set to N if Add Client IP in token generation for added security should be disabled.
          example: N
        ips:
          type: string
          description: 'IPs should be separated by comma. Eg: 192.168.0.1, 192.168.0.2'
          example: 117.251.60.184
    postPushZoneImport:
      type: object
      properties:
        id:
          type: integer
          description: Enter numeric value.
          format: int32
        url:
          type: string
          description: Enter url of file
          example: https://cdn.example.com/test.mp4
        filename:
          type: string
          description: Filename must have an extension.
          example: test.mp4
        folder:
          type: string
          description: Enter file upload foler path
          example: mp4
    PostCache:
      type: object
      properties:
        cache:
          type: string
          description: This will be the default cache name. The values can be 1d,7d,14d, 1M, 3M, 6M, or 1y
          example: 7d
        expiry:
          type: string
          description: (Pull HTTP zones) Browser caching TTL
          example: 1M
        querystring:
          type: string
          enum: [Y]
          description: Cache query string as separate cacheable item.
        cachecontrol:
          type: string
          enum: [Y]
          description: Ignore Cache-Control header from origin server.
        usestale:
          type: string
          enum: [Y]
          description: Serve expired content while fetching fresh content or when origin is down
        revalidate:
          type: string
          enum: [Y]
          description: Revalidate expired cache items using conditional requests
    postPurge:
      type: object
      properties:
        _METHOD:
          type: string
          description: To cast request method to DELETE
          example: DELETE
