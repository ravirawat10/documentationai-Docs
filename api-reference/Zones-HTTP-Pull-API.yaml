                            s3_access_key_id:
                              type: string
                              description: AWS Access Key ID for S3 origin authentication (20 characters, starts with AKIA)
                              example: AKIA************MNBG
                            s3_access_key_secret:
                              type: string
                              description: AWS Secret Access Key for S3 origin authentication (40 characters)
                              example: hhaj********************************kkkk
                        domainlock:
