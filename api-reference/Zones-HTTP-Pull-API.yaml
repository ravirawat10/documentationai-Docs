openapi: 3.0.0
info:
  title: 5centsCDN - HTTP Pull Zones
  description: API for managing Zones in 5centsCDN (https://www.5centscdn.net)
  version: 2.0.0
  contact:
    email: help@5centscdn.com
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
servers:
- url: https://api.5centscdn.com/v2
  description: 5centsCDN API Server - Production
security:
- ApiKeyAuth: []
tags:
- name: Zone Management
  description: Create, list, update, delete, and configure zones
- name: Security
  description: SSL, secure token, geo block, domain lock, bandwidth limit, and access control
- name: Cache
  description: Edge settings, shield, cache configuration, and CDN optimization
- name: Restore & Purge
  description: Content purge and zone restore operations
paths:
  /zones/http/pull:
    get:
      tags:
      - Zone Management
      summary: Zone
      description: Zone HTTP Pull list
      operationId: zonePullList
      deprecated: false
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          description: The page number of the result. One page contains 20 results.
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                    example: success
                  zones:
                    type: array
                    description: Array of zone objects returned in this page of results.
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: "Zone type identifier (push or pull)"
                          example: pull
                        id:
                          type: integer
                          description: "Unique numeric identifier of the zone"
                          example: 12345
                        serviceid:
                          type: integer
                          description: "Service account identifier associated with this zone"
                          example: 67890
                        alias:
                          type: string
                          description: "Primary CDN hostname assigned to the zone"
                          example: tests
                        hashid:
                          type: string
                          description: "Unique hash identifier of the zone"
                          example: n4zpvl968j5o
                        mode:
                          type: string
                          description: "Delivery mode of the zone (e.g. http, https)"
                          example: http
                        optimize:
                          type: string
                          description: Whether image/content optimization is enabled (Y/N)
                          example: live
                        optimizer:
                          type: string
                          description: "Whether the optimizer feature is enabled for this zone"
                          example: "0"
                        origin:
                          type: string
                          description: "Origin server hostname or URL"
                          example: http://www.jjk.com
                        backup:
                          type: string
                          description: Whether backup origin failover is enabled (Y/N)
                          example: ""
                        cnames:
                          type: string
                          nullable: true
                          description: "Comma-separated list of CNAMEs associated with this zone"
                          example: ""
                        live:
                          type: string
                          description: Whether live streaming is active for this zone
                          example: "N"
                        wafid:
                          nullable: true
                          example:
                        edgeruleids:
                          type: integer
                          description: "Count of edge rules associated with this zone"
                          example: 0
                        dnscheck:
                          type: integer
                          description: Whether DNS propagation check is enabled
                          example: 1
                        ip:
                          type: string
                          nullable: true
                          description: "IP address of the server or origin"
                          example:
                        customhostheader:
                          type: string
                          description: Custom Host header value sent to the origin server
                          example: ""
                        iswordpress:
                          type: string
                          description: Whether WordPress integration mode is enabled (Y/N)
                          example: "0"
                        awsSignatureV4:
                          type: string
                          description: AWS Signature Version 4 authentication configuration
                          nullable: true
                          example: ""
                        disabled:
                          type: string
                          description: "Whether this zone is currently disabled (0=active, 1=disabled)"
                          example: "0"
                        created_at:
                          type: string
                          description: "ISO 8601 timestamp when this resource was created"
                          example: "2026-04-07 05:31:16"
                        updated_at:
                          type: string
                          description: "ISO 8601 timestamp of the most recent update"
                          example: "2026-04-14 12:29:23"
                        deleted:
                          nullable: true
                          example:
                        router:
                          type: string
                          description: "Internal router label for this zone"
                          example: mycdn
                        remaining:
                          type: integer
                          description: "Remaining quota or resource count for this zone"
                          example: 0
                        status:
                          type: string
                          description: "Current operational status of the resource"
                          example: Enabled
                        name:
                          type: string
                          description: "Human-readable name of the resource"
                          example: sample-pull-zone
                        fqdn:
                          type: string
                          description: "Fully qualified domain name of the CDN zone"
                          example: cdn.example.com
                        ssl:
                          type: object
                          properties:
                            http:
                              type: string
                              description: "Whether plain HTTP delivery is enabled (Y/N)"
                              example: "N"
                            http2:
                              type: string
                              description: "Whether HTTP/2 is enabled (Y/N)"
                              example: "Y"
                            redirect:
                              type: string
                              description: "Whether HTTP to HTTPS redirect is enabled (Y/N)"
                              example: "Y"
                            mode:
                              type: string
                              description: "Delivery mode of the zone (e.g. http, https)"
                              example: S
                            certid:
                              type: string
                              nullable: true
                              description: "SSL certificate identifier, or empty if using default"
                              example:
                            zerossl:
                              type: object
                              nullable: true
                              properties:
                                logDir:
                                  type: string
                                  description: Directory path where access logs are stored
                                  example: /var/logs/ssl/2023/sample
                                messages:
                                  type: array
                                  items:
                                    type: string
                                    description: Array of informational messages from the operation
                                  example: ["Subject Altternative Names are Required"]
                                cn:
                                  type: string
                                  description: ZeroSSL certificate provisioning settings
                                  example: cdn.example.com
                                sans:
                                  type: array
                                  items:
                                    type: string
                                    description: Subject Alternative Names (SANs) on the SSL certificate
                                  example: ["ttt.5centscdndemo.ca"]
                                strSans:
                                  type: string
                                  description: Subject Alternative Names as a formatted string
                                  example: ttt.5centscdndemo.ca
                                certDomains:
                                  type: string
                                  description: Array of domain names covered by this certificate
                                  example: cdn.example.com,ttt.5centscdndemo.ca
                                baseDir:
                                  type: string
                                  description: Base directory for ZeroSSL certificate files.
                                  example: /etc/ssl/zerossl/cdn.example.com
                                dbRow:
                                  type: object
                                  description: Database record associated with this ZeroSSL certificate.
                            enabled:
                              type: string
                              description: "Whether this feature is currently enabled (Y/N)"
                              example: "Y"
                            warning:
                              oneOf:
                              - type: boolean
                              - type: string
                              description: "SSL warning flag or message, false if none"
                              example: false
                        cnamesArr:
                          type: array
                          items:
                            type: string
                          description: "Array of CNAMEs for this zone"
                          example: []
                        cnamesArrFqdn:
                          type: array
                          items:
                            type: string
                          description: "Array of FQDN CNAMEs for this zone"
                          example: ["cdn.example.com"]
                        waf:
                          type: object
                          properties:
                            enabled:
                              type: string
                              description: "Whether this feature is currently enabled (Y/N)"
                              example: "N"
                        defaultBehaviors:
