                            robots:
                              type: string
                              description: Robots.txt handling mode for this zone
                              example: "N"
                            robotstxt:
                              type: string
                              description: Custom robots.txt content for this zone
                              example: "N"
                            robotstxtcustom:
                              type: string
                              description: Whether SEO-friendly URL mode is enabled (Y/N)
