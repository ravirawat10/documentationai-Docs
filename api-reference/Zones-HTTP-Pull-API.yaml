                            enabled:
                              type: string
                              description: "Whether this feature is currently enabled (Y/N)"
                              example: "Y"
                        hasEdgeRules:
                          type: boolean
                          description: "Whether this zone has any edge rules configured"
                          example: true
    post:
      tags:
      - Zone Management
      summary: Create Zone
      description: Create a new HTTP Pull Zone
      operationId: createZonePull
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - _METHOD
              - alias
              - origin
              properties:
                _METHOD:
                  type: string
                  description: Must always be PUT.
                  example: PUT
                alias:
                  type: string
                  description: Label for the zone.
                  example: my-pull-zone
                origin:
                  type: string
                  description: Origin server URL.
                  example: https://origin.com
                optimize:
                  type: string
                  enum: [http, live, vod]
                  description: "Content delivery optimization mode. http = Standard web content optimization. live = HLS/DASH live streaming optimization. vod = HLS/DASH Video on Demand optimization."
                  example: http
                ssl:
                  type: object
                  properties:
                    http2:
                      type: string
                      enum: [Y, N]
                      description: "Enable HTTP/2 multiplexing. Y = HTTP/2 enabled. N = HTTP/1.1 only."
                      example: Y
                    redirect:
                      type: string
                      enum: [Y, N]
                      description: "Enforce HTTPS via 301 redirect. Y = redirect HTTP to HTTPS. N = allow both HTTP and HTTPS."
                      example: N
                    mode:
                      type: string
                      enum: [N, S, L, C]
                      description: "SSL certificate mode. N = None (no SSL). S = Shared wildcard SSL certificate (default CDN certificate). L = Free SSL via ZeroSSL/Let's Encrypt. C = Custom SSL certificate (requires certid)."
                      example: S
                  description: SSL certificate settings for HTTPS delivery.
                cache:
                  type: object
                  properties:
                    cache:
                      type: string
                      description: Edge cache TTL duration code.
                      example: 1h
                    expiry:
                      type: string
                      description: Browser cache TTL duration code, or empty string to disable.
                      example: ""
                  description: Cache configuration settings for the zone.
                cnames:
                  type: string
                  description: Comma-separated verified CNAMEs.
                  example: cdn.example.com
                origin_auth:
                  type: object
                  description: Optional AWS S3 authentication for private origins.
                  properties:
                    type:
                      type: string
                      enum: [none, awsSignatureV4]
                      example: none
