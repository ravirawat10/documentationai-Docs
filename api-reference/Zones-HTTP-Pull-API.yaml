                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  description: "Unique numeric identifier of the zone"
                                  example: 11111
                                network:
                                  type: string
                                  description: "Network provider name for this behavior"
                                  example: gcore
                                rule:
                                  type: object
                        edgeRules:
                          type: array
