openapi: 3.0.3
info:
  title: 5centsCDN - SimpleDNS
  description: >
    API for managing SimpleDNS zones, records, DNSSEC, SOA, statistics,
    zone import/export, and mail forwards in 5centsCDN.
  version: 2.0.0
  contact:
    email: help@5centscdn.com
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
servers:
- url: https://api.5centscdn.com/v2
  description: 5centsCDN API Server - Production
tags:
  - name: DNS Zones
    description: DNS zone management (create, list, delete, restore, status)
  - name: DNS Records
    description: DNS record management within a zone
  - name: DNS Security
    description: DNSSEC and SOA management
  - name: DNS Statistics
    description: DNS query statistics
  - name: Mail Forwards
    description: Email forwarding rules for DNS zones
components:
  securitySchemes:
    apikeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  parameters:
    serviceId:
      name: id
      in: path
      required: true
      description: service id
      schema:
        type: integer
        example: 123
    dnsIdParam:
      name: dnsId
      in: path
      required: true
      description: SimpleDNS zone ID.
      schema:
        type: integer
        example: 42
    recordIdParam:
      name: recordid
      in: path
      required: true
      description: DNS record ID within the zone.
      schema:
        type: integer
        example: 258289692

  schemas:
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - Success
            - Error
          description: Outcome of the operation.
        statusDescription:
          type: string
          description: Human-readable description of the outcome.
      required:
        - status
        - statusDescription

    RecordType:
      type: string
      description: DNS record type.
      enum:
        - A
        - AAAA
        - MX
        - CNAME
        - TXT
        - SPF
        - NS
        - SRV
        - WR
        - ALIAS
        - RP
        - SSHFP
        - NAPTR
        - CAA
        - TLSA
        - DS
        - CERT
        - PTR
        - HINFO
        - LOC
        - DNAME
        - OPENPGPKEY
        - SMIMEA

    TtlValue:
      type: integer
      description: TTL value in seconds.
      enum:
        - 60
        - 300
        - 600
        - 900
        - 1800
        - 3600
        - 21600
        - 43200
        - 86400
        - 172800
        - 259200
        - 604800
        - 1209600
        - 2592000

    SoaInput:
      type: object
      description: SOA record fields for update.
      properties:
        primaryNS:
          type: string
          description: Primary name server hostname.
          example: pns31.5centscdn.com
        adminMail:
          type: string
          format: email
          description: DNS administrator email address.
          example: support@5centscdn.com
        refresh:
          type: integer
          minimum: 1200
          maximum: 43200
          description: Zone refresh interval in seconds (1200-43200).
          default: 7200
          example: 7200
        retry:
          type: integer
          minimum: 180
          maximum: 2419200
          description: Retry interval in seconds after a failed refresh (180-2419200).
          default: 1800
          example: 1800
        expire:
          type: integer
          minimum: 1209600
          maximum: 2419200
          description: Expiry time in seconds for secondary servers (1209600-2419200).
          default: 1209600
          example: 1209600
        defaultTTL:
          type: integer
          minimum: 60
          maximum: 2419200
          description: Default TTL in seconds for records without explicit TTL (60-2419200).
          default: 3600
          example: 3600

    MailForwardInput:
      type: object
      description: Fields for creating or updating a mail forward rule.
      required:
        - destination
      properties:
        box:
          type: string
          description: >
            The mailbox name (local part before @). Leave empty to create a
            catch-all forward.
          example: admin
        host:
          type: string
          description: >
            The subdomain part of the source address. Leave empty for the root domain.
          example: www
        destination:
          type: string
          format: email
          description: The destination email address to forward mail to.
          example: noreply@gmail.com

    DnsRecordInput:
      type: object
      description: >
        Unified input schema for creating or updating a DNS record. Required
        fields depend on the record type.
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/RecordType'
        host:
          type: string
          description: >
            Hostname / subdomain for the record. Leave empty to target the root domain.
          example: www
        ttl:
          $ref: '#/components/schemas/TtlValue'
        record:
          type: string
          description: >
            The primary value / target of the record. Interpretation varies by type
            (IP for A/AAAA, hostname for CNAME/MX/NS, text for TXT, URL for WR, etc).
          example: 8.8.8.8
        priority:
          type: integer
          minimum: 0
          maximum: 65535
          description: Priority for MX or SRV records (lower = higher preference).
        weight:
          type: integer
          minimum: 0
          maximum: 65535
          description: Weight for SRV record load balancing (0-65535).
        port:
          type: integer
          minimum: 0
          maximum: 65535
          description: Port for SRV record (0-65535).
        algorithm:
          type: integer
          description: Algorithm identifier for SSHFP (1=RSA, 2=DSA, 3=ECDSA, 4=Ed25519) and DS/CERT records.
          enum: [1, 2, 3, 4, 5, 6, 7, 8, 10, 13, 14, 15, 16, 252, 253, 254]
        fptype:
          type: integer
          description: "SSHFP fingerprint hash type: 1=SHA-1, 2=SHA-256."
          enum: [1, 2]
        status:
          type: integer
          enum: [0, 1]
          description: "1 = create active, 0 = create inactive. Defaults to active."
        caa_flag:
          type: integer
          description: "CAA flag: 0 = Non Critical, 128 = Critical."
          enum: [0, 128]
        caa_type:
          type: string
          description: "CAA property tag: issue, issuewild, or iodef."
          enum: [issue, issuewild, iodef]
        caa_value:
          type: string
          description: CAA value (CA hostname, semicolon, or mailto/http URL for iodef).
          example: letsencrypt.org
        tlsa_usage:
          type: integer
          description: "TLSA usage: 0=PKIX-TA, 1=PKIX-EE, 2=DANE-TA, 3=DANE-EE."
          enum: [0, 1, 2, 3]
        tlsa_selector:
          type: integer
          description: "TLSA selector: 0=full certificate, 1=SPKI."
          enum: [0, 1]
        tlsa_matching_type:
          type: integer
          description: "TLSA matching type: 0=full, 1=SHA-256, 2=SHA-512."
          enum: [0, 1, 2]
        key_tag:
          type: integer
          description: DS record key tag value.
        digest_type:
          type: integer
          description: "DS digest type: 1=SHA-1, 2=SHA-256, 3=GOST, 4=SHA-384."
          enum: [1, 2, 3, 4]
        cert_type:
          type: integer
          description: "CERT record type: 1=PKIX, 2=SPKI, 3=PGP, etc."
          enum: [1, 2, 3, 4, 5, 6, 7, 8, 253, 254]
        cert_key_tag:
          type: integer
          minimum: 0
          maximum: 65535
          description: CERT record key tag (0-65535).
        cert_algorithm:
          type: integer
          description: CERT record algorithm.
          enum: [2, 3, 4, 5, 6, 7, 8, 10, 13, 14, 15, 16, 252, 253, 254]
        mail:
          type: string
          description: "RP record: responsible person email (dot-encoded per RFC 1183)."
        txt:
          type: string
          description: "RP record: name of a TXT record with additional info."
        order:
          type: integer
          minimum: 0
          maximum: 65535
          description: "NAPTR record processing order (lower first)."
        pref:
          type: integer
          minimum: 0
          maximum: 65535
          description: "NAPTR preference for equal-order records (lower = higher)."
        flag:
          type: string
          description: "NAPTR flag (empty, U, S, A, or P)."
          enum: ["", U, S, A, P]
        params:
          type: string
          description: "NAPTR service parameters (e.g. E2U+sip)."
        regexp:
          type: string
          description: "NAPTR regular expression."
        replace:
          type: string
          description: "NAPTR replacement FQDN."
        frame:
          type: integer
          enum: [0, 1]
          description: "WR record: 1=iframe redirect, 0=HTTP redirect."
        frame_title:
          type: string
          description: "WR frame mode: HTML title."
        frame_keywords:
          type: string
          description: "WR frame mode: HTML meta keywords."
        frame_description:
          type: string
          description: "WR frame mode: HTML meta description."
        mobile_meta:
          type: integer
          enum: [0, 1]
          description: "WR frame mode: 1=add mobile viewport meta tags."
        save_path:
          type: integer
          enum: [0, 1]
          description: "WR record: 1=append request path to redirect URL."
        redirect_type:
          type: integer
          enum: [301, 302]
          description: "WR redirect type when frame is disabled."
        cpu:
          type: string
          description: "HINFO record: CPU identifier."
        os:
          type: string
          description: "HINFO record: Operating system name."
        lat_deg:
          type: integer
          minimum: 0
          maximum: 90
          description: "LOC latitude degrees (0-90)."
        lat_min:
          type: integer
          minimum: 0
          maximum: 59
          description: "LOC latitude minutes (0-59, default 0)."
        lat_sec:
          type: number
          minimum: 0
          maximum: 59.999
          description: "LOC latitude seconds (0-59.999, default 0)."
        lat_dir:
          type: string
          enum: [N, S]
          description: "LOC latitude direction."
        long_deg:
          type: integer
          minimum: 0
          maximum: 180
          description: "LOC longitude degrees (0-180)."
        long_min:
          type: integer
          minimum: 0
          maximum: 59
          description: "LOC longitude minutes (0-59, default 0)."
        long_sec:
          type: number
          minimum: 0
          maximum: 59.999
          description: "LOC longitude seconds (0-59.999, default 0)."
        long_dir:
          type: string
          enum: [W, E]
          description: "LOC longitude direction."
        altitude:
          type: number
          minimum: -100000
          maximum: 42849672.95
          description: "LOC altitude in meters (-100000.00 to 42849672.95)."
        size:
          type: number
          minimum: 0
          maximum: 90000000
          description: "LOC size in meters (default 1)."
        h_precision:
          type: number
          minimum: 0
          maximum: 90000000
          description: "LOC horizontal precision in meters (default 10000)."
        v_precision:
          type: number
          minimum: 0
          maximum: 90000000
          description: "LOC vertical precision in meters (default 10)."
        smimea_usage:
          type: integer
          description: "SMIMEA usage: 0=PKIX-TA, 1=PKIX-EE, 2=DANE-TA, 3=DANE-EE."
          enum: [0, 1, 2, 3]
        smimea_selector:
          type: integer
          description: "SMIMEA selector: 0=full cert, 1=SPKI."
          enum: [0, 1]
        smimea_matching_type:
          type: integer
          description: "SMIMEA matching type: 0=full, 1=SHA-256, 2=SHA-512."
          enum: [0, 1, 2]
security:
  - apikeyAuth: []
paths:
  /{id}/dns:
    get:
      tags:
        - DNS Zones
      summary: List Zones
      parameters:
        - $ref: '#/components/parameters/serviceId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  domains:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 317
                        serviceid:
                          type: integer
                          example: 103
                        domain:
                          type: string
                          example: flussoniccdn.com
                        meta:
                          type: object
                          properties:
                            name:
                              type: string
                              example: flussoniccdn.com
                            id:
                              type: string
                              example: '5035023'
                            type:
                              type: string
                              example: master
                            group:
                              type: string
                              example: None
                            hasBulk:
                              type: boolean
                              example: false
                            is_cloud:
                              type: integer
                              example: 0
                            zone:
                              type: string
                              example: domain
                            status:
                              type: string
                              example: '1'
                            serial:
                              type: string
                              example: '2026042001'
                            isUpdated:
                              type: integer
                              example: 1
                        soa:
                          type: object
                          properties:
                            serialNumber:
                              type: string
                              example: '2026042001'
                            primaryNS:
                              type: string
                              example: pns31.5centscdn.com
                            adminMail:
                              type: string
                              example: support@5centscdn.com
                            refresh:
                              type: string
                              example: '7200'
                            retry:
                              type: string
                              example: '1800'
                            expire:
                              type: string
                              example: '1209600'
                            defaultTTL:
                              type: string
                              example: '3600'
                        dnssec:
                          type: object
                          properties:
                            status:
                              type: string
                              example: '1'
                            ds:
                              type: array
                              items:
                                type: string
                            ds_records:
                              type: array
                              items:
                                type: object
                                properties:
                                  digest:
                                    type: string
                                  key_tag:
                                    type: string
                                  algorithm:
                                    type: string
                                  algorithm_name:
                                    type: string
                                  digest_type:
                                    type: string
                                  digest_type_name:
                                    type: string
                            dnskey:
                              type: array
                              items:
                                type: string
                            optout:
                              type: string
                              example: '1'
                            statusDescription:
                              type: string
                              example: The DNSSEC is not active.
                        preferredtype:
                          type: string
                          example: All
                        created_at:
                          type: string
                          example: '2023-07-04 14:08:59'
                        updated_at:
                          type: string
                          example: '2026-04-20 05:57:57'
                        synced_at:
                          type: string
                          example: '2026-04-20 05:57:57'
                        validated_at:
                          type: string
                          example: '2026-04-17 22:57:53'
                        deleted:
                          nullable: true
                          example: null
                        proxied:
                          type: array
                          items: {}
                        linkedZones:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              id:
                                type: integer
                              mode:
                                type: string
                        nameservers:
                          type: array
                          items:
                            type: string
                          example:
                            - pns31.5centscdn.com
                            - pns32.5centscdn.com
                            - pns33.5centscdn.com
                            - pns34.5centscdn.com
                        stats:
                          type: object
                          properties:
                            queries:
                              type: integer
                              example: 877245
                            records:
                              type: integer
                              example: 16
                  nameservers:
                    type: array
                    items:
                      type: string
                    example:
                      - pns31.5centscdn.com
                      - pns32.5centscdn.com
                      - pns33.5centscdn.com
                      - pns34.5centscdn.com
    post:
      tags:
        - DNS Zones
      summary: Create Zones
      parameters:
        - $ref: '#/components/parameters/serviceId'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              properties:
                domain:
                  type: string
                  description: New DNS Domain
                  example: testdomain.com
                _METHOD:
                  type: string
                  description: masking post -> put request
                  example: PUT
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              examples:
                example-0:
                  summary: Error
                  value:
                    status: Error
                    statusDescription: Domain Already Exists
                example-1:
                  summary: Success
                  value:
                    status: Success
                    statusDescription: Domain zone vivek.com was created successfully.
                    dnsid: 93
  /{id}/dns/{dnsId}/updated:
    get:
      tags:
        - DNS Zones
      summary: Get UpdatedStatus
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - name: dnsId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
              example: 'true'
  /{id}/dns/{dnsId}/status:
    post:
      tags:
        - DNS Zones
      summary: Enable/Disable Zone
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  description: '1: Enable, 0: Disable'
                  example: '1'
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - name: dnsId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                status: Success
                statusDescription: The zone was activated!
  /{id}/dns/{dnsId}:
    post:
      tags:
        - DNS Zones
      summary: Delete Zone
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                _METHOD:
                  type: string
                  description: casting post -> delete
                  example: delete
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - name: dnsId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                status: Success
                statusDescription: >-
                  Domain zone vivek.com was disabled. Will be fully removed
                  after usage billing.
  /{id}/dns/{dnsId}/restore:
    get:
      tags:
        - DNS Zones
      summary: Restore Zone
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - name: dnsId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                status: Success
                statusDescription: Zone Restored
  /{id}/dns/{dnsId}/statistics:
    get:
      tags:
        - DNS Statistics
      summary: Get Zone Statistics
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - name: dnsId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  '2022-03-25': 2339
                  '2022-03-26': 2147
                  '2022-03-27': 1750
                  '2022-03-28': 2031
                  '2022-03-29': 2339
                  '2022-03-30': 2486
                  '2022-03-31': 1517
                  '2022-04-01': 1572
                  '2022-04-02': 1876
                  '2022-04-03': 2120
                  '2022-04-04': 2686
                  '2022-04-05': 1161
                  '2022-04-06': 769
                  '2022-04-07': 824
                  '2022-04-08': 777
                  '2022-04-09': 1013
                  '2022-04-10': 966
                  '2022-04-11': 886
                  '2022-04-12': 709
                  '2022-04-13': 676
                  '2022-04-14': 672
