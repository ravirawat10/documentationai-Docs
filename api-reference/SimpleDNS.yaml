  /{id}/dns/{dnsId}/soa:
    get:
      tags:
        - DNS Security
      summary: Get Zone SOA
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - name: dnsId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  serialNumber: '2022042309'
                  primaryNS: pns31.5centscdn.net
                  adminMail: support@5centscdn.net
                  refresh: '7200'
                  retry: '1800'
                  expire: '1209600'
                  defaultTTL: '3600'
    post:
      tags:
        - DNS Security
      summary: Update Zone SOA
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                primaryNS:
                  type: string
                  description: >
                    Specifies the primary nameserver for the zone. This is the
                    main DNS server that holds authoritative information about
                    the domain.
                  example: pns31.5centscdn.com
                adminMail:
                  type: string
                  description: >
                    The email address of the administrator responsible for the
                    domain. Usually formatted as admin@domain.com but replaces
                    @ with a dot in the SOA record.
                  example: support@5centscdn.com
                refresh:
                  type: string
                  description: >
                    The refresh interval for the secondary DNS server to check
                    for updates from the primary server. Measured in seconds
                    and determines how frequently secondary servers will update
                    their records.
                  example: '3600'
                retry:
                  type: string
                  description: >
                    The retry interval for secondary DNS servers if a refresh
                    fails. Specifies how long the secondary server should wait
                    before retrying to contact the primary server.
                  example: '1800'
                expire:
                  type: string
                  description: >
                    The expiration time for data held by secondary servers if
                    they cannot contact the primary server. After this time,
                    the secondary server discards the zone data as it is
                    considered outdated.
                  example: '1209600'
                defaultTTL:
                  type: string
                  description: >
                    The default time-to-live (TTL) value for DNS records in
                    the zone. Specifies how long DNS records are cached by
                    resolvers before they must query again.
                  example: '3600'
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - name: dnsId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                status: Success
                statusDescription: The SOA record was modified successfully.
