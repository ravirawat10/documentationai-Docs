                  '2022-04-19': 701
                  '2022-04-20': 690
                  '2022-04-21': 671
                  '2022-04-22': 685
                  '2022-04-23': 193
                options:
                  months:
                    '0': '-'
                    '01': Jan
                    '02': Feb
                    '03': Mar
                    '04': Apr
                  hourly:
                    till: '2022-03-24'
                  years:
                    - '2022'
                    - '2021'
                message: null
  /{id}/dns/{dnsId}/statistics/monthly/{year}:
    get:
      tags:
        - DNS Statistics
      summary: Get Zone Statistics (Monthly)
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - name: dnsId
          in: path
          schema:
            type: string
          required: true
        - name: year
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  '01': 0
                  '02': 0
                  '03': 53854
                  '04': 23017
                options:
                  months:
                    '0': '-'
                    '01': Jan
                    '02': Feb
                    '03': Mar
                    '04': Apr
                  hourly:
                    till: '2022-03-24'
                  years:
                    - '2022'
                    - '2021'
                message: null
  /{id}/dns/{dnsId}/statistics/yearly:
    get:
      tags:
        - DNS Statistics
      summary: Get Zone Statistics (Yearly)
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - name: dnsId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  '2022': '76871'
                options:
                  months:
                    '0': '-'
                    '01': Jan
                    '02': Feb
                    '03': Mar
                    '04': Apr
                  hourly:
                    till: '2022-03-24'
                  years:
                    - '2022'
                    - '2021'
                message: null
  /{id}/dns/{dnsId}/statistics/daily/{year}/{month}:
    get:
      tags:
        - DNS Statistics
      summary: Get Zone Statistics (Daily)
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - name: dnsId
          in: path
          schema:
            type: string
          required: true
        - name: year
          in: path
          schema:
            type: string
          required: true
        - name: month
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
