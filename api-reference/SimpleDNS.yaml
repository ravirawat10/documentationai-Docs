                  hourly:
                    till: '2022-03-24'
                  years:
                    - '2022'
                    - '2021'
                message: null
  /{id}/dns/{dnsId}/statistics/last30:
    get:
      tags:
        - DNS Statistics
      summary: Get Zone Statistics (Last 30 Days)
      parameters:
        - $ref: '#/components/parameters/serviceId'
        - name: dnsId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  '2022-03-25': 2339
                  '2022-03-26': 2147
                  '2022-03-27': 1750
                  '2022-03-28': 2031
                  '2022-03-29': 2339
                  '2022-03-30': 2486
                  '2022-03-31': 1517
                  '2022-04-01': 1572
                  '2022-04-02': 1876
                  '2022-04-03': 2120
                  '2022-04-04': 2686
                  '2022-04-05': 1161
