                        example: default
                      default:
                        type: string
                        example: 345600s
                      value:
                        type: string
                        example: 345600s
                      revalidate:
                        type: string
                        nullable: true
                        example: null
                      custom:
                        type: object
                        properties:
                          default:
                            type: string
                            example: ""
                          value:
                            type: string
                            example: ""
                      custom_values:
                        type: object
                        properties:
                          codes:
                            type: array
                            items:
                              type: array
                              items:
                                type: string
                            example: []
                          value:
                            type: array
                            items:
                              type: string
                            example: []
                  browser_cache_settings:
                    type: object
                    description: Controls Cache-Control headers sent to the client browser.
