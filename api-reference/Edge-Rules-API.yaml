                            type: boolean
                            nullable: true
                          body:
                            type: string
                          flag:
                            type: string
                            enum: [break, last, redirect, permanent]
                      host_redirect:
                        type: object
                        description: Redirect requests to a different hostname.
                        properties:
                          enabled:
                            type: boolean
                            nullable: true
                          to:
                            type: string
                          value:
                            type: array
                            items:
                              type: string
                      redirect_http_to_https:
                        type: object
                        description: Permanently redirect HTTP requests to HTTPS (301).
                        properties:
                          enabled:
                            type: boolean
                            nullable: true
                      follow_origin_redirect:
                        type: object
                        description: Follow HTTP redirects returned by the origin.
                        properties:
                          enabled:
                            type: boolean
                            nullable: true
                          codes:
                            type: array
                            items:
                              type: integer
                      hsts:
                        type: object
                        description: HTTP Strict Transport Security configuration.
                        properties:
                          enabled:
                            type: boolean
                            nullable: true
                          referrerPolicy:
                            type: string
                            enum:
                              - no-referrer
                              - no-referrer-when-downgrade
                              - origin
                              - origin-when-cross-origin
                              - same-origin
                              - strict-origin
                              - strict-origin-when-cross-origin
                              - unsafe-url
                          includeSubDomains:
                            type: boolean
                          preload:
                            type: boolean
                      xff:
                        type: object
                        description: Add X-Forwarded-For header to origin requests.
                        properties:
                          enabled:
                            type: boolean
                            nullable: true
                      sni:
                        type: object
                        description: SNI hostname for TLS handshake toward origin.
                        properties:
                          enabled:
                            type: boolean
                            nullable: true
                          sni_type:
                            type: string
                            enum: [dynamic, custom]
                          custom_hostname:
                            type: string
                      force_return:
                        type: object
                        description: Return a fixed HTTP status code for matched requests.
                        properties:
                          enabled:
                            type: boolean
                            nullable: true
                          code:
                            type: integer
                          body:
                            type: string
                      stale:
                        type: object
                        description: Serve stale cached content if origin is unreachable.
                        properties:
                          enabled:
                            type: boolean
                            nullable: true
                          value:
                            type: string
                      staticHeaders:
                        type: object
                        description: Add or override response headers.
                        properties:
                          enabled:
                            type: boolean
                            nullable: true
                          keys:
                            type: array
                            items:
                              type: string
                          values:
                            type: array
                            items:
                              type: string
                      staticRequestHeaders:
                        type: object
                        description: Add or override request headers forwarded to origin.
                        properties:
                          enabled:
                            type: boolean
                            nullable: true
                          keys:
                            type: array
                            items:
                              type: string
                          values:
                            type: array
                            items:
                              type: string
                      response_headers_hiding_policy:
                        type: object
                        description: Suppress specific response headers before delivery to client.
                        properties:
                          enabled:
                            type: boolean
                            nullable: true
                          mode:
                            type: string
                            enum: [hide, show]
                          expected:
                            type: object
                            properties:
                              hide:
                                type: array
                                items:
                                  type: string
                              show:
                                type: array
                                items:
                                  type: string
                      hostHeader:
                        type: object
                        description: Control the Host header sent to origin.
                        properties:
                          enabled:
                            type: boolean
                            nullable: true
                          control:
                            type: string
                            enum: [forward, custom]
                          custom:
                            type: string
                      forward_host_header:
                        type: object
                        description: Legacy alias for hostHeader. Send alongside hostHeader.
                        properties:
                          enabled:
                            type: boolean
                            nullable: true
                      cors:
                        type: object
                        description: CORS header support.
                        properties:
                          enabled:
                            type: boolean
                            nullable: true
                          control:
                            type: string
                          always:
                            type: boolean
                          value:
                            type: string
                          custom:
                            type: string
          example:
            name: Cache Segments
            rule: /stream/*
            options:
              edge_cache_settings: {enabled: null, control: default, default: 345600s, value: 345600s, revalidate: null, custom: {default: "", value: ""}, custom_values: {codes: [], value: []}}
              cors: {enabled: null, control: "*", always: false, value: "*", custom: ""}
