                value: 345600s
                revalidate: null
                custom: { default: "", value: "" }
                custom_values: { codes: [], value: [] }
              midgress_cache_settings:
                enabled: null
                control: default
                default: 345600s
                value: 345600s
                revalidate: null
                custom: { default: "", value: "" }
                custom_values: { codes: [], value: [] }
