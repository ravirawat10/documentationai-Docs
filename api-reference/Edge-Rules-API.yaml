  /zones/vod/push/{zoneId}/rules/rule:
    post:
      tags: [VOD Push]
      operationId: createEdgeRuleVodPush
      summary: Create a new edge rule for a VOD Push zone
      description: >
        Creates a new edge rule for the zone. The body must include
        `"_METHOD": "PUT"` alongside the standard rule payload. On success the
        server returns `result: "success"` with a human-readable message.
      parameters:
        - $ref: '#/components/parameters/zoneId'
      requestBody:
        $ref: '#/components/requestBodies/CreateRuleBody_vodPush'
      responses:
        '200':
          description: Edge rule created successfully
          content:
            application/json:
              schema:
                type: object
                required: [result, message, ruleid]
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                    enum: [success]
                  message:
                    type: string
                  ruleid:
                    type: integer
                    description: The numeric ID of the newly created edge rule.
              example:
                result: success
                message: Zone EdgeRule Created. Please wait till the rules validation & deployment completes.
                ruleid: 8435
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /zones/vod/push/{zoneId}/rules/rule/{ruleId}:
    post:
      tags: [VOD Push]
      operationId: updateOrDeleteEdgeRuleVodPush
      summary: Update or delete a specific edge rule in a VOD Push zone
      description: >
        **Update** — omit `_METHOD` or do not send it; the full rule options
        object is sent as the body and the rule is updated in place.

        **Delete** — include `"_METHOD": "DELETE"` as the only body field.
        The rule identified by `ruleId` is permanently removed.
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - $ref: '#/components/parameters/ruleId'
      requestBody:
        $ref: '#/components/requestBodies/UpdateOrDeleteRuleBody_vodPush'
      responses:
        '200':
          description: Operation completed successfully (update or delete)
          content:
            application/json:
              schema:
                type: object
                required: [result, message]
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                    enum: [success]
                  message:
                    type: string
              examples:
                updated:
                  summary: Rule updated successfully
                  value:
                    result: success
                    message: Zone EdgeRule Updated. Please wait till the rules validation & deployment completes.
                deleted:
                  summary: Rule deleted successfully
                  value:
                    result: success
                    message: Zone EdgeRule Deleted. Please wait till the deployment completes.
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /zones/vod/push/{zoneId}/rules/behavior/{behaviorId}:
    post:
      tags: [Default Behaviors]
      operationId: updateDefaultBehaviorVodPush
      summary: Update the default behavior for a VOD Push zone
      description: >
        Saves changes to the zone's default behavior entry. The payload
        structure is identical to a rule update (`RulePayload`) but the
        `name` and `rule` fields are effectively ignored — only `options`
        is applied. `behaviorId` is the `id` from the behaviors array
        returned by GET rules.
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - $ref: '#/components/parameters/behaviorId'
      requestBody:
        $ref: '#/components/requestBodies/UpdateBehaviorBody_vodPush'
      responses:
        '200':
          description: Default behavior updated successfully
          content:
            application/json:
              schema:
                type: object
                required: [result, message]
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                    enum: [success]
                  message:
                    type: string
              example:
                result: success
                message: Zone Behavior Updated. Please wait till the rules validation & deployment completes.
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  # ═══════════════════════════════════════════════════════════════
  # VALIDATION
  # ═══════════════════════════════════════════════════════════════

  /validate/rule:
    post:
      tags: [Validation]
      operationId: validateRulePattern
      summary: Validate an edge rule pattern string
      description: >
        Checks whether the supplied `rule` glob/pattern is syntactically valid
        for the given zone. Called client-side with a 500 ms debounce as the
        user types the rule pattern field. Returns `result: "success"` when
        the pattern is valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRuleRequest'
            example:
              rule: /images/*
              zoneid: 12345
              zonetype: pull
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                    enum: [success]
              example:
                result: success
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

# ═══════════════════════════════════════════════════════════════
# Components
# ═══════════════════════════════════════════════════════════════
components:

  # ─── Security Schemes ────────────────────────────────────────
  securitySchemes:
    apikeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  # ─── Parameters ─────────────────────────────────────────────
  parameters:
    zoneId:
      name: zoneId
      in: path
      required: true
      description: Numeric ID of the zone
      schema:
        type: integer
        example: 12345

    ruleId:
      name: ruleId
      in: path
      required: true
      description: Numeric ID of the edge rule to update or delete
      schema:
        type: integer
        example: 201

    behaviorId:
      name: behaviorId
      in: path
      required: true
      description: Numeric identifier of the default behavior record
      schema:
        type: integer
        example: 1

  # ─── Request Bodies ──────────────────────────────────────────
  requestBodies:
    CreateRuleBody_httpPull:
      required: true
      description: >
        Request body for creating an edge rule on an HTTP Pull zone.
        Must include `"_METHOD": "PUT"`. Only tls_versions is excluded
        (Default Behaviors view only). Query string options (ignoreQueryString,
        query_params_blacklist, query_params_whitelist) are mutually exclusive —
        only one should have enabled = true at a time.
      content:
        application/json:
          schema:
            type: object
            required: [_METHOD, name, rule, options]
            properties:
              _METHOD:
                type: string
                enum: [PUT]
                description: HTTP method override. Always "PUT" for create.
              name:
                type: string
                description: Human-readable label for the rule.
              rule:
                type: string
                description: >
                  URL pattern or regex applied to incoming requests.
                  Validated via /validate/rule.
              options:
                type: object
                description: Container for all behavior option groups.
                properties:
                  edge_cache_settings:
                    type: object
                    description: Controls how long the edge CDN caches content.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "true = active, false = disabled, null = inherit from default."
                      control:
                        type: string
                        enum: [default, value, no-cache]
                        description: Selects which cache duration mode applies.
                      default:
                        type: string
                        description: Duration used when control is "default".
                      value:
                        type: string
                        description: Duration used when control is "value".
                      revalidate:
                        type: string
                        nullable: true
                        description: Revalidation time directive.
                      custom:
                        type: object
                        properties:
                          default:
                            type: string
                            description: Custom pattern default value.
                          value:
                            type: string
                            description: Custom pattern override value.
                      custom_values:
                        type: object
                        description: Per-path-pattern cache overrides.
                        properties:
                          codes:
                            type: array
                            description: Each inner array is a list of path patterns for one override rule.
                            items:
                              type: array
                              items:
                                type: string
                          value:
                            type: array
                            description: Cache duration per override group, parallel-indexed with codes.
                            items:
                              type: string
                  midgress_cache_settings:
                    type: object
                    description: Controls midgress (mid-tier) cache duration. Identical structure to edge_cache_settings.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      control:
                        type: string
                        enum: [default, value]
                        description: '"default" or "value".'
                      default:
                        type: string
                        description: Duration for default mode.
                      value:
                        type: string
                        description: Duration for value mode.
                      revalidate:
                        type: string
                        nullable: true
                        description: Revalidation directive.
                      custom:
                        type: object
                        properties:
                          default:
                            type: string
                          value:
                            type: string
                      custom_values:
                        type: object
                        properties:
                          codes:
                            type: array
                            items:
                              type: array
                              items:
                                type: string
                          value:
                            type: array
                            items:
                              type: string
                  browser_cache_settings:
                    type: object
                    description: Controls Cache-Control headers sent to the client browser.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      control:
                        type: string
                        enum: [default, no-cache, custom]
                        description: '"default" uses default duration; "no-cache" disables browser caching; "custom" uses custom.value.'
                      value:
                        type: string
                        description: Duration when control is "default".
                      custom:
                        type: object
                        properties:
                          value:
                            type: string
                            description: Duration when control is "custom".
                  ignore_cookie:
                    type: object
                    description: Ignore the Set-Cookie header from origin so responses can be cached by the CDN edge. Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                  ignoreQueryString:
                    type: object
                    description: >
                      Controls whether query strings are considered when caching.
                      Mutually exclusive with query_params_blacklist and query_params_whitelist.
                      Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      control:
                        type: string
                        nullable: true
                        description: '"ignore" = strip all query strings before caching; "cache" = include full query string in cache key.'
                      value:
                        type: string
                        nullable: true
                        description: Additional control value (used with specific control modes).
                  query_params_blacklist:
                    type: object
                    description: >
                      Exclude specific query parameters from the cache key.
                      Mutually exclusive with ignoreQueryString and query_params_whitelist. Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      value:
                        type: string
                        nullable: true
                        description: Comma-separated query parameter names to strip from the cache key.
                  query_params_whitelist:
                    type: object
                    description: >
                      Include only specific query parameters in the cache key.
                      Mutually exclusive with ignoreQueryString and query_params_blacklist. Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      value:
                        type: string
                        nullable: true
                        description: Comma-separated query parameter names to keep in the cache key. All others are stripped.
                  segmenter_cache_settings:
                    type: object
                    description: HLS segmenter caching. Only applicable to HTTP Pull zones where zone.optimize is "vod" or "live". Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      midgress_manifest:
                        type: string
                        description: Cache duration for manifest files at midgress tier.
                      edge_manifest:
                        type: string
                        description: Cache duration for manifest files at edge tier.
                      midgress_segment:
                        type: string
                        description: Cache duration for segment files at midgress tier.
                      edge_segment:
                        type: string
                        description: Cache duration for segment files at edge tier.
                  country_acl:
                    type: object
                    description: Allow or block requests from specific countries.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        description: '"allow" = whitelist mode (only listed countries allowed); "deny" = blacklist mode.'
                      excepted_values:
                        type: array
                        items:
                          type: string
                        description: ISO 3166-1 alpha-2 country codes to apply the policy to.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs or CIDR ranges excluded from the country ACL check.
                  ip_address_acl:
                    type: object
                    description: Allow or block requests from specific IP addresses.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        description: '"allow" or "deny".'
                      excepted_values:
                        type: array
                        items:
                          type: string
                        description: IP addresses or CIDR blocks to apply the policy to.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs exempt from this policy.
                  user_agent_acl:
                    type: object
                    description: Allow or block requests based on the User-Agent header.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        description: '"allow" or "deny".'
                      excepted_values:
                        type: array
                        items:
                          type: string
                        description: User-agent strings. Must be non-empty when enabled = true.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs exempt from this policy.
                      casesensitive:
                        type: boolean
                        description: Whether string matching is case-sensitive.
                  referrer_acl:
                    type: object
                    description: Allow or block requests based on the Referer header.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        description: '"allow" or "deny".'
                      noreferer:
                        type: boolean
                        description: Also apply the policy to requests with no Referer header.
                      excepted_values:
                        type: array
                        items:
                          type: string
                        description: Referer domain values. Must be non-empty when enabled = true.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs exempt from this policy.
                  secure_key:
                    type: object
                    description: Protect content with signed URL tokens.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      policy_type:
                        type: integer
                        enum: [0, 1, 2]
                        description: "Token algorithm. 0 = MD5, 1 = SHA1, 2 = SHA256."
                      session:
                        type: integer
                        description: "Session expiry mode. 0 = disabled."
                      key:
                        type: string
                        description: Secret signing key. Must be non-empty when enabled = true.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs allowed without token validation.
                      type:
                        type: boolean
                        description: "false = standard token, true = advanced mode."
                  gzipOn:
                    type: object
                    description: Enable edge GZip compression of responses.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                  fetch_compressed:
                    type: object
                    description: Request compressed content from origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                  brotli_compression:
                    type: object
                    description: Enable Brotli compression.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      value:
                        type: string
                        description: Compression level or mode.
                  slice:
                    type: object
                    description: Splits large files into slices for parallel delivery.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                  limit_bandwidth:
                    type: object
                    description: Per-connection download speed throttling.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      limit_type:
                        type: string
                        enum: [static, dynamic]
                        description: '"static" = fixed speed; "dynamic" = after an initial burst buffer.'
                      speed:
                        type: integer
                        description: Speed cap in bytes/second.
                      buffer:
                        type: integer
                        description: Initial buffer in KB before speed limit kicks in (used with limit_type "dynamic").
                  disposition:
                    type: object
                    description: Sets Content-Disposition attachment on responses.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      value:
                        type: integer
                        description: "0 = use filename from URL; positive integer = custom expiry variant."
                  limit_request:
                    type: object
                    description: Per-IP request rate limiting.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      rate:
                        type: integer
                        description: Allowed requests per second per client.
                      burst:
                        type: integer
                        description: Burst capacity (additional requests allowed above rate).
                      delay:
                        type: integer
                        description: Requests delayed before rejection kicks in.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs exempt from rate limiting.
                  rewrite:
                    type: object
                    description: URL rewrite rule applied before forwarding to origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      body:
                        type: string
                        description: The rewrite rule body (nginx-style rewrite expression).
                      flag:
                        type: string
                        enum: [break, last, redirect, permanent]
                        description: '"break" stops further processing, "last" re-evaluates, "redirect" returns 302, "permanent" returns 301.'
                  host_redirect:
                    type: object
                    description: Redirect requests to a different hostname.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      to:
                        type: string
                        description: Target hostname to redirect to.
                      value:
                        type: array
                        items:
                          type: string
                        description: Additional redirect path mappings.
                  redirect_http_to_https:
                    type: object
                    description: Permanently redirect all HTTP requests to HTTPS (301).
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                  allowedHttpMethods:
                    type: object
                    description: Restrict which HTTP methods the CDN forwards to origin. Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      value:
                        type: string
                        nullable: true
                        description: Comma-separated list of allowed HTTP methods. Requests using other methods are rejected.
                  follow_origin_redirect:
                    type: object
                    description: Follow HTTP redirects returned by the origin. Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      codes:
                        type: array
                        items:
                          type: integer
                        description: HTTP redirect status codes from origin that the CDN should follow and cache the result.
                  hsts:
                    type: object
                    description: HTTP Strict Transport Security configuration.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      referrerPolicy:
                        type: string
                        enum:
                          - no-referrer
                          - no-referrer-when-downgrade
                          - origin
                          - origin-when-cross-origin
                          - same-origin
                          - strict-origin
                          - strict-origin-when-cross-origin
                          - unsafe-url
                        description: Sets the Referrer-Policy header.
                      includeSubDomains:
                        type: boolean
                        description: Include includeSubDomains directive in HSTS header.
                      preload:
                        type: boolean
                        description: Include preload directive (required to be on HSTS preload list).
                  xff:
                    type: object
                    description: Add the X-Forwarded-For header with the client IP when forwarding to origin. Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                  sni:
                    type: object
                    description: SNI hostname used in TLS handshake toward origin. Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      sni_type:
                        type: string
                        enum: [dynamic, custom]
                        description: '"dynamic" = use the incoming request hostname as SNI; "custom" = use custom_hostname.'
                      custom_hostname:
                        type: string
                        description: The hostname to use as the SNI value when sni_type is "custom".
                  image_stack:
                    type: object
                    description: On-the-fly image optimization.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      quality:
                        type: string
                        enum: [Disabled, Low, Medium, High]
                        description: WebP/AVIF output quality preset.
                      webp:
                        type: string
                        enum: [Disabled, Enabled]
                        description: Auto-convert images to WebP.
                      avif:
                        type: string
                        enum: [Disabled, Enabled]
                        description: Auto-convert images to AVIF.
                      png_loseless:
                        type: string
                        enum: ["true", "false"]
                        description: Use lossless encoding for PNG. Sent as string, not boolean.
                  asset_stack:
                    type: object
                    description: >
                      Web performance optimization for CSS and JavaScript assets.
                      The entire asset_stack object in the final payload is replaced by
                      this.asseststack (set via child component updateRule() emission).
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      combine_css:
                        type: boolean
                        description: Combine multiple CSS files into one.
                      MaxCombinedCssBytes:
                        type: integer
                        description: "Max size (bytes) for combined CSS. -1 = unlimited."
                      flatten_css_imports:
                        type: boolean
                        description: Inline @import rules in CSS.
                      CssFlattenMaxBytes:
                        type: integer
                        nullable: true
                        description: Max bytes for CSS flattening.
                      inline_css:
                        type: boolean
                        description: Inline small CSS files into HTML.
                      CssInlineMaxBytes:
                        type: integer
                        nullable: true
                        description: Max size of CSS to inline.
                      outline_css:
                        type: boolean
                        description: Extract inline CSS into external files.
                      CssOutlineMinBytes:
                        type: integer
                        nullable: true
                        description: Min size of inline CSS to extract.
                      rewrite_css:
                        type: boolean
                        description: Rewrite CSS URLs to CDN-hosted paths.
                      fallback_rewrite_css_urls:
                        type: boolean
                        description: Rewrite CSS URL fallbacks.
                      combine_javascript:
                        type: boolean
                        description: Combine multiple JS files into one.
                      MaxCombinedJsBytes:
                        type: integer
                        nullable: true
                        description: Max size for combined JS.
                      defer_javascript:
                        type: boolean
                        description: Add defer attribute to script tags.
                      inline_javascript:
                        type: boolean
                        description: Inline small JS files into HTML.
                      JsInlineMaxBytes:
                        type: integer
                        nullable: true
                        description: Max size of JS to inline.
                      rewrite_javascript:
                        type: boolean
                        description: Rewrite JS source URLs.
                      outline_javascript:
                        type: boolean
                        description: Extract inline JS into external files.
                      JsOutlineMinBytes:
                        type: integer
                        nullable: true
                        description: Min size of inline JS to extract.
                      collapse_whitespace:
                        type: boolean
                        description: Collapse HTML whitespace.
                      remove_comments:
                        type: boolean
                        description: Strip HTML comments.
                      remove_quotes:
                        type: boolean
                        description: Remove unnecessary attribute quotes in HTML.
                      CombineAcrossPaths:
                        type: boolean
                        description: Combine assets across different URL paths.
                  cms:
                    type: object
                    description: CMS-specific caching optimizations. Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      value:
                        type: array
                        items:
                          type: string
                        description: CMS platform(s) to optimize for. CDN applies platform-specific caching and bypass rules.
                  force_return:
                    type: object
                    description: Return a fixed HTTP status code for matched requests.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      code:
                        type: integer
                        description: HTTP status code to return for matched requests.
                      body:
                        type: string
                        description: Response body to return with the forced status code.
                  stale:
                    type: object
                    description: Serve stale cached content if origin is unreachable.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      value:
                        type: string
                        description: How long to serve stale content.
                  staticHeaders:
                    type: object
                    description: Add or override response headers.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      keys:
                        type: array
                        items:
                          type: string
                        description: Header names to add/override in the response. Parallel-indexed with values.
                      values:
                        type: array
                        items:
                          type: string
                        description: Corresponding header values.
                  staticRequestHeaders:
                    type: object
                    description: Adds or overrides headers on the request forwarded to origin. Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      keys:
                        type: array
                        items:
                          type: string
                        description: Header names to add/override in the request to origin. Parallel-indexed with values.
                      values:
                        type: array
                        items:
                          type: string
                        description: Corresponding header values.
                  response_headers_hiding_policy:
                    type: object
                    description: Suppress specific response headers before delivery to the client. Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      mode:
                        type: string
                        enum: [hide, show]
                        description: '"hide" = remove listed headers from response; "show" = remove all except listed.'
                      expected:
                        type: object
                        properties:
                          hide:
                            type: array
                            items:
                              type: string
                            description: Header names to strip from the response when mode is "hide".
                          show:
                            type: array
                            items:
                              type: string
                            description: Header names to keep in the response when mode is "show". All others are removed.
                  hostHeader:
                    type: object
                    description: >
                      Controls the Host header sent to origin. Pull only.
                      The system uses hostHeader for the setting; forward_host_header is a legacy alias — both must be sent.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      control:
                        type: string
                        enum: [forward, custom]
                        description: '"forward" = forward the client original Host header; "custom" = use the custom value below.'
                      custom:
                        type: string
                        description: Custom hostname to use as the Host header when control is "custom".
                  forward_host_header:
                    type: object
                    description: Legacy alias for the Host Header setting. Send alongside hostHeader. Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                  honor_vary:
                    type: object
                    description: >
                      Respect the Vary header from origin when building the cache key
                      (e.g., Vary: Accept-Encoding). Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                  cors:
                    type: object
                    description: CORS header support.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      control:
                        type: string
                        description: '"*" = wildcard (allow all origins); "custom" = restrict to specific origin.'
                      always:
                        type: boolean
                        description: Add CORS headers to all responses including error responses.
                      value:
                        type: string
                        description: Access-Control-Allow-Origin header value.
                      custom:
                        type: string
                        description: Used when control is "custom"; the specific allowed origin.
          example:
            _METHOD: PUT
            name: Cache Images
            rule: /images/*
            options:
              edge_cache_settings:
                enabled: null
                control: default
                default: 345600s
                value: 345600s
                revalidate: null
                custom: { default: "", value: "" }
                custom_values: { codes: [], value: [] }
              midgress_cache_settings:
                enabled: null
                control: default
                default: 345600s
                value: 345600s
                revalidate: null
                custom: { default: "", value: "" }
                custom_values: { codes: [], value: [] }
              browser_cache_settings:
                enabled: null
                control: default
                value: 345600s
                custom: { value: "" }
              ignore_cookie: { enabled: null }
              ignoreQueryString: { enabled: null, control: null, value: null }
              query_params_blacklist: { enabled: null, value: null }
              query_params_whitelist: { enabled: null, value: null }
              segmenter_cache_settings:
                enabled: null
                midgress_manifest: ""
                edge_manifest: ""
                midgress_segment: ""
                edge_segment: ""
              country_acl:
                enabled: null
                policy_type: allow
                excepted_values: []
                ip_whitelists: []
              ip_address_acl:
                enabled: null
                policy_type: allow
                excepted_values: []
                ip_whitelists: []
              user_agent_acl:
                enabled: null
                policy_type: allow
                excepted_values: []
                ip_whitelists: []
                casesensitive: false
              referrer_acl:
                enabled: null
                policy_type: allow
                noreferer: false
                excepted_values: []
                ip_whitelists: []
              secure_key:
                enabled: null
                policy_type: 0
                session: 0
                key: ""
                ip_whitelists: []
                type: false
              gzipOn: { enabled: null }
              fetch_compressed: { enabled: null }
              brotli_compression: { enabled: null, value: "" }
              slice: { enabled: null }
              limit_bandwidth:
                enabled: null
                limit_type: static
                speed: 12000
                buffer: 1024
              disposition: { enabled: null, value: 0 }
              limit_request:
                enabled: null
                rate: 9
                burst: 98
                delay: 96
                ip_whitelists: []
              rewrite: { enabled: null, body: "", flag: break }
              host_redirect: { enabled: null, to: "", value: [] }
              redirect_http_to_https: { enabled: null }
              allowedHttpMethods: { enabled: null, value: null }
              follow_origin_redirect: { enabled: null, codes: [] }
              hsts:
                enabled: null
                referrerPolicy: no-referrer
                includeSubDomains: true
                preload: true
              xff: { enabled: null }
              sni: { enabled: null, sni_type: dynamic, custom_hostname: "" }
              image_stack:
                enabled: null
                quality: Disabled
                webp: Disabled
                avif: Disabled
                png_loseless: "true"
              asset_stack:
                enabled: null
                combine_css: false
                MaxCombinedCssBytes: -1
                flatten_css_imports: false
                CssFlattenMaxBytes: null
                inline_css: false
                CssInlineMaxBytes: null
                outline_css: false
                CssOutlineMinBytes: null
                rewrite_css: false
                fallback_rewrite_css_urls: false
                combine_javascript: false
                MaxCombinedJsBytes: null
                defer_javascript: false
                inline_javascript: false
                JsInlineMaxBytes: null
                rewrite_javascript: false
                outline_javascript: false
                JsOutlineMinBytes: null
                collapse_whitespace: false
                remove_comments: false
                remove_quotes: false
                CombineAcrossPaths: false
              cms: { enabled: null, value: [] }
              force_return: { enabled: null, code: 200, body: "" }
              stale: { enabled: null, value: "" }
              staticHeaders: { enabled: null, keys: [], values: [] }
              staticRequestHeaders: { enabled: null, keys: [], values: [] }
              response_headers_hiding_policy:
                enabled: null
                mode: hide
                expected: { hide: [], show: [] }
              hostHeader: { enabled: null, control: forward, custom: "" }
              forward_host_header: { enabled: null }
              honor_vary: { enabled: null }
              cors:
                enabled: null
                control: "*"
                always: false
                value: "*"
                custom: ""

    CreateRuleBody_httpPush:
      required: true
      description: >
        Request body for creating an edge rule on an HTTP Push zone.
        Must include `"_METHOD": "PUT"`. Options excluded for HTTP Push zones:
        ignore_cookie, ignoreQueryString, query_params_blacklist, query_params_whitelist,
        segmenter_cache_settings, allowedHttpMethods, follow_origin_redirect, xff, sni,
        tls_versions, cms, staticRequestHeaders, response_headers_hiding_policy,
        hostHeader, forward_host_header, honor_vary.
      content:
        application/json:
          schema:
            type: object
            required: [_METHOD, name, rule, options]
            properties:
              _METHOD:
                type: string
                enum: [PUT]
                description: HTTP method override. Always "PUT" for create.
              name:
                type: string
                description: Human-readable label for the rule.
              rule:
                type: string
                description: >
                  URL pattern or regex applied to incoming requests.
                  Validated via /validate/rule.
              options:
                type: object
                description: Container for all behavior option groups.
                properties:
                  edge_cache_settings:
                    type: object
                    description: Controls how long the edge CDN caches content.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "true = active, false = disabled, null = inherit from default."
                      control:
                        type: string
                        enum: [default, value, no-cache]
                        description: Selects which cache duration mode applies.
                      default:
                        type: string
                        description: Duration used when control is "default".
                      value:
                        type: string
                        description: Duration used when control is "value".
                      revalidate:
                        type: string
                        nullable: true
                        description: Revalidation time directive.
                      custom:
                        type: object
                        properties:
                          default:
                            type: string
                            description: Custom pattern default value.
                          value:
                            type: string
                            description: Custom pattern override value.
                      custom_values:
                        type: object
                        description: Per-path-pattern cache overrides.
                        properties:
                          codes:
                            type: array
                            description: Each inner array is a list of path patterns for one override rule.
                            items:
                              type: array
                              items:
                                type: string
                          value:
                            type: array
                            description: Cache duration per override group, parallel-indexed with codes.
                            items:
                              type: string
                  midgress_cache_settings:
                    type: object
                    description: Controls midgress (mid-tier) cache duration. Identical structure to edge_cache_settings.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      control:
                        type: string
                        enum: [default, value]
                        description: '"default" or "value".'
                      default:
                        type: string
                        description: Duration for default mode.
                      value:
                        type: string
                        description: Duration for value mode.
                      revalidate:
                        type: string
                        nullable: true
                        description: Revalidation directive.
                      custom:
                        type: object
                        properties:
                          default:
                            type: string
                          value:
                            type: string
                      custom_values:
                        type: object
                        properties:
                          codes:
                            type: array
                            items:
                              type: array
                              items:
                                type: string
                          value:
                            type: array
                            items:
                              type: string
                  browser_cache_settings:
                    type: object
                    description: Controls Cache-Control headers sent to the client browser.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      control:
                        type: string
                        enum: [default, no-cache, custom]
                        description: '"default" uses default duration; "no-cache" disables browser caching; "custom" uses custom.value.'
                      value:
                        type: string
                        description: Duration when control is "default".
                      custom:
                        type: object
                        properties:
                          value:
                            type: string
                            description: Duration when control is "custom".
                  country_acl:
                    type: object
                    description: Allow or block requests from specific countries.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        description: '"allow" = whitelist mode (only listed countries allowed); "deny" = blacklist mode.'
                      excepted_values:
                        type: array
                        items:
                          type: string
                        description: ISO 3166-1 alpha-2 country codes to apply the policy to.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs or CIDR ranges excluded from the country ACL check.
                  ip_address_acl:
                    type: object
                    description: Allow or block requests from specific IP addresses.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        description: '"allow" or "deny".'
                      excepted_values:
                        type: array
                        items:
                          type: string
                        description: IP addresses or CIDR blocks to apply the policy to.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs exempt from this policy.
                  user_agent_acl:
                    type: object
                    description: Allow or block requests based on the User-Agent header.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        description: '"allow" or "deny".'
                      excepted_values:
                        type: array
                        items:
                          type: string
                        description: User-agent strings to apply the policy to. Must be non-empty when enabled = true.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs exempt from this policy.
                      casesensitive:
                        type: boolean
                        description: Whether string matching is case-sensitive.
                  referrer_acl:
                    type: object
                    description: Allow or block requests based on the Referer header.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        description: '"allow" or "deny".'
                      noreferer:
                        type: boolean
                        description: Whether to also apply the policy to requests with no Referer header.
                      excepted_values:
                        type: array
                        items:
                          type: string
                        description: Referer domain values. Must be non-empty when enabled = true.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs exempt from this policy.
                  secure_key:
                    type: object
                    description: Protect content with signed URL tokens.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      policy_type:
                        type: integer
                        enum: [0, 1, 2]
                        description: "Token algorithm. 0 = MD5, 1 = SHA1, 2 = SHA256."
                      session:
                        type: integer
                        description: "Session expiry mode. 0 = disabled."
                      key:
                        type: string
                        description: The secret signing key. Must be non-empty when enabled = true.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs allowed without token validation.
                      type:
                        type: boolean
                        description: "false = standard token, true = advanced mode."
                  gzipOn:
                    type: object
                    description: Enable edge GZip compression of responses.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "true = active, false = disabled, null = inherit from default."
                  fetch_compressed:
                    type: object
                    description: Request compressed content from origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                  brotli_compression:
                    type: object
                    description: Enable Brotli compression.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      value:
                        type: string
                        description: Compression level or mode.
                  slice:
                    type: object
                    description: Splits large files into slices for parallel delivery.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                  limit_bandwidth:
                    type: object
                    description: Per-connection download speed throttling.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      limit_type:
                        type: string
                        enum: [static, dynamic]
                        description: '"static" = fixed speed; "dynamic" = after an initial burst buffer.'
                      speed:
                        type: integer
                        description: Speed cap in bytes/second.
                      buffer:
                        type: integer
                        description: Initial buffer in KB before the speed limit kicks in (used with limit_type "dynamic").
                  disposition:
                    type: object
                    description: Sets Content-Disposition attachment on responses.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      value:
                        type: integer
                        description: "0 = use filename from URL; any positive integer = custom expiry variant."
                  limit_request:
                    type: object
                    description: Per-IP request rate limiting.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      rate:
                        type: integer
                        description: Allowed requests per second per client.
                      burst:
                        type: integer
                        description: Burst capacity (additional requests allowed above rate).
                      delay:
                        type: integer
                        description: Requests delayed before rejection kicks in.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs exempt from rate limiting.
                  rewrite:
                    type: object
                    description: URL rewrite rule applied before forwarding to origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      body:
                        type: string
                        description: The rewrite rule body (nginx-style rewrite expression).
                      flag:
                        type: string
                        enum: [break, last, redirect, permanent]
                        description: '"break" stops further rule processing, "last" re-evaluates from first rule, "redirect" returns 302, "permanent" returns 301.'
                  host_redirect:
                    type: object
                    description: Redirect requests to a different hostname.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      to:
                        type: string
                        description: The target hostname to redirect to.
                      value:
                        type: array
                        items:
                          type: string
                        description: Additional redirect path mappings.
                  redirect_http_to_https:
                    type: object
                    description: Permanently redirect all HTTP requests to HTTPS (301).
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                  hsts:
                    type: object
                    description: HTTP Strict Transport Security configuration.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      referrerPolicy:
                        type: string
                        enum:
                          - no-referrer
                          - no-referrer-when-downgrade
                          - origin
                          - origin-when-cross-origin
                          - same-origin
                          - strict-origin
                          - strict-origin-when-cross-origin
                          - unsafe-url
                        description: Sets the Referrer-Policy header.
                      includeSubDomains:
                        type: boolean
                        description: Include includeSubDomains directive in HSTS header.
                      preload:
                        type: boolean
                        description: Include preload directive (required to be on HSTS preload list).
                  image_stack:
                    type: object
                    description: On-the-fly image optimization.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      quality:
                        type: string
                        enum: [Disabled, Low, Medium, High]
                        description: WebP/AVIF output quality preset.
                      webp:
                        type: string
                        enum: [Disabled, Enabled]
                        description: Auto-convert images to WebP.
                      avif:
                        type: string
                        enum: [Disabled, Enabled]
                        description: Auto-convert images to AVIF.
                      png_loseless:
                        type: string
                        enum: ["true", "false"]
                        description: Use lossless encoding for PNG. Sent as string, not boolean.
                  asset_stack:
                    type: object
                    description: >
                      Web performance optimization for CSS and JavaScript assets.
                      The entire asset_stack object in the final payload is replaced by
                      this.asseststack (set via child component updateRule() emission).
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      combine_css:
                        type: boolean
                        description: Combine multiple CSS files into one.
                      MaxCombinedCssBytes:
                        type: integer
                        description: "Max size (bytes) for combined CSS. -1 = unlimited."
                      flatten_css_imports:
                        type: boolean
                        description: Inline @import rules in CSS.
                      CssFlattenMaxBytes:
                        type: integer
                        nullable: true
                        description: Max bytes for CSS flattening.
                      inline_css:
                        type: boolean
                        description: Inline small CSS files into HTML.
                      CssInlineMaxBytes:
                        type: integer
                        nullable: true
                        description: Max size of CSS to inline.
                      outline_css:
                        type: boolean
                        description: Extract inline CSS into external files.
                      CssOutlineMinBytes:
                        type: integer
                        nullable: true
                        description: Min size of inline CSS to extract.
                      rewrite_css:
                        type: boolean
                        description: Rewrite CSS URLs to CDN-hosted paths.
                      fallback_rewrite_css_urls:
                        type: boolean
                        description: Rewrite CSS URL fallbacks.
                      combine_javascript:
                        type: boolean
                        description: Combine multiple JS files into one.
                      MaxCombinedJsBytes:
                        type: integer
                        nullable: true
                        description: Max size for combined JS.
                      defer_javascript:
                        type: boolean
                        description: Add defer attribute to script tags.
                      inline_javascript:
                        type: boolean
                        description: Inline small JS files into HTML.
                      JsInlineMaxBytes:
                        type: integer
                        nullable: true
                        description: Max size of JS to inline.
                      rewrite_javascript:
                        type: boolean
                        description: Rewrite JS source URLs.
                      outline_javascript:
                        type: boolean
                        description: Extract inline JS into external files.
                      JsOutlineMinBytes:
                        type: integer
                        nullable: true
                        description: Min size of inline JS to extract.
                      collapse_whitespace:
                        type: boolean
                        description: Collapse HTML whitespace.
                      remove_comments:
                        type: boolean
                        description: Strip HTML comments.
                      remove_quotes:
                        type: boolean
                        description: Remove unnecessary attribute quotes in HTML.
                      CombineAcrossPaths:
                        type: boolean
                        description: Combine assets across different URL paths.
                  force_return:
                    type: object
                    description: Return a fixed HTTP status code for matched requests.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      code:
                        type: integer
                        description: HTTP status code to return for matched requests.
                      body:
                        type: string
                        description: Response body to return with the forced status code.
                  stale:
                    type: object
                    description: Serve stale cached content if origin is unreachable.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      value:
                        type: string
                        description: How long to serve stale content.
                  staticHeaders:
                    type: object
                    description: Add or override response headers.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      keys:
                        type: array
                        items:
                          type: string
                        description: Header names to add/override in the response. Parallel-indexed with values.
                      values:
                        type: array
                        items:
                          type: string
                        description: Corresponding header values.
                  cors:
                    type: object
                    description: CORS header support.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      control:
                        type: string
                        description: '"*" = wildcard (allow all origins); "custom" = restrict to specific origin.'
                      always:
                        type: boolean
                        description: Add CORS headers to all responses including error responses.
                      value:
                        type: string
                        description: Access-Control-Allow-Origin header value.
                      custom:
                        type: string
                        description: Used when control is "custom"; the specific allowed origin.
          example:
            _METHOD: PUT
            name: Cache Images
            rule: /images/*
            options:
              edge_cache_settings:
                enabled: null
                control: default
                default: 345600s
                value: 345600s
                revalidate: null
                custom: { default: "", value: "" }
                custom_values: { codes: [], value: [] }
              midgress_cache_settings:
                enabled: null
                control: default
                default: 345600s
                value: 345600s
                revalidate: null
                custom: { default: "", value: "" }
                custom_values: { codes: [], value: [] }
              browser_cache_settings:
                enabled: null
                control: default
                value: 345600s
                custom: { value: "" }
              country_acl:
                enabled: null
                policy_type: allow
                excepted_values: []
                ip_whitelists: []
              ip_address_acl:
                enabled: null
                policy_type: allow
                excepted_values: []
                ip_whitelists: []
              user_agent_acl:
                enabled: null
                policy_type: allow
                excepted_values: []
                ip_whitelists: []
                casesensitive: false
              referrer_acl:
                enabled: null
                policy_type: allow
                noreferer: false
                excepted_values: []
                ip_whitelists: []
              secure_key:
                enabled: null
                policy_type: 0
                session: 0
                key: ""
                ip_whitelists: []
                type: false
              gzipOn: { enabled: null }
              fetch_compressed: { enabled: null }
              brotli_compression: { enabled: null, value: "" }
              slice: { enabled: null }
              limit_bandwidth:
                enabled: null
                limit_type: static
                speed: 12000
                buffer: 1024
              disposition: { enabled: null, value: 0 }
              limit_request:
                enabled: null
                rate: 9
                burst: 98
                delay: 96
                ip_whitelists: []
              rewrite: { enabled: null, body: "", flag: break }
              host_redirect: { enabled: null, to: "", value: [] }
              redirect_http_to_https: { enabled: null }
              hsts:
                enabled: null
                referrerPolicy: no-referrer
                includeSubDomains: true
                preload: true
              image_stack:
                enabled: null
                quality: Disabled
                webp: Disabled
                avif: Disabled
                png_loseless: "true"
              asset_stack:
                enabled: null
                combine_css: false
                MaxCombinedCssBytes: -1
                flatten_css_imports: false
                CssFlattenMaxBytes: null
                inline_css: false
                CssInlineMaxBytes: null
                outline_css: false
                CssOutlineMinBytes: null
                rewrite_css: false
                fallback_rewrite_css_urls: false
                combine_javascript: false
                MaxCombinedJsBytes: null
                defer_javascript: false
                inline_javascript: false
                JsInlineMaxBytes: null
                rewrite_javascript: false
                outline_javascript: false
                JsOutlineMinBytes: null
                collapse_whitespace: false
                remove_comments: false
                remove_quotes: false
                CombineAcrossPaths: false
              force_return: { enabled: null, code: 200, body: "" }
              stale: { enabled: null, value: "" }
              staticHeaders: { enabled: null, keys: [], values: [] }
              cors:
                enabled: null
                control: "*"
                always: false
                value: "*"
                custom: ""

    CreateRuleBody_vodPull:
      required: true
      description: >
        Request body for creating an edge rule on a VOD Pull zone.
        Must include `"_METHOD": "PUT"`. Excluded options: segmenter_cache_settings,
        gzipOn, fetch_compressed, brotli_compression, slice, disposition,
        allowedHttpMethods, image_stack, asset_stack, cms, honor_vary, tls_versions.
        Query string options (ignoreQueryString, query_params_blacklist,
        query_params_whitelist) are mutually exclusive — only one should have
        enabled = true at a time.
      content:
        application/json:
          schema:
            type: object
            required: [_METHOD, name, rule, options]
            properties:
              _METHOD:
                type: string
                enum: [PUT]
                description: HTTP method override. Always "PUT" for create.
              name:
                type: string
                description: Human-readable label for the rule.
              rule:
                type: string
                description: >
                  URL pattern or regex applied to incoming requests.
                  Validated via /validate/rule.
              options:
                type: object
                description: Container for all behavior option groups.
                properties:
                  edge_cache_settings:
                    type: object
                    description: Controls how long the edge CDN caches content.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "true = active, false = disabled, null = inherit from default."
                      control:
                        type: string
                        enum: [default, value, no-cache]
                        description: Selects which cache duration mode applies.
                      default:
                        type: string
                        description: Duration used when control is "default".
                      value:
                        type: string
                        description: Duration used when control is "value".
                      revalidate:
                        type: string
                        nullable: true
                        description: Revalidation time directive.
                      custom:
                        type: object
                        properties:
                          default:
                            type: string
                            description: Custom pattern default value.
                          value:
                            type: string
                            description: Custom pattern override value.
                      custom_values:
                        type: object
                        description: Per-path-pattern cache overrides.
                        properties:
                          codes:
                            type: array
                            description: Each inner array is a list of path patterns for one override rule.
                            items:
                              type: array
                              items:
                                type: string
                          value:
                            type: array
                            description: Cache duration per override group, parallel-indexed with codes.
                            items:
                              type: string
                  midgress_cache_settings:
                    type: object
                    description: Controls midgress (mid-tier) cache duration. Identical structure to edge_cache_settings.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      control:
                        type: string
                        enum: [default, value]
                        description: '"default" or "value".'
                      default:
                        type: string
                        description: Duration for default mode.
                      value:
                        type: string
                        description: Duration for value mode.
                      revalidate:
                        type: string
                        nullable: true
                        description: Revalidation directive.
                      custom:
                        type: object
                        properties:
                          default:
                            type: string
                          value:
                            type: string
                      custom_values:
                        type: object
                        properties:
                          codes:
                            type: array
                            items:
                              type: array
                              items:
                                type: string
                          value:
                            type: array
                            items:
                              type: string
                  browser_cache_settings:
                    type: object
                    description: Controls Cache-Control headers sent to the client browser.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      control:
                        type: string
                        enum: [default, no-cache, custom]
                        description: '"default" uses default duration; "no-cache" disables browser caching; "custom" uses custom.value.'
                      value:
                        type: string
                        description: Duration when control is "default".
                      custom:
                        type: object
                        properties:
                          value:
                            type: string
                            description: Duration when control is "custom".
                  ignore_cookie:
                    type: object
                    description: Ignore the Set-Cookie header from origin so responses can be cached by the CDN edge. Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                  ignoreQueryString:
                    type: object
                    description: >
                      Controls whether query strings are considered when caching.
                      Mutually exclusive with query_params_blacklist and query_params_whitelist. Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      control:
                        type: string
                        nullable: true
                        description: '"ignore" = strip all query strings before caching; "cache" = include full query string in cache key.'
                      value:
                        type: string
                        nullable: true
                        description: Additional control value (used with specific control modes).
                  query_params_blacklist:
                    type: object
                    description: >
                      Exclude specific query parameters from the cache key.
                      Mutually exclusive with ignoreQueryString and query_params_whitelist. Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      value:
                        type: string
                        nullable: true
                        description: Comma-separated query parameter names to strip from the cache key.
                  query_params_whitelist:
                    type: object
                    description: >
                      Include only specific query parameters in the cache key.
                      Mutually exclusive with ignoreQueryString and query_params_blacklist. Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      value:
                        type: string
                        nullable: true
                        description: Comma-separated query parameter names to keep in the cache key. All others are stripped.
                  country_acl:
                    type: object
                    description: Allow or block requests from specific countries.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        description: '"allow" = whitelist mode (only listed countries allowed); "deny" = blacklist mode.'
                      excepted_values:
                        type: array
                        items:
                          type: string
                        description: ISO 3166-1 alpha-2 country codes to apply the policy to.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs or CIDR ranges excluded from the country ACL check.
                  ip_address_acl:
                    type: object
                    description: Allow or block requests from specific IP addresses.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        description: '"allow" or "deny".'
                      excepted_values:
                        type: array
                        items:
                          type: string
                        description: IP addresses or CIDR blocks to apply the policy to.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs exempt from this policy.
                  user_agent_acl:
                    type: object
                    description: Allow or block requests based on the User-Agent header.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        description: '"allow" or "deny".'
                      excepted_values:
                        type: array
                        items:
                          type: string
                        description: User-agent strings. Must be non-empty when enabled = true.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs exempt from this policy.
                      casesensitive:
                        type: boolean
                        description: Whether string matching is case-sensitive.
                  referrer_acl:
                    type: object
                    description: Allow or block requests based on the Referer header.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        description: '"allow" or "deny".'
                      noreferer:
                        type: boolean
                        description: Also apply the policy to requests with no Referer header.
                      excepted_values:
                        type: array
                        items:
                          type: string
                        description: Referer domain values. Must be non-empty when enabled = true.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs exempt from this policy.
                  secure_key:
                    type: object
                    description: Protect content with signed URL tokens.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      policy_type:
                        type: integer
                        enum: [0, 1, 2]
                        description: "Token algorithm. 0 = MD5, 1 = SHA1, 2 = SHA256."
                      session:
                        type: integer
                        description: "Session expiry mode. 0 = disabled."
                      key:
                        type: string
                        description: Secret signing key. Must be non-empty when enabled = true.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs allowed without token validation.
                      type:
                        type: boolean
                        description: "false = standard token, true = advanced mode."
                  limit_bandwidth:
                    type: object
                    description: Per-connection download speed throttling.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      limit_type:
                        type: string
                        enum: [static, dynamic]
                        description: '"static" = fixed speed; "dynamic" = after an initial burst buffer.'
                      speed:
                        type: integer
                        description: Speed cap in bytes/second.
                      buffer:
                        type: integer
                        description: Initial buffer in KB before speed limit kicks in (used with limit_type "dynamic").
                  limit_request:
                    type: object
                    description: Per-IP request rate limiting.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      rate:
                        type: integer
                        description: Allowed requests per second per client.
                      burst:
                        type: integer
                        description: Burst capacity (additional requests allowed above rate).
                      delay:
                        type: integer
                        description: Requests delayed before rejection kicks in.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs exempt from rate limiting.
                  rewrite:
                    type: object
                    description: URL rewrite rule applied before forwarding to origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      body:
                        type: string
                        description: The rewrite rule body (nginx-style rewrite expression).
                      flag:
                        type: string
                        enum: [break, last, redirect, permanent]
                        description: '"break" stops further processing, "last" re-evaluates, "redirect" returns 302, "permanent" returns 301.'
                  host_redirect:
                    type: object
                    description: Redirect requests to a different hostname.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      to:
                        type: string
                        description: Target hostname to redirect to.
                      value:
                        type: array
                        items:
                          type: string
                        description: Additional redirect path mappings.
                  redirect_http_to_https:
                    type: object
                    description: Permanently redirect all HTTP requests to HTTPS (301).
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                  follow_origin_redirect:
                    type: object
                    description: Follow HTTP redirects returned by the origin. Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      codes:
                        type: array
                        items:
                          type: integer
                        description: HTTP redirect status codes from origin that the CDN should follow and cache the result.
                  hsts:
                    type: object
                    description: HTTP Strict Transport Security configuration.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      referrerPolicy:
                        type: string
                        enum:
                          - no-referrer
                          - no-referrer-when-downgrade
                          - origin
                          - origin-when-cross-origin
                          - same-origin
                          - strict-origin
                          - strict-origin-when-cross-origin
                          - unsafe-url
                        description: Sets the Referrer-Policy header.
                      includeSubDomains:
                        type: boolean
                        description: Include includeSubDomains directive in HSTS header.
                      preload:
                        type: boolean
                        description: Include preload directive (required to be on HSTS preload list).
                  xff:
                    type: object
                    description: Add the X-Forwarded-For header with the client IP when forwarding to origin. Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                  sni:
                    type: object
                    description: SNI hostname used in TLS handshake toward origin. Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      sni_type:
                        type: string
                        enum: [dynamic, custom]
                        description: '"dynamic" = use the incoming request hostname as SNI; "custom" = use custom_hostname.'
                      custom_hostname:
                        type: string
                        description: The hostname to use as the SNI value when sni_type is "custom".
                  force_return:
                    type: object
                    description: Return a fixed HTTP status code for matched requests.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      code:
                        type: integer
                        description: HTTP status code to return for matched requests.
                      body:
                        type: string
                        description: Response body to return with the forced status code.
                  stale:
                    type: object
                    description: Serve stale cached content if origin is unreachable.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      value:
                        type: string
                        description: How long to serve stale content.
                  staticHeaders:
                    type: object
                    description: Add or override response headers.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      keys:
                        type: array
                        items:
                          type: string
                        description: Header names to add/override in the response. Parallel-indexed with values.
                      values:
                        type: array
                        items:
                          type: string
                        description: Corresponding header values.
                  staticRequestHeaders:
                    type: object
                    description: Adds or overrides headers on the request forwarded to origin. Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      keys:
                        type: array
                        items:
                          type: string
                        description: Header names to add/override in the request to origin. Parallel-indexed with values.
                      values:
                        type: array
                        items:
                          type: string
                        description: Corresponding header values.
                  response_headers_hiding_policy:
                    type: object
                    description: Suppress specific response headers before delivery to the client. Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      mode:
                        type: string
                        enum: [hide, show]
                        description: '"hide" = remove listed headers from response; "show" = remove all except listed.'
                      expected:
                        type: object
                        properties:
                          hide:
                            type: array
                            items:
                              type: string
                            description: Header names to strip from the response when mode is "hide".
                          show:
                            type: array
                            items:
                              type: string
                            description: Header names to keep in the response when mode is "show". All others are removed.
                  hostHeader:
                    type: object
                    description: >
                      Controls the Host header sent to origin. Pull only.
                      Send alongside forward_host_header which is its legacy alias.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      control:
                        type: string
                        enum: [forward, custom]
                        description: '"forward" = forward the client original Host header; "custom" = use the custom value below.'
                      custom:
                        type: string
                        description: Custom hostname to use as the Host header when control is "custom".
                  forward_host_header:
                    type: object
                    description: Legacy alias for the Host Header setting. Send alongside hostHeader. Pull only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                  cors:
                    type: object
                    description: CORS header support.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      control:
                        type: string
                        description: '"*" = wildcard (allow all origins); "custom" = restrict to specific origin.'
                      always:
                        type: boolean
                        description: Add CORS headers to all responses including error responses.
                      value:
                        type: string
                        description: Access-Control-Allow-Origin header value.
                      custom:
                        type: string
                        description: Used when control is "custom"; the specific allowed origin.
          example:
            _METHOD: PUT
            name: Cache Segments
            rule: /stream/*
            options:
              edge_cache_settings:
                enabled: null
                control: default
                default: 345600s
                value: 345600s
                revalidate: null
                custom: { default: "", value: "" }
                custom_values: { codes: [], value: [] }
              midgress_cache_settings:
                enabled: null
                control: default
                default: 345600s
                value: 345600s
                revalidate: null
                custom: { default: "", value: "" }
                custom_values: { codes: [], value: [] }
              browser_cache_settings:
                enabled: null
                control: default
                value: 345600s
                custom: { value: "" }
              ignore_cookie: { enabled: null }
              ignoreQueryString: { enabled: null, control: null, value: null }
              query_params_blacklist: { enabled: null, value: null }
              query_params_whitelist: { enabled: null, value: null }
              country_acl:
                enabled: null
                policy_type: allow
                excepted_values: []
                ip_whitelists: []
              ip_address_acl:
                enabled: null
                policy_type: allow
                excepted_values: []
                ip_whitelists: []
              user_agent_acl:
                enabled: null
                policy_type: allow
                excepted_values: []
                ip_whitelists: []
                casesensitive: false
              referrer_acl:
                enabled: null
                policy_type: allow
                noreferer: false
                excepted_values: []
                ip_whitelists: []
              secure_key:
                enabled: null
                policy_type: 0
                session: 0
                key: ""
                ip_whitelists: []
                type: false
              limit_bandwidth:
                enabled: null
                limit_type: static
                speed: 12000
                buffer: 1024
              limit_request:
                enabled: null
                rate: 9
                burst: 98
                delay: 96
                ip_whitelists: []
              rewrite: { enabled: null, body: "", flag: break }
              host_redirect: { enabled: null, to: "", value: [] }
              redirect_http_to_https: { enabled: null }
              follow_origin_redirect: { enabled: null, codes: [] }
              hsts:
                enabled: null
                referrerPolicy: no-referrer
                includeSubDomains: true
                preload: true
              xff: { enabled: null }
              sni: { enabled: null, sni_type: dynamic, custom_hostname: "" }
              force_return: { enabled: null, code: 200, body: "" }
              stale: { enabled: null, value: "" }
              staticHeaders: { enabled: null, keys: [], values: [] }
              staticRequestHeaders: { enabled: null, keys: [], values: [] }
              response_headers_hiding_policy:
                enabled: null
                mode: hide
                expected: { hide: [], show: [] }
              hostHeader: { enabled: null, control: forward, custom: "" }
              forward_host_header: { enabled: null }
              cors:
                enabled: null
                control: "*"
                always: false
                value: "*"
                custom: ""

    CreateRuleBody_vodPush:
      required: true
      description: >
        Request body for creating an edge rule on a VOD Push zone.
        Must include `"_METHOD": "PUT"`. Excluded options: ignore_cookie,
        ignoreQueryString, query_params_blacklist, query_params_whitelist,
        segmenter_cache_settings, gzipOn, fetch_compressed, brotli_compression,
        slice, disposition, allowedHttpMethods, follow_origin_redirect, xff, sni,
        image_stack, asset_stack, cms, staticRequestHeaders,
        response_headers_hiding_policy, hostHeader, forward_host_header,
        honor_vary, tls_versions.
      content:
        application/json:
          schema:
            type: object
            required: [_METHOD, name, rule, options]
            properties:
              _METHOD:
                type: string
                enum: [PUT]
                description: HTTP method override. Always "PUT" for create.
              name:
                type: string
                description: Human-readable label for the rule.
              rule:
                type: string
                description: >
                  URL pattern or regex applied to incoming requests.
                  Validated via /validate/rule.
              options:
                type: object
                description: Container for all behavior option groups.
                properties:
                  edge_cache_settings:
                    type: object
                    description: Controls how long the edge CDN caches content.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "true = active, false = disabled, null = inherit from default."
                      control:
                        type: string
                        enum: [default, value, no-cache]
                        description: Selects which cache duration mode applies.
                      default:
                        type: string
                        description: Duration used when control is "default".
                      value:
                        type: string
                        description: Duration used when control is "value".
                      revalidate:
                        type: string
                        nullable: true
                        description: Revalidation time directive.
                      custom:
                        type: object
                        properties:
                          default:
                            type: string
                            description: Custom pattern default value.
                          value:
                            type: string
                            description: Custom pattern override value.
                      custom_values:
                        type: object
                        description: Per-path-pattern cache overrides.
                        properties:
                          codes:
                            type: array
                            description: Each inner array is a list of path patterns for one override rule.
                            items:
                              type: array
                              items:
                                type: string
                          value:
                            type: array
                            description: Cache duration per override group, parallel-indexed with codes.
                            items:
                              type: string
                  midgress_cache_settings:
                    type: object
                    description: Controls midgress (mid-tier) cache duration. Identical structure to edge_cache_settings.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      control:
                        type: string
                        enum: [default, value]
                        description: '"default" or "value".'
                      default:
                        type: string
                        description: Duration for default mode.
                      value:
                        type: string
                        description: Duration for value mode.
                      revalidate:
                        type: string
                        nullable: true
                        description: Revalidation directive.
                      custom:
                        type: object
                        properties:
                          default:
                            type: string
                          value:
                            type: string
                      custom_values:
                        type: object
                        properties:
                          codes:
                            type: array
                            items:
                              type: array
                              items:
                                type: string
                          value:
                            type: array
                            items:
                              type: string
                  browser_cache_settings:
                    type: object
                    description: Controls Cache-Control headers sent to the client browser.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      control:
                        type: string
                        enum: [default, no-cache, custom]
                        description: '"default" uses default duration; "no-cache" disables browser caching; "custom" uses custom.value.'
                      value:
                        type: string
                        description: Duration when control is "default".
                      custom:
                        type: object
                        properties:
                          value:
                            type: string
                            description: Duration when control is "custom".
                  country_acl:
                    type: object
                    description: Allow or block requests from specific countries.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        description: '"allow" = whitelist mode (only listed countries allowed); "deny" = blacklist mode.'
                      excepted_values:
                        type: array
                        items:
                          type: string
                        description: ISO 3166-1 alpha-2 country codes to apply the policy to.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs or CIDR ranges excluded from the country ACL check.
                  ip_address_acl:
                    type: object
                    description: Allow or block requests from specific IP addresses.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        description: '"allow" or "deny".'
                      excepted_values:
                        type: array
                        items:
                          type: string
                        description: IP addresses or CIDR blocks to apply the policy to.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs exempt from this policy.
                  user_agent_acl:
                    type: object
                    description: Allow or block requests based on the User-Agent header.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        description: '"allow" or "deny".'
                      excepted_values:
                        type: array
                        items:
                          type: string
                        description: User-agent strings. Must be non-empty when enabled = true.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs exempt from this policy.
                      casesensitive:
                        type: boolean
                        description: Whether string matching is case-sensitive.
                  referrer_acl:
                    type: object
                    description: Allow or block requests based on the Referer header.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        description: '"allow" or "deny".'
                      noreferer:
                        type: boolean
                        description: Also apply the policy to requests with no Referer header.
                      excepted_values:
                        type: array
                        items:
                          type: string
                        description: Referer domain values. Must be non-empty when enabled = true.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs exempt from this policy.
                  secure_key:
                    type: object
                    description: Protect content with signed URL tokens.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      policy_type:
                        type: integer
                        enum: [0, 1, 2]
                        description: "Token algorithm. 0 = MD5, 1 = SHA1, 2 = SHA256."
                      session:
                        type: integer
                        description: "Session expiry mode. 0 = disabled."
                      key:
                        type: string
                        description: Secret signing key. Must be non-empty when enabled = true.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs allowed without token validation.
                      type:
                        type: boolean
                        description: "false = standard token, true = advanced mode."
                  limit_bandwidth:
                    type: object
                    description: Per-connection download speed throttling.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      limit_type:
                        type: string
                        enum: [static, dynamic]
                        description: '"static" = fixed speed; "dynamic" = after an initial burst buffer.'
                      speed:
                        type: integer
                        description: Speed cap in bytes/second.
                      buffer:
                        type: integer
                        description: Initial buffer in KB before speed limit kicks in (used with limit_type "dynamic").
                  limit_request:
                    type: object
                    description: Per-IP request rate limiting.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      rate:
                        type: integer
                        description: Allowed requests per second per client.
                      burst:
                        type: integer
                        description: Burst capacity (additional requests allowed above rate).
                      delay:
                        type: integer
                        description: Requests delayed before rejection kicks in.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        description: IPs exempt from rate limiting.
                  rewrite:
                    type: object
                    description: URL rewrite rule applied before forwarding to origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      body:
                        type: string
                        description: The rewrite rule body (nginx-style rewrite expression).
                      flag:
                        type: string
                        enum: [break, last, redirect, permanent]
                        description: '"break" stops further processing, "last" re-evaluates, "redirect" returns 302, "permanent" returns 301.'
                  host_redirect:
                    type: object
                    description: Redirect requests to a different hostname.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      to:
                        type: string
                        description: Target hostname to redirect to.
                      value:
                        type: array
                        items:
                          type: string
                        description: Additional redirect path mappings.
                  redirect_http_to_https:
                    type: object
                    description: Permanently redirect all HTTP requests to HTTPS (301).
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                  hsts:
                    type: object
                    description: HTTP Strict Transport Security configuration.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      referrerPolicy:
                        type: string
                        enum:
                          - no-referrer
                          - no-referrer-when-downgrade
                          - origin
                          - origin-when-cross-origin
                          - same-origin
                          - strict-origin
                          - strict-origin-when-cross-origin
                          - unsafe-url
                        description: Sets the Referrer-Policy header.
                      includeSubDomains:
                        type: boolean
                        description: Include includeSubDomains directive in HSTS header.
                      preload:
                        type: boolean
                        description: Include preload directive (required to be on HSTS preload list).
                  force_return:
                    type: object
                    description: Return a fixed HTTP status code for matched requests.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      code:
                        type: integer
                        description: HTTP status code to return for matched requests.
                      body:
                        type: string
                        description: Response body to return with the forced status code.
                  stale:
                    type: object
                    description: Serve stale cached content if origin is unreachable.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      value:
                        type: string
                        description: How long to serve stale content.
                  staticHeaders:
                    type: object
                    description: Add or override response headers.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      keys:
                        type: array
                        items:
                          type: string
                        description: Header names to add/override in the response. Parallel-indexed with values.
                      values:
                        type: array
                        items:
                          type: string
                        description: Corresponding header values.
                  cors:
                    type: object
                    description: CORS header support.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable."
                      control:
                        type: string
                        description: '"*" = wildcard (allow all origins); "custom" = restrict to specific origin.'
                      always:
                        type: boolean
                        description: Add CORS headers to all responses including error responses.
                      value:
                        type: string
                        description: Access-Control-Allow-Origin header value.
                      custom:
                        type: string
                        description: Used when control is "custom"; the specific allowed origin.
          example:
            _METHOD: PUT
            name: Cache Stream
            rule: /live/*
            options:
              edge_cache_settings:
                enabled: null
                control: default
                default: 345600s
                value: 345600s
                revalidate: null
                custom: { default: "", value: "" }
                custom_values: { codes: [], value: [] }
              midgress_cache_settings:
                enabled: null
                control: default
                default: 345600s
                value: 345600s
                revalidate: null
                custom: { default: "", value: "" }
                custom_values: { codes: [], value: [] }
              browser_cache_settings:
                enabled: null
                control: default
                value: 345600s
                custom: { value: "" }
              country_acl:
                enabled: null
                policy_type: allow
                excepted_values: []
                ip_whitelists: []
              ip_address_acl:
                enabled: null
                policy_type: allow
                excepted_values: []
                ip_whitelists: []
              user_agent_acl:
                enabled: null
                policy_type: allow
                excepted_values: []
                ip_whitelists: []
                casesensitive: false
              referrer_acl:
                enabled: null
                policy_type: allow
                noreferer: false
                excepted_values: []
                ip_whitelists: []
              secure_key:
                enabled: null
                policy_type: 0
                session: 0
                key: ""
                ip_whitelists: []
                type: false
              limit_bandwidth:
                enabled: null
                limit_type: static
                speed: 12000
                buffer: 1024
              limit_request:
                enabled: null
                rate: 9
                burst: 98
                delay: 96
                ip_whitelists: []
              rewrite: { enabled: null, body: "", flag: break }
              host_redirect: { enabled: null, to: "", value: [] }
              redirect_http_to_https: { enabled: null }
              hsts:
                enabled: null
                referrerPolicy: no-referrer
                includeSubDomains: true
                preload: true
              force_return: { enabled: null, code: 200, body: "" }
              stale: { enabled: null, value: "" }
              staticHeaders: { enabled: null, keys: [], values: [] }
              cors:
                enabled: null
                control: "*"
                always: false
                value: "*"
                custom: ""

    UpdateOrDeleteRuleBody_httpPull:
      required: true
      description: >
        Update an edge rule in an HTTP Pull zone. No _METHOD field required — direct POST.
        To delete: send only {"_METHOD": "DELETE"} instead of this payload.
      content:
        application/json:
          schema:
            type: object
            required: [name, rule, options]
            properties:
              name:
                type: string
                description: Pre-populated rule name. Send back as received from GET rules.
              rule:
                type: string
                description: Pre-populated rule pattern. Send back as received from GET rules.
              options:
                type: object
                description: Full options object for the rule update.
                properties:
                      edge_cache_settings:
                        type: object
                        description: CDN edge cache TTL configuration.
                        properties:
                          enabled:
                            type: boolean
                            nullable: true
                          control:
                            type: string
                            enum: [default, value, no-cache]
                          default:
                            type: string
                          value:
                            type: string
                          revalidate:
                            type: string
                            nullable: true
                          custom:
                            type: object
                            properties:
                              default:
                                type: string
                              value:
                                type: string
                          custom_values:
                            type: object
                            properties:
                              codes:
                                type: array
                                items:
                                  type: array
                                  items:
                                    type: string
                              value:
                                type: array
                                items:
                                  type: string
                      midgress_cache_settings:
                        type: object
                        description: CDN midgress cache TTL configuration.
                        properties:
                          enabled:
                            type: boolean
