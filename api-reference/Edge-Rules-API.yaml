                      inline_css:
                        type: boolean
                        example: false
                      CssInlineMaxBytes:
                        type: integer
                        nullable: true
                        example: null
                      outline_css:
                        type: boolean
                        example: false
                      CssOutlineMinBytes:
                        type: integer
                        nullable: true
                        example: null
                      rewrite_css:
                        type: boolean
                        example: false
                      fallback_rewrite_css_urls:
                        type: boolean
                        example: false
                      combine_javascript:
                        type: boolean
                        example: false
                      MaxCombinedJsBytes:
                        type: integer
                        nullable: true
                        example: null
                      defer_javascript:
                        type: boolean
                        example: false
                      inline_javascript:
                        type: boolean
                        example: false
                      JsInlineMaxBytes:
                        type: integer
                        nullable: true
                        example: null
                      rewrite_javascript:
                        type: boolean
                        example: false
                      outline_javascript:
                        type: boolean
                        example: false
                      JsOutlineMinBytes:
                        type: integer
                        nullable: true
                        example: null
                      collapse_whitespace:
                        type: boolean
                        example: false
                      remove_comments:
                        type: boolean
                        example: false
                      remove_quotes:
                        type: boolean
                        example: false
                      CombineAcrossPaths:
                        type: boolean
                        example: false
                  cms:
                    type: object
