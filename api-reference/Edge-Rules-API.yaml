  /zones/vod/pull/{zoneId}/rules/rule:
    post:
      tags: [VOD Pull]
      operationId: createEdgeRuleVodPull
      summary: Create a new edge rule for a VOD Pull zone
      description: >
        Creates a new edge rule for the zone. The body must include
        `"_METHOD": "PUT"` alongside the standard rule payload. On success the
        server returns `result: "success"` with a human-readable message.
      parameters:
        - $ref: '#/components/parameters/zoneId'
      requestBody:
        $ref: '#/components/requestBodies/CreateRuleBody_vodPull'
      responses:
        '200':
          description: Edge rule created successfully
          content:
            application/json:
              schema:
                type: object
                required: [result, message, ruleid]
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                    enum: [success]
                  message:
                    type: string
                  ruleid:
                    type: integer
                    description: The numeric ID of the newly created edge rule.
              example:
                result: success
                message: Zone EdgeRule Created. Please wait till the rules validation & deployment completes.
                ruleid: 8421
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /zones/vod/pull/{zoneId}/rules/rule/{ruleId}:
    post:
      tags: [VOD Pull]
      operationId: updateOrDeleteEdgeRuleVodPull
      summary: Update or delete a specific edge rule in a VOD Pull zone
      description: >
        **Update** — omit `_METHOD` or do not send it; the full rule options
        object is sent as the body and the rule is updated in place.

        **Delete** — include `"_METHOD": "DELETE"` as the only body field.
        The rule identified by `ruleId` is permanently removed.
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - $ref: '#/components/parameters/ruleId'
      requestBody:
        $ref: '#/components/requestBodies/UpdateOrDeleteRuleBody_vodPull'
      responses:
        '200':
          description: Operation completed successfully (update or delete)
          content:
            application/json:
              schema:
                type: object
                required: [result, message]
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                    enum: [success]
                  message:
                    type: string
              examples:
                updated:
                  summary: Rule updated successfully
                  value:
                    result: success
                    message: Zone EdgeRule Updated. Please wait till the rules validation & deployment completes.
                deleted:
                  summary: Rule deleted successfully
                  value:
                    result: success
                    message: Zone EdgeRule Deleted. Please wait till the deployment completes.
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

  /zones/vod/pull/{zoneId}/rules/behavior/{behaviorId}:
    post:
      tags: [Default Behaviors]
      operationId: updateDefaultBehaviorVodPull
      summary: Update the default behavior for a VOD Pull zone
      description: >
        Saves changes to the zone's default behavior entry. The payload
        structure is identical to a rule update (`RulePayload`) but the
        `name` and `rule` fields are effectively ignored — only `options`
        is applied. `behaviorId` is the `id` from the behaviors array
        returned by GET rules.
      parameters:
        - $ref: '#/components/parameters/zoneId'
        - $ref: '#/components/parameters/behaviorId'
      requestBody:
        $ref: '#/components/requestBodies/UpdateBehaviorBody_vodPull'
      responses:
        '200':
          description: Default behavior updated successfully
          content:
            application/json:
              schema:
                type: object
                required: [result, message]
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                    enum: [success]
                  message:
                    type: string
              example:
                result: success
                message: Zone Behavior Updated. Please wait till the rules validation & deployment completes.
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'

