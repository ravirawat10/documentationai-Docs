    UpdateBehaviorBody_httpPush:
      required: true
      description: >
        Request body for updating the default behavior of a HTTPPUSH zone.
        No _METHOD override required — direct POST. tls_versions is available here
        (not available in rule editing). All options are sent regardless of zone type.
        name and rule should be sent back as received from the GET rules response.
      content:
        application/json:
          schema:
            type: object
            required: [name, rule, options]
            properties:
              name:
                type: string
                description: Pre-populated behavior name. Send back as received.
                example: default
              rule:
                type: string
                description: Pre-populated behavior rule pattern. Send back as received.
                example: /
              options:
                type: object
                description: Container for all behavior option groups.
                properties:
                  edge_cache_settings:
                    type: object
                    description: Controls how long the edge CDN caches content.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "true = active, false = disabled, null = inherit from default."
                        example: null
                      control:
                        type: string
                        enum: [default, value, no-cache]
                        description: Selects which cache duration mode applies.
                        example: default
                      default:
                        type: string
                        description: Duration used when control is "default".
                        example: 345600s
                      value:
                        type: string
                        description: Duration used when control is "value".
                        example: 345600s
                      revalidate:
                        type: string
                        nullable: true
                        description: Revalidation time directive.
                        example: null
                      custom:
                        type: object
                        properties:
                          default:
                            type: string
                            example: ""
                          value:
                            type: string
                            example: ""
                      custom_values:
                        type: object
                        properties:
                          codes:
                            type: array
                            items:
                              type: array
                              items:
                                type: string
                            example: []
                          value:
                            type: array
                            items:
                              type: string
                            example: []
                  midgress_cache_settings:
                    type: object
                    description: Controls midgress (mid-tier) cache duration.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      control:
                        type: string
                        enum: [default, value]
                        example: default
                      default:
                        type: string
                        example: 345600s
                      value:
                        type: string
                        example: 345600s
                      revalidate:
                        type: string
                        nullable: true
                        example: null
                      custom:
                        type: object
                        properties:
                          default:
                            type: string
                            example: ""
                          value:
                            type: string
                            example: ""
                      custom_values:
                        type: object
                        properties:
                          codes:
                            type: array
                            items:
                              type: array
                              items:
                                type: string
                            example: []
                          value:
                            type: array
                            items:
                              type: string
                            example: []
                  browser_cache_settings:
                    type: object
                    description: Controls Cache-Control headers sent to the client browser.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      control:
                        type: string
                        enum: [default, no-cache, custom]
                        example: default
                      value:
                        type: string
                        example: 345600s
                      custom:
                        type: object
                        properties:
                          value:
                            type: string
                            example: ""
                  ignore_cookie:
                    type: object
                    description: Ignore the Set-Cookie header from origin so responses can be cached.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                  ignoreQueryString:
                    type: object
                    description: >
                      Controls whether query strings are considered when caching.
                      Mutually exclusive with query_params_blacklist and query_params_whitelist.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      control:
                        type: string
                        nullable: true
                        example: null
                      value:
                        type: string
                        nullable: true
                        example: null
                  query_params_blacklist:
                    type: object
                    description: Exclude specific query parameters from the cache key.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      value:
                        type: string
                        nullable: true
                        example: null
                  query_params_whitelist:
                    type: object
                    description: Include only specific query parameters in the cache key.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      value:
                        type: string
                        nullable: true
                        example: null
                  country_acl:
                    type: object
                    description: Allow or block requests from specific countries.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        example: allow
                      excepted_values:
                        type: array
                        items:
                          type: string
                        example: []
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        example: []
                  ip_address_acl:
                    type: object
                    description: Allow or block requests from specific IP addresses.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        example: allow
                      excepted_values:
                        type: array
                        items:
                          type: string
                        example: []
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        example: []
                  user_agent_acl:
                    type: object
                    description: Allow or block requests based on the User-Agent header.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        example: allow
                      excepted_values:
                        type: array
                        items:
                          type: string
                        example: []
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        example: []
                      casesensitive:
                        type: boolean
                        example: false
                  referrer_acl:
                    type: object
                    description: Allow or block requests based on the Referer header.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        example: allow
                      noreferer:
                        type: boolean
                        example: false
                      excepted_values:
                        type: array
                        items:
                          type: string
                        example: []
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        example: []
                  secure_key:
                    type: object
                    description: Protect content with signed URL tokens.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      policy_type:
                        type: integer
                        enum: [0, 1, 2]
                        description: "Token algorithm. 0 = MD5, 1 = SHA1, 2 = SHA256."
                        example: 0
                      session:
                        type: integer
                        description: "Session expiry mode. 0 = disabled."
                        example: 0
                      key:
                        type: string
                        description: Secret signing key. Must be non-empty when enabled = true.
                        example: ""
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        example: []
                      type:
                        type: boolean
                        description: "false = standard token, true = advanced mode."
                        example: false
                  gzipOn:
                    type: object
                    description: Enable edge GZip compression of responses.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                  fetch_compressed:
                    type: object
                    description: Request compressed content from origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                  brotli_compression:
                    type: object
                    description: Enable Brotli compression.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      value:
                        type: string
                        example: ""
                  slice:
                    type: object
                    description: Splits large files into slices for parallel delivery.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                  limit_bandwidth:
                    type: object
                    description: Per-connection download speed throttling.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      limit_type:
                        type: string
                        enum: [static, dynamic]
                        example: static
                      speed:
                        type: integer
                        example: 12000
                      buffer:
                        type: integer
                        example: 1024
                  disposition:
                    type: object
                    description: Sets Content-Disposition attachment on responses.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      value:
                        type: integer
                        example: 0
                  limit_request:
                    type: object
                    description: Per-IP request rate limiting.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      rate:
                        type: integer
                        example: 9
                      burst:
                        type: integer
                        example: 98
                      delay:
                        type: integer
                        example: 96
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        example: []
                  rewrite:
                    type: object
                    description: URL rewrite rule applied before forwarding to origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      body:
                        type: string
                        example: ""
                      flag:
                        type: string
                        enum: [break, last, redirect, permanent]
                        example: break
                  host_redirect:
                    type: object
                    description: Redirect requests to a different hostname.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      to:
                        type: string
                        example: ""
                      value:
                        type: array
                        items:
                          type: string
                        example: []
                  redirect_http_to_https:
                    type: object
                    description: Permanently redirect all HTTP requests to HTTPS (301).
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                  allowedHttpMethods:
                    type: object
                    description: Restrict which HTTP methods the CDN forwards to origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      value:
                        type: string
                        nullable: true
                        example: null
                  follow_origin_redirect:
                    type: object
                    description: Follow HTTP redirects returned by the origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      codes:
                        type: array
                        items:
                          type: integer
                        example: []
                  hsts:
                    type: object
                    description: HTTP Strict Transport Security configuration.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      referrerPolicy:
                        type: string
                        enum:
                          - no-referrer
                          - no-referrer-when-downgrade
                          - origin
                          - origin-when-cross-origin
                          - same-origin
                          - strict-origin
                          - strict-origin-when-cross-origin
                          - unsafe-url
                        example: no-referrer
                      includeSubDomains:
                        type: boolean
                        example: true
                      preload:
                        type: boolean
                        example: true
                  xff:
                    type: object
                    description: Add the X-Forwarded-For header with the client IP when forwarding to origin.
