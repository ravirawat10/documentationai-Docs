                    description: CORS header support.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      control:
                        type: string
                      always:
                        type: boolean
                      value:
                        type: string
                      custom:
                        type: string
          example:
            name: default
            rule: /
            options:
              edge_cache_settings:
                enabled: null
