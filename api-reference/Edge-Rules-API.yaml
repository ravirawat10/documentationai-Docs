                              type: integer
                              description: Rule type identifier. 0 = standard path-based rule.
                            originProtocol:
                              nullable: true
                              description: Origin protocol override. Null to inherit from zone settings.
                            isRegex:
                              type: boolean
                              description: When true, the rule pattern uses regular expression syntax.
                            network:
                              type: string
                              description: CDN network provider associated with this rule configuration.
                            options:
                              type: object
                              description: Behavior options applied when this rule matches a request.
                              properties:
                                ignore_cookie:
                                  type: object
                                  description: Ignore Set-Cookie headers from origin so responses can be cached.
                                  properties:
                                    enabled:
                                      type: boolean
                                    value:
                                      type: boolean
                                honor_vary:
                                  type: object
                                  description: Respect the Vary header from origin when forming cache keys.
                                  properties:
                                    enabled:
                                      type: boolean
                                    value:
                                      type: boolean
                                xff:
                                  type: object
                                  description: Forward the client IP in the X-Forwarded-For header to origin.
                                  properties:
                                    enabled:
                                      type: boolean
                                    value:
                                      type: boolean
                                disposition:
                                  type: object
                                  description: Control the Content-Disposition header mode for responses.
                                  properties:
                                    enabled:
                                      type: boolean
                                    value:
                                      type: integer
                                redirect_http_to_https:
                                  type: object
                                  description: Automatically redirect HTTP requests to HTTPS.
                                  properties:
                                    enabled:
                                      type: boolean
                                    value:
                                      type: boolean
                                segmenter_cache_settings:
                                  type: object
                                  description: Override cache durations for HLS manifest and segment files.
                                  properties:
                                    enabled:
                                      type: boolean
                                    midgress_manifest:
                                      type: integer
                                    edge_manifest:
                                      type: integer
                                    midgress_segment:
                                      type: integer
                                    edge_segment:
                                      type: integer
                                follow_origin_redirect:
                                  type: object
                                  description: Follow 3xx redirects from origin instead of passing them to clients.
                                  properties:
                                    enabled:
                                      type: boolean
                                    codes:
                                      type: array
                                      items:
                                        type: integer
                                host_redirect:
                                  type: object
                                  description: Redirect requests matching this rule to a different host.
                                  properties:
                                    enabled:
                                      type: boolean
                                    value:
                                      type: array
                                      items:
                                        type: string
                                    to:
                                      type: string
                                gzipOn:
                                  type: object
                                  description: Enable gzip compression for responses.
                                  properties:
                                    enabled:
                                      type: boolean
                                    value:
                                      type: boolean
                                fetch_compressed:
                                  type: object
                                  description: Fetch and serve pre-compressed assets from origin.
                                  properties:
                                    enabled:
                                      type: boolean
                                    value:
                                      type: boolean
                                slice:
                                  type: object
                                  description: Enable range-request slice caching for large files.
                                  properties:
                                    enabled:
                                      type: boolean
                                    value:
                                      type: boolean
                                websockets:
                                  type: object
                                  description: Enable WebSocket proxying for matched requests.
                                  properties:
                                    enabled:
                                      type: boolean
                                    value:
                                      type: boolean
                                waf:
                                  type: object
                                  description: Enable Web Application Firewall protection.
                                  properties:
                                    enabled:
                                      type: boolean
                                    value:
                                      type: boolean
                                stale:
                                  type: object
                                  description: Serve stale cached content when specified error conditions occur.
                                  properties:
                                    enabled:
                                      type: boolean
                                    value:
                                      type: array
                                      items:
                                        type: string
                                brotli_compression:
                                  type: object
                                  description: Enable Brotli compression for specified MIME content types.
                                  properties:
                                    enabled:
                                      type: boolean
                                    value:
                                      type: array
                                      items:
                                        type: string
                                response_headers_hiding_policy:
                                  type: object
                                  description: Filter or suppress specific response headers before delivery.
                                  properties:
                                    enabled:
                                      type: boolean
                                    mode:
                                      type: string
                                    expected:
                                      nullable: true
                                    value:
                                      type: array
                                      items:
                                        type: string
                                referrer_acl:
                                  type: object
                                  description: Allow or block requests based on the HTTP Referer header.
                                  properties:
                                    enabled:
                                      type: boolean
                                    policy_type:
                                      type: string
                                    excepted_values:
                                      type: array
                                      items:
                                        type: string
                                    ip_whitelists:
                                      type: array
                                      items:
                                        type: string
                                    noreferer:
                                      type: boolean
                                country_acl:
                                  type: object
                                  description: Allow or block requests based on the visitor country.
                                  properties:
                                    enabled:
                                      type: boolean
                                    policy_type:
                                      type: string
                                    excepted_values:
                                      type: array
                                      items:
                                        type: string
                                    ip_whitelists:
                                      type: array
                                      items:
                                        type: string
                                ip_address_acl:
                                  type: object
                                  description: Allow or block requests based on the client IP address.
                                  properties:
                                    enabled:
                                      type: boolean
                                    policy_type:
                                      type: string
                                    excepted_values:
                                      type: array
                                      items:
                                        type: string
                                    ip_whitelists:
                                      type: array
                                      items:
                                        type: string
                                user_agent_acl:
                                  type: object
                                  description: Allow or block requests based on the User-Agent header.
                                  properties:
                                    enabled:
                                      type: boolean
                                    policy_type:
                                      type: string
                                    excepted_values:
                                      type: array
                                      items:
                                        type: string
                                    ip_whitelists:
                                      type: array
                                      items:
                                        type: string
                                    casesensitive:
                                      type: boolean
                                secure_key:
                                  type: object
                                  description: Protect content using time-limited signed URL tokens.
                                  properties:
                                    enabled:
                                      type: boolean
                                    policy_type:
                                      nullable: true
                                    type:
                                      type: integer
                                    key:
                                      type: string
                                    ip_whitelists:
                                      type: array
                                      items:
                                        type: string
                                    timeout:
                                      type: integer
                                    session:
                                      type: integer
                                allowedHttpMethods:
                                  type: object
                                  description: Restrict which HTTP methods are accepted for requests.
                                  properties:
                                    enabled:
                                      type: boolean
                                    value:
                                      type: array
                                      items:
                                        type: string
                                tls_versions:
                                  type: object
                                  description: Restrict TLS connections to specific protocol versions.
                                  properties:
                                    enabled:
                                      type: boolean
                                    value:
                                      type: array
                                      items:
                                        type: string
                                edge_cache_settings:
                                  type: object
                                  description: Controls how long CDN edge nodes cache content.
                                  properties:
                                    enabled:
                                      type: boolean
                                    revalidate:
                                      type: boolean
                                    default:
                                      type: string
                                midgress_cache_settings:
                                  type: object
                                  description: Controls how long CDN mid-tier nodes cache content.
                                  properties:
                                    enabled:
                                      type: boolean
                                    revalidate:
                                      type: boolean
                                    default:
                                      type: string
                                browser_cache_settings:
                                  type: object
                                  description: Controls Cache-Control headers sent to the client browser.
                                  properties:
                                    enabled:
                                      type: boolean
                                cors:
                                  type: object
                                  description: Set Cross-Origin Resource Sharing headers on responses.
                                  properties:
                                    enabled:
                                      type: boolean
                                    always:
                                      type: boolean
                                    value:
                                      type: string
                                sni:
                                  type: object
                                  description: Enable Server Name Indication for TLS connections.
                                  properties:
                                    enabled:
                                      type: boolean
                                force_return:
                                  type: object
                                  description: Return a fixed HTTP status code and optional body for matched requests.
                                  properties:
                                    enabled:
                                      type: boolean
                                rewrite:
                                  type: object
                                  description: Rewrite the request URL path using a pattern and replacement.
                                  properties:
                                    enabled:
                                      type: boolean
                                staticRequestHeaders:
                                  type: object
                                  description: Add static headers to requests forwarded to origin.
                                  properties:
                                    enabled:
                                      type: boolean
                                staticHeaders:
                                  type: object
                                  description: Add static headers to responses sent to clients.
                                  properties:
                                    enabled:
                                      type: boolean
                                hostHeader:
                                  nullable: true
                                  description: Override the Host header sent to origin.
                                forward_host_header:
                                  nullable: true
                                  description: Forward the original client Host header to origin.
                                limit_bandwidth:
                                  type: object
                                  description: Throttle the response bandwidth for matched requests.
                                  properties:
                                    enabled:
                                      type: boolean
                                    limit_type:
                                      type: string
                                limit_request:
                                  type: object
                                  description: Rate-limit requests from each client IP address.
                                  properties:
                                    enabled:
                                      type: boolean
                                    rate:
                                      type: integer
                                    burst:
                                      type: integer
                                    delay:
                                      type: integer
                                    ip_whitelists:
                                      type: array
                                      items:
                                        type: string
                                hsts:
                                  type: object
                                  description: Set HTTP Strict Transport Security policy headers.
                                  properties:
                                    enabled:
                                      type: boolean
                                    referrerPolicy:
                                      type: string
                                    includeSubDomains:
                                      type: boolean
                                    preload:
                                      type: boolean
                                cms:
                                  type: object
                                  description: Apply caching optimizations for specific CMS platforms.
                                  properties:
                                    enabled:
                                      type: boolean
                                    value:
                                      type: array
                                      items:
                                        type: string
                                image_stack:
                                  nullable: true
                                  description: Enable on-the-fly image optimization.
                                asset_stack:
                                  nullable: true
                                  description: Enable web performance optimizations for CSS and JavaScript assets.
                                ignoreQueryString:
                                  type: object
                                  description: Control how query strings are handled when forming cache keys.
                                  properties:
                                    enabled:
                                      type: boolean
                                    value:
                                      type: boolean
              example:
                result: success
                rules:
                  - id: 12345
                    network: sample-network
                    rule:
                      name: sample-edge-rule
                      rule: /images/*
                      ruleType: 0
                      originProtocol: null
                      isRegex: true
                      network: sample-network
                      options:
                        ignore_cookie: { enabled: false, value: false }
                        honor_vary: { enabled: false, value: false }
                        xff: { enabled: false, value: false }
                        disposition: { enabled: false, value: 0 }
                        redirect_http_to_https: { enabled: false, value: false }
                        segmenter_cache_settings: { enabled: false, midgress_manifest: 2, edge_manifest: 4, midgress_segment: 1, edge_segment: 3 }
                        follow_origin_redirect: { enabled: false, codes: [] }
                        host_redirect: { enabled: true, value: [cdn.example.com], to: origin.example.com }
                        gzipOn: { enabled: false, value: false }
                        fetch_compressed: { enabled: false, value: false }
                        slice: { enabled: false, value: false }
                        websockets: { enabled: false, value: false }
                        waf: { enabled: false, value: false }
