                        example: default
                      default:
                        type: string
                        description: Duration used when control is "default".
                        example: 345600s
                      value:
                        type: string
                        description: Duration used when control is "value".
                        example: 345600s
                      revalidate:
                        type: string
                        nullable: true
                        description: Revalidation time directive.
                        example: null
                      custom:
                        type: object
                        properties:
                          default:
                            type: string
                            description: Custom pattern default value.
                            example: ""
                          value:
