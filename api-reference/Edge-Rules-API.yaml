                        type: boolean
                        nullable: true
                      mode:
                        type: string
                        enum: [hide, show]
                      expected:
                        type: object
                        properties:
                          hide:
                            type: array
                            items:
                              type: string
                          show:
                            type: array
                            items:
                              type: string
                  hostHeader:
                    type: object
                    description: Controls the Host header sent to origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      control:
                        type: string
                        enum: [forward, custom]
                      custom:
                        type: string
                  forward_host_header:
                    type: object
                    description: Legacy alias for the Host Header setting. Send alongside hostHeader.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                  honor_vary:
