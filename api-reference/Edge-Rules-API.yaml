        Update an edge rule in a VOD Pull zone. No _METHOD field required — direct POST. Excluded: segmenter_cache_settings, gzipOn, fetch_compressed, brotli_compression, slice, disposition, allowedHttpMethods, image_stack, asset_stack, cms, honor_vary.
        To delete: send only {"_METHOD": "DELETE"} instead of this payload.
      content:
        application/json:
          schema:
            type: object
            required: [name, rule, options]
            properties:
              name:
                type: string
                description: Pre-populated rule name. Send back as received from GET rules.
              rule:
                type: string
                description: Pre-populated rule pattern. Send back as received from GET rules.
              options:
                type: object
                description: Full options object for the rule update.
                properties:
                      edge_cache_settings:
                        type: object
                        description: CDN edge cache TTL configuration.
                        properties:
                          enabled:
                            type: boolean
                            nullable: true
                          control:
                            type: string
                            enum: [default, value, no-cache]
                          default:
                            type: string
                          value:
                            type: string
                          revalidate:
                            type: string
                            nullable: true
                          custom:
                            type: object
                            properties:
                              default:
                                type: string
                              value:
                                type: string
                          custom_values:
                            type: object
                            properties:
                              codes:
                                type: array
                                items:
                                  type: array
                                  items:
                                    type: string
                              value:
                                type: array
                                items:
                                  type: string
                      midgress_cache_settings:
                        type: object
                        description: CDN midgress cache TTL configuration.
                        properties:
                          enabled:
                            type: boolean
                            nullable: true
                          control:
                            type: string
                            enum: [default, value]
                          default:
                            type: string
                          value:
                            type: string
                          revalidate:
                            type: string
                            nullable: true
                          custom:
                            type: object
                            properties:
                              default:
                                type: string
                              value:
                                type: string
                          custom_values:
                            type: object
                            properties:
                              codes:
                                type: array
                                items:
                                  type: array
                                  items:
                                    type: string
                              value:
                                type: array
                                items:
                                  type: string
                      browser_cache_settings:
                        type: object
                        description: Browser-side Cache-Control TTL configuration.
                        properties:
                          enabled:
                            type: boolean
                            nullable: true
                          control:
                            type: string
                            enum: [default, no-cache, custom]
                          value:
                            type: string
                          custom:
                            type: object
                            properties:
                              value:
                                type: string
                      ignore_cookie:
                        type: object
                        description: Ignore Set-Cookie from origin to allow caching.
                        properties:
                          enabled:
                            type: boolean
                            nullable: true
                      ignoreQueryString:
                        type: object
                        description: Strip query string from cache key. Mutually exclusive with query_params_blacklist/whitelist.
