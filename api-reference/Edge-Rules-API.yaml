    UpdateBehaviorBody_vodPull:
      required: true
      description: >
        Request body for updating the default behavior of a VODPULL zone.
        No _METHOD override required — direct POST. tls_versions is available here
        (not available in rule editing). All options are sent regardless of zone type.
        name and rule should be sent back as received from the GET rules response.
      content:
        application/json:
          schema:
            type: object
            required: [name, rule, options]
            properties:
              name:
                type: string
                description: Pre-populated behavior name. Send back as received.
              rule:
                type: string
                description: Pre-populated behavior rule pattern. Send back as received.
              options:
                type: object
                description: Container for all behavior option groups.
                properties:
                  edge_cache_settings:
                    type: object
                    description: Controls how long the edge CDN caches content.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "true = active, false = disabled, null = inherit from default."
                      control:
                        type: string
                        enum: [default, value, no-cache]
                        description: Selects which cache duration mode applies.
                      default:
                        type: string
                        description: Duration used when control is "default".
                      value:
                        type: string
                        description: Duration used when control is "value".
                      revalidate:
                        type: string
                        nullable: true
                        description: Revalidation time directive.
                      custom:
                        type: object
                        properties:
                          default:
                            type: string
                          value:
                            type: string
                      custom_values:
                        type: object
                        properties:
                          codes:
                            type: array
                            items:
                              type: array
                              items:
                                type: string
                          value:
                            type: array
                            items:
                              type: string
                  midgress_cache_settings:
                    type: object
                    description: Controls midgress (mid-tier) cache duration.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      control:
                        type: string
                        enum: [default, value]
                      default:
                        type: string
                      value:
                        type: string
                      revalidate:
                        type: string
                        nullable: true
                      custom:
                        type: object
                        properties:
                          default:
                            type: string
                          value:
                            type: string
                      custom_values:
                        type: object
                        properties:
                          codes:
                            type: array
                            items:
                              type: array
                              items:
                                type: string
                          value:
                            type: array
                            items:
                              type: string
                  browser_cache_settings:
                    type: object
                    description: Controls Cache-Control headers sent to the client browser.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      control:
                        type: string
                        enum: [default, no-cache, custom]
                      value:
                        type: string
                      custom:
                        type: object
                        properties:
                          value:
                            type: string
                  ignore_cookie:
                    type: object
                    description: Ignore the Set-Cookie header from origin so responses can be cached.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                  ignoreQueryString:
                    type: object
                    description: >
                      Controls whether query strings are considered when caching.
                      Mutually exclusive with query_params_blacklist and query_params_whitelist.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      control:
                        type: string
                        nullable: true
                      value:
                        type: string
                        nullable: true
                  query_params_blacklist:
                    type: object
                    description: Exclude specific query parameters from the cache key.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      value:
                        type: string
                        nullable: true
                  query_params_whitelist:
                    type: object
                    description: Include only specific query parameters in the cache key.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      value:
                        type: string
                        nullable: true
                  country_acl:
                    type: object
                    description: Allow or block requests from specific countries.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      policy_type:
                        type: string
                        enum: [allow, deny]
                      excepted_values:
                        type: array
                        items:
                          type: string
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                  ip_address_acl:
                    type: object
                    description: Allow or block requests from specific IP addresses.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      policy_type:
                        type: string
                        enum: [allow, deny]
                      excepted_values:
                        type: array
                        items:
                          type: string
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                  user_agent_acl:
                    type: object
                    description: Allow or block requests based on the User-Agent header.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      policy_type:
                        type: string
                        enum: [allow, deny]
                      excepted_values:
                        type: array
                        items:
                          type: string
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                      casesensitive:
                        type: boolean
                  referrer_acl:
                    type: object
                    description: Allow or block requests based on the Referer header.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      policy_type:
                        type: string
                        enum: [allow, deny]
                      noreferer:
                        type: boolean
                      excepted_values:
                        type: array
                        items:
                          type: string
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                  secure_key:
                    type: object
                    description: Protect content with signed URL tokens.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      policy_type:
                        type: integer
                        enum: [0, 1, 2]
                        description: "Token algorithm. 0 = MD5, 1 = SHA1, 2 = SHA256."
                      session:
                        type: integer
                        description: "Session expiry mode. 0 = disabled."
                      key:
                        type: string
                        description: Secret signing key. Must be non-empty when enabled = true.
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                      type:
                        type: boolean
                        description: "false = standard token, true = advanced mode."
                  gzipOn:
                    type: object
                    description: Enable edge GZip compression of responses.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                  fetch_compressed:
                    type: object
                    description: Request compressed content from origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                  brotli_compression:
                    type: object
                    description: Enable Brotli compression.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      value:
                        type: string
                  slice:
                    type: object
                    description: Splits large files into slices for parallel delivery.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                  limit_bandwidth:
                    type: object
                    description: Per-connection download speed throttling.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      limit_type:
                        type: string
                        enum: [static, dynamic]
                      speed:
                        type: integer
                      buffer:
                        type: integer
                  disposition:
                    type: object
                    description: Sets Content-Disposition attachment on responses.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      value:
                        type: integer
                  limit_request:
                    type: object
                    description: Per-IP request rate limiting.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      rate:
                        type: integer
                      burst:
                        type: integer
                      delay:
                        type: integer
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                  rewrite:
                    type: object
                    description: URL rewrite rule applied before forwarding to origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      body:
                        type: string
                      flag:
                        type: string
                        enum: [break, last, redirect, permanent]
                  host_redirect:
                    type: object
                    description: Redirect requests to a different hostname.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      to:
                        type: string
                      value:
                        type: array
                        items:
                          type: string
                  redirect_http_to_https:
                    type: object
                    description: Permanently redirect all HTTP requests to HTTPS (301).
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                  allowedHttpMethods:
                    type: object
                    description: Restrict which HTTP methods the CDN forwards to origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      value:
                        type: string
                        nullable: true
                  follow_origin_redirect:
                    type: object
                    description: Follow HTTP redirects returned by the origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      codes:
                        type: array
                        items:
                          type: integer
                  hsts:
                    type: object
                    description: HTTP Strict Transport Security configuration.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      referrerPolicy:
                        type: string
                        enum:
                          - no-referrer
                          - no-referrer-when-downgrade
                          - origin
                          - origin-when-cross-origin
                          - same-origin
                          - strict-origin
                          - strict-origin-when-cross-origin
                          - unsafe-url
                      includeSubDomains:
                        type: boolean
                      preload:
                        type: boolean
                  xff:
                    type: object
                    description: Add the X-Forwarded-For header with the client IP when forwarding to origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                  sni:
                    type: object
                    description: SNI hostname used in TLS handshake toward origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      sni_type:
                        type: string
                        enum: [dynamic, custom]
                      custom_hostname:
                        type: string
                  tls_versions:
                    type: object
                    description: >
                      TLS version restrictions. Only available when updating default behaviors,
                      not available in rule editing.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable TLS version restrictions."
                      value:
                        type: array
                        items:
                          type: string
                          enum: [TLSv1, TLSv1.1, TLSv1.2, TLSv1.3]
                        description: "Allowed TLS protocol versions. Empty array = all versions allowed."
                  image_stack:
                    type: object
                    description: On-the-fly image optimization.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      quality:
                        type: string
                        enum: [Disabled, Low, Medium, High]
                      webp:
                        type: string
                        enum: [Disabled, Enabled]
                      avif:
                        type: string
                        enum: [Disabled, Enabled]
                      png_loseless:
                        type: string
                        enum: ["true", "false"]
                  asset_stack:
                    type: object
                    description: Web performance optimization for CSS and JavaScript assets.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      combine_css:
                        type: boolean
                      MaxCombinedCssBytes:
                        type: integer
                      flatten_css_imports:
                        type: boolean
                      CssFlattenMaxBytes:
                        type: integer
                        nullable: true
                      inline_css:
                        type: boolean
                      CssInlineMaxBytes:
                        type: integer
                        nullable: true
                      outline_css:
                        type: boolean
                      CssOutlineMinBytes:
                        type: integer
                        nullable: true
                      rewrite_css:
                        type: boolean
                      fallback_rewrite_css_urls:
                        type: boolean
                      combine_javascript:
                        type: boolean
                      MaxCombinedJsBytes:
                        type: integer
                        nullable: true
                      defer_javascript:
                        type: boolean
                      inline_javascript:
                        type: boolean
                      JsInlineMaxBytes:
                        type: integer
                        nullable: true
                      rewrite_javascript:
                        type: boolean
                      outline_javascript:
                        type: boolean
                      JsOutlineMinBytes:
                        type: integer
                        nullable: true
                      collapse_whitespace:
                        type: boolean
                      remove_comments:
                        type: boolean
                      remove_quotes:
                        type: boolean
                      CombineAcrossPaths:
                        type: boolean
                  cms:
                    type: object
                    description: CMS-specific caching optimizations.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      value:
                        type: array
                        items:
                          type: string
                  force_return:
                    type: object
                    description: Return a fixed HTTP status code for matched requests.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      code:
                        type: integer
                      body:
                        type: string
                  stale:
                    type: object
                    description: Serve stale cached content if origin is unreachable.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      value:
                        type: string
                  staticHeaders:
                    type: object
                    description: Add or override response headers.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      keys:
                        type: array
                        items:
                          type: string
                      values:
                        type: array
                        items:
                          type: string
                  staticRequestHeaders:
                    type: object
                    description: Adds or overrides headers on the request forwarded to origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      keys:
                        type: array
                        items:
                          type: string
                      values:
                        type: array
                        items:
                          type: string
                  response_headers_hiding_policy:
