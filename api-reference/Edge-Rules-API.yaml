                enabled: null
                policy_type: allow
                excepted_values: []
                ip_whitelists: []
              user_agent_acl:
                enabled: null
                policy_type: allow
                excepted_values: []
                ip_whitelists: []
                casesensitive: false
              referrer_acl:
                enabled: null
                policy_type: allow
                noreferer: false
                excepted_values: []
                ip_whitelists: []
              secure_key:
                enabled: null
                policy_type: 0
                session: 0
                key: ""
                ip_whitelists: []
                type: false
              limit_bandwidth:
                enabled: null
                limit_type: static
                speed: 12000
                buffer: 1024
              limit_request:
                enabled: null
                rate: 9
                burst: 98
                delay: 96
                ip_whitelists: []
              rewrite: { enabled: null, body: "", flag: break }
              host_redirect: { enabled: null, to: "", value: [] }
              redirect_http_to_https: { enabled: null }
              hsts:
                enabled: null
                referrerPolicy: no-referrer
                includeSubDomains: true
                preload: true
              force_return: { enabled: null, code: 200, body: "" }
              stale: { enabled: null, value: "" }
              staticHeaders: { enabled: null, keys: [], values: [] }
              cors:
                enabled: null
                control: "*"
                always: false
                value: "*"
                custom: ""

