                          enabled:
                            type: boolean
                            nullable: true
                          value:
                            type: string
                            nullable: true
                      country_acl:
                        type: object
                        description: Allow or block requests by country.
                        properties:
                          enabled:
                            type: boolean
                            nullable: true
                          policy_type:
                            type: string
                            enum: [allow, deny]
