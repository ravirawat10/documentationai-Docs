                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      control:
                        type: string
                        enum: [default, no-cache, custom]
                        example: default
                      value:
                        type: string
                        example: 345600s
                      custom:
                        type: object
                        properties:
                          value:
                            type: string
                            example: ""
                  ignore_cookie:
                    type: object
                    description: Ignore the Set-Cookie header from origin so responses can be cached.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                  ignoreQueryString:
                    type: object
                    description: >
