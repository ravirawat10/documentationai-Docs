                      control:
                        type: string
                        enum: [forward, custom]
                        example: forward
                      custom:
                        type: string
                        example: ""
                  forward_host_header:
                    type: object
                    description: Legacy alias for the Host Header setting. Send alongside hostHeader.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                  honor_vary:
