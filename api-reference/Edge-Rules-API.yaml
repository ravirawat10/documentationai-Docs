    UpdateBehaviorBody_httpPull:
      required: true
      description: >
        Request body for updating the default behavior of a HTTPPULL zone.
        No _METHOD override required — direct POST. tls_versions is available here
        (not available in rule editing). All options are sent regardless of zone type.
        name and rule should be sent back as received from the GET rules response.
      content:
        application/json:
          schema:
            type: object
            required: [name, rule, options]
            properties:
              name:
                type: string
                description: Pre-populated behavior name. Send back as received.
              rule:
                type: string
                description: Pre-populated behavior rule pattern. Send back as received.
              options:
                type: object
                description: Container for all behavior option groups.
                properties:
                  edge_cache_settings:
                    type: object
                    description: Controls how long the edge CDN caches content.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "true = active, false = disabled, null = inherit from default."
                      control:
                        type: string
                        enum: [default, value, no-cache]
                        description: Selects which cache duration mode applies.
                      default:
                        type: string
                        description: Duration used when control is "default".
                      value:
                        type: string
                        description: Duration used when control is "value".
                      revalidate:
                        type: string
                        nullable: true
                        description: Revalidation time directive.
                      custom:
                        type: object
                        properties:
                          default:
                            type: string
                          value:
                            type: string
                      custom_values:
                        type: object
                        properties:
                          codes:
                            type: array
                            items:
                              type: array
                              items:
                                type: string
                          value:
                            type: array
                            items:
                              type: string
                  midgress_cache_settings:
                    type: object
                    description: Controls midgress (mid-tier) cache duration.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      control:
                        type: string
                        enum: [default, value]
                      default:
                        type: string
                      value:
                        type: string
                      revalidate:
                        type: string
                        nullable: true
                      custom:
                        type: object
                        properties:
                          default:
                            type: string
                          value:
                            type: string
                      custom_values:
                        type: object
                        properties:
                          codes:
                            type: array
                            items:
                              type: array
                              items:
                                type: string
                          value:
                            type: array
                            items:
                              type: string
                  browser_cache_settings:
                    type: object
                    description: Controls Cache-Control headers sent to the client browser.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      control:
                        type: string
                        enum: [default, no-cache, custom]
                      value:
                        type: string
                      custom:
                        type: object
                        properties:
                          value:
                            type: string
                  segmenter_cache_settings:
                    type: object
                    description: HLS segmenter caching. HTTP Pull zones with optimize=vod/live only.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      midgress_manifest:
                        type: string
                      edge_manifest:
                        type: string
                      midgress_segment:
                        type: string
                      edge_segment:
                        type: string
                  ignore_cookie:
                    type: object
                    description: Ignore the Set-Cookie header from origin so responses can be cached.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                  ignoreQueryString:
                    type: object
                    description: >
                      Controls whether query strings are considered when caching.
                      Mutually exclusive with query_params_blacklist and query_params_whitelist.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      control:
                        type: string
                        nullable: true
                      value:
                        type: string
                        nullable: true
                  query_params_blacklist:
                    type: object
                    description: Exclude specific query parameters from the cache key.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      value:
                        type: string
                        nullable: true
                  query_params_whitelist:
                    type: object
                    description: Include only specific query parameters in the cache key.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      value:
                        type: string
                        nullable: true
                  country_acl:
                    type: object
                    description: Allow or block requests from specific countries.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      policy_type:
                        type: string
                        enum: [allow, deny]
                      excepted_values:
                        type: array
                        items:
                          type: string
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                  ip_address_acl:
                    type: object
                    description: Allow or block requests from specific IP addresses.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      policy_type:
                        type: string
                        enum: [allow, deny]
                      excepted_values:
                        type: array
                        items:
                          type: string
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                  user_agent_acl:
                    type: object
                    description: Allow or block requests based on the User-Agent header.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                      policy_type:
                        type: string
                        enum: [allow, deny]
                      excepted_values:
                        type: array
