                                    excepted_values:
                                      type: array
                                      items:
                                        type: string
                                      example: [""]
                                    ip_whitelists:
                                      type: array
                                      items:
                                        type: string
                                      example: []
                                ip_address_acl:
                                  type: object
                                  description: Allow or block requests based on the client IP address.
                                  properties:
                                    enabled:
                                      type: boolean
                                      example: false
                                    policy_type:
                                      type: string
                                      example: allow
                                    excepted_values:
                                      type: array
                                      items:
                                        type: string
                                      example: []
                                    ip_whitelists:
                                      type: array
                                      items:
                                        type: string
                                      example: []
                                user_agent_acl:
                                  type: object
                                  description: Allow or block requests based on the User-Agent header.
                                  properties:
                                    enabled:
                                      type: boolean
                                      example: false
                                    policy_type:
                                      type: string
                                      example: allow
                                    excepted_values:
                                      type: array
                                      items:
                                        type: string
                                      example: []
                                    ip_whitelists:
                                      type: array
                                      items:
                                        type: string
                                      example: []
                                    casesensitive:
                                      type: boolean
                                      example: false
                                secure_key:
                                  type: object
                                  description: Protect content using time-limited signed URL tokens.
                                  properties:
                                    enabled:
                                      type: boolean
                                      example: false
                                    policy_type:
                                      nullable: true
                                      example: null
                                    type:
                                      type: integer
                                      example: 2
                                    key:
                                      type: string
                                      example: ""
                                    ip_whitelists:
                                      type: array
                                      items:
                                        type: string
                                      example: []
                                    timeout:
                                      type: integer
                                      example: 3600
                                    session:
                                      type: integer
                                      example: 0
                                allowedHttpMethods:
                                  type: object
                                  description: Restrict which HTTP methods are accepted for requests.
                                  properties:
                                    enabled:
                                      type: boolean
                                      example: false
                                    value:
                                      type: array
                                      items:
                                        type: string
