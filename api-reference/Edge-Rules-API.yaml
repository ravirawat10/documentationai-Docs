                              items:
                                type: string
                            example: []
                          value:
                            type: array
                            items:
                              type: string
                            example: []
                  browser_cache_settings:
                    type: object
                    description: Controls Cache-Control headers sent to the client browser.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      control:
                        type: string
                        enum: [default, no-cache, custom]
                        example: default
                      value:
                        type: string
                        example: 345600s
                      custom:
                        type: object
                        properties:
                          value:
                            type: string
                            example: ""
                  ignore_cookie:
                    type: object
                    description: Ignore the Set-Cookie header from origin so responses can be cached.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                  ignoreQueryString:
                    type: object
                    description: >
                      Controls whether query strings are considered when caching.
                      Mutually exclusive with query_params_blacklist and query_params_whitelist.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      control:
                        type: string
                        nullable: true
                        example: null
                      value:
                        type: string
                        nullable: true
                        example: null
                  query_params_blacklist:
                    type: object
                    description: Exclude specific query parameters from the cache key.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      value:
                        type: string
                        nullable: true
                        example: null
                  query_params_whitelist:
                    type: object
                    description: Include only specific query parameters in the cache key.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      value:
                        type: string
                        nullable: true
                        example: null
                  country_acl:
                    type: object
                    description: Allow or block requests from specific countries.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        example: allow
                      excepted_values:
                        type: array
                        items:
                          type: string
                        example: []
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        example: []
                  ip_address_acl:
                    type: object
                    description: Allow or block requests from specific IP addresses.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        example: allow
                      excepted_values:
                        type: array
                        items:
                          type: string
                        example: []
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        example: []
                  user_agent_acl:
                    type: object
                    description: Allow or block requests based on the User-Agent header.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        example: allow
                      excepted_values:
                        type: array
                        items:
                          type: string
                        example: []
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        example: []
                      casesensitive:
                        type: boolean
                        example: false
                  referrer_acl:
                    type: object
                    description: Allow or block requests based on the Referer header.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      policy_type:
                        type: string
                        enum: [allow, deny]
                        example: allow
                      noreferer:
                        type: boolean
                        example: false
                      excepted_values:
                        type: array
                        items:
                          type: string
                        example: []
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        example: []
                  secure_key:
                    type: object
                    description: Protect content with signed URL tokens.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      policy_type:
                        type: integer
                        enum: [0, 1, 2]
                        description: "Token algorithm. 0 = MD5, 1 = SHA1, 2 = SHA256."
                        example: 0
                      session:
                        type: integer
                        description: "Session expiry mode. 0 = disabled."
                        example: 0
                      key:
                        type: string
                        description: Secret signing key. Must be non-empty when enabled = true.
                        example: ""
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        example: []
                      type:
                        type: boolean
                        description: "false = standard token, true = advanced mode."
                        example: false
                  gzipOn:
                    type: object
                    description: Enable edge GZip compression of responses.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                  fetch_compressed:
                    type: object
                    description: Request compressed content from origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                  brotli_compression:
                    type: object
                    description: Enable Brotli compression.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      value:
                        type: string
                        example: ""
                  slice:
                    type: object
                    description: Splits large files into slices for parallel delivery.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                  limit_bandwidth:
                    type: object
                    description: Per-connection download speed throttling.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      limit_type:
                        type: string
                        enum: [static, dynamic]
                        example: static
                      speed:
                        type: integer
                        example: 12000
                      buffer:
                        type: integer
                        example: 1024
                  disposition:
                    type: object
                    description: Sets Content-Disposition attachment on responses.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      value:
                        type: integer
                        example: 0
                  limit_request:
                    type: object
                    description: Per-IP request rate limiting.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      rate:
                        type: integer
                        example: 9
                      burst:
                        type: integer
                        example: 98
                      delay:
                        type: integer
                        example: 96
                      ip_whitelists:
                        type: array
                        items:
                          type: string
                        example: []
                  rewrite:
                    type: object
                    description: URL rewrite rule applied before forwarding to origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      body:
                        type: string
                        example: ""
                      flag:
                        type: string
                        enum: [break, last, redirect, permanent]
                        example: break
                  host_redirect:
                    type: object
                    description: Redirect requests to a different hostname.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      to:
                        type: string
                        example: ""
                      value:
                        type: array
                        items:
                          type: string
                        example: []
                  redirect_http_to_https:
                    type: object
                    description: Permanently redirect all HTTP requests to HTTPS (301).
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                  allowedHttpMethods:
                    type: object
                    description: Restrict which HTTP methods the CDN forwards to origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      value:
                        type: string
                        nullable: true
                        example: null
                  follow_origin_redirect:
                    type: object
                    description: Follow HTTP redirects returned by the origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      codes:
                        type: array
                        items:
                          type: integer
                        example: []
                  hsts:
                    type: object
                    description: HTTP Strict Transport Security configuration.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      referrerPolicy:
                        type: string
                        enum:
                          - no-referrer
                          - no-referrer-when-downgrade
                          - origin
                          - origin-when-cross-origin
                          - same-origin
                          - strict-origin
                          - strict-origin-when-cross-origin
                          - unsafe-url
                        example: no-referrer
                      includeSubDomains:
                        type: boolean
                        example: true
                      preload:
                        type: boolean
                        example: true
                  xff:
                    type: object
                    description: Add the X-Forwarded-For header with the client IP when forwarding to origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                  sni:
                    type: object
                    description: SNI hostname used in TLS handshake toward origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      sni_type:
                        type: string
                        enum: [dynamic, custom]
                        example: dynamic
                      custom_hostname:
                        type: string
                        example: ""
                  tls_versions:
                    type: object
                    description: >
                      TLS version restrictions. Only available when updating default behaviors,
                      not available in rule editing.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        description: "Inherit / enable / disable TLS version restrictions."
                        example: null
                      value:
                        type: array
                        items:
                          type: string
                          enum: [TLSv1, TLSv1.1, TLSv1.2, TLSv1.3]
                        description: "Allowed TLS protocol versions. Empty array = all versions allowed."
                        example: []
                  image_stack:
                    type: object
                    description: On-the-fly image optimization.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      quality:
                        type: string
                        enum: [Disabled, Low, Medium, High]
                        example: Disabled
                      webp:
                        type: string
                        enum: [Disabled, Enabled]
                        example: Disabled
                      avif:
                        type: string
                        enum: [Disabled, Enabled]
                        example: Disabled
                      png_loseless:
                        type: string
                        enum: ["true", "false"]
                        example: "true"
                  asset_stack:
                    type: object
                    description: Web performance optimization for CSS and JavaScript assets.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      combine_css:
                        type: boolean
                        example: false
                      MaxCombinedCssBytes:
                        type: integer
                        example: -1
                      flatten_css_imports:
                        type: boolean
                        example: false
                      CssFlattenMaxBytes:
                        type: integer
                        nullable: true
                        example: null
                      inline_css:
                        type: boolean
                        example: false
                      CssInlineMaxBytes:
                        type: integer
                        nullable: true
                        example: null
                      outline_css:
                        type: boolean
                        example: false
                      CssOutlineMinBytes:
                        type: integer
                        nullable: true
                        example: null
                      rewrite_css:
                        type: boolean
                        example: false
                      fallback_rewrite_css_urls:
                        type: boolean
                        example: false
                      combine_javascript:
                        type: boolean
                        example: false
                      MaxCombinedJsBytes:
                        type: integer
                        nullable: true
                        example: null
                      defer_javascript:
                        type: boolean
                        example: false
                      inline_javascript:
                        type: boolean
                        example: false
                      JsInlineMaxBytes:
                        type: integer
                        nullable: true
                        example: null
                      rewrite_javascript:
                        type: boolean
                        example: false
                      outline_javascript:
                        type: boolean
                        example: false
                      JsOutlineMinBytes:
                        type: integer
                        nullable: true
                        example: null
                      collapse_whitespace:
                        type: boolean
                        example: false
                      remove_comments:
                        type: boolean
                        example: false
                      remove_quotes:
                        type: boolean
                        example: false
                      CombineAcrossPaths:
                        type: boolean
                        example: false
                  cms:
                    type: object
                    description: CMS-specific caching optimizations.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      value:
                        type: array
                        items:
                          type: string
                        example: []
                  force_return:
                    type: object
                    description: Return a fixed HTTP status code for matched requests.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      code:
                        type: integer
                        example: 200
                      body:
                        type: string
                        example: ""
                  stale:
                    type: object
                    description: Serve stale cached content if origin is unreachable.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      value:
                        type: string
                        example: ""
                  staticHeaders:
                    type: object
                    description: Add or override response headers.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      keys:
                        type: array
                        items:
                          type: string
                        example: []
                      values:
                        type: array
                        items:
                          type: string
                        example: []
                  staticRequestHeaders:
                    type: object
                    description: Adds or overrides headers on the request forwarded to origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      keys:
                        type: array
                        items:
                          type: string
                        example: []
                      values:
                        type: array
                        items:
                          type: string
                        example: []
                  response_headers_hiding_policy:
                    type: object
                    description: Suppress specific response headers before delivery to the client.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      mode:
                        type: string
                        enum: [hide, show]
                        example: hide
                      expected:
                        type: object
                        properties:
                          hide:
                            type: array
                            items:
                              type: string
                            example: []
                          show:
                            type: array
                            items:
                              type: string
                            example: []
                  hostHeader:
                    type: object
                    description: Controls the Host header sent to origin.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      control:
                        type: string
                        enum: [forward, custom]
                        example: forward
                      custom:
                        type: string
                        example: ""
                  forward_host_header:
                    type: object
                    description: Legacy alias for the Host Header setting. Send alongside hostHeader.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                  honor_vary:
                    type: object
                    description: Respect the Vary header from origin when building the cache key.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                  cors:
                    type: object
                    description: CORS header support.
                    properties:
                      enabled:
                        type: boolean
                        nullable: true
                        example: null
                      control:
                        type: string
                        example: "*"
                      always:
                        type: boolean
                        example: false
                      value:
                        type: string
                        example: "*"
                      custom:
                        type: string
                        example: ""
          example:
            name: default
            rule: /
            options:
              edge_cache_settings:
                enabled: null
                control: default
                default: 345600s
                value: 345600s
                revalidate: null
                custom: { default: "", value: "" }
                custom_values: { codes: [], value: [] }
              midgress_cache_settings:
                enabled: null
                control: default
                default: 345600s
                value: 345600s
                revalidate: null
                custom: { default: "", value: "" }
                custom_values: { codes: [], value: [] }
              browser_cache_settings:
                enabled: null
                control: default
                value: 345600s
                custom: { value: "" }
              ignore_cookie: { enabled: null }
              ignoreQueryString: { enabled: null, control: null, value: null }
              query_params_blacklist: { enabled: null, value: null }
              query_params_whitelist: { enabled: null, value: null }
              country_acl: { enabled: null, policy_type: allow, excepted_values: [], ip_whitelists: [] }
              ip_address_acl: { enabled: null, policy_type: allow, excepted_values: [], ip_whitelists: [] }
              user_agent_acl: { enabled: null, policy_type: allow, excepted_values: [], ip_whitelists: [], casesensitive: false }
              referrer_acl: { enabled: null, policy_type: allow, noreferer: false, excepted_values: [], ip_whitelists: [] }
              secure_key: { enabled: null, policy_type: 0, session: 0, key: "", ip_whitelists: [], type: false }
              gzipOn: { enabled: null }
              fetch_compressed: { enabled: null }
              brotli_compression: { enabled: null, value: "" }
              slice: { enabled: null }
              limit_bandwidth: { enabled: null, limit_type: static, speed: 12000, buffer: 1024 }
              disposition: { enabled: null, value: 0 }
              limit_request: { enabled: null, rate: 9, burst: 98, delay: 96, ip_whitelists: [] }
              rewrite: { enabled: null, body: "", flag: break }
              host_redirect: { enabled: null, to: "", value: [] }
              redirect_http_to_https: { enabled: null }
              allowedHttpMethods: { enabled: null, value: null }
              follow_origin_redirect: { enabled: null, codes: [] }
              hsts: { enabled: null, referrerPolicy: no-referrer, includeSubDomains: true, preload: true }
              xff: { enabled: null }
              sni: { enabled: null, sni_type: dynamic, custom_hostname: "" }
              tls_versions: { enabled: null, value: [] }
              image_stack: { enabled: null, quality: Disabled, webp: Disabled, avif: Disabled, png_loseless: "true" }
              asset_stack:
                enabled: null
                combine_css: false
                MaxCombinedCssBytes: -1
                flatten_css_imports: false
                CssFlattenMaxBytes: null
                inline_css: false
                CssInlineMaxBytes: null
                outline_css: false
                CssOutlineMinBytes: null
                rewrite_css: false
                fallback_rewrite_css_urls: false
                combine_javascript: false
                MaxCombinedJsBytes: null
                defer_javascript: false
                inline_javascript: false
                JsInlineMaxBytes: null
                rewrite_javascript: false
                outline_javascript: false
                JsOutlineMinBytes: null
                collapse_whitespace: false
                remove_comments: false
                remove_quotes: false
                CombineAcrossPaths: false
              cms: { enabled: null, value: [] }
              force_return: { enabled: null, code: 200, body: "" }
              stale: { enabled: null, value: "" }
              staticHeaders: { enabled: null, keys: [], values: [] }
              staticRequestHeaders: { enabled: null, keys: [], values: [] }
              response_headers_hiding_policy:
                enabled: null
                mode: hide
                expected: { hide: [], show: [] }
              hostHeader: { enabled: null, control: forward, custom: "" }
              forward_host_header: { enabled: null }
              honor_vary: { enabled: null }
              cors: { enabled: null, control: "*", always: false, value: "*", custom: "" }

  # ─── Responses ──────────────────────────────────────────────
  responses:
    MutationSuccessResponse:
      description: Operation completed successfully
      content:
        application/json:
          schema:
            type: object
            required: [result, message]
            properties:
              result:
                type: string
                enum: [success]
              message:
                type: string
                example: "Rule updated successfully"

    ErrorResponse:
      description: Business-logic or validation error
      content:
        application/json:
          schema:
            type: object
            required: [result, message]
            properties:
              result:
                type: string
                enum: [error]
              message:
                type: string
                example: "Rule pattern is required"

    UnauthorizedResponse:
      description: Authentication token missing or expired
      content:
        application/json:
          schema:
            type: object
            properties:
              result:
                type: string
                enum: [error]
              message:
                type: string
                example: "Unauthorized"

  # ─── Schemas ────────────────────────────────────────────────
  schemas:

    EdgeRulesListResponse:
      type: object
      required: [rules, behaviors]
      properties:
        result:
          type: string
          enum: [success]
        rules:
          type: array
          description: All edge rules configured for the zone
          items:
            $ref: '#/components/schemas/SummaryRule'
        behaviors:
          type: array
          description: Default behavior entries for the zone (typically one item)
          items:
            $ref: '#/components/schemas/BehaviorEntry'

    SummaryRule:
      type: object
      required: [id, network, rule]
      properties:
        id:
          type: integer
          description: Database ID of the rule record
          example: 101
        network:
          type: string
          description: CDN network scope
          example: "global"
        rule:
          $ref: '#/components/schemas/RuleObject'

    BehaviorEntry:
      type: object
      required: [id, network, rule]
      properties:
        id:
          type: integer
          description: Database ID of the default behavior record
          example: 1
        network:
          type: string
          example: "global"
        rule:
          $ref: '#/components/schemas/RuleObject'

    RuleObject:
      type: object
      required: [id, name, rule, ruleType, isRegex, options]
      properties:
        id:
          type: integer
          description: Internal rule identifier
          example: 201
        name:
          type: string
          description: Human-readable label for the rule
          example: "Cache Images"
        rule:
          type: string
          description: URL pattern or glob this rule matches against
          example: "/images/*"
        ruleType:
          type: integer
          description: "0 = default behavior; 1 = custom rule"
          enum: [0, 1]
          example: 1
        originProtocol:
          nullable: true
          description: Protocol override toward origin (null = inherit)
          example: null
        isRegex:
          type: boolean
          description: Whether `rule` is a regular expression instead of a glob
          example: false
        options:
          $ref: '#/components/schemas/RuleOptions'

    RulePayload:
      type: object
      required: [name, rule, options]
      properties:
        name:
          type: string
          description: Human-readable name for the rule
          example: "Cache Static Assets"
        rule:
          type: string
          description: URL glob pattern the rule applies to (e.g. /static/*)
          example: "/static/*"
        options:
          $ref: '#/components/schemas/RuleOptions'

    DeleteMethodOverride:
      type: object
      required: [_METHOD]
      properties:
        _METHOD:
          type: string
          enum: [DELETE]
          description: HTTP method override for this request. This endpoint accepts POST requests; include `_METHOD: "DELETE"` in the request body to delete an existing resource.

    RuleOptions:
      type: object
      description: >
        Each property is optional and independently nullable.
        `enabled: true` activates the behavior; `enabled: false` disables it;
        `enabled: null` (or the property absent) means "inherit from default".
      properties:
        edge_cache_settings:
          $ref: '#/components/schemas/EdgeCacheSettings'
        midgress_cache_settings:
          $ref: '#/components/schemas/EdgeCacheSettings'
        browser_cache_settings:
          $ref: '#/components/schemas/BrowserCacheSettings'
        segmenter_cache_settings:
          $ref: '#/components/schemas/SegmenterCacheSettings'
        country_acl:
          $ref: '#/components/schemas/CountryAcl'
        ip_address_acl:
          $ref: '#/components/schemas/IpAddressAcl'
        user_agent_acl:
          $ref: '#/components/schemas/UserAgentAcl'
        referrer_acl:
          $ref: '#/components/schemas/ReferrerAcl'
        secure_key:
          $ref: '#/components/schemas/SecureKey'
        redirect_http_to_https:
          $ref: '#/components/schemas/SimpleToggle'
        rewrite:
          $ref: '#/components/schemas/Rewrite'
        host_redirect:
          $ref: '#/components/schemas/HostRedirect'
        follow_origin_redirect:
          $ref: '#/components/schemas/FollowOriginRedirect'
        allowedHttpMethods:
          $ref: '#/components/schemas/AllowedHttpMethods'
        gzipOn:
          $ref: '#/components/schemas/SimpleToggle'
        brotli_compression:
          $ref: '#/components/schemas/BrotliCompression'
        fetch_compressed:
          $ref: '#/components/schemas/SimpleToggle'
        slice:
          $ref: '#/components/schemas/SimpleToggle'
        disposition:
          $ref: '#/components/schemas/Disposition'
        limit_bandwidth:
          $ref: '#/components/schemas/LimitBandwidth'
        limit_request:
          $ref: '#/components/schemas/LimitRequest'
        hsts:
          $ref: '#/components/schemas/Hsts'
        xff:
          $ref: '#/components/schemas/SimpleToggle'
        sni:
          $ref: '#/components/schemas/Sni'
        tls_versions:
          $ref: '#/components/schemas/TlsVersions'
        cors:
          $ref: '#/components/schemas/Cors'
        staticHeaders:
          $ref: '#/components/schemas/StaticHeaders'
        staticRequestHeaders:
          $ref: '#/components/schemas/StaticHeaders'
        response_headers_hiding_policy:
          $ref: '#/components/schemas/ResponseHeadersHidingPolicy'
        hostHeader:
          $ref: '#/components/schemas/HostHeader'
        forward_host_header:
          $ref: '#/components/schemas/SimpleToggle'
        honor_vary:
          $ref: '#/components/schemas/SimpleToggle'
        ignore_cookie:
          $ref: '#/components/schemas/SimpleToggle'
        ignoreQueryString:
          $ref: '#/components/schemas/IgnoreQueryString'
        query_params_blacklist:
          $ref: '#/components/schemas/QueryParamsList'
        query_params_whitelist:
          $ref: '#/components/schemas/QueryParamsList'
        stale:
          $ref: '#/components/schemas/Stale'
        force_return:
          $ref: '#/components/schemas/ForceReturn'
        cms:
          $ref: '#/components/schemas/CmsOptimization'
        image_stack:
          $ref: '#/components/schemas/ImageStack'
        asset_stack:
          $ref: '#/components/schemas/AssetStack'

    SimpleToggle:
      type: object
      nullable: true
      description: A behavior that only has an on/off/inherit state
      properties:
        enabled:
          type: boolean
          nullable: true
          description: "true = active, false = inactive, null = inherit"
          example: true

    EdgeCacheSettings:
      type: object
      nullable: true
      description: CDN edge (or midgress) cache TTL configuration
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        control:
          type: string
          enum: [default, value, custom]
          description: >
            `default` uses the built-in default TTL; `value` uses the `value`
            field; `custom` maps status-code groups to individual TTLs via
            `custom_values`.
          example: "default"
        default:
          type: string
          description: Built-in default TTL string (seconds suffix)
          example: "345600s"
        value:
          type: string
          description: Override TTL when `control` is `value`
          example: "86400s"
        revalidate:
          type: boolean
          nullable: true
          description: Whether to revalidate stale content with the origin
          example: false
        custom:
          type: object
          description: Custom TTL pair used in the form (UI only; see custom_values for the API payload)
          properties:
            default:
              type: string
              example: ""
            value:
              type: string
              example: ""
        custom_values:
          $ref: '#/components/schemas/CustomValues'

    CustomValues:
      type: object
      description: >
        Maps HTTP status-code groups to specific TTLs.
        `codes` is a 2-D array where each inner array is a group of status
        codes that share the corresponding `value` entry.
      properties:
        codes:
          type: array
          items:
            type: array
            items:
              type: string
          example: [["200", "206"], ["301", "302"]]
        value:
          type: array
          items:
            type: string
          description: TTL string matching each codes group
          example: ["86400s", "3600s"]

    BrowserCacheSettings:
      type: object
      nullable: true
      description: Browser-side cache TTL configuration
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        control:
          type: string
          enum: [default, value, custom]
          example: "default"
        value:
          type: string
          description: Override TTL
          example: "345600s"
        custom:
          type: object
          properties:
            value:
              type: string
              example: ""

    SegmenterCacheSettings:
      type: object
      nullable: true
      description: HLS/MPEG-DASH segment and manifest cache TTLs (VOD/live pull zones only)
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        midgress_manifest:
          type: string
          description: Midgress-layer manifest TTL
          example: "60s"
        edge_manifest:
          type: string
          description: Edge-layer manifest TTL
          example: "30s"
        midgress_segment:
          type: string
          description: Midgress-layer segment TTL
          example: "3600s"
        edge_segment:
          type: string
          description: Edge-layer segment TTL
          example: "3600s"

    CountryAcl:
      type: object
      nullable: true
      description: Country-based access control
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        policy_type:
          type: string
          enum: [allow, deny]
          description: Whether the listed countries are allowed or denied
          example: "allow"
        excepted_values:
          description: ISO 3166-1 alpha-2 country codes to allow or deny
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: ["US", "CA", "GB"]
        ip_whitelists:
          description: IPs exempt from this country policy
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: ["192.168.1.0/24"]

    IpAddressAcl:
      type: object
      nullable: true
      description: IP address access control list
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        policy_type:
          type: string
          enum: [allow, deny]
          example: "allow"
        excepted_values:
          description: IP addresses or CIDR ranges subject to the policy
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: ["203.0.113.0/24", "198.51.100.5"]
        ip_whitelists:
          description: IPs always allowed regardless of policy
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: []

    UserAgentAcl:
      type: object
      nullable: true
      description: User-Agent string access policy
      properties:
        enabled:
          type: boolean
          nullable: true
          example: false
        policy_type:
          type: string
          enum: [allow, deny]
          example: "deny"
        excepted_values:
          description: User-Agent substrings to match
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: ["Googlebot", "bingbot"]
        ip_whitelists:
          description: IPs exempt from user-agent policy
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: []
        casesensitive:
          type: string
          description: Whether matching is case-sensitive ("true" | "false" | "")
          example: "false"

    ReferrerAcl:
      type: object
      nullable: true
      description: HTTP Referer header access policy
      properties:
        enabled:
          type: boolean
          nullable: true
          example: false
        policy_type:
          type: string
          enum: [allow, deny]
          example: "allow"
        noreferer:
          type: boolean
          description: Whether requests with no Referer header are allowed
          example: false
        excepted_values:
          description: Referer hostnames or patterns
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: ["example.com", "partner.io"]
        ip_whitelists:
          description: IPs exempt from referrer policy
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: []

    SecureKey:
      type: object
      nullable: true
      description: Token-based secure URL signing
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        policy_type:
          type: integer
          description: "0 = MD5; 1 = SHA-256"
          enum: [0, 1]
          example: 0
        session:
          type: integer
          description: Token lifetime in seconds (0 = no expiry)
          example: 3600
        key:
          type: string
          description: Shared secret used for HMAC token signing
          example: "myS3cr3tK3y"
        ip_whitelists:
          description: IPs exempt from token validation
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: []
        type:
          type: boolean
          nullable: true
          description: Additional signing mode flag (false = standard)
          example: false

    Rewrite:
      type: object
      nullable: true
      description: URL rewrite rule applied before forwarding to origin
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        body:
          type: string
          description: Target path pattern (supports capture groups)
          example: "/new-path/$1"
        flag:
          type: string
          enum: [break, last, redirect, permanent]
          description: Nginx-style rewrite flag controlling post-rewrite behavior
          example: "break"

    HostRedirect:
      type: object
      nullable: true
      description: Redirect requests to a different hostname
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        to:
          type: string
          description: Destination hostname (without protocol)
          example: "www.example.com"
        value:
          type: array
          items:
            type: string
          description: Additional host patterns to redirect
          example: []

    FollowOriginRedirect:
      type: object
      nullable: true
      description: Follow HTTP redirects returned by the origin
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        codes:
          type: array
          items:
            type: integer
          description: HTTP status codes from origin that trigger redirect following
          example: [301, 302, 307]

    AllowedHttpMethods:
      type: object
      nullable: true
      description: Restrict which HTTP methods the CDN forwards to origin
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        value:
          description: Permitted method names
          oneOf:
            - type: array
              items:
                type: string
                enum: [GET, HEAD, POST, PUT, DELETE, OPTIONS, PATCH]
            - type: string
          example: ["GET", "HEAD", "OPTIONS"]

    BrotliCompression:
      type: object
      nullable: true
      description: Brotli on-the-fly compression
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        value:
          type: string
          description: Comma-separated MIME types eligible for Brotli compression
          example: "text/html,text/css,application/javascript"

    Disposition:
      type: object
      nullable: true
      description: Force a file-download Content-Disposition header
      properties:
        enabled:
          type: boolean
          nullable: true
          example: false
        value:
          type: integer
          description: "0 = no override; 1 = attachment"
          enum: [0, 1]
          example: 0

    LimitBandwidth:
      type: object
      nullable: true
      description: Per-connection download speed throttling
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        limit_type:
          type: string
          enum: [static, dynamic]
          description: >
            `static` applies a fixed rate; `dynamic` computes the rate based
            on file size.
          example: "static"
        speed:
          type: integer
          description: Maximum transfer speed in bytes/sec
          example: 12000
        buffer:
          type: integer
          description: Initial burst buffer in bytes before throttling starts
          example: 1024

    LimitRequest:
      type: object
      nullable: true
      description: Per-IP request rate limiting
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        rate:
          type: integer
          description: Sustained request rate (requests/sec)
          example: 9
        burst:
          type: integer
          description: Maximum burst above the sustained rate
          example: 98
        delay:
          type: integer
          description: Number of excess requests to delay before rejecting
          example: 96
        ip_whitelists:
          description: IPs exempt from rate limiting
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: []

    Hsts:
      type: object
      nullable: true
      description: HTTP Strict Transport Security (HSTS) header configuration
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        referrerPolicy:
          type: string
          enum:
            - no-referrer
            - no-referrer-when-downgrade
            - origin
            - origin-when-cross-origin
            - same-origin
            - strict-origin
            - strict-origin-when-cross-origin
            - unsafe-url
          description: Referrer-Policy header value sent alongside HSTS
          example: "no-referrer"
        includeSubDomains:
          type: boolean
          nullable: true
          description: Include the `includeSubDomains` HSTS directive
          example: true
        preload:
          type: boolean
          nullable: true
          description: Include the `preload` HSTS directive
          example: true

    Sni:
      type: object
      nullable: true
      description: SNI hostname used in TLS handshake toward origin
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        sni_type:
          type: string
          enum: [dynamic, custom]
          description: >
            `dynamic` = use the incoming request Host header;
            `custom` = use `custom_hostname`.
          example: "dynamic"
        custom_hostname:
          type: string
          description: Custom SNI hostname (used when sni_type is `custom`)
          example: "origin.example.com"

    TlsVersions:
      type: object
      nullable: true
      description: Minimum/allowed TLS protocol versions
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        value:
          type: array
          items:
            type: string
            enum: [TLSv1, TLSv1.1, TLSv1.2, TLSv1.3]
          description: Allowed TLS versions
          example: ["TLSv1.2", "TLSv1.3"]

    Cors:
      type: object
      nullable: true
      description: Cross-Origin Resource Sharing (CORS) header injection
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        control:
          type: string
          description: "`*` = wildcard; `custom` = use the `value` field"
          example: "*"
        always:
          type: boolean
          nullable: true
          description: Inject CORS headers on all responses including error codes
          example: true
        value:
          type: string
          description: Specific origin to allow when `control` is `custom`
          example: "https://app.example.com"
        custom:
          type: string
          nullable: true
          description: Additional custom CORS configuration string
          example: null

    StaticHeaders:
      type: object
      nullable: true
      description: >
        Static response (`staticHeaders`) or request (`staticRequestHeaders`) headers
        to inject. `keys` and `values` are parallel arrays.
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        keys:
          description: Header names
          oneOf:
            - type: array
              items:
                type: string
            - type: string
          example: ["X-Custom-Header", "Cache-Tag"]
        values:
          description: Corresponding header values
          oneOf:
            - type: array
              items:
                type: string
            - type: string
          example: ["cdn-edge", "static-assets"]

    ResponseHeadersHidingPolicy:
      type: object
      nullable: true
      description: Suppress specific response headers before delivery to the client
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        mode:
          type: string
          enum: [hide, show]
          description: >
            `hide` — remove the headers listed in `expected.hide`;
            `show` — remove everything except the headers listed in `expected.show`.
          example: "hide"
        expected:
          type: object
          properties:
            hide:
              type: array
              items:
                type: string
              description: Header names to suppress
              example: ["X-Powered-By", "Server"]
            show:
              type: array
              items:
                type: string
              description: Header names to pass through (used when mode is `show`)
              example: ["Content-Type", "Cache-Control"]

    HostHeader:
      type: object
      nullable: true
      description: Host header forwarded to origin
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        control:
          type: string
          enum: [forward, custom]
          description: >
            `forward` = pass the client Host header to origin;
            `custom` = use the `custom` field value.
          example: "forward"
        custom:
          type: string
          description: Custom hostname sent to origin (used when `control` is `custom`)
          example: "origin.mysite.com"

    IgnoreQueryString:
      type: object
      nullable: true
      description: >
        Controls whether the query string is included in the cache key.
        Mutually exclusive with `query_params_blacklist` /
        `query_params_whitelist` — only one should be enabled at a time.
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        control:
          type: string
          nullable: true
          description: Query-string handling mode when partially ignoring params
          example: null
        value:
          type: string
          nullable: true
          description: Specific query params to ignore (comma-separated)
          example: null

    QueryParamsList:
      type: object
      nullable: true
      description: >
        Cache-key query parameter blacklist or whitelist.
        When `query_params_blacklist` is enabled, listed params are stripped
        from the cache key. When `query_params_whitelist` is enabled, only
        listed params are kept.
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        value:
          description: Query parameter names
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: ["utm_source", "utm_medium", "fbclid"]

    Stale:
      type: object
      nullable: true
      description: Serve stale (always-online) content while revalidating or on origin error
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        value:
          type: string
          description: Maximum stale window duration (e.g. "86400s")
          example: "86400s"

    ForceReturn:
      type: object
      nullable: true
      description: Return a fixed HTTP status code for matched requests
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        code:
          type: integer
          description: HTTP status code to return (e.g. 200, 403, 404, 503)
          example: 403
        body:
          type: string
          description: Optional response body text
          example: "Access denied"

    CmsOptimization:
      type: object
      nullable: true
      description: CMS-specific caching optimizations (WordPress, Drupal, Joomla, etc.)
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        value:
          type: array
          items:
            type: string
            enum: [wordpress, drupal, joomla, magento]
          description: CMS platforms for which to apply dedicated optimizations
          example: ["wordpress"]

    ImageStack:
      type: object
      nullable: true
      description: On-the-fly image optimization (compression, format conversion)
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        quality:
          type: string
          enum: [Disabled, Low, Medium, High]
          description: JPEG/PNG lossy compression quality level
          example: "Medium"
        webp:
          type: string
          enum: [Disabled, Enabled]
          description: Convert images to WebP for supporting browsers
          example: "Enabled"
        avif:
          type: string
          enum: [Disabled, Enabled]
          description: Convert images to AVIF for supporting browsers
          example: "Disabled"
        png_loseless:
          type: string
          enum: ["true", "false"]
          description: Apply lossless optimization to PNG images
          example: "true"

    AssetStack:
      type: object
      nullable: true
      description: >
        Web performance optimization for CSS and JavaScript assets
        (combine, inline, minify, defer). All boolean sub-fields default to
        null (inherit) and are individually optional.
      properties:
        enabled:
          type: boolean
          nullable: true
          example: true
        combine_css:
          type: boolean
          nullable: true
          description: Concatenate multiple CSS files into one request
          example: true
        MaxCombinedCssBytes:
          type: integer
          description: Maximum combined CSS payload in bytes (-1 = unlimited)
          example: -1
        flatten_css_imports:
          type: boolean
          nullable: true
          description: Inline @import rules into the parent CSS file
          example: false
        CssFlattenMaxBytes:
          type: integer
          nullable: true
          description: Maximum bytes per flattened CSS file
          example: null
        inline_css:
          type: boolean
          nullable: true
          description: Inline small CSS files into the HTML head
          example: false
        CssInlineMaxBytes:
          type: integer
          nullable: true
          description: Maximum CSS size (bytes) eligible for inlining
          example: null
        outline_css:
          type: boolean
          nullable: true
          description: Extract inline style blocks into external files
          example: false
        CssOutlineMinBytes:
          type: integer
          nullable: true
          description: Minimum inline style size to trigger outlining
          example: null
        rewrite_css:
          type: boolean
          nullable: true
          description: Rewrite CSS URLs to CDN-hosted paths
          example: false
        fallback_rewrite_css_urls:
          type: boolean
          nullable: true
          description: Rewrite CSS URLs even when the resource is not on CDN
          example: false
        combine_javascript:
          type: boolean
          nullable: true
          description: Concatenate JavaScript files
          example: false
        MaxCombinedJsBytes:
          type: integer
          nullable: true
          description: Maximum combined JS payload in bytes
          example: null
        defer_javascript:
          type: boolean
          nullable: true
          description: Add defer attribute to script tags
          example: false
        inline_javascript:
          type: boolean
          nullable: true
          description: Inline small JS files into HTML
          example: false
        JsInlineMaxBytes:
          type: integer
          nullable: true
          description: Maximum JS size (bytes) eligible for inlining
          example: null
        rewrite_javascript:
          type: boolean
          nullable: true
          description: Rewrite JS URLs to CDN-hosted paths
          example: false
        outline_javascript:
          type: boolean
          nullable: true
          description: Extract inline script content into external files
          example: false
        JsOutlineMinBytes:
          type: integer
          nullable: true
          description: Minimum inline script size to trigger outlining
          example: null
        collapse_whitespace:
          type: boolean
          nullable: true
          description: Remove redundant whitespace from HTML
          example: true
        remove_comments:
          type: boolean
          nullable: true
          description: Strip HTML comments
          example: true
        remove_quotes:
          type: boolean
          nullable: true
          description: Remove optional attribute quotes from HTML tags
          example: false
        CombineAcrossPaths:
          type: boolean
          nullable: true
          description: Allow combining assets from different URL paths
          example: false

    ValidateRuleRequest:
      type: object
      required: [rule, zoneid, zonetype]
      properties:
        rule:
          type: string
          description: >
            The URL pattern or regex string to validate. Same value as the rule
            field in the create/update payload. Supports plain path patterns
            (e.g. /images/*) and regex (e.g. ^/api/v[0-9]+/).
          example: /images/*
        zoneid:
          type: integer
          description: The numeric ID of the zone this rule will belong to.
          example: 12345
        zonetype:
          type: string
          enum: [pull, push]
          description: >
            The type of the zone. Determines which pattern syntax rules apply.
            Must match the zone's type exactly.
          example: pull

    ValidateRuleResponse:
      type: object
      required: [result, message]
      properties:
        result:
          type: string
          enum: [success, error]
          description: Outcome of the validation.
          example: success
        message:
          type: string
          description: Human-readable description of the validation result or error reason.
          example: Rule pattern is valid.