                  will be generated soon.
  /dns/{dnsId}/soa:
    get:
      tags:
      - default
      summary: Get Zone SOA
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  serialNumber: '2022042309'
                  primaryNS: pns31.5centscdn.net
                  adminMail: support@5centscdn.net
                  refresh: '7200'
                  retry: '1800'
                  expire: '1209600'
                  defaultTTL: '3600'
    post:
      tags:
      - default
      summary: Update Zone SOA
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                primaryNS: pns31.5centscdn.com
                adminMail: support@5centscdn.com
                refresh: '3600'
                retry: '1800'
                expire: '1209600'
                defaultTTL: '3600'
              properties:
                primaryNS:
                  type: string
                  description: Primary name server for the zone.
                  example: pns31.5centscdn.com
                adminMail:
                  type: string
                  description: Administrator email address for the zone.
                  example: support@5centscdn.com
                refresh:
                  type: string
                  description: How often secondary servers check for updates, in seconds.
                  example: '3600'
                retry:
                  type: string
                  description: How long secondary servers wait before retrying a failed
                    refresh, in seconds.
                  example: '1800'
                expire:
                  type: string
                  description: How long secondary servers keep zone data if they cannot
                    reach the primary, in seconds.
                  example: '1209600'
                defaultTTL:
                  type: string
                  description: Default TTL applied to records without an explicit
                    TTL, in seconds.
                  example: '3600'
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                status: Success
                statusDescription: The SOA record was modified successfully.
