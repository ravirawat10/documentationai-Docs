    get:
      tags:
      - default
      summary: Export Zone
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          headers:
            Content-Description:
              schema:
                type: string
                example: File Transfer
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="5centscdn.dev.txt"
            Connection:
              schema:
                type: string
                example: close
            Transfer-Encoding:
              schema:
                type: string
                example: chunked
            Content-Type:
              schema:
                type: string
                example: application/octet-stream
          content:
            text/plain:
              schema:
                type: string
              example: "$ORIGIN 5centscdn.dev.\n@\t3600\tIN\tSOA\tpns31.5centscdn.com.\
                \ support.5centscdn.com. 2022042311 3600 1800 1209600 3600\n@\t3600\t\
                IN\tNS\tpns31.5centscdn.com.\n@\t3600\tIN\tNS\tpns32.5centscdn.com.\n\
                @\t3600\tIN\tNS\tpns33.5centscdn.com.\n@\t3600\tIN\tNS\tpns34.5centscdn.com.\n\
                ww3\t60\tIN\tA\t51.222.141.228\nwww\t60\tIN\tA\t51.222.141.228\ncdn\t\
                3600\tIN\tCNAME\tpull-2871.5centscdn.com.\n_acme-challenge.ww3\t3600\t\
                IN\tTXT\t\"fC95Tjct5eB1a4qUe7UpPSt4un6ivngEvJrKABKtm24\"\ntest\t60\t\
                IN\tA\t2.2.2.2\n;@\t60\tIN\tALIAS\tpull-2871.5centscdn.com\n@\t60\t\
                IN\tA\t23.217.99.152\n@\t60\tIN\tA\t23.217.99.162\n@\t60\tIN\tAAAA\t\
                2a02:26f0:d7::17d9:63c0\n@\t60\tIN\tAAAA\t2a02:26f0:d7::17d9:63cb\n\
                vikesh\t60\tIN\tA\t7.8.9.1\ntestt\t60\tIN\tA\t8.8.8.8\ntest2\t60\t\
                IN\tA\t8.8.8.8\n258288550proxy\t60\tIN\tCNAME\twww.google.com.\nproxy\t\
                300\tIN\tCNAME\tpull-3061.5centscdn.com.\n"
  /dns/{dnsId}/import:
    post:
      tags:
      - default
      summary: Import Zone
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  description: bind/tinydns
                  example: bind
                file:
                  type: string
                  format: binary
                  description: Zone file content to import.
                  example: example zone file content
                delete-existing-records:
                  type: integer
                  description: '0: No, 1: Yes'
                  example: '0'
                record-types[]:
