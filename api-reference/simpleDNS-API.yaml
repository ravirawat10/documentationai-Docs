openapi: 3.0.3
info:
  title: 5centsCDN - SimpleDNS
  description: >
    API for managing SimpleDNS zones, records, DNSSEC, SOA, statistics,
    zone import/export, and mail forwards in 5centsCDN.
  version: 2.0.0
  contact:
    email: help@5centscdn.com
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
servers:
- url: https://api.5centscdn.com/v2
  description: 5centsCDN API Server - Production
tags:
- name: DNS Zones
  description: DNS zone management (create, list, delete, restore, status)
- name: DNS Records
  description: DNS record management within a zone
- name: DNS Security
  description: DNSSEC and SOA management
- name: DNS Statistics
  description: DNS query statistics
- name: Mail Forwards
  description: Email forwarding rules for DNS zones
components:
  securitySchemes:
    apikeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    dnsIdParam:
      name: dnsId
      in: path
      required: true
      description: SimpleDNS zone ID.
      schema:
        type: integer
        example: 42
    recordIdParam:
      name: recordid
      in: path
      required: true
      description: DNS record ID within the zone.
      schema:
        type: integer
        example: 258289692
  schemas:
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          enum: [Success, Error]
          description: Outcome of the operation.
          example: '1'
        statusDescription:
          type: string
          description: Human-readable description of the outcome.
          example: Operation completed successfully.
      required: [status, statusDescription]
    RecordType:
      type: string
      description: DNS record type.
      enum: [A, AAAA, MX, CNAME, TXT, SPF, NS, SRV, WR, ALIAS, RP, SSHFP, NAPTR, CAA, TLSA, DS, CERT, PTR, HINFO, LOC, DNAME, OPENPGPKEY, SMIMEA]
    TtlValue:
      type: integer
      description: TTL value in seconds.
      enum: [60, 300, 900, 1800, 3600, 21600, 43200, 86400, 172800, 259200, 604800, 1209600, 2592000]
security:
- apikeyAuth: []
paths:
  /dns:
    get:
      operationId: listDnsZones
      tags: [DNS Zones]
      summary: List Zones
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: API response status.
                    example: success
                  domains:
                    type: array
                    description: Array of DNS zone objects configured for this service.
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique identifier.
                          example: 317
                        serviceid:
                          type: integer
                          description: Service account identifier.
                          example: 103
                        domain:
                          type: string
                          description: Domain name configured in the DNS zone.
                          example: example.com
                        meta:
                          type: object
                          description: Metadata about the DNS zone from the provider.
                          properties:
                            name:
                              type: string
                              description: Domain name as stored in the DNS provider.
                              example: example.com
                            id:
                              type: string
                              description: Unique identifier.
                              example: '12345'
                            type:
                              type: string
                              description: Zone type identifier.
                              example: master
                            group:
                              type: string
                              description: Zone group assignment.
                              example: None
                            hasBulk:
                              type: boolean
                              description: Whether bulk record operations are enabled for this zone.
                              example: false
                            is_cloud:
                              type: integer
                              description: Whether the zone is a cloud-based zone (1 = yes, 0 = no).
                              example: 0
                            zone:
                              type: string
                              description: Zone classification type.
                              example: domain
                            status:
                              type: string
                              description: Current status of the zone or record.
                              example: '1'
                            serial:
                              type: string
                              description: SOA serial number for zone change tracking.
                              example: '2026010100'
                            isUpdated:
                              type: integer
                              description: Whether the zone has been updated and propagated (1 = yes, 0 = no).
                              example: 1
                        soa:
                          type: object
                          description: SOA (Start of Authority) record data for the DNS zone.
                          properties:
                            serialNumber:
                              type: string
                              description: SOA serial number used for zone change tracking.
                              example: '2026010100'
                            primaryNS:
                              type: string
                              description: Primary nameserver hostname for the zone.
                              example: ns1.example-dns.com
                            adminMail:
                              type: string
                              description: Administrator email address for the DNS zone.
                              example: admin@example.com
                            refresh:
                              type: string
                              description: Zone refresh interval in seconds.
                              example: '7200'
                            retry:
                              type: string
                              description: Retry interval in seconds after a failed zone refresh.
                              example: '1800'
                            expire:
                              type: string
                              description: Expiry time in seconds for secondary zone data.
                              example: '1209600'
                            defaultTTL:
                              type: string
                              description: Default TTL in seconds for records without an explicit TTL.
                              example: '3600'
                        dnssec:
                          type: object
                          description: DNSSEC configuration and key data for the zone.
                          properties:
                            status:
                              type: string
                              description: Current status of the zone or record.
                              example: '1'
                            ds:
                              type: array
                              description: Array of DS record strings for DNSSEC delegation.
                              items:
                                type: string
                            ds_records:
                              type: array
                              description: Array of parsed DS record objects.
                              items:
                                type: object
                                properties:
                                  digest:
                                    type: string
                                    description: DS record digest hash value.
                                    example: a1b2c3d4e5f6789012345678abcdef12
                                  key_tag:
                                    type: string
                                    description: Key tag value identifying the DNSSEC signing key.
                                    example: '12345'
                                  algorithm:
                                    type: string
                                    description: DNSSEC algorithm identifier.
                                    example: '13'
                                  algorithm_name:
                                    type: string
                                    description: Human-readable DNSSEC algorithm name.
                                    example: ECDSA SHA-256
                                  digest_type:
                                    type: string
                                    description: DS digest type identifier.
                                    example: '2'
                                  digest_type_name:
                                    type: string
                                    description: Human-readable DS digest type name.
                                    example: SHA-256
                            dnskey:
                              type: array
                              description: Array of DNSKEY record strings for the zone.
                              items:
                                type: string
                            optout:
                              type: string
                              description: DNSSEC opt-out flag (1 = enabled, 0 = disabled).
                              example: '1'
                            statusDescription:
                              type: string
                              description: Human-readable description of the operation outcome.
                              example: The DNSSEC is not active.
                        preferredtype:
                          type: string
                          description: Preferred DNS record type filter setting.
                          example: All
                        created_at:
                          type: string
                          description: Timestamp when this record was created.
                          example: '2023-07-04 14:08:59'
                        updated_at:
                          type: string
                          description: Timestamp when this record was last updated.
                          example: '2026-04-20 05:57:57'
                        synced_at:
                          type: string
                          description: Timestamp when the zone was last synced with the provider.
                          example: '2026-04-20 05:57:57'
                        validated_at:
                          type: string
                          description: Timestamp when the zone was last validated.
                          example: '2026-04-17 22:57:53'
                        deleted:
                          nullable: true
                          example:
                        proxied:
                          type: array
                          description: Array of CDN-proxied record configurations for this zone.
                          items: {}
                        linkedZones:
                          type: object
                          description: Map of linked CDN zones keyed by zone ID.
                          additionalProperties:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: Unique identifier.
                                example: 12345
                              mode:
                                type: string
                                description: Linked zone or proxy mode type.
                                example: http
                        nameservers:
                          type: array
                          description: Array of authoritative nameserver hostnames for the zone.
                          items:
                            type: string
                          example: [ns1.example-dns.com, ns2.example-dns.com, ns3.example-dns.com, ns4.example-dns.com]
                        stats:
                          type: object
                          description: Query and record statistics for this zone.
                          properties:
                            queries:
                              type: integer
                              description: Total number of DNS queries received for this zone.
                              example: 125000
                            records:
                              type: integer
                              description: Total number of DNS records configured in this zone.
                              example: 16
                  nameservers:
                    type: array
                    description: Array of authoritative nameserver hostnames for the zone.
                    items:
                      type: string
                    example: [ns1.example-dns.com, ns2.example-dns.com, ns3.example-dns.com, ns4.example-dns.com]
    post:
      operationId: createDnsZone
      tags: [DNS Zones]
      summary: Create Zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, _METHOD]
              properties:
                domain:
                  type: string
                  description: New DNS Domain
                  example: testdomain.com
                _METHOD:
                  type: string
                  description: HTTP method override for this request. This endpoint accepts POST requests; set _METHOD to PUT in the request body to update an existing resource.
                  example: PUT
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Operation outcome.
                    example: Success
                  statusDescription:
                    type: string
                    description: Human-readable description of the operation outcome.
                    example: Domain zone example.com was created successfully.
                  dnsid:
                    type: integer
                    description: Unique identifier of the newly created DNS zone. Present on success only.
                    example: 42
              examples:
                example-0:
                  summary: Error
                  value:
                    status: Error
                    statusDescription: Domain Already Exists
                example-1:
                  summary: Success
                  value:
                    status: Success
                    statusDescription: Domain zone example.com was created successfully.
                    dnsid: 42

  /dns/{dnsId}/updated:
    get:
      operationId: getDnsZoneUpdatedStatus
      tags: [DNS Zones]
      summary: Get Updated Status
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
              example: 'true'

  /dns/{dnsId}/status:
    post:
      operationId: enableDisableDnsZone
      tags: [DNS Zones]
      summary: Enable/Disable Zone
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  description: '1: Enable, 0: Disable'
                  example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Operation outcome.
                    example: Success
                  statusDescription:
                    type: string
                    description: Human-readable description of the operation outcome.
                    example: The zone was activated.
              example:
                status: Success
                statusDescription: The zone was activated.

  /dns/{dnsId}:
    post:
      operationId: deleteDnsZone
      tags: [DNS Zones]
      summary: Delete Zone
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                _METHOD:
                  type: string
                  description: HTTP method override for this request. This endpoint accepts POST requests; set _METHOD to DELETE in the request body to delete an existing resource.
                  example: DELETE
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Operation outcome.
                    example: Success
                  statusDescription:
                    type: string
                    description: Human-readable description of the operation outcome.
                    example: Domain zone example.com was disabled. Will be fully removed after usage billing.
              example:
                status: Success
                statusDescription: Domain zone example.com was disabled. Will be fully removed after usage billing.

  /dns/{dnsId}/restore:
    get:
      operationId: restoreDnsZone
      tags: [DNS Zones]
      summary: Restore Zone
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Operation outcome.
                    example: Success
                  statusDescription:
                    type: string
                    description: Human-readable description of the operation outcome.
                    example: Zone Restored
              example:
                status: Success
                statusDescription: Zone Restored

  /dns/{dnsId}/statistics:
    get:
      operationId: getDnsZoneStatistics
      tags: [DNS Statistics]
      summary: Get Zone Statistics
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Map of date keys (YYYY-MM-DD) to DNS query counts for that day.
                    additionalProperties:
                      type: integer
                    example:
                      '2026-01-01': 12500
                      '2026-01-02': 9800
                  options:
                    type: object
                    description: Navigation and filter options for the statistics view.
                    properties:
                      months:
                        type: object
                        description: Map of two-digit month number to abbreviated month name.
                        additionalProperties:
                          type: string
                        example:
                          '01': Jan
                          '02': Feb
                      years:
                        type: array
                        description: Array of years for which statistics are available.
                        items:
                          type: string
                        example: ['2026', '2025']
                  message:
                    type: string
                    nullable: true
                    description: Optional informational message accompanying the response.

  /dns/{dnsId}/statistics/last30:
    get:
      operationId: getDnsZoneStatisticsLast30
      tags: [DNS Statistics]
      summary: Get Zone Statistics (Last 30 Days)
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Map of date keys (YYYY-MM-DD) to DNS query counts for the last 30 days.
                    additionalProperties:
                      type: integer
                    example:
                      '2026-01-01': 12500
                      '2026-01-02': 9800
                  options:
                    type: object
                    description: Navigation and filter options for the statistics view.
                    properties:
                      months:
                        type: object
                        description: Map of two-digit month number to abbreviated month name.
                        additionalProperties:
                          type: string
                        example:
                          '01': Jan
                          '02': Feb
                      years:
                        type: array
                        description: Array of years for which statistics are available.
                        items:
                          type: string
                        example: ['2026', '2025']
                  message:
                    type: string
                    nullable: true
                    description: Optional informational message accompanying the response.

  /dns/{dnsId}/statistics/monthly/{year}:
    get:
      operationId: getDnsZoneStatisticsMonthly
      tags: [DNS Statistics]
      summary: Get Zone Statistics (Monthly)
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      - name: year
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Map of two-digit month number keys to total DNS query counts for that month.
                    additionalProperties:
                      type: integer
                    example:
                      '01': 45200
                      '02': 38900
                  options:
                    type: object
                    description: Navigation and filter options for the statistics view.
                    properties:
                      months:
                        type: object
                        description: Map of two-digit month number to abbreviated month name.
                        additionalProperties:
                          type: string
                        example:
                          '01': Jan
                          '02': Feb
                      years:
                        type: array
                        description: Array of years for which statistics are available.
                        items:
                          type: string
                        example: ['2026', '2025']
                  message:
                    type: string
                    nullable: true
                    description: Optional informational message accompanying the response.

  /dns/{dnsId}/statistics/yearly:
    get:
      operationId: getDnsZoneStatisticsYearly
      tags: [DNS Statistics]
      summary: Get Zone Statistics (Yearly)
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Map of year string keys to total DNS query counts for that year.
                    additionalProperties:
                      type: string
                    example:
                      '2026': '520000'
                      '2025': '487000'
                  options:
                    type: object
                    description: Navigation and filter options for the statistics view.
                    properties:
                      months:
                        type: object
                        description: Map of two-digit month number to abbreviated month name.
                        additionalProperties:
                          type: string
                        example:
                          '01': Jan
                          '02': Feb
                      years:
                        type: array
                        description: Array of years for which statistics are available.
                        items:
                          type: string
                        example: ['2026', '2025']
                  message:
                    type: string
                    nullable: true
                    description: Optional informational message accompanying the response.

  /dns/{dnsId}/statistics/daily/{year}/{month}:
    get:
      operationId: getDnsZoneStatisticsDaily
      tags: [DNS Statistics]
      summary: Get Zone Statistics (Daily)
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      - name: year
        in: path
        schema:
          type: string
        required: true
      - name: month
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Map of two-digit day-of-month keys to DNS query counts for that day.
                    additionalProperties:
                      type: integer
                    example:
                      '01': 15200
                      '02': 18400
                  options:
                    type: object
                    description: Navigation and filter options for the statistics view.
                    properties:
                      months:
                        type: object
                        description: Map of two-digit month number to abbreviated month name.
                        additionalProperties:
                          type: string
                        example:
                          '01': Jan
                          '02': Feb
                      years:
                        type: array
                        description: Array of years for which statistics are available.
                        items:
                          type: string
                        example: ['2026', '2025']
                  message:
                    type: string
                    nullable: true
                    description: Optional informational message accompanying the response.

  /dns/{dnsId}/statistics/hourly/{year}/{month}/{day}:
    get:
      operationId: getDnsZoneStatisticsHourly
      tags: [DNS Statistics]
      summary: Get Zone Statistics (Hourly)
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      - name: year
        in: path
        schema:
          type: string
        required: true
      - name: month
        in: path
        schema:
          type: string
        required: true
      - name: day
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Map of two-digit hour-of-day keys (00-23) to DNS query counts for that hour.
                    additionalProperties:
                      type: integer
                    example:
                      '10': 420
                      '11': 385
                  options:
                    type: object
                    description: Navigation and filter options for the statistics view.
                    properties:
                      months:
                        type: object
                        description: Map of two-digit month number to abbreviated month name.
                        additionalProperties:
                          type: string
                        example:
                          '01': Jan
                          '02': Feb
                      years:
                        type: array
                        description: Array of years for which statistics are available.
                        items:
                          type: string
                        example: ['2026', '2025']
                  message:
                    type: string
                    nullable: true
                    description: Optional informational message accompanying the response.

  /dns/{dnsId}/dnssec:
    get:
      operationId: getDnsZoneDnssec
      tags: [DNS Security]
      summary: Get Zone DNSSEC
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: Response data payload.
                    properties:
                      status:
                        type: string
                        description: Current status of the zone or record.
                        example: '1'
                      ds:
                        type: array
                        description: Array of DS record strings for DNSSEC delegation.
                        items:
                          type: string
                        example:
                        - "example.com. 3600 IN DS 12345 13 2 a1b2c3d4e5f6789012345678abcdef1234567890abcdef1234567890abcdef12"
                      ds_records:
                        type: array
                        description: Array of parsed DS record objects.
                        items:
                          type: object
                          properties:
                            digest:
                              type: string
                              description: DS record digest hash value.
                              example: a1b2c3d4e5f6789012345678abcdef1234567890abcdef1234567890abcdef12
                            key_tag:
                              type: string
                              description: Key tag value identifying the DNSSEC signing key.
                              example: '12345'
                            algorithm:
                              type: string
                              description: DNSSEC algorithm identifier.
                              example: '13'
                            algorithm_name:
                              type: string
                              description: Human-readable DNSSEC algorithm name.
                              example: ECDSA SHA-256
                            digest_type:
                              type: string
                              description: DS digest type identifier.
                              example: '2'
                            digest_type_name:
                              type: string
                              description: Human-readable DS digest type name.
                              example: SHA-256
                      dnskey:
                        type: array
                        description: Array of DNSKEY record strings for the zone.
                        items:
                          type: string
                        example:
                        - "example.com. 3600 IN DNSKEY 257 3 13 SampleKSKPublicKeyDataForDocumentationPurposesOnlyABC="
                      optout:
                        type: string
                        description: DNSSEC opt-out flag (1 = enabled, 0 = disabled).
                        example: '1'
    post:
      operationId: activateDnsZoneDnssec
      tags: [DNS Security]
      summary: Activate Zone DNSSEC
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  description: '1: activate, 0: deactivate'
                  example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Operation outcome.
                    example: Success
                  statusDescription:
                    type: string
                    description: Human-readable description of the operation outcome.
                    example: The DNSSEC is activated for your zone. The keys will be generated soon.
              example:
                status: Success
                statusDescription: The DNSSEC is activated for your zone. The keys will be generated soon.

  /dns/{dnsId}/soa:
    get:
      operationId: getDnsZoneSoa
      tags: [DNS Security]
      summary: Get Zone SOA
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    description: SOA (Start of Authority) record data for the zone.
                    properties:
                      serialNumber:
                        type: string
                        description: SOA serial number used for zone change tracking.
                        example: '2026010100'
                      primaryNS:
                        type: string
                        description: Primary nameserver hostname for the zone.
                        example: ns1.example-dns.com
                      adminMail:
                        type: string
                        description: Administrator email address for the DNS zone.
                        example: admin@example.com
                      refresh:
                        type: string
                        description: Zone refresh interval in seconds.
                        example: '7200'
                      retry:
                        type: string
                        description: Retry interval in seconds after a failed zone refresh.
                        example: '1800'
                      expire:
                        type: string
                        description: Expiry time in seconds for secondary zone data.
                        example: '1209600'
                      defaultTTL:
                        type: string
                        description: Default TTL in seconds for records without an explicit TTL.
                        example: '3600'
              example:
                data:
                  serialNumber: '2026010100'
                  primaryNS: ns1.example-dns.com
