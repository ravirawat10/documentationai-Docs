  /dns/{dnsId}/updated:
    get:
      tags:
      - default
      summary: Get UpdatedStatus
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
              example: 'true'
  /dns/{dnsId}/status:
    post:
      tags:
      - default
      summary: Enable/Disable Zone
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  description: '1: Enable, 0: Disable'
                  example: '1'
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                status: Success
                statusDescription: The zone was activated!
  /dns/{dnsId}:
    post:
      tags:
      - default
      summary: Delete Zone
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                _METHOD:
                  type: string
                  description: casting post -> delete
                  example: delete
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                status: Success
                statusDescription: Domain zone vivek.com was disabled. Will be fully
                  removed after usage billing.
