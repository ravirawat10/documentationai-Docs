      summary: Add Record
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                _METHOD:
                  type: string
                  description: post -> put
                  example: PUT
                type:
                  type: string
                  description: A, AAAA, MX, CNAME, TXT, NS, SRV, WR, RP, SSHFP, ALIAS,
                    CAA, TLSA, CERT, DS for domain names, NS and PTR for reversed
                    zones, and NAPTR, NS, CNAME for ENUM zones
                  example: A
                ttl:
                  type: integer
                  description: 'Available TTL''s:

                    60 = 1 minute

                    300 = 5 minutes

                    900 = 15 minutes

                    1800 = 30 minutes

                    3600 = 1 hour

                    21600 = 6 hours

                    43200 = 12 hours

                    86400 = 1 day

                    172800 = 2 days

                    259200 = 3 days

                    604800 = 1 week

                    1209600 = 2 weeks

                    2592000 = 1 month'
                  example: '60'
                host:
                  type: string
                  description: host / subdomain
                  example: new
                record:
                  type: string
                  description: Record you want to add. Example 10.10.10.10 or cname.5centscdn.com
                  example: 8.8.8.8
                priority:
                  type: string
                  description: Priority for MX or SRV record
                  example: '10'
                weight:
                  type: string
                  description: Weight for SRV record
                  example: '10'
                port:
                  type: string
                  description: Port for SRV record
                  example: '443'
                frame:
                  type: string
                  description: 0 or 1 for Web redirects to disable or enable frame
                  example: N
                frame_title:
                  type: string
                  description: Title if frame is enabled in Web redirects
                  example: My Site
                frame_keywords:
                  type: string
                  description: Keywords if frame is enabled in Web redirects
                  example: cdn, streaming
                frame_description:
                  type: string
                  description: Description if frame is enabled in Web redirects
                  example: My CDN site
                mobile_meta:
                  type: string
                  description: Mobile responsive meta tags if Web redirects with frame
                    is enabled. Default value - 0.
                  example: N
                save_path:
                  type: string
                  description: 0 or 1 for Web redirects
                  example: N
                redirect_type:
                  type: string
                  description: 301 or 302 for Web redirects if frame is disabled
                  example: '301'
                mail:
                  type: string
                  description: E-mail address for RP records
                  example: mail.example.com
                txt:
                  type: string
                  description: Domain name for TXT record used in RP records
                  example: v=spf1 include:example.com ~all
                algorithm:
                  type: string
                  description: The algorithm of the referenced DS record.
                  example: '2'
                fptype:
                  type: string
                  description: Type of the SSHFP algorithm. Required for SSHFP records
                    only.
                  example: '2'
                status:
                  type: string
                  description: Set to 1 to create the record active or to 0 to create
                    it inactive. If omitted the record will be created active.
                caa_flag:
                  type: string
                  description: 0 - Non critical or 128 - Critical
                  example: '0'
                caa_type:
                  type: string
                  description: Type of CAA record. The available flags are issue,
                    issuewild, iodef.
                  example: issue
                caa_value:
                  type: string
                  description: If caa_type is issue, caa_value can be hostname or
                    ";". If caa_type is issuewild, it can be hostname or ";". If caa_type
                    is iodef, it can be "mailto:someemail@address.tld, http://example.tld
                    or http://example.tld.
                  example: '"letsencrypt.org"'
                tlsa_usage:
                  type: string
                  description: (From 0 to 3) It shows the provided association that
                    will be used.
                  example: '3'
                tlsa_selector:
                  type: string
                  description: (From 0 to 1) It specifies which part of the TLS certificate
                    presented by the server will be matched against the association
                    data
                  example: '1'
                tlsa_matching_type:
                  type: string
                  description: (From 0 to 2) It specifies how the certificate association
                    is presented.
                  example: '1'
                key_tag:
                  type: string
                  description: A numeric value used for identifying the referenced
                    DS record.
                  example: '12345'
                digest_type:
                  type: string
                  description: The cryptographic hash algorithm is used to create
                    the Digest value.
                  example: '2'
                order:
                  type: string
                  description: Specifies the order in which multiple NAPTR records
                    must be processed (low to high).
                  example: '10'
                pref:
                  type: string
                  description: Specifies the order (low to high) in which NAPTR records
                    with equal Order values should be processed.
                  example: '10'
                flag:
                  type: string
                  description: Controls aspects of the rewriting and interpretation
                    of the fields in the record.
                  example: S
                params:
                  type: string
                  description: Specifies the service parameters applicable to this
                    delegation path.
                  example: SIP+D2U
                regexp:
                  type: string
                  description: Contains a substitution expression that is applied
                    to the original string, held by the client in order to construct
                    the next domain name to lookup.
                  example: ''
                replace:
                  type: string
                  description: Specifies the next domain name (fully qualified) to
                    query for depending on the potential values found in the flags
                    field.
                  example: _sip._udp.example.com
                cert_type:
                  type: string
                  description: Type of the Certificate/CRL
                  example: '1'
                cert_key_tag:
                  type: string
                  description: A numeric value (0-65535), used the efficiently pick
                    a CERT record.
                  example: '0'
                cert_algorithm:
                  type: string
                  description: Identifies the algorithm, used to produce a legitimate
                    signature.
                  example: '5'
                cpu:
                  type: string
                  description: Identifiable name of the CPU of the host. Can include
                    only  digits, letters, hyphen and forward slash. Must start with  a
                    letter and end with either letter or digit.
                  example: Intel
                os:
                  type: string
                  description: Name of the Operating System (OS) of the host. Can
                    include  only digits, letters, period, hyphen and forward slash.
                    Must  start with a letter and end with either letter or digit.
                  example: Linux
                lat_deg:
                  type: string
                  description: For type LOC, Latitude's Degrees. 0-90
                  example: '37'
                lat_min:
                  type: string
                  description: For type LOC, Latitude's Minutes. 0-59, if omitted
                    will default to 0
                  example: '46'
                lat_sec:
                  type: string
                  description: For type LOC, Latitude's seconds. 0-59.999, if omitted
                    will default to 0
                  example: '29'
                lat_dir:
                  type: string
                  description: 'For type LOC, Latitude''s Direction. N: North, S:
                    South'
                  example: N
                long_deg:
                  type: string
                  description: For type LOC, Longitude's Degrees. 0-90
                  example: '122'
                long_min:
                  type: string
                  description: For type LOC, Longitude's Minutes. 0-59, if omitted
                    will default to 0
                  example: '25'
                long_sec:
                  type: string
                  description: For type LOC, Longitude's seconds. 0-59.999, if omitted
                    will default to 0
                  example: '9'
                long_dir:
                  type: string
                  description: 'For type LOC, Longitude''s Direction. W: West, E:
                    East'
                  example: W
                altitude:
                  type: string
                  description: 'For type LOC, Precision: Altitude. -100000.00 - 42849672.95'
                  example: '0'
                size:
                  type: string
                  description: 'For type LOC, Precision: Size. 0 - 90000000.00. If
                    omitted, size defaults to 1'
                  example: '1'
                h_precision:
                  type: string
                  description: 'For type LOC, Precision: Horizontal. 0 - 90000000.00.
                    If omitted, horizontal precision defaults to 10000'
                  example: '10000'
                v_precision:
                  type: string
                  description: 'For type LOC, Precision: Vertical. 0 - 90000000.00.
                    If omitted, vertical precision defaults to 10'
                  example: '10'
                smimea_usage:
                  type: string
                  description: 'For type SMIMEA, Usage (0) PKIX-TA: Certificate Authority
                    Constraint (1) PKIX-EE: Service Certificate Constraint (2) DANE-TA:
                    Trust Anchor Assertion (3) DANE-EE: Domain Issued Certificate'
                  example: '3'
                smimea_selector:
                  type: string
                  description: 'For type SMIMEA, Selector (0) Cert: Use full certificate
                    (1) SPKI: Use subject public key'
                  example: '0'
                smimea_matching_type:
                  type: string
                  description: 'For type SMIMEA, Matching Type (0) Full: No Hash (1)
                    SHA-256: SHA-256 hash (2) SHA-512: SHA-512 hash'
                  example: '1'
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                status: Success
                statusDescription: The record was added successfully.
                data:
                  id: 258289692
