                adminMail:
                  type: string
                  description: Administrator email address for the zone.
                  example: admin@example.com
                refresh:
                  type: string
                  description: How often secondary servers check for updates, in seconds.
                  example: '3600'
                retry:
                  type: string
                  description: How long secondary servers wait before retrying a failed refresh, in seconds.
                  example: '1800'
                expire:
                  type: string
                  description: How long secondary servers keep zone data if they cannot reach the primary, in seconds.
