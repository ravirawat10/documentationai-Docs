openapi: 3.0.3
info:
  title: 5centsCDN - SimpleDNS
  description: >
    API for managing SimpleDNS zones, records, DNSSEC, SOA, statistics,
    zone import/export, and mail forwards in 5centsCDN.
  version: 2.0.0
  contact:
    email: help@5centscdn.com
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
servers:
- url: https://api.5centscdn.com/v2
  description: 5centsCDN API Server - Production
tags:
- name: DNS Zones
  description: DNS zone management (create, list, delete, restore, status)
- name: DNS Records
  description: DNS record management within a zone
- name: DNS Security
  description: DNSSEC and SOA management
- name: DNS Statistics
  description: DNS query statistics
- name: Mail Forwards
  description: Email forwarding rules for DNS zones
components:
  securitySchemes:
    apikeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    dnsIdParam:
      name: dnsId
      in: path
      required: true
      description: SimpleDNS zone ID.
      schema:
        type: integer
        example: 42
    recordIdParam:
      name: recordid
      in: path
      required: true
      description: DNS record ID within the zone.
      schema:
        type: integer
        example: 258289692
  schemas:
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          enum: [Success, Error]
          description: Outcome of the operation.
        statusDescription:
          type: string
          description: Human-readable description of the outcome.
      required: [status, statusDescription]
    RecordType:
      type: string
      description: DNS record type.
      enum: [A, AAAA, MX, CNAME, TXT, SPF, NS, SRV, WR, ALIAS, RP, SSHFP, NAPTR, CAA, TLSA, DS, CERT, PTR, HINFO, LOC, DNAME, OPENPGPKEY, SMIMEA]
    TtlValue:
      type: integer
      description: TTL value in seconds.
      enum: [60, 300, 600, 900, 1800, 3600, 21600, 43200, 86400, 172800, 259200, 604800, 1209600, 2592000]
security:
- apikeyAuth: []
paths:
  /dns:
    get:
      tags: [DNS Zones]
      summary: List Zones
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    example: success
                  domains:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 317
                        serviceid:
                          type: integer
                          example: 103
                        domain:
                          type: string
                          example: flussoniccdn.com
                        meta:
                          type: object
                          properties:
                            name:
                              type: string
                              example: flussoniccdn.com
                            id:
                              type: string
                              example: '5035023'
                            type:
                              type: string
                              example: master
                            group:
                              type: string
                              example: None
                            hasBulk:
                              type: boolean
                              example: false
                            is_cloud:
                              type: integer
                              example: 0
                            zone:
                              type: string
                              example: domain
                            status:
                              type: string
                              example: '1'
                            serial:
                              type: string
                              example: '2026042001'
                            isUpdated:
                              type: integer
                              example: 1
                        soa:
                          type: object
                          properties:
                            serialNumber:
                              type: string
                              example: '2026042001'
                            primaryNS:
                              type: string
                              example: pns31.5centscdn.com
                            adminMail:
                              type: string
                              example: support@5centscdn.com
                            refresh:
                              type: string
                              example: '7200'
                            retry:
                              type: string
                              example: '1800'
                            expire:
                              type: string
                              example: '1209600'
                            defaultTTL:
                              type: string
                              example: '3600'
                        dnssec:
                          type: object
                          properties:
                            status:
                              type: string
                              example: '1'
                            ds:
                              type: array
                              items:
                                type: string
                            ds_records:
                              type: array
                              items:
                                type: object
                                properties:
                                  digest:
                                    type: string
                                  key_tag:
                                    type: string
                                  algorithm:
                                    type: string
                                  algorithm_name:
                                    type: string
                                  digest_type:
                                    type: string
                                  digest_type_name:
                                    type: string
                            dnskey:
                              type: array
                              items:
                                type: string
                            optout:
                              type: string
                              example: '1'
                            statusDescription:
                              type: string
                              example: The DNSSEC is not active.
                        preferredtype:
                          type: string
                          example: All
                        created_at:
                          type: string
                          example: '2023-07-04 14:08:59'
                        updated_at:
                          type: string
                          example: '2026-04-20 05:57:57'
                        synced_at:
                          type: string
                          example: '2026-04-20 05:57:57'
                        validated_at:
                          type: string
                          example: '2026-04-17 22:57:53'
                        deleted:
                          nullable: true
                          example:
                        proxied:
                          type: array
                          items: {}
                        linkedZones:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              id:
                                type: integer
                              mode:
                                type: string
                        nameservers:
                          type: array
                          items:
                            type: string
                          example: [pns31.5centscdn.com, pns32.5centscdn.com, pns33.5centscdn.com, pns34.5centscdn.com]
                        stats:
                          type: object
                          properties:
                            queries:
                              type: integer
                              example: 877245
                            records:
                              type: integer
                              example: 16
                  nameservers:
                    type: array
                    items:
                      type: string
                    example: [pns31.5centscdn.com, pns32.5centscdn.com, pns33.5centscdn.com, pns34.5centscdn.com]
    post:
      tags: [DNS Zones]
      summary: Create Zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, _METHOD]
              properties:
                domain:
                  type: string
                  description: New DNS Domain
                  example: testdomain.com
                _METHOD:
                  type: string
                  description: masking post -> put request
                  example: PUT
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              examples:
                example-0:
                  summary: Error
                  value:
                    status: Error
                    statusDescription: Domain Already Exists
                example-1:
                  summary: Success
                  value:
                    status: Success
                    statusDescription: Domain zone vivek.com was created successfully.
                    dnsid: 93

  /dns/{dnsId}/updated:
    get:
      tags: [DNS Zones]
      summary: Get Updated Status
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
              example: 'true'

  /dns/{dnsId}/status:
    post:
      tags: [DNS Zones]
      summary: Enable/Disable Zone
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  description: '1: Enable, 0: Disable'
                  example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                status: Success
                statusDescription: The zone was activated!

  /dns/{dnsId}:
    post:
      tags: [DNS Zones]
      summary: Delete Zone
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                _METHOD:
                  type: string
                  description: casting post -> delete
                  example: delete
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                status: Success
                statusDescription: Domain zone vivek.com was disabled. Will be fully removed after usage billing.

  /dns/{dnsId}/restore:
    get:
      tags: [DNS Zones]
      summary: Restore Zone
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                status: Success
                statusDescription: Zone Restored

  /dns/{dnsId}/statistics:
    get:
      tags: [DNS Statistics]
      summary: Get Zone Statistics
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  '2022-04-20': 690
                  '2022-04-21': 671
                options:
                  months:
                    '0': '-'
                    '01': Jan
                  years: ['2022', '2021']
                message:

  /dns/{dnsId}/statistics/last30:
    get:
      tags: [DNS Statistics]
      summary: Get Zone Statistics (Last 30 Days)
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  '2022-04-20': 690
                  '2022-04-21': 671
                options:
                  months:
                    '0': '-'
                    '01': Jan
                  years: ['2022', '2021']
                message:

  /dns/{dnsId}/statistics/monthly/{year}:
    get:
      tags: [DNS Statistics]
      summary: Get Zone Statistics (Monthly)
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      - name: year
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  '03': 53854
                  '04': 23017
                options:
                  months:
                    '0': '-'
                    '01': Jan
                  years: ['2022', '2021']
                message:

  /dns/{dnsId}/statistics/yearly:
    get:
      tags: [DNS Statistics]
      summary: Get Zone Statistics (Yearly)
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  '2022': '76871'
                options:
                  months:
                    '0': '-'
                    '01': Jan
                  years: ['2022', '2021']
                message:

  /dns/{dnsId}/statistics/daily/{year}/{month}:
    get:
      tags: [DNS Statistics]
      summary: Get Zone Statistics (Daily)
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      - name: year
        in: path
        schema:
          type: string
        required: true
      - name: month
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  '01': 70970
                  '02': 75441
                options:
                  months:
                    '0': '-'
                    '01': Jan
                  years: ['2026', '2025']
                message:

  /dns/{dnsId}/statistics/hourly/{year}/{month}/{day}:
    get:
      tags: [DNS Statistics]
      summary: Get Zone Statistics (Hourly)
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      - name: year
        in: path
        schema:
          type: string
        required: true
      - name: month
        in: path
        schema:
          type: string
        required: true
      - name: day
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  '10': 19
                  '11': 19
                options:
                  months:
                    '0': '-'
                    '01': Jan
                  years: ['2022', '2021']
                message:

  /dns/{dnsId}/dnssec:
    get:
      tags: [DNS Security]
      summary: Get Zone DNSSEC
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: '1'
                      ds:
                        type: array
                        items:
                          type: string
                        example:
                        - "flussoniccdn.com. 3600 IN DS 39651 13 2 8392D66D42CE8941E86ED0D8BBE51870926B12F40083BA0EF8310BB007F93AAC"
                      ds_records:
                        type: array
                        items:
                          type: object
                          properties:
                            digest:
                              type: string
                              example: 8392D66D42CE8941E86ED0D8BBE51870926B12F40083BA0EF8310BB007F93AAC
                            key_tag:
                              type: string
                              example: '39651'
                            algorithm:
                              type: string
                              example: '13'
                            algorithm_name:
                              type: string
                              example: ECDSA SHA-256
                            digest_type:
                              type: string
                              example: '2'
                            digest_type_name:
                              type: string
                              example: SHA-256
                      dnskey:
                        type: array
                        items:
                          type: string
                        example:
                        - "flussoniccdn.com. 3600 IN DNSKEY 257 3 13 1v/ZI4Z9Fq2ilPhkRMktkaQPinzs+AIns81BrqGUatwJAOR+zGhOuF5ttBCKj+EH+zjhMU3mEWgJfjCuMLXvSQ=="
                      optout:
                        type: string
                        example: '1'
    post:
      tags: [DNS Security]
      summary: Activate Zone DNSSEC
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  description: '1: activate, 0: deactivate'
                  example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                status: Success
                statusDescription: The DNSSEC is activated for your zone. The keys will be generated soon.

  /dns/{dnsId}/soa:
    get:
      tags: [DNS Security]
      summary: Get Zone SOA
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                  serialNumber: '2022042309'
                  primaryNS: pns31.5centscdn.net
                  adminMail: support@5centscdn.net
                  refresh: '7200'
                  retry: '1800'
                  expire: '1209600'
                  defaultTTL: '3600'
    post:
      tags: [DNS Security]
      summary: Update Zone SOA
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                primaryNS:
                  type: string
                  description: Primary nameserver for the zone.
                  example: pns31.5centscdn.com
                adminMail:
                  type: string
                  description: Administrator email address for the zone.
                  example: support@5centscdn.com
                refresh:
                  type: string
                  description: How often secondary servers check for updates, in seconds.
                  example: '3600'
                retry:
                  type: string
                  description: How long secondary servers wait before retrying a failed refresh, in seconds.
                  example: '1800'
                expire:
                  type: string
                  description: How long secondary servers keep zone data if they cannot reach the primary, in seconds.
                  example: '1209600'
                defaultTTL:
                  type: string
                  description: Default TTL applied to records without an explicit TTL, in seconds.
                  example: '3600'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                status: Success
                statusDescription: The SOA record was modified successfully.

  /dns/{dnsId}/export:
    get:
      tags: [DNS Zones]
      summary: Export Zone
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
              example: "$ORIGIN example.com.\n@ 3600 IN SOA pns31.5centscdn.com. support.5centscdn.com. 2026042001 7200 1800 1209600 3600\n"

  /dns/{dnsId}/import:
    post:
      tags: [DNS Zones]
      summary: Import Zone
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  description: Import file format. bind or tinydns.
                  example: bind
                file:
                  type: string
                  format: binary
                  description: Zone file content to import.
                  example: zone file content
                delete-existing-records:
                  type: integer
                  description: Delete all existing records before import. 1 means yes, 0 means no.
                  example: 0
                record-types[]:
                  type: string
                  description: DNS record types to import. Leave empty to import all types.
                  example: AAAA
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                status: Success
                statusDescription: The records of 5centscdn.dev were added successfully.

  /dns/{dnsId}/mail:
    get:
      tags: [Mail Forwards]
      summary: Get Mail Forwards
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      '1233111':
                        type: object
                        properties:
                          id:
                            type: string
                            example: '1233111'
                          domain:
                            type: string
                            example: eniobong.com
                          source:
                            type: string
                            example: oladokun.me@eniobong.com
                          destination:
                            type: string
                            example: ola@gmail.com
                          status:
                            type: string
                            example: '1'
    put:
      tags: [Mail Forwards]
      summary: Add Mail Forward
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                box:
                  type: string
                  description: Email username or mailbox name to forward from.
                  example: admin
                host:
                  type: string
                  description: Subdomain part of the source address. Leave empty for the root domain.
                  example: www
                destination:
                  type: string
                  description: Destination email address to forward messages to.
                  example: noreply@gmail.com
                _METHOD:
                  type: string
                  description: Method override to trigger mail forward creation.
                  example: PUT
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                status: Success
                statusDescription: The mail forward has been added successfully.
                data:
                  id: 337734
    post:
      tags: [Mail Forwards]
      summary: Update Mail Forward
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                box:
                  type: string
                  description: Email username or mailbox name to forward from.
                  example: admin
                host:
                  type: string
                  description: Subdomain part of the source address. Leave empty for the root domain.
                  example: www
                destination:
                  type: string
                  description: Destination email address to forward messages to.
                  example: noreply@gmail.com
                mail-forward-id:
                  type: string
                  description: ID of the mail forward record to update.
                  example: '42'
                _METHOD:
                  type: string
                  description: Method override to trigger mail forward update.
                  example: PUT
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                status: Success
                statusDescription: The mail forward has been edited successfully.
    delete:
      tags: [Mail Forwards]
      summary: Delete Mail Forward
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                _METHOD:
                  type: string
                  description: Method override to trigger mail forward deletion.
                  example: DELETE
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                status: Success
                statusDescription: The mail forward has been deleted successfully.

  /dns/{dnsId}/records:
    get:
      tags: [DNS Records]
      summary: Get Records
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
        example: 10
      - name: page
        in: query
        schema:
          type: integer
        example: 1
      - name: host
        in: query
        schema:
          type: string
      - name: type
        in: query
        schema:
          type: string
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 558
                      serviceid:
                        type: integer
                        example: 103
                      domain:
                        type: string
                        example: eniobong.com
                  pageMax:
                    type: array
                    items: {}
                  records:
                    type: array
                    items: {}
    post:
      tags: [DNS Records]
      summary: Add Record
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [_METHOD, type, ttl, host, record]
              properties:
                _METHOD:
                  type: string
                  description: HTTP method override. Use PUT to create a record.
                  example: PUT
                type:
                  type: string
                  description: DNS record type. A, AAAA, MX, CNAME, TXT, NS, SRV, WR, RP, SSHFP, ALIAS, CAA, TLSA, CERT, DS, NAPTR, PTR, HINFO, LOC, SMIMEA.
                  example: A
                ttl:
                  type: integer
                  description: "Time to live in seconds. Common values: 60, 300, 3600, 86400."
                  example: 3600
                host:
                  type: string
                  description: Hostname or subdomain. Use @ for the root domain.
                  example: www
                record:
                  type: string
                  description: Record value. IP address for A/AAAA, hostname for CNAME/MX/NS, text for TXT.
                  example: 8.8.8.8
                priority:
                  type: string
                  description: Priority for MX or SRV records. Lower value means higher priority.
                  example: '10'
                weight:
                  type: string
                  description: Weight for SRV records. Used to balance load between equal-priority servers.
                  example: '10'
                port:
                  type: string
                  description: Port number for SRV records.
                  example: '443'
                frame:
                  type: string
                  description: Enable iframe redirect for WR records. Y means enabled, N means disabled.
                  example: 'N'
                frame_title:
                  type: string
