                os:
                  type: string
                  description: Operating system identifier for HINFO records.
                  example: Linux
                lat_deg:
                  type: string
                  description: Latitude degrees for LOC records. Range 0-90.
                  example: '37'
                lat_min:
                  type: string
                  description: Latitude minutes for LOC records. Range 0-59.
                  example: '46'
                lat_sec:
                  type: string
                  description: Latitude seconds for LOC records. Range 0-59.999.
                  example: '29'
                lat_dir:
                  type: string
                  description: Latitude direction for LOC records. N or S.
                  example: N
                long_deg:
                  type: string
                  description: Longitude degrees for LOC records. Range 0-180.
                  example: '122'
                long_min:
                  type: string
                  description: Longitude minutes for LOC records. Range 0-59.
                  example: '25'
                long_sec:
                  type: string
                  description: Longitude seconds for LOC records. Range 0-59.999.
                  example: '9'
                long_dir:
                  type: string
                  description: Longitude direction for LOC records. E or W.
                  example: W
                altitude:
                  type: string
                  description: Altitude in metres for LOC records.
                  example: '0'
                size:
                  type: string
                  description: Size of the location in metres for LOC records.
                  example: '1'
                h_precision:
                  type: string
                  description: Horizontal precision in metres for LOC records.
                  example: '10000'
                v_precision:
                  type: string
                  description: Vertical precision in metres for LOC records.
                  example: '10'
                smimea_usage:
                  type: string
                  description: S/MIME certificate usage. 0=PKIX-TA, 1=PKIX-EE, 2=DANE-TA, 3=DANE-EE.
                  example: '3'
                smimea_selector:
                  type: string
                  description: S/MIME selector. 0 means full certificate, 1 means public key only.
                  example: '0'
                smimea_matching_type:
                  type: string
                  description: S/MIME matching type. 0 means full data, 1 means SHA-256, 2 means SHA-512.
                  example: '1'
                note:
                  type: string
                  description: Optional free-text note or comment attached to this DNS record.
                  example: My primary web server A record
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Operation outcome.
                    example: Success
                  statusDescription:
                    type: string
                    description: Human-readable description of the operation outcome.
                    example: The record was updated successfully.
                  data:
                    type: object
                    description: Response data payload.
                    properties:
                      id:
                        type: integer
                        description: Unique identifier of the updated DNS record.
                        example: 12345
              example:
                status: Success
                statusDescription: The record was updated successfully.
                data:
                  id: 12345
