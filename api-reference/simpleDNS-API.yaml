      tags:
      - default
      summary: Proxy Record
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  description: '1: Enable, 0: Disable'
                  example: http
                optimize:
                  type: string
                  example: http
                  description: Enable performance optimizations. Y means enabled.
                ssl:
                  type: string
                  example: S
                  description: 'SSL/HTTPS mode. Values: off, flexible, full.'
                cache:
                  type: string
                  example: 1d
                  description: Caching behavior setting.
                expiry:
                  type: string
                  example: 1d
                  description: Cache expiry duration.
                cachecontrol:
                  type: string
                  example: Y
                  description: Cache-Control header handling.
                usestale:
                  type: string
                  example: Y
                  description: Serve stale cache while revalidating. Y means enabled.
                revalidate:
                  type: string
                  example: Y
                  description: Revalidation behavior setting.
                scheme:
                  type: string
                  example: http
                  description: Protocol scheme. http or https.
                port:
                  type: integer
                  example: '80'
                  description: Port number for SRV records.
                status:
                  type: integer
                  example: '1'
                  description: Enable or disable. 1 means enabled, 0 means disabled.
                type:
                  type: string
                  example: A
                  description: 'DNS record type. Examples: A, AAAA, CNAME, MX, TXT,
                    SRV.'
                host:
                  type: string
                  example: new
                  description: Hostname or subdomain for this record. Use @ for root.
                record:
                  type: number
                  example: 1.1.1.1
                  description: The record value. For A records this is an IP address.
                ttl:
                  type: integer
                  example: '60'
                  description: Time to live in seconds. Lower values update faster.
      parameters:
      - name: dnsId
        in: path
