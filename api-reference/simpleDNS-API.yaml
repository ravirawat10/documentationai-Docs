                    example: example.com
                    properties:
                      id:
                        type: integer
                        description: Unique identifier.
                        example: 558
                      serviceid:
                        type: integer
                        description: Service account identifier.
                        example: 103
                      domain:
                        type: string
                        description: Domain name configured in the DNS zone.
                        example: example.com
                  pageMax:
                    type: array
                    description: Total number of pages available for the records listing.
                    items: {}
                  records:
                    type: array
                    description: Total number of DNS records configured in this zone.
                    example: 16
                    items: {}
    post:
      operationId: addDnsRecord
      tags: [DNS Records]
      summary: Add Record
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [_METHOD, type, ttl, host, record]
              properties:
                _METHOD:
                  type: string
                  description: HTTP method override for this request. This endpoint accepts POST requests; set _METHOD to PUT in the request body to update an existing resource.
                  example: PUT
                type:
                  type: string
                  description: DNS record type. A, AAAA, MX, CNAME, TXT, NS, SRV, WR, RP, SSHFP, ALIAS, CAA, TLSA, CERT, DS, NAPTR, PTR, HINFO, LOC, SMIMEA.
                  example: A
                ttl:
                  type: integer
                  description: "Time to live in seconds. Common values: 60, 300, 3600, 86400."
                  example: 3600
                host:
                  type: string
                  description: Hostname or subdomain. Use @ for the root domain.
                  example: www
                record:
                  type: string
                  description: Record value. IP address for A/AAAA, hostname for CNAME/MX/NS, text for TXT.
                  example: 8.8.8.8
                priority:
                  type: string
                  description: Priority for MX or SRV records. Lower value means higher priority.
                  example: '10'
                weight:
                  type: string
                  description: Weight for SRV records. Used to balance load between equal-priority servers.
                  example: '10'
                port:
                  type: string
                  description: Port number for SRV records.
                  example: '443'
                frame:
                  type: string
                  description: Enable iframe redirect for WR records. Y means enabled, N means disabled.
                  example: 'N'
                frame_title:
                  type: string
                  description: HTML page title shown when using iframe redirect.
                  example: My Site
                frame_keywords:
                  type: string
                  description: HTML meta keywords for iframe redirect page.
                  example: cdn, streaming
                frame_description:
                  type: string
                  description: HTML meta description for iframe redirect page.
                  example: My CDN site
                mobile_meta:
                  type: string
                  description: Add a mobile viewport meta tag. Y means enabled, N means disabled.
                  example: 'N'
                save_path:
                  type: string
                  description: Preserve the request path when redirecting. Y means enabled, N means disabled.
                  example: 'N'
                redirect_type:
                  type: string
                  description: HTTP redirect type. 301 means permanent, 302 means temporary.
                  example: '301'
                mail:
                  type: string
                  description: Mail server hostname for MX records.
                  example: mail.example.com
                txt:
                  type: string
                  description: TXT record content string.
                  example: v=spf1 include:example.com ~all
                algorithm:
                  type: string
                  description: "Algorithm identifier. For SSHFP records: 1=RSA, 2=DSA, 3=ECDSA, 4=Ed25519. For DS/CERT records: 2=DH, 3=DSA/SHA1, 4=ECC, 5=RSASHA1, 6=DSA-NSEC3-SHA1, 7=RSASHA1-NSEC3-SHA1, 8=RSASHA256, 10=RSASHA512, 13=ECDSAP256SHA256, 14=ECDSAP384SHA384, 15=Ed25519, 16=Ed448, 252=INDIRECT, 253=PRIVATEDNS, 254=PRIVATEOID."
                  example: '13'
                fptype:
                  type: string
                  description: Fingerprint hash type for SSHFP records. 1 means SHA-1, 2 means SHA-256.
                  example: '2'
                status:
                  type: string
                  description: Record status on creation. 1 means active, 0 means inactive.
                  example: '1'
                caa_flag:
                  type: string
                  description: "CAA record flag controlling certificate authority enforcement. 0 = Non-critical. 28 = Critical."
                  enum: ['0', '28']
                  example: '0'
                caa_type:
                  type: string
                  description: "CAA property tag. Values: issue, issuewild, iodef."
                  example: issue
                caa_value:
                  type: string
                  description: CAA record value. CA domain name or mailto/http URL for iodef.
                  example: letsencrypt.org
                tlsa_usage:
                  type: string
                  description: TLSA certificate usage. 0=PKIX-TA, 1=PKIX-EE, 2=DANE-TA, 3=DANE-EE.
                  example: '3'
                tlsa_selector:
                  type: string
                  description: TLSA selector. 0 means full certificate, 1 means public key only.
                  example: '1'
                tlsa_matching_type:
                  type: string
                  description: TLSA matching type. 0 means full data, 1 means SHA-256, 2 means SHA-512.
                  example: '1'
                key_tag:
                  type: string
                  description: Key tag for DS records. Identifies the referenced DNSKEY record.
                  example: '12345'
                digest_type:
                  type: string
                  description: "DS record digest algorithm. 1 = SHA-1. 2 = SHA-256. 3 = GOST R 34.11-94. 4 = SHA-384."
                  enum: ['1', '2', '3', '4']
                  example: '2'
                order:
                  type: string
                  description: Processing order for NAPTR records. Lower value is processed first.
                  example: '10'
                pref:
                  type: string
                  description: Preference for NAPTR records with equal order. Lower value is preferred.
                  example: '10'
                flag:
                  type: string
                  description: "Flag for NAPTR records. 'Empty Flag' = no replacement (pass to next rule). U = terminal URI. S = terminal SRV lookup. A = terminal A/AAAA lookup. P = provider-specific."
                  enum: ['Empty Flag', U, S, A, P]
                  example: U
                params:
                  type: string
                  description: Service parameters for NAPTR records.
                  example: SIP+D2U
                regexp:
                  type: string
                  description: Regular expression substitution for NAPTR records.
                  example: ''
                replace:
                  type: string
                  description: Replacement FQDN for NAPTR records.
                  example: _sip._udp.example.com
                cert_type:
                  type: string
                  description: "CERT record certificate type. 1=PKIX, 2=SPKI, 3=PGP, 4=IPKIX, 5=ISPKI, 6=IPGP, 7=ACPKIX, 8=IACPKIX, 253=URI, 254=OID."
                  example: '1'
                cert_key_tag:
                  type: string
                  description: Key tag for CERT records.
                  example: '0'
                cert_algorithm:
                  type: string
                  description: "CERT record cryptographic algorithm. 2=DH, 3=DSA/SHA1, 4=ECC, 5=RSASHA1, 6=DSA-NSEC3-SHA1, 7=RSASHA1-NSEC3-SHA1, 8=RSASHA256, 10=RSASHA512, 13=ECDSAP256SHA256, 14=ECDSAP384SHA384, 15=Ed25519, 16=Ed448, 252=INDIRECT, 253=PRIVATEDNS, 254=PRIVATEOID."
                  example: '13'
                cpu:
                  type: string
                  description: CPU type identifier for HINFO records.
                  example: Intel
                os:
                  type: string
                  description: Operating system identifier for HINFO records.
                  example: Linux
                lat_deg:
                  type: string
                  description: Latitude degrees for LOC records. Range 0-90.
                  example: '37'
                lat_min:
                  type: string
                  description: Latitude minutes for LOC records. Range 0-59.
                  example: '46'
                lat_sec:
                  type: string
                  description: Latitude seconds for LOC records. Range 0-59.999.
                  example: '29'
                lat_dir:
                  type: string
                  description: Latitude direction for LOC records. N or S.
                  example: N
                long_deg:
                  type: string
                  description: Longitude degrees for LOC records. Range 0-180.
                  example: '122'
                long_min:
                  type: string
                  description: Longitude minutes for LOC records. Range 0-59.
                  example: '25'
                long_sec:
                  type: string
                  description: Longitude seconds for LOC records. Range 0-59.999.
                  example: '9'
                long_dir:
                  type: string
                  description: Longitude direction for LOC records. E or W.
                  example: W
                altitude:
                  type: string
                  description: Altitude in metres for LOC records.
                  example: '0'
                size:
                  type: string
                  description: Size of the location in metres for LOC records.
                  example: '1'
                h_precision:
                  type: string
                  description: Horizontal precision in metres for LOC records.
                  example: '10000'
                v_precision:
                  type: string
                  description: Vertical precision in metres for LOC records.
                  example: '10'
                smimea_usage:
                  type: string
                  description: S/MIME certificate usage. 0=PKIX-TA, 1=PKIX-EE, 2=DANE-TA, 3=DANE-EE.
                  example: '3'
                smimea_selector:
                  type: string
                  description: S/MIME selector. 0 means full certificate, 1 means public key only.
                  example: '0'
                smimea_matching_type:
                  type: string
                  description: S/MIME matching type. 0 means full data, 1 means SHA-256, 2 means SHA-512.
                  example: '1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Operation outcome.
                    example: Success
                  statusDescription:
                    type: string
                    description: Human-readable description of the operation outcome.
                    example: The record was added successfully.
                  data:
                    type: object
                    description: Response data payload.
                    properties:
                      id:
                        type: integer
                        description: Unique identifier of the created DNS record.
                        example: 12345
              example:
                status: Success
                statusDescription: The record was added successfully.
                data:
                  id: 12345

