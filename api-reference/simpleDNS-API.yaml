  /dns/{dnsId}/records/{recordid}/status:
    post:
      tags: [DNS Records]
      summary: Enable/Disable Record
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      - name: recordid
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  description: '1: Enable the record, 0: Disable the record'
                  example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                status: Success
                statusDescription: Record deactivated

  /dns/{dnsId}/records/{recordid}/proxy:
    post:
      tags: [DNS Records]
      summary: Proxy Record
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      - name: recordid
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  description: Proxy mode. http means enable proxy, disabled means turn it off.
                  example: http
                optimize:
                  type: string
                  description: Performance optimization setting for the proxy.
                  example: http
                ssl:
                  type: string
                  description: SSL handling mode. S means strict HTTPS.
                  example: S
                cache:
                  type: string
                  description: Cache duration for proxied responses.
                  example: 1d
                expiry:
                  type: string
                  description: Cache expiry duration.
                  example: 1d
                cachecontrol:
                  type: string
                  description: Respect Cache-Control headers from origin. Y means enabled.
                  example: 'Y'
                usestale:
                  type: string
                  description: Serve stale cache while revalidating in the background. Y means enabled.
                  example: 'Y'
                revalidate:
                  type: string
                  description: Revalidate cached content with the origin server. Y means enabled.
                  example: 'Y'
                scheme:
                  type: string
                  description: Protocol to use when connecting to the origin server. http or https.
                  example: http
                port:
                  type: integer
                  description: Port to connect to on the origin server.
                  example: 80
                status:
                  type: integer
                  description: Enable or disable the proxy. 1 means enabled, 0 means disabled.
                  example: 1
                type:
                  type: string
                  description: DNS record type being proxied.
                  example: A
                host:
                  type: string
                  description: Hostname or subdomain for the proxied record.
                  example: www
                record:
                  type: number
                  description: IP address of the origin server.
                  example: 1.1.1.1
                ttl:
                  type: integer
                  description: Time to live in seconds for the DNS record.
                  example: 60
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
              example:
                status: Success
                statusDescription: CDN Proxy enabled.

