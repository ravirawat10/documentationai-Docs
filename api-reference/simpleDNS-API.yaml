  /dns/{dnsId}/records/{recordid}/status:
    post:
      operationId: enableDisableDnsRecord
      tags: [DNS Records]
      summary: Enable/Disable Record
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      - name: recordid
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  description: '1: Enable the record, 0: Disable the record'
                  example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Operation outcome.
                    example: Success
                  statusDescription:
                    type: string
                    description: Human-readable description of the operation outcome.
                    example: Record deactivated
              example:
                status: Success
                statusDescription: Record deactivated

  /dns/{dnsId}/records/{recordid}/proxy:
    post:
      operationId: proxyDnsRecord
      tags: [DNS Records]
      summary: Proxy Record
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      - name: recordid
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  description: Proxy mode. http means enable proxy, disabled means turn it off.
                  example: http
                optimize:
                  type: string
                  description: Performance optimization setting for the proxy.
                  example: http
                ssl:
                  type: string
                  description: "SSL termination mode for CDN proxy to origin. N = HTTP (no SSL). S = HTTPS strict. F = Full SSL strict."
                  enum: [N, S, F]
                  example: N
                cache:
                  type: string
                  description: Cache duration for proxied responses.
                  example: 1d
                expiry:
                  type: string
                  description: "Cache expiry/max-age duration for CDN content. N = no caching."
                  enum: [N, 1h, 2h, 4h, 8h, 12h, 1d, 2d, 3d, 4d, 5d, 6d, 7d]
                  example: 1d
                cachecontrol:
                  type: string
                  description: Respect Cache-Control headers from origin. Y means enabled.
                  example: 'Y'
                usestale:
                  type: string
                  description: Serve stale cache while revalidating in the background. Y means enabled.
                  example: 'Y'
                revalidate:
                  type: string
                  description: Revalidate cached content with the origin server. Y means enabled.
                  example: 'Y'
                querystring:
                  type: string
                  description: "Controls whether query string parameters are forwarded to the origin. Y = pass through. N = strip at edge."
                  enum: [Y, N]
                  example: N
                scheme:
                  type: string
                  description: Protocol to use when connecting to the origin server. http or https.
                  example: http
                port:
                  type: string
                  description: Origin server port number for CDN proxy.
                  example: '80'
                status:
                  type: integer
                  description: Enable or disable the proxy. 1 means enabled, 0 means disabled.
                  example: 1
                type:
                  type: string
                  description: DNS record type being proxied.
                  example: A
                host:
                  type: string
                  description: Hostname or subdomain for the proxied record.
                  example: www
                record:
                  type: number
                  description: IP address of the origin server.
                  example: 1.1.1.1
                ttl:
                  type: integer
                  description: Time to live in seconds for the DNS record.
                  example: 60
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Operation outcome.
                    example: Success
                  statusDescription:
                    type: string
                    description: Human-readable description of the operation outcome.
                    example: CDN Proxy enabled successfully.
              example:
                status: Success
                statusDescription: CDN Proxy enabled successfully.

  /dns/{dnsId}/records/{recordid}/dynamicurl:
    get:
      operationId: getDnsRecordDynamicUrl
      tags: [DNS Records]
      summary: Get/Activate Record DynamicURL
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      - name: recordid
        in: path
        schema:
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  host:
                    type: string
                    description: Hostname of the A or AAAA record for which the DynamicURL was activated.
                    example: dynamic.example.com
                  url:
                    type: string
                    description: Dynamic URL endpoint used to update the DNS record IP address.
                    example: "https://api.example.com/dynamicURL/?q=sample-dynamic-token"
                  status:
                    type: string
                    description: Operation outcome on error.
                    example: Failed
                  statusDescription:
                    type: string
                    description: Human-readable description of the error outcome.
                    example: The DynamicURL is only for A and AAAA record types.
              examples:
                example-0:
                  summary: Error
                  value:
                    status: Failed
                    statusDescription: The DynamicURL is only for A and AAAA record types.
                example-1:
                  summary: Success
                  value:
                    host: dynamic.example.com
                    url: "https://api.example.com/dynamicURL/?q=sample-dynamic-token"
    post:
      operationId: deleteDnsRecordDynamicUrl
      tags: [DNS Records]
      summary: Delete/Disable Record DynamicURL
      parameters:
      - name: dnsId
        in: path
        schema:
          type: string
        required: true
      - name: recordid
        in: path
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                _METHOD:
                  type: string
                  description: HTTP method override for this request. This endpoint accepts POST requests; set _METHOD to DELETE in the request body to delete an existing resource.
                  example: DELETE
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Operation outcome.
                    example: Success
                  statusDescription:
                    type: string
                    description: Human-readable description of the operation outcome.
                    example: The DynamicURL of dynamic.example.com was deactivated.
              example:
                status: Success
                statusDescription: The DynamicURL of dynamic.example.com was deactivated.