        content:
          application/json:
            schema:
              type: object
              properties:
                ltc:
                  type: integer
                  description: Number of transcoding profiles assigned. 0 means none.
                  example: 3
                vprofiles:
                  type: array
                  description: List of video transcoding profile IDs to apply.
                  items:
                    type: string
                  example:
                  - '12345'
