components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    streamIdParam:
      name: streamid
      in: path
      description: Stream ID
      required: true
      style: simple
      explode: false
      schema:
        type: string
        example: '1001'
    profileidParam:
      name: profileid
      in: path
      description: Profile ID
      required: true
      style: simple
      explode: false
      schema:
        type: string
        example: '1'
    platformIdParam:
      name: platformid
      in: path
      description: Platform ID
      required: true
      style: simple
      explode: false
      schema:
        type: string
        example: '1'
    fileParam:
      name: f
      in: header
      description: Enter reported by
      required: true
      style: simple
      explode: false
      schema:
        type: string
        example: all
    playlistidParam:
      name: playlistid
      in: path
      description: Playlist ID
      required: true
      style: simple
      explode: false
      schema:
        type: string
        example: '42'
    rParam:
      name: r
      in: header
      description: Enter value last_24hrs/hourly or last_7days/hourly or last_30days/daily
      required: true
      style: simple
      explode: false
      schema:
        type: string
        example: last_7days/hourly
