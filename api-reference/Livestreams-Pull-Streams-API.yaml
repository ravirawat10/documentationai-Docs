    AdInsertionCreateRequest:
      type: object
      required:
      - enabled
      - policy
      properties:
        enabled:
          type: string
          enum:
          - Y
          - N
          description: Enable or disable ad insertion on the stream.
        policy:
          type: integer
          enum:
          - 1
          - 2
          description: 'Ad insertion policy: 1 is Provider-based, 2 is No provider.'
        provider:
          type: string
          description: Required when policy is 1. Provider identifier.
        defaultDuration:
          type: integer
          minimum: 10
          maximum: 180
          default: 30
          description: Default ad break duration in seconds.
    AdServerRequest:
      type: object
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          description: The VAST or VMAP ad server endpoint URL. This is the base URL the SSAI engine calls to fetch ad content during a live stream. Must be a valid HTTP/HTTPS URL.
          example: https://pubads.g.doubleclick.net/gampad/ads
        queryParameters:
          type: array
          description: 'A dynamic list of query parameters appended to every ad server request. Each entry has three fields: name (the parameter key), type (the value source), and value (the parameter value or source identifier).'
          items:
            $ref: '#/components/schemas/AdServerQueryParam'
        adOrigin:
          type: object
          properties:
            customHeaders:
              type: array
              description: A list of custom HTTP headers sent to the ad origin server with each ad request. Used to pass authentication tokens, platform identifiers, or metadata required by the ad server.
              items:
                $ref: '#/components/schemas/CustomHeader'
    AdServerQueryParam:
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
          description: The query parameter key sent to the ad server.
          example: correlator
        type:
          type: string
          enum:
          - custom
          - forward
          - from-variable
          - from-header
          - from-query-parameter
          description: "Controls where the parameter value comes from. custom: a static value you define manually. forward: forwards a parameter from the viewer's original playback request as-is. from-query-parameter: maps a viewer request parameter to a differently named ad server parameter. from-variable: populates the parameter with a server-side system variable (CLIENT_IP, CACHE_BUSTER, ADBREAK_DURATION_S, ADBREAK_DURATION_MS, UPID_ASCII, UPID_HEX, ADFR_FORMAT, ADFR_VERSION, ADFR_CHANNEL, ADFR_DATE, ADFR_CODE, ADFR_DURATION, CURRENT_SPOT_INDEX, SOURCE_URL). from-header: reads a value from an HTTP request header sent by the viewer."
          example: from-variable
        value:
          type: string
          description: 'The parameter value or source identifier. Required for all types. For custom: the literal string value. For forward and from-query-parameter: the source parameter name from the viewer request. For from-variable: one of the predefined system tokens (e.g. CLIENT_IP, CACHE_BUSTER). For from-header: the HTTP header name to read from.'
          example: CLIENT_IP
    CustomHeader:
      type: object
      required:
      - name
      - value
      properties:
        name:
          type: string
          description: The HTTP header name to send to the ad origin server.
          example: X-Api-Key
        value:
          type: string
          description: The value of the HTTP header.
          example: Bearer abc123
    AdPreRollRequest:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: string
          enum:
          - Y
          - N
          description: Enable or disable pre-roll.
        maxDuration:
          type: integer
          minimum: 1
          maximum: 7200
          description: Maximum pre-roll duration in seconds.
        offset:
          type: integer
          minimum: 0
          maximum: 60
          description: Playback offset in seconds before the pre-roll starts.
        startOver:
          type: string
          enum:
          - Y
          description: Pass Y to restart the stream from the beginning after the pre-roll.
    AdReplacementRequest:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: string
          enum:
          - Y
          - N
          description: Enable or disable ad replacement.
        gapFiller:
          type: string
          description: URL to a gap-filler asset shown when no ad is available.
        maxAdDurationExcess:
          type: integer
          minimum: 0
          maximum: 180
          description: Maximum seconds an ad can exceed the scheduled break duration.
        pastAdBreakReplacement:
          type: integer
          enum:
          - -2
          - -1
          - 0
          description: 'Behaviour for late-joining viewers: 0 disabled, -1 replace from break start, -2 use look-back window.'
        pastAdBreakReplacementValue:
          type: integer
          minimum: 1
          maximum: 7200
          description: Look-back window in seconds.
        onStartWithinAdBreak:
          type: string
          enum:
          - replace
          - skip_ad_break
          description: What to do when a viewer joins mid-break.
        scte35:
          $ref: '#/components/schemas/Scte35Config'
    Scte35Config:
      type: object
      properties:
        adBreakTriggers:
          type: array
          description: SCTE-35 splice command types that start an ad break.
          items:
            type: string
            enum:
            - '0x22'
            - '0x30'
            - '0x32'
            - '0x34'
            - '0x36'
            - '0x38'
            - '0x3a'
            - splice_insert
        markersToRemove:
          type: array
          description: SCTE-35 markers to strip from the manifest.
          items:
            type: string
            enum:
            - '0x22'
            - '0x30'
            - '0x32'
            - '0x34'
            - '0x36'
            - '0x38'
            - '0x3a'
            - splice_insert
            - ALL
    TriggersRequest:
      type: object
      properties:
        scheduleIds:
          type: array
          items:
            type: integer
          description: Filter to specific schedule IDs.
        viewTriggered:
          type: string
          enum:
          - '0'
          - '1'
          description: 'Filter by triggered status: 0 pending, 1 already fired.'
        orderByDate:
          type: boolean
          description: Set true to order results by value descending.
    Trigger:
