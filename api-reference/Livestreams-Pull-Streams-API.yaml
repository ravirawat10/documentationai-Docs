  schemas:
    CreatePushStream:
      required:
      - _METHOD
      - name
      - server
      type: object
      properties:
        _METHOD:
          type: string
          description: HTTP method override for this request. This endpoint accepts POST, but set this to PUT to perform an update operation.
          example: PUT
        name:
          type: string
          description: The unique name of the stream. Must be 4 to 32 characters long and follow the format string(4,32)/string(4,32).
          example: sample/stream
        server:
          type: string
          description: The server identifier for the streaming setup. Examples include 20 (Singapore), 2 (Europe), 211 (North America), 209 (Oceania).
          example: 11,211
        codec:
          type: string
          description: Video codec for the stream. Use h264 or h265.
          example: h264
        protocols:
          type: array
          description: A list of supported streaming protocols. Examples include RTMP, RTSP, HLS, and DASH.
          items:
            type: string
          example:
          - HLS
        domainlock:
          type: object
          description: Settings for restricting stream access to specific domains.
          properties:
            enabled:
              type: string
              description: Indicates whether domain locking is enabled. Use Y for enable or N for disable.
              example: Y
            policy:
              type: string
              description: Defines the domain lock policy. Use N for no policy or R for restricted.
              example: Y
            list:
              type: array
              description: A list of allowed domains for streaming.
              items:
                type: string
              example:
              - test.com
              - google.com
            noreferer:
              type: string
              description: Block requests with no referrer header. Y means blocked (requests with empty referer are blocked); N means allowed.
              example: N
            ips:
              type: array
              description: A list of IPs allowed for domain locking.
              items:
                type: string
              example: []
        geoblock:
          type: object
          description: Settings for restricting access based on geographic locations.
          properties:
            enabled:
              type: string
              description: Indicates whether geo-blocking is enabled. Use Y for enable or N for disable.
              example: Y
            policy:
              type: string
              description: Defines the geo-block policy. Use N for none, B for block, or A for allow.
              example: Y
            list:
              type: array
              description: A list of countries to block or allow based on the policy. Examples include GB, US, FR, NG.
              items:
                type: string
              example: []
            ips:
              type: array
              description: A list of IPs considered for geo-blocking rules.
              items:
                type: string
              example: []
        ipaccess:
          type: object
          description: Settings for limiting or granting stream access based on IPs.
          properties:
            enabled:
              type: string
              description: Indicates whether IP access control is enabled. Use Y for enable or N for disable.
              example: Y
            policy:
              type: string
              description: Defines the IP access policy. Use Y for whitelist or N for blacklist.
              example: N
            list:
              type: array
              description: A list of IPs included in the policy.
              items:
                type: string
              example: []
            ips:
              type: array
              description: IPs allowed to bypass access restrictions.
              items:
                type: string
              example: []
        ndvr:
          type: object
          description: nDVR (network DVR) settings for the stream.
          properties:
            enabled:
              type: string
              description: Values can be Y or N. Set Y to enable nDVR. Set N to disable nDVR.
              example: Y
            retention:
              type: integer
              description: To specify the Rewind Period in mins. Min 5 max 180.
              example: 5
        record:
          type: object
          description: DVR recording settings for the stream.
          properties:
            server:
              type: integer
              description: The DVR server identifier.
              example: 1
            enabled:
              type: string
              description: Values can be Y or N. Set Y to enable DVR. Set N to disable DVR.
              example: Y
            retention:
              type: integer
              description: To specify the Retention period in days. Min 1 max 14.
              example: 3
        securetoken:
          type: object
          description: Secure token settings for stream access control.
          properties:
            enabled:
              type: string
              description: Values can be Y or N. Set Y to enable secure token. Set N to disable.
              example: Y
            policy:
              type: string
              description: Values can be D (default) or other policy values.
              example: D
            list:
              type: string
              description: Random alpha numeric string used as the token secret.
              example: 32862cdb6276e19a
            ips:
              type: string
              description: List of IPs to whitelist. IPs should be separated by comma.
              example: ''
            keyip:
              type: string
              description: Values can be Y or N. Set Y to include client IP in token generation.
              example: N
            session:
              type: string
              description: "Session type. 1 means moving session (URL is valid when requested within Token Expiration time and subsequent request is made within the Token Expiration time), 0 means fixed session (URL is valid till Token Expiration)."
              example: '0'
            timeout:
              type: integer
              description: Secure token link expiration time in seconds. Min 5 max 25200.
              example: 3600
            active:
              type: string
              description: Values can be Y or N. Indicates if secure token is active.
              example: Y
        useragent:
          type: object
          description: User agent access control settings.
          properties:
            enabled:
              type: string
              description: Values can be Y or N. Set Y to enable user agent restriction.
              example: Y
            policy:
              type: string
              description: Values can be Y (whitelist) or N (blacklist).
              example: Y
            list:
              type: string
              description: User agent string list.
              example: ''
            ips:
              type: string
              description: IPs allowed to bypass user agent restrictions.
              example: ''
            casesensitive:
              type: string
              description: Values can be Y or N. Set Y for case-sensitive matching.
              example: N
            active:
              type: string
              description: Values can be Y or N. Indicates if user agent filtering is active.
              example: N
            listArr:
              type: array
              description: Array representation of the user agent list.
              items:
                type: string
              example:
              - ''
        vprofiles:
          type: array
          description: An array of unique IDs representing video profiles for encoding.
          items:
            type: integer
          example:
          - 14931
          - 14937
        aprofiles:
          type: array
          description: An array of unique IDs representing audio profiles for encoding.
          items:
            type: integer
          example:
          - 14931
        filters:
          type: array
          description: An array of unique IDs representing filters applied to the stream.
          items:
            type: integer
          example:
          - 3
          - 4
        draft:
          type: integer
          description: Indicates draft mode status. Use 0 for disabled and 1 for enabled.
          example: 0
    filtersList:
      properties:
        '0':
          type: object
          properties:
            id:
              type: integer
              description: Unique numeric identifier.
              example: 1
            serviceid:
              type: integer
              description: Unique identifier of the service this stream belongs to.
              example: 103
            type:
              type: string
              description: Type identifier for this stream or object.
