  /streams/restream/{streamid}/source:
    post:
      tags:
      - Stream Management
      summary: Update Source
      operationId: updateSourceStreamsPull
      parameters:
      - $ref: '#/components/parameters/streamIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                restreamtype:
                  type: string
                  description: Indicates the type of restream being used. Defines the source or mechanism of the stream. Examples include mediaserver or cloudstream.
                  example: mediaserver
                server[mediaserver]:
                  type: string
                  description: Represents the identifier of the media server. Used to point to the specific media server in the system.
                  example: 11,211
                mode[mediaserver]:
                  type: string
                  description: Indicates the streaming mode supported by the media server. Common values include hls, dash, rtmp.
                  example: rtmp
                url[mediaserver][]:
                  type: string
                  description: A URL pointing to the media server endpoint for accessing the stream.
                  example: rtmp://fms-01-01.5centscdn.com
                audiofix:
                  type: string
                  description: Fix audio sync issues in pull streams. Y means enabled, N means disabled.
                  example: Y
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
