  /streams/pull/{streamid}/adinsertion:
    put:
      tags:
      - Ad Insertion
      summary: Enable ad insertion (pull stream)
      description: 'Creates (or updates) the ad insertion record for the pull stream.

        Requires the service to have **Advanced Features** enabled and an

        available ad insertion slot.

        '
      operationId: adInsertionCreatePull
      parameters:
      - $ref: '#/components/parameters/streamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdInsertionCreateRequest'
            example:
              enabled: Y
              policy: 1
              provider: Google Ad Manager
              defaultDuration: 30
      responses:
        '200':
          $ref: '#/components/responses/SuccessResult'
    post:
      tags:
      - Ad Insertion
      summary: Update ad insertion settings (pull stream)
      description: 'Updates the ad insertion record for the pull stream. The record must already

        exist (i.e. ad insertion must have been enabled with PUT first).

        '
      operationId: adInsertionUpdatePull
      parameters:
      - $ref: '#/components/parameters/streamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdInsertionCreateRequest'
            example:
              enabled: Y
              policy: 1
              provider: Google Ad Manager
              defaultDuration: 45
      responses:
        '200':
          $ref: '#/components/responses/SuccessResult'
    delete:
      tags:
      - Ad Insertion
      summary: Delete ad insertion (pull stream - not implemented)
      description: Reserved - returns error / Not implemented until a backend method is available.
      operationId: adInsertionDeletePull
      parameters:
      - $ref: '#/components/parameters/streamId'
      responses:
        '200':
          $ref: '#/components/responses/ErrorResult'
  /streams/pull/{streamid}/adinsertion/server:
    post:
      tags:
      - Ad Insertion
      summary: Configure ad server (pull stream)
      description: 'Sets the upstream VAST/VMAP ad server URL, query parameters and custom

        origin headers. Triggers a stream-adserver provisioning job.

        '
      operationId: adInsertionUpdateAdServerPull
      parameters:
      - $ref: '#/components/parameters/streamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdServerRequest'
            example:
              url: https://adserver.example.com/vast.php
              queryParameters:
              - name: src_url
                type: from-variable
                value: SOURCE_URL
              - name: break_dur
                type: from-variable
                value: ADBREAK_DURATION_S
              - name: CACHE_BUSTER
                type: from-variable
                value: CACHE_BUSTER
              adOrigin:
                customHeaders: []
      responses:
        '200':
          $ref: '#/components/responses/SuccessResult'
  /streams/pull/{streamid}/adinsertion/preroll:
    post:
      tags:
      - Ad Insertion
      summary: Configure pre-roll ads (pull stream)
      description: 'Enables or disables live ad pre-roll. When enabled is N the

        pre-roll configuration is removed entirely.

        '
      operationId: adInsertionUpdateAdPreRollPull
      parameters:
      - $ref: '#/components/parameters/streamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdPreRollRequest'
            example:
              enabled: Y
              maxDuration: 30
              offset: 0
              startOver: Y
      responses:
        '200':
          $ref: '#/components/responses/SuccessResult'
  /streams/pull/{streamid}/adinsertion/replacement:
    post:
      tags:
      - Ad Insertion
      summary: Configure ad replacement (pull stream)
      description: 'Enables or disables live ad replacement. When enabled is N the

        replacement configuration is removed entirely.

        '
      operationId: adInsertionUpdateAdReplacementPull
      parameters:
      - $ref: '#/components/parameters/streamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdReplacementRequest'
            example:
              enabled: Y
              gapFiller: ''
              maxAdDurationExcess: 0
              pastAdBreakReplacement: 0
              pastAdBreakReplacementValue: ''
              onStartWithinAdBreak: replace
              scte35:
                adBreakTriggers:
                - '0x22'
                - '0x30'
                - '0x32'
                - '0x34'
                - '0x36'
                - '0x38'
                - '0x3a'
                - splice_insert
                markersToRemove:
                - ALL
      responses:
        '200':
          $ref: '#/components/responses/SuccessResult'
  /streams/pull/{streamid}/adinsertion/schedule:
    post:
      tags:
      - Ad Insertion
      summary: Add ad break schedule (pull stream)
      description: 'Adds a new ad break schedule. Two schedule types are supported.

        Maximum 10 schedules per stream.

        '
      operationId: adInsertionAddSchedulePull
      parameters:
      - $ref: '#/components/parameters/streamId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              - duration
              - value
              properties:
                _METHOD:
                  type: string
                  description: HTTP method override for this request. This endpoint accepts POST, but set this to PUT to perform an update operation.
                  example: PUT
                type:
                  type: integer
                  enum:
                  - 1
                  - 2
                  description: 'Schedule type: 1 for Recurring, 2 for One-time.'
                  example: 1
                duration:
                  type: integer
                  minimum: 10
                  maximum: 180
                  description: Ad break duration in seconds.
                  example: 60
                value:
                  description: Quartz cron expression (type 1) or Unix timestamp (type 2).
                  oneOf:
                  - type: string
                    description: Quartz cron expression (type 1).
                  - type: integer
                    description: Unix timestamp (type 2).
                  example: 0 */5 * * * *
                mode:
                  type: string
                  enum:
                  - schedule
                  description: Pass schedule to immediately create triggers.
                  example: schedule
                recur:
                  type: integer
                  minimum: 0
                  maximum: 720
                  description: Maximum number of trigger repetitions. 0 means unlimited.
                  example: 1
      responses:
        '200':
          description: Schedule add result including trigger counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                    enum:
                    - success
                    - error
                    example: success
                  message:
                    type: string
                    description: Summary of added and failed trigger counts.
                    example: 'Added: 1, Failed: 151'
                  messages:
                    type: object
                    description: Informational messages related to the stream state.
                    properties:
                      added:
                        type: object
                        description: Map of Unix timestamp to beanstalkd job ID.
                        additionalProperties:
                          type: integer
                        example:
                          '1778066400': 1370623
                      failed:
                        type: object
                        description: Map of Unix timestamp to failure reason.
                        additionalProperties:
                          type: string
                        example:
                          '1778066700': Recur limit reached
  /streams/pull/{streamid}/adinsertion/schedule/{scheduleid}:
    post:
      tags:
      - Ad Insertion
      summary: Update a schedule (pull stream)
      description: Updates the cron pattern, duration and recurrence limit of an existing type 1 schedule.
      operationId: adInsertionUpdateSchedulePull
      parameters:
      - $ref: '#/components/parameters/streamId'
      - $ref: '#/components/parameters/scheduleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - value
              - duration
              - recur
              properties:
                value:
                  type: string
                  description: Updated Quartz 6-field cron expression.
                  example: 10 */5 1 * * *
                duration:
                  type: integer
                  minimum: 10
                  maximum: 180
                  description: Updated ad break duration in seconds.
                  example: 24
                recur:
                  type: integer
                  minimum: 0
                  maximum: 720
                  description: Updated maximum trigger repetitions. 0 means unlimited.
                  example: 0
                mode:
                  type: string
                  enum:
                  - replace
                  description: Pass replace to delete existing triggers and regenerate.
                  example: replace
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                    enum:
                    - success
                    - error
                    example: success
    delete:
      tags:
      - Ad Insertion
      summary: Delete a schedule (pull stream)
      description: Deletes the schedule record. When mode is clear, all queued triggers are also deleted.
      operationId: adInsertionDeleteSchedulePull
      parameters:
      - $ref: '#/components/parameters/streamId'
      - $ref: '#/components/parameters/scheduleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - _METHOD
              - mode
              properties:
                _METHOD:
                  type: string
                  description: HTTP method override for this request. This endpoint accepts POST, but set this to DELETE to perform a delete operation.
                  example: DELETE
                mode:
                  type: string
                  enum:
                  - delete
                  - clear
                  description: delete removes schedule only; clear also deletes queued triggers.
                  example: delete
      responses:
        '200':
          description: Operation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: string
                    description: Status of the API response.
                    enum:
                    - success
                    - error
                    example: success
                  message:
                    type: string
                    description: Human-readable message describing the result.
                    example: Schedule Deleted
