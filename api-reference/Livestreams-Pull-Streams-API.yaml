                          items:
                            type: string
                        example:
                        - []
                        - 
                      protocols:
                        type: array
                        description: Supported streaming protocols for each server.
                        items:
                          type: array
                          items:
                            type: string
                        example:
                        - - HLS
                        - - HLS
