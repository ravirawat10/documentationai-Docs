                aprofiles:
                  type: array
                  description: List of audio transcoding profile IDs to apply.
                  items:
                    type: integer
                  example:
                  - 126635
                filters:
                  type: array
                  description: List of transcoding filter IDs to apply.
                  items:
                    type: integer
                  example: []
                autostop:
                  type: integer
                  description: Auto-stop the transcoder after inactivity. 0 means disabled.
                  example: 0
