          description: "Group of Pictures (keyframe) interval in seconds. Allowed values: 2, 4, 6, 8, 10, 12."
          example: 2
        tune:
          type: string
          description: "Encoding tune to optimize for a specific use case. zerolatency reduces encoding delay, fastdecode optimizes for fast decoding, disabled applies no tuning. libx264 supports disabled, zerolatency, fastdecode. libx265 supports disabled, fastdecode. Allowed values: disabled, zerolatency, fastdecode."
          example: disabled
        ca:
          type: string
          description: "Audio codec for encoding. Allowed value: aac."
          example: aac
        aca:
          type: integer
          format: int32
          description: Audio channel configuration. 0 means As Source, 1 means Mono, 2 means Stereo.
          example: 2
        bavalue:
          type: string
          description: Audio bitrate in kbps. Min 32 max 320.
          example: '128'
        ara:
          type: string
          description: "Audio sample rate in Hz. Allowed values: 16000, 22050, 32000, 44100, 48000."
          example: '44100'
